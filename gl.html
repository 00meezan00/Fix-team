<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* 🔒 اللغة متثبّتة على العربي — نفس باقي الصفحات */
try{ localStorage.setItem('ifix-lang', 'ar'); }catch(e){}
</script>
<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الصفحات (ifix-theme). من غير ده فيه ومضة بيضا. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', d ? '#0F1823' : '#16233A');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر الأستاذ العام — FIX TEAM</title>
<meta name="theme-color" content="#16233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتر الأستاذ العام">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     📒 دفتر الأستاذ العام — نفس ألوان باقي النظام بالحرف (زي customers.html)
     🖥️ على الكمبيوتر الصفحة بتفرد على الشاشة كلها — ده من common.js
        (بلوك «ملو الشاشة على الكمبيوتر»)، مش من هنا.
     ============================================================ */
  :root{
    --chrome:#16233A; --on-chrome:#FFFFFF;
    --paper:#EBEEF2; --card:#FFFFFF; --line:#E4E9EF; --soft:#F2F5F8;
    --ink:#17222E; --ink-2:#475569; --muted:#6B7A8C; --faint:#94A3B4;
    --red:#DC2626; --red-bg:#FEF2F2;
    --done:#15803D; --done-bg:#EAF6EE;
    --wait:#B5651D; --wait-bg:#FBF2E9;
    --blue:#2B6CB0; --blue-bg:#EAF1F8;
    --violet:#6E56CF; --violet-bg:#F1EEFB;
    --accent:#0891A8;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --chrome:#0F1823; --on-chrome:#F2F5F8;
    --paper:#0E1620; --card:#16202C; --line:#233040; --soft:#1D2937;
    --ink:#E9EEF4; --ink-2:#B7C3D0; --muted:#8A99A9; --faint:#67788A;
    --red:#F87171; --red-bg:rgba(248,113,113,.14);
    --done:#4ADE80; --done-bg:rgba(74,222,128,.13);
    --wait:#F0A552; --wait-bg:rgba(240,165,82,.14);
    --blue:#7FB2E5; --blue-bg:rgba(127,178,229,.14);
    --violet:#A78BFA; --violet-bg:rgba(167,139,250,.15);
    --accent:#2AB5CE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Tajawal',system-ui,sans-serif; min-height:100dvh;}
  button{font-family:inherit; cursor:pointer;}

  .topbar{background:var(--chrome); color:var(--on-chrome); position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;}
  .tb-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .topbar h1{font-family:'Cairo',sans-serif; font-size:17px; margin:0; font-weight:900;}
  .who{font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; opacity:.85; margin-top:1px;}
  .back-btn{border:none; border-radius:11px; background:rgba(255,255,255,.12); color:var(--on-chrome);
    padding:9px 12px; font-weight:800; font-size:13px; white-space:nowrap;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none; border:none; border-radius:999px; padding:8px 13px; font-weight:800; font-size:13px;
    background:rgba(255,255,255,.10); color:var(--on-chrome); white-space:nowrap;}
  .tab.on{background:var(--on-chrome); color:var(--chrome);}
  .tab .n{display:inline-block; min-width:18px; margin-inline-start:4px; border-radius:9px; padding:0 5px;
    background:var(--red); color:#fff; font-size:11px; line-height:18px; text-align:center;}

  .wrap{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 90px); max-width:880px; margin:0 auto;}
  .sec-h{display:flex; align-items:center; gap:8px; margin:16px 2px 9px; font-family:'Cairo',sans-serif;
    font-weight:900; font-size:14.5px;}
  .sec-h .c{font-family:system-ui; font-size:12px; font-weight:800; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:1px 9px;}
  .sec-h .rule{flex:1; height:1px; background:var(--line);}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.8; margin:-2px 2px 10px;}
  .empty{background:var(--card); border:1px dashed var(--line); border-radius:13px; padding:26px 14px;
    text-align:center; color:var(--muted); font-size:13.5px; line-height:1.9;}
  .err{background:var(--red-bg); color:var(--red); border-radius:12px; padding:12px 14px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:12px; word-break:break-word;}
  .warnbox{background:var(--wait-bg); color:var(--wait); border-radius:11px; padding:10px 12px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:10px;}
  .okbox{background:var(--done-bg); color:var(--done); border-radius:11px; padding:10px 12px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:10px;}
  .warnbox button,.okbox button{margin-top:6px;}

  .stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-bottom:12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:10px 11px; text-align:start;
    color:var(--ink); min-width:0;}
  button.stat{cursor:pointer;}
  .stat .k{font-size:11.5px; font-weight:800; color:var(--muted);}
  .stat .v{font-family:'Cairo',sans-serif; font-weight:900; font-size:18px; margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .stat .s{font-size:11px; color:var(--muted); margin-top:1px;}
  .stat.good .v{color:var(--done);} .stat.warn .v{color:var(--wait);} .stat.bad .v{color:var(--red);}
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2, minmax(0,1fr));} }

  .search{width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px;
    padding:12px 13px; font-family:inherit; font-size:15px; margin-bottom:9px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
    padding:8px 13px; font-weight:800; font-size:12.5px;}
  .chip.on{border-color:var(--blue); background:var(--blue-bg); color:var(--blue);}
  .range{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin-bottom:10px;}
  .range label{display:flex; flex-direction:column; gap:3px; font-size:11.5px; font-weight:800; color:var(--muted); flex:1 1 130px;}
  .range input,.range select{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px;
    padding:9px 10px; font-family:inherit; font-size:14px; font-weight:700; width:100%;}

  .card{background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--edge,var(--line));
    border-radius:13px; padding:11px 13px; margin-bottom:8px;}
  button.card{display:block; width:100%; text-align:start; color:var(--ink);}
  .card.k-auto{--edge:var(--blue);} .card.k-cogs{--edge:var(--violet);} .card.k-manual,.card.k-adjust{--edge:var(--wait);}
  .card.k-excel{--edge:var(--done);} .card.k-till{--edge:var(--blue);}
  .card.k-opening{--edge:var(--done);} .card.k-asset{--edge:var(--blue);} .card.k-depr{--edge:var(--violet);} .card.k-reversal{--edge:var(--red);} .card.k-closing{--edge:var(--ink-2);}
  .card.off{opacity:.62;}
  .c-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .c-t{font-family:'Cairo',sans-serif; font-weight:900; font-size:14.5px; line-height:1.45; min-width:0; word-break:break-word;}
  .c-s{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.7;}
  .code{font-family:ui-monospace,Menlo,monospace; font-size:12px; font-weight:700; color:var(--muted); direction:ltr; unicode-bidi:isolate;}
  .pill{flex:none; font-size:11.5px; font-weight:800; border-radius:20px; padding:3px 9px; white-space:nowrap;
    background:var(--soft); color:var(--ink-2);}
  .pill.red{background:var(--red-bg); color:var(--red);} .pill.blue{background:var(--blue-bg); color:var(--blue);}
  .pill.green{background:var(--done-bg); color:var(--done);} .pill.wait{background:var(--wait-bg); color:var(--wait);}
  .pill.violet{background:var(--violet-bg); color:var(--violet);}
  .money{font-family:'Cairo',sans-serif; font-weight:900; white-space:nowrap; direction:ltr; unicode-bidi:isolate;}
  .money.dr{color:var(--blue);} .money.cr{color:var(--wait);} .money.pos{color:var(--done);} .money.neg{color:var(--red);}
  .acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
  .btn{flex:1 1 auto; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:10px;
    padding:10px 10px; font-size:13px; font-weight:800; white-space:nowrap;}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.bad{color:var(--red); border-color:var(--red);}
  .btn.ghost{background:none;}
  .btn.sm{flex:0 0 auto; padding:7px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:default;}
  [data-theme="dark"] .btn.pri{color:#0E1620;}
  .more{display:block; width:100%; margin-top:6px;}

  /* ===== سطور القيد ===== */
  .jl{display:grid; grid-template-columns:1fr auto auto; gap:2px 10px; font-size:12.5px; padding:5px 0;
    border-top:1px dashed var(--line); align-items:baseline;}
  .jl:first-of-type{border-top:none;}
  .jl .a{min-width:0; word-break:break-word; line-height:1.55;}
  .jl .a small{color:var(--muted); display:block;}
  .jl .d,.jl .cc{font-family:'Cairo',sans-serif; font-weight:800; min-width:64px; text-align:end; direction:ltr; unicode-bidi:isolate;}
  .jl .d{color:var(--blue);} .jl .cc{color:var(--wait);}
  .jl.cr .a{padding-inline-start:16px;}
  .jl.head{font-size:11px; font-weight:800; color:var(--muted); border-top:none; padding-top:8px;}
  .jl.head .d,.jl.head .cc{font-family:inherit; color:var(--muted); font-size:11px;}

  /* ===== الجداول (الميزان والقوايم) ===== */
  .tbl{width:100%; border-collapse:collapse; background:var(--card); border-radius:13px; overflow:hidden;
    border:1px solid var(--line); font-size:12.5px;}
  .tbl th{background:var(--soft); color:var(--ink-2); font-weight:800; padding:8px 7px; text-align:start; font-size:11.5px; white-space:nowrap;}
  .tbl td{padding:7px 7px; border-top:1px solid var(--line); vertical-align:top;}
  .tbl td.n,.tbl th.n{text-align:end; font-family:'Cairo',sans-serif; font-weight:800; white-space:nowrap; direction:ltr;}
  .tbl tr.g td{font-weight:900; background:var(--soft);}
  .tbl tr.g1 td{font-weight:900; background:var(--blue-bg);}
  .tbl tr.tot td{font-weight:900; background:var(--chrome); color:var(--on-chrome);}
  .tbl tr.click{cursor:pointer;}
  .tbl tr.click:active td{background:var(--blue-bg);}
  .tbl td.ind1{padding-inline-start:18px;} .tbl td.ind2{padding-inline-start:30px;} .tbl td.ind3{padding-inline-start:42px;}
  .tscroll{overflow-x:auto; border-radius:13px;}
  .tscroll .tbl td:first-child{min-width:150px;}
  .tbl .zero{color:var(--faint);}
  /* 📥 اختيارات الإكسل جوه الجدول */
  .tbl select{width:100%; min-width:150px; border:1px solid var(--wait); background:var(--wait-bg); color:var(--ink);
    border-radius:8px; padding:6px 8px; font-family:inherit; font-size:13px; font-weight:700;}

  /* ===== الشيت ===== */
  .ov{position:fixed; inset:0; z-index:60; background:rgba(8,14,20,.55); display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:720px; max-height:94dvh; overflow-y:auto; background:var(--paper);
    border-radius:18px 18px 0 0; padding:0 0 calc(env(safe-area-inset-bottom,0px) + 22px);}
  .sh-h{position:sticky; top:0; z-index:2; background:var(--paper); display:flex; align-items:center; gap:10px;
    padding:14px 16px 10px; border-bottom:1px solid var(--line);}
  .sh-h h3{flex:1; margin:0; font-family:'Cairo',sans-serif; font-size:16px; font-weight:900; min-width:0; word-break:break-word;}
  .sh-x{border:none; background:var(--card); color:var(--ink); width:36px; height:36px; border-radius:10px; font-size:18px; flex:none;}
  .sh-b{padding:14px 16px;}
  .f{display:block; margin-bottom:12px;}
  .f > span{display:block; font-size:12.5px; font-weight:800; color:var(--ink-2); margin-bottom:5px;}
  .f input,.f textarea,.f select{width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:11px; padding:11px 12px; font-family:inherit; font-size:15px;}
  .f2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .note-in{font-size:12px; color:var(--muted); line-height:1.8; margin-top:5px;}
  .big{width:100%; border:none; border-radius:13px; padding:15px; background:var(--accent); color:#fff;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:15.5px;}
  .big:disabled{opacity:.5;}
  [data-theme="dark"] .big{color:#0E1620;}

  /* ===== محرر القيد ===== */
  .le{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px;}
  .le select,.le input{width:100%; border:1px solid var(--line); background:var(--soft); color:var(--ink);
    border-radius:9px; padding:9px 10px; font-family:inherit; font-size:14px;}
  .le .r2{display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-top:6px; align-items:center;}
  .le .r1{display:grid; grid-template-columns:1fr; gap:6px;}
  .le .x{border:none; background:var(--red-bg); color:var(--red); width:36px; height:36px; border-radius:9px; font-size:15px;}
  .le .dIn{border-color:var(--blue) !important;} .le .cIn{border-color:var(--wait) !important;}
  .baltag{position:sticky; bottom:0; background:var(--paper); padding:10px 0 4px; display:flex; gap:8px; align-items:center;
    justify-content:space-between; font-weight:800; font-size:13px; border-top:1px solid var(--line); margin-top:6px;}

  .fab{position:fixed; inset-inline-start:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:15;
    border:none; border-radius:16px; padding:14px 18px; background:var(--accent); color:#fff;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:14.5px; box-shadow:0 10px 26px rgba(8,145,168,.38);}
  [data-theme="dark"] .fab{color:#0E1620;}
  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    z-index:100000; background:var(--chrome); color:var(--on-chrome); border-radius:12px; padding:12px 16px; font-weight:800;
    font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--red); color:#fff;}

  /* 📱 قاعدة الآيفون — متشيلهاش: خط الخانات ١٦px على الموبايل */
  @media (max-width:820px){
    input, textarea, select{ font-size:16px !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-row">
    <div>
      <h1>📒 دفتر الأستاذ العام</h1>
      <div class="who" id="whoLbl">…</div>
    </div>
    <button class="back-btn" onclick="location.href='dashboard.html'">→ رجوع</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap" id="app"><div class="empty">⏳ جاري التحميل…</div></div>
<div id="fabHost"></div>
<div class="toast" id="toast"></div>
<datalist id="dlCust"></datalist>
<datalist id="dlSup"></datalist>
<datalist id="dlEmp"></datalist>

<script src="pages/gl.js"></script>
</body>
</html>
