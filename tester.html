<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* 🔒 اللغة متثبّتة على العربي — نفس باقي الصفحات */
try{ localStorage.setItem('ifix-lang', 'ar'); }catch(e){}
</script>
<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الصفحات (ifix-theme). من غير ده فيه ومضة بيضا. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الفحص — FIX TEAM</title>
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FIX TEAM">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="attendance.js"></script>
<script src="payroll.js"></script>
<script src="qc-view.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     🧪 مسؤول الفحص — ألوان FIX TEAM (أسود + برتقالي اللوجو)
     ============================================================ */
  :root{
    --chrome:#141416; --on-chrome:#FFFFFF; --acc:#F26A1B; --acc-bg:rgba(242,106,27,.10);
    --paper:#F1F0ED; --card:#FFFFFF; --line:#E3E1DC; --soft:#F6F5F2;
    --ink:#141416; --ink-2:#3F3F46; --muted:#6B6B70; --faint:#A1A1AA;
    --ok:#15803D; --ok-bg:#EAF6EE; --bad:#DC2626; --bad-bg:#FEF2F2;
    --wait:#B45309; --wait-bg:#FEF3C7; --na:#64748B; --na-bg:#EEF1F3;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --chrome:#000000; --on-chrome:#F2F2F0; --acc:#FF7A2E; --acc-bg:rgba(255,122,46,.13);
    --paper:#0E0E10; --card:#1A1A1D; --line:#2C2C31; --soft:#222226;
    --ink:#F2F2F0; --ink-2:#C9C9CF; --muted:#9C9CA2; --faint:#6B6B72;
    --ok:#4ADE80; --ok-bg:rgba(74,222,128,.13); --bad:#F87171; --bad-bg:rgba(248,113,113,.14);
    --wait:#FBBF24; --wait-bg:rgba(251,191,36,.15); --na:#94A3B8; --na-bg:rgba(148,163,184,.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Tajawal',system-ui,sans-serif; min-height:100dvh;}
  button{font-family:inherit; cursor:pointer;}

  /* ===== الهيدر ===== */
  .topbar{background:var(--chrome); color:var(--on-chrome); position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0; border-bottom:3px solid var(--acc);}
  .tb-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand img{width:40px; height:40px; border-radius:10px; background:#fff; object-fit:contain; flex:none;}
  .topbar h1{font-family:'Cairo',sans-serif; font-size:17px; margin:0; font-weight:900;}
  .topbar h1 em{font-style:normal; color:var(--acc);}
  .who{font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; opacity:.85; margin-top:1px;}
  .kebab-wrap{position:relative; flex:none;}
  .kebab-btn{width:42px; height:42px; border:1px solid rgba(255,255,255,.18); border-radius:11px;
    background:rgba(255,255,255,.08); color:var(--on-chrome); font-size:20px; line-height:1;}
  .kebab-menu{position:absolute; top:50px; inset-inline-end:0; min-width:210px; background:var(--card);
    border:1px solid var(--line); border-radius:13px; box-shadow:0 12px 30px rgba(0,0,0,.25); overflow:hidden; z-index:30;}
  .kebab-menu.hidden{display:none;}
  .kebab-menu button{display:block; width:100%; text-align:start; border:none; background:none; color:var(--ink);
    padding:13px 16px; font-size:14.5px; font-weight:700;}
  .kebab-menu button + button{border-top:1px solid var(--line);}
  .kebab-menu button.danger{color:var(--bad);}
  .kebab-shield{position:fixed; inset:0; z-index:25;}
  .kebab-shield.hidden{display:none;}

  .tabs{display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none; border:none; border-radius:999px; padding:8px 14px; font-weight:800; font-size:13.5px;
    background:rgba(255,255,255,.10); color:var(--on-chrome); white-space:nowrap;}
  .tab.on{background:var(--acc); color:#fff;}
  .tab .n{display:inline-block; min-width:19px; margin-inline-start:5px; border-radius:9px; padding:0 5px;
    background:#fff; color:var(--chrome); font-size:11.5px; line-height:19px; text-align:center;}
  .tab:not(.on) .n{background:var(--acc); color:#fff;}

  .wrap{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 40px); max-width:820px; margin:0 auto;}
  .search{width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px;
    padding:12px 14px; font-family:inherit; font-size:16px; margin-bottom:12px;}
  .search:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-bg);}
  .sec-h{display:flex; align-items:center; gap:8px; margin:16px 2px 9px; font-family:'Cairo',sans-serif; font-weight:900; font-size:14.5px;}
  .sec-h:first-child{margin-top:2px;}
  .sec-h .c{font-family:system-ui; font-size:12px; font-weight:800; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:1px 9px;}
  .sec-h .rule{flex:1; height:1px; background:var(--line);}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.8; margin:-2px 2px 10px;}
  .empty{background:var(--card); border:1px dashed var(--line); border-radius:13px; padding:26px 14px;
    text-align:center; color:var(--muted); font-size:13.5px; line-height:1.9;}
  .err{white-space:pre-line; background:var(--bad-bg); color:var(--bad); border-radius:12px; padding:12px 14px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:12px; word-break:break-word;}

  /* ===== كارت الجهاز ===== */
  .card{background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--edge,var(--line));
    border-radius:13px; padding:12px 13px; margin-bottom:9px;}
  .card.todo{--edge:var(--acc);}
  .card.done{--edge:var(--ok); opacity:.92;}
  .card.reg{--edge:var(--bad);}
  .c-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .c-t{font-family:'Cairo',sans-serif; font-weight:900; font-size:15.5px; line-height:1.45;}
  .c-s{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.7;}
  .c-s b{color:var(--ink-2);}
  .pill{flex:none; font-size:11.5px; font-weight:800; border-radius:20px; padding:3px 9px; white-space:nowrap; background:var(--soft); color:var(--ink-2);}
  .pill.ok{background:var(--ok-bg); color:var(--ok);} .pill.bad{background:var(--bad-bg); color:var(--bad);}
  .pill.wait{background:var(--wait-bg); color:var(--wait);} .pill.acc{background:var(--acc-bg); color:var(--acc);}
  .box{margin-top:8px; background:var(--soft); border-radius:9px; padding:8px 10px; font-size:13px; line-height:1.7; color:var(--ink-2); word-break:break-word;}
  .acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
  .btn{flex:1 1 auto; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:10px;
    padding:11px 10px; font-size:13.5px; font-weight:800; white-space:nowrap;}
  .btn.pri{background:var(--acc); border-color:var(--acc); color:#fff;}
  .btn.sm{flex:0 0 auto; padding:7px 10px; font-size:12px;}

  /* ===== الشيت ===== */
  .ov{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:680px; max-height:94dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--paper);
    border-radius:18px 18px 0 0; padding:0 0 calc(env(safe-area-inset-bottom,0px) + 18px);}
  .sh-h{position:sticky; top:0; z-index:3; background:var(--chrome); color:var(--on-chrome); display:flex; align-items:center; gap:10px;
    padding:14px 16px 12px; border-bottom:3px solid var(--acc);}
  .sh-h h3{flex:1; margin:0; font-family:'Cairo',sans-serif; font-size:16px; font-weight:900; min-width:0;}
  .sh-h .prog{font-size:12px; font-weight:800; background:rgba(255,255,255,.12); border-radius:20px; padding:3px 10px; white-space:nowrap;}
  .sh-x{border:none; background:rgba(255,255,255,.12); color:var(--on-chrome); width:36px; height:36px; border-radius:10px; font-size:18px; flex:none;}
  .sh-b{padding:14px 16px;}

  .dev{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:12px;}
  .power{display:flex; gap:8px; margin-bottom:14px;}
  .power button{flex:1; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:12px; font-weight:900; font-size:14px;}
  .power button.on.y{border-color:var(--ok); background:var(--ok-bg); color:var(--ok);}
  .power button.on.n{border-color:var(--bad); background:var(--bad-bg); color:var(--bad);}

  .grp{background:var(--card); border:1px solid var(--line); border-radius:13px; margin-bottom:10px; overflow:hidden;}
  .grp-h{display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--soft); font-family:'Cairo',sans-serif; font-weight:900; font-size:14px;}
  .grp-h .gc{font-family:system-ui; font-size:11.5px; color:var(--muted); font-weight:800;}
  .grp-h .all{margin-inline-start:auto; border:1px solid var(--ok); color:var(--ok); background:var(--card); border-radius:9px; padding:5px 9px; font-size:12px; font-weight:800;}
  .it{padding:10px 12px; border-top:1px solid var(--line);}
  .it.miss{background:var(--acc-bg);}
  .it.regr{background:var(--bad-bg);}
  .it-top{display:flex; align-items:center; gap:8px;}
  .it-l{flex:1; min-width:0; font-weight:800; font-size:14px; line-height:1.5;}
  .it-l small{display:block; font-weight:600; font-size:11.5px; color:var(--muted);}
  .was{font-size:11px; font-weight:800; border-radius:8px; padding:1px 7px; background:var(--soft); color:var(--muted); white-space:nowrap;}
  .sg{display:flex; gap:5px; flex:none;}
  .sg button{width:44px; height:40px; border:2px solid var(--line); background:var(--card); border-radius:10px; font-size:17px; line-height:1;}
  .sg button.on.ok{border-color:var(--ok); background:var(--ok-bg);}
  .sg button.on.bad{border-color:var(--bad); background:var(--bad-bg);}
  .sg button.on.na{border-color:var(--na); background:var(--na-bg);}
  .sg button:disabled{opacity:.35;}
  .it input.note{width:100%; margin-top:8px; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:9px; padding:9px 10px; font-family:inherit; font-size:16px;}
  .it input.note.need{border-color:var(--bad);}
  .reg-t{margin-top:6px; font-size:12px; font-weight:900; color:var(--bad);}

  .f{display:block; margin-bottom:12px;}
  .f > span{display:block; font-size:12.5px; font-weight:800; color:var(--ink-2); margin-bottom:5px;}
  .f input,.f textarea{width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:11px; padding:11px 12px; font-family:inherit; font-size:16px;}
  .f textarea{resize:vertical; min-height:64px;}
  .big{width:100%; border:none; border-radius:13px; padding:15px; background:var(--acc); color:#fff; font-family:'Cairo',sans-serif; font-weight:900; font-size:16px;}
  .big:disabled{opacity:.5;}
  .warnbox{background:var(--wait-bg); color:var(--wait); border-radius:11px; padding:10px 12px; font-size:13px; font-weight:700; line-height:1.8; margin-bottom:12px;}
  .badbox{background:var(--bad-bg); color:var(--bad); border-radius:11px; padding:10px 12px; font-size:13px; font-weight:800; line-height:1.8; margin-bottom:12px;}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    z-index:100000; background:var(--chrome); color:var(--on-chrome); border-radius:12px; padding:12px 16px; font-weight:800;
    font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--bad); color:#fff;}

  @media (min-width:900px){
    .list{display:grid; grid-template-columns:1fr 1fr; gap:0 10px;}
  }
  /* 📱 قاعدة الآيفون — خط الخانات ١٦px، أقل من كده الأيفون بيكبّر الصفحة */
  @media (max-width:820px){ input, textarea, select{ font-size:16px !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-row">
    <div class="brand">
      <img src="icon-192.png" alt="" onerror="this.remove()">
      <div>
        <h1><em>🧪</em> الفحص</h1>
        <div class="who" id="whoLbl">…</div>
      </div>
    </div>
    <div class="kebab-shield hidden" id="kebabShield" onclick="closeKebab()"></div>
    <div class="kebab-wrap">
      <button class="kebab-btn" onclick="toggleKebab()" aria-label="قايمة">⋮</button>
      <div class="kebab-menu hidden" id="kebabMenu">
        <button id="backDashBtn" style="display:none;" onclick="location.href='dashboard.html'">→ رجوع للشاشة الرئيسية</button>
        <!-- ⚠️ الكلاسين att-menu-btn و pay-menu-btn مهمين: attendance.js و payroll.js
             بيدوّروا عليهم بنفسهم ويظهّروهم على الموبايل بس. -->
        <button class="att-menu-btn" style="display:none;" onclick="closeKebab(); openAttendance()">⏰ المواعيد</button>
        <button class="pay-menu-btn" style="display:none;" onclick="closeKebab(); openPayroll()">💰 مرتبك</button>
        <button onclick="closeKebab(); load(true)">↻ تحديث القايمة</button>
        <button class="danger" onclick="closeKebab(); doLogout()">⏻ تسجيل الخروج</button>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap" id="app"><div class="empty">⏳ جاري التحميل…</div></div>
<div class="toast" id="toast"></div>

<!-- شاشة المواعيد — بتتبني بالكامل من attendance.js -->
<div id="attOverlay" class="hidden"></div>
<!-- شاشة «مرتبك» — بتتبني بالكامل من payroll.js -->
<div id="payOverlay" class="hidden"></div>

<script src="pages/tester.js"></script>
</body>
</html>
