function hrPrint(html, title){
  const old = document.getElementById('hrPrintFrame');
  if(old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'hrPrintFrame';
  f.title = title || 'print';
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;';
  document.body.appendChild(f);
  try{
    const d = f.contentWindow.document;
    d.open(); d.write(html); d.close();
    f.contentWindow.focus();
    f.contentWindow.print();     // فوراً — من غير أي انتظار
  }catch(e){
    console.error('hrPrint failed:', e);
    f.remove();
    alert('مقدرناش نفتح نافذة الطباعة. جرّب تاني.');
  }
}

    a.download = `مواعيد-${nameOf(email)}-${MONTH}.xlsx`;
    a.click();
    // ⚠️ بنفضّي الرابط بعد شوية — من غير كده الملف بيفضل في
    //    الذاكرة لحد ما الصفحة تتقفل
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){
    console.error('exportEmpExcel failed:', e);
    alert('فشل التصدير: ' + (e.message || e));
  }
}


// ============================================================
// 💸 الخصومات اليدوية
// ------------------------------------------------------------
// HR بتكتب خصم + سبب، والموظف بيشوفه في شاشة «مرتبك» على موبايله.
//
// 🔴 الكتابة كلها من دوال السيرفر (hr_add_deduction / hr_delete_deduction).
//    جدول hr_deductions **مفيهوش سياسة إدخال ولا حذف خالص** — زي
//    جدول attendance بالظبط. الصفحة دي واجهة عرض وبس.
//
// ⚠️ الخصم ده **غير** خصم التأخير الأوتوماتيكي اللي بيتحسب من
//    قواعد المواعيد. ده يدوي وبسبب مكتوب، وده بيتحسب لوحده —
//    وعن قصد مش بنجمعهم في رقم واحد عشان محدش يتلغبط.
// ============================================================
let DEDS = {};            // إيميل → [خصومات] (كل الشهور، مش الشهر المعروض بس)
let DED_EMAIL = '';       // الموظف المفتوح في شاشة الخصم

async function loadDeductions(){
  try{
    // ⚠️ ترتيب قبل قص — أحدث خصم لازم يبان حتى لو العدد وصل الحد
    // 🔴 على صفحات (شوف hrAll) — كان فيه .limit(1000)، وده معناه إن
    //    أول ما الخصومات تعدّي ١٠٠٠ (مسحوبات الإكسل بتزوّد كتير)،
    //    الأقدم يختفي والمجموع يقل في صمت.
    const data = await hrAll(() => sb.from('hr_deductions')
      .select('id,user_email,amount,reason,work_date,kind,created_at,created_by,seen_at,waived_at,waived_by,waive_reason')
      .order('created_at', { ascending:false })
      .order('id', { ascending:true }), 'الخصومات');
    DEDS = {};
    (data || []).forEach(r => {
      const e = (r.user_email || '').toLowerCase();
      (DEDS[e] = DEDS[e] || []).push(r);
    });
  }catch(e){
    // بنقول بصوت عالي. الفشل الصامت هنا معناه إن HR تفتكر إن
    // الموظف مالوش خصومات وهي موجودة فعلاً.
    console.error('loadDeductions failed:', e);
    DEDS = {};
    const t = (e && e.message) ? e.message : String(e);
    if(/hr_deductions/i.test(t) || (e && e.code === '42P01'))
      console.warn('⚠️ الجدول لسه ماتعملش — شغّل 32-hr-deductions.sql');
  }
}

// مجموع الخصم اليدوي لموظف
// ⚠️ اللي اتشال **مش داخل في المجموع** — بس بيفضل في القايمة
//    بختم مين شاله وليه. لو شلناه من القايمة كمان، محدش هيعرف
//    إن كان فيه خصم أصلاً.
//
// 🐞 اتصلّح: مسحوبات الإكسل (kind='withdrawal') كانت بتتجمع مع
//    الخصم اليدوي في رقم واحد. المسحوبات فلوس الموظف أخدها مقدّم
//    مش عقوبة — وكشف الراتب في السيرفر بيفصلهم. دلوقتي:
//      total = الخصم اليدوي بس · wd = المسحوبات لوحدها
//
// ym (اختياري، 'YYYY-MM'): المجموع لشهر واحد بس (حسب work_date).
//    من غيره = كل التاريخ. «لسه ما اتقراش» دايماً على كل التاريخ —
//    عشان HR تعرف إن فيه رسالة واقفة حتى لو من شهر فات.
function manualDed(email, ym){
  const all = DEDS[(email||'').toLowerCase()] || [];
  const list = ym ? all.filter(r => String(r.work_date || '').slice(0,7) === ym) : all;
  let total = 0, wd = 0, unseen = 0, waived = 0;
  list.forEach(r => {
    if(r.waived_at){ waived++; return; }
    if(r.kind === 'withdrawal') wd += Number(r.amount || 0);
    else total += Number(r.amount || 0);
  });
  all.forEach(r => { if(!r.seen_at) unseen++; });
  return { total: Math.round(total * 100) / 100, wd: Math.round(wd * 100) / 100,
           unseen, waived, count: list.length, list };
}

// خصم التأخير التلقائي لموظف في الشهر المعروض
function lateDed(email){
  const byDay = PENS[(email||'').toLowerCase()] || {};
  let total = 0, days = 0, waived = 0;
  Object.keys(byDay).forEach(d => {
    const r = byDay[d];
    if(r.waived){ waived++; return; }
    const p = Number(r.penalty || 0);
    if(p > 0){ total += p; days++; }
  });
  return { total: Math.round(total * 100) / 100, days, waived };
}

// سطر خصم يدوي واحد — مصدر واحد عشان الشكل ما يختلفش بين
// قايمة السجل وقايمة شاشة الخصم
function dedRowHtml(r){
  const w = !!r.waived_at;
  return `

      <div class="ded-amt" ${w ? 'style="text-decoration:line-through;opacity:.55;"' : ''}>${
        /* مبلغ بالسالب = سداد مسحوبات — «−-200» بتلخبط، فبنكتب + */
        Number(r.amount) < 0 ? '+' + Math.abs(Number(r.amount)) : '−' + Number(r.amount)}</div>
      <div class="ded-mid">
        <b ${w ? 'style="text-decoration:line-through;opacity:.6;"' : ''}>${
          r.kind === 'withdrawal' ? '🔩 ' : ''}${esc(r.reason)}</b>
        <span>${new Date(r.created_at).toLocaleDateString('ar-EG',
          { day:'numeric', month:'long', year:'numeric' })}
          · ${w ? '✋ اتشال' : (r.seen_at ? '✔️ قراه الموظف' : '🔔 لسه ما قراهوش')}</span>
        ${w ? `<span style="color:var(--done);">سبب الشيل: ${esc(r.waive_reason || '—')}</span>` : ''}
      </div>
      ${w
        ? `<button class="ded-del" title="رجّع الخصم" onclick="unwaiveDeduction('${esc(r.id)}')">↩️</button>`
        : `<button class="ded-del" title="شيل الخصم" onclick="waiveDeduction('${esc(r.id)}')">✋</button>`}
      <button class="ded-del" title="مسح نهائي" onclick="deleteDeduction('${esc(r.id)}')">🗑️</button>
    </div>`;
}

// ============================================================
// 🗄️ درج المسحوبات — جوه سجل الموظف
// ------------------------------------------------------------
// 🧠 بالبلدي: المسحوبات اللي جاية من الإكسل كتير (سحبة كل يوم تقريباً)،
//    وكانت بتتفرد كلها في السجل — من **كل الشهور** — فتغطّي الصفحة
//    والواحد يتوه قبل ما يوصل لأيام الحضور.
//
// ✅ دلوقتي:
//    • المسحوبات مبقتش في القايمة خالص — اتلمّت في «درج» مقفول.
//    • الدرج فيه مسحوبات **الشهر المختار من الشاشة الرئيسية بس**
//      (MONTH). تغيّر الشهر من فوق → الدرج يتغيّر معاه.
//    • على الدرج من برا: العدد والمجموع — من غير ما تفتحه.
//    • الخصومات اليدوية (💸) زي ما هي، مظاهرة عادي.
//
// ⚠️ الشهر بيتحدد من work_date (يوم السحبة نفسه)، ولو فاضي من
//    created_at — نفس اللي كشف الراتب بيعمله، عشان الرقم اللي في
//    الدرج يطلع نفس رقم «المسحوبات» في الكشف.
// ============================================================
let WD_DRAWER_OPEN = false;   // الدرج مفتوح ولا مقفول — بيفضل زي ما سبته لحد ما تقفل السجل

function wdMonthOf(r){
  return String(r.work_date || r.created_at || '').slice(0,7);
}

// مسحوبات موظف في الشهر المعروض — من الأحدث للأقدم
function wdListFor(email, ym){
  const all = DEDS[(email||'').toLowerCase()] || [];
  return all
    .filter(r => r.kind === 'withdrawal' && wdMonthOf(r) === ym)
    .sort((a,b) => String(b.work_date || b.created_at).localeCompare(String(a.work_date || a.created_at)));
}

function toggleWdDrawer(){
  WD_DRAWER_OPEN = !WD_DRAWER_OPEN;
  const box = document.getElementById('wdDrawerBody');
  const arw = document.getElementById('wdDrawerArrow');
  if(box) box.classList.toggle('hidden', !WD_DRAWER_OPEN);
  if(arw) arw.textContent = WD_DRAWER_OPEN ? '▴' : '▾';
}

function wdDrawerHtml(email){
  const list = wdListFor(email, MONTH);
  // المجموع من غير اللي اتشال — زي باقي المجاميع في الصفحة
  let total = 0, waived = 0;
  list.forEach(r => { if(r.waived_at) waived++; else total += Number(r.amount || 0); });
  total = Math.round(total * 100) / 100;
  return `
    <div class="wd-drawer">
      <button class="wd-head" onclick="toggleWdDrawer()">
        <span class="wd-ttl">🗄️ درج المسحوبات <small>— ${esc(monthLabel())}</small></span>
        <span class="wd-sum">${list.length
          ? `${list.length} سحبة · <b>${total.toLocaleString('en-US')}</b> ج.م`
          : 'فاضي'}</span>
        <span id="wdDrawerArrow" class="wd-arw">${WD_DRAWER_OPEN ? '▴' : '▾'}</span>
      </button>
      <div id="wdDrawerBody" class="wd-body${WD_DRAWER_OPEN ? '' : ' hidden'}">
        ${list.length
          ? list.map(dedRowHtml).join('') +
            (waived ? `<div class="wd-note">✋ ${waived} سحبة متشالة — مش داخلة في المجموع</div>` : '')
          : `<div class="wd-note">مفيش مسحوبات في ${esc(monthLabel())}.<br>
               غيّر الشهر من فوق في الشاشة الرئيسية عشان تشوف شهر تاني.</div>`}
      </div>
    </div>`;
}

function dedSectionHtml(email){
  const all = DEDS[(email||'').toLowerCase()] || [];
  // 💸 الخصومات اليدوية بس — المسحوبات راحت الدرج
  const manual = all.filter(r => r.kind !== 'withdrawal');
  let mTotal = 0, unseen = 0;
  manual.forEach(r => {
    if(!r.seen_at) unseen++;
    if(!r.waived_at) mTotal += Number(r.amount || 0);
  });
  mTotal = Math.round(mTotal * 100) / 100;
  const hasWd = all.some(r => r.kind === 'withdrawal');
  if(!manual.length && !hasWd) return '';

  return `
    ${hasWd ? wdDrawerHtml(email) : ''}
    ${manual.length ? `
    <div style="margin-top:18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">
        <b style="flex:1;font-size:14px;">💸 الخصومات اليدوية</b>
        <span style="font-size:12.5px;font-weight:800;color:var(--red);">
          ${mTotal} ج.م${unseen ? ` · ${unseen} لسه ما اتقراش` : ''}</span>
      </div>
      ${manual.map(dedRowHtml).join('')}
    </div>` : ''}`;
}

// ============================================================
// 🎁 الحوافز والمكافآت (ملف 72)
// ------------------------------------------------------------
// 🧸 بالبلدي: HR بتكتب حافز (مبلغ + سبب + شهر) → بيتزاد على صافي
//    مرتب الشهر ده على طول، والموظف بيشوفه في «مرتبك» بسطر أخضر.
//
// 🔴 الحوافز في جدول لوحدها (hr_bonuses) مش مع الخصومات — عشان
//    مفيش أي مكان بيجمع «الخصومات» يخصمها بالغلط من الموظف.
// 🔴 الكتابة من السيرفر بس (hr_add_bonus / hr_delete_bonus).
//    والشهر اللي اتصرف متقفل — السيرفر بيرفض.
// ============================================================
let BONS = {};          // إيميل → [حوافز] (كل الشهور)
let BON_EMAIL = '';
let BONS_ERR = '';

async function loadBonuses(){
  BONS_ERR = '';
  try{
    const data = await hrAll(() => sb.from('hr_bonuses')
      .select('id,user_email,amount,reason,work_date,created_by,created_at')
      .order('work_date', { ascending:false })
      .order('id', { ascending:true }), 'الحوافز');
    BONS = {};
    data.forEach(r => {
      const e = (r.user_email || '').toLowerCase();
      (BONS[e] = BONS[e] || []).push(r);
    });
  }catch(e){
    // ⚠️ بنقول بصوت عالي — السكوت هنا = HR تفتكر إن مفيش حوافز
    console.error('loadBonuses failed:', e);
    BONS = {};
    const t = (e && e.message) ? e.message : String(e);
    BONS_ERR = /does not exist|42P01|PGRST205/i.test(t)
      ? 'ميزة الحوافز لسه ماتركبتش — شغّل ملف 72-bonuses.sql' : t;
  }
}

// مجموع حوافز موظف في شهر ('YYYY-MM')
function bonusSum(email, ym){
  const list = (BONS[(email||'').toLowerCase()] || [])
    .filter(r => String(r.work_date || '').slice(0,7) === ym);
  const total = Math.round(list.reduce((a, r) => a + Number(r.amount || 0), 0) * 100) / 100;
  return { total, list };
}

function bonusRowHtml(r){
  const d = new Date(r.work_date).toLocaleDateString('ar-EG',
    { day:'numeric', month:'long', year:'numeric' });
  return `
    <div class="ded-row" style="border-color:var(--done);">
      <div class="ded-amt" style="color:var(--done);">+${Number(r.amount)}</div>
      <div class="ded-mid">
        <b>🎁 ${esc(r.reason)}</b>
        <span>${esc(d)} · ${esc(nameOf(r.created_by || ''))}</span>
      </div>
      <button class="ded-del" title="مسح" onclick="deleteBonus('${esc(r.id)}')">🗑️</button>
    </div>`;
}

// قسم الحوافز جوه سجل الموظف — الشهر المختار من الشاشة الرئيسية
function bonusSectionHtml(email){
  const b = bonusSum(email, MONTH);
  if(!b.list.length) return '';
  return `
    <div style="margin-top:18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">
        <b style="flex:1;font-size:14px;">🎁 الحوافز والمكافآت — ${esc(monthLabel())}</b>
        <span style="font-size:12.5px;font-weight:800;color:var(--done);">+${b.total} ج.م</span>
      </div>
      ${b.list.map(bonusRowHtml).join('')}
    </div>`;
}

function openBonus(email){
  BON_EMAIL = (email || '').toLowerCase();
  const list = allPeople();
  if(!list.length){ alert('مفيش موظفين متسجّلين — ضيفهم من لوحة الأدمن الأول'); return; }
  if(list.indexOf(BON_EMAIL) < 0) BON_EMAIL = list[0];
  renderBonus();
  openSheet('bonSheet');
}

function renderBonus(){
  const list = allPeople();
  // الشهر الافتراضي = الشهر المعروض في الشاشة الرئيسية (لو هو الحالي → النهاردة)
  const today = todayCairo();
  const defDate = today.slice(0,7) === MONTH ? today : MONTH + '-01';
  const recent = (BONS[BON_EMAIL] || []).slice(0, 5);
  document.getElementById('bonTitle').textContent = '🎁 حافز — ' + nameOf(BON_EMAIL);
  document.getElementById('bonBody').innerHTML = `
    ${BONS_ERR ? `<div class="hintbox" style="background:var(--rejected-bg,#FEF2F2);color:var(--red);">❌ ${esc(BONS_ERR)}</div>` : ''}
    <label class="fld"><span>👤 الموظف</span>
      <select onchange="BON_EMAIL=this.value; renderBonus()">
        ${list.map(e => `<option value="${esc(e)}"${e===BON_EMAIL?' selected':''}>${esc(nameOf(e))}</option>`).join('')}
      </select>
    </label>

    <label class="fld"><span>💰 المبلغ (بالجنيه)</span>
      <input type="number" id="bonAmt" min="1" step="5" inputmode="decimal" placeholder="500">
    </label>

    <label class="fld"><span>📝 السبب</span>
      <small>الموظف هيشوفه زي ما هو في «مرتبك».</small>
      <textarea id="bonWhy" rows="2" placeholder="مثال: حافز تارجت الشهر"></textarea>
    </label>

    <label class="fld"><span>🗓️ على مرتب شهر</span>
      <small>الحافز بيتزاد على مرتب الشهر بتاع التاريخ ده.</small>
      <input type="date" id="bonDate" value="${esc(defDate)}">
    </label>

    <button class="save" id="bonSave" onclick="saveBonus()">🎁 اعمل الحافز</button>

    ${recent.length ? `<div style="margin-top:22px;">
      <b style="font-size:13.5px;">آخر حوافز ${esc(nameOf(BON_EMAIL))}</b>
      <div style="margin-top:10px;">${recent.map(bonusRowHtml).join('')}</div>
    </div>` : ''}`;
}

async function saveBonus(){
  const btn = document.getElementById('bonSave');
  const amt = parseFloat((document.getElementById('bonAmt') || {}).value);
  const why = ((document.getElementById('bonWhy') || {}).value || '').trim();
  const day = ((document.getElementById('bonDate') || {}).value || '').trim();
  // ⚠️ الفحص هنا مجاملة بس — الحقيقي جوه hr_add_bonus في السيرفر
  if(!amt || amt <= 0){ alert('اكتب مبلغ أكبر من صفر'); return; }
  if(!why){ alert('لازم تكتب سبب الحافز'); return; }
  if(!day){ alert('اختار الشهر'); return; }
  const mon = new Date(day).toLocaleDateString('ar-EG', { month:'long', year:'numeric' });
  if(!confirm(`تأكيد الحافز\n\nالموظف: ${nameOf(BON_EMAIL)}\nالمبلغ: +${amt} ج.م\nعلى مرتب: ${mon}\nالسبب: ${why}`)) return;

  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try{
    const { error } = await sb.rpc('hr_add_bonus',
      { p_email: BON_EMAIL, p_amount: amt, p_reason: why, p_date: day });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    await notifyPay(BON_EMAIL, `🎁 حافز ${amt} ج.م على مرتب ${mon} — ${why}`);
    await loadBonuses();
    render();
    renderBonus();
    await payAdminReload();
    alert('✅ اتسجّل الحافز — هيظهر في كشف مرتب ' + mon);
  }catch(e){
    console.error('saveBonus failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883|PGRST202/i.test(t)
      ? '❌ الميزة لسه ماتركبتش — شغّل ملف 72-bonuses.sql' : '❌ ' + t);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '🎁 اعمل الحافز'; }
  }
}

async function deleteBonus(id){
  if(!confirm('تمسح الحافز ده؟\nهيتشال من صافي المرتب.')) return;
  try{
    const { error } = await sb.rpc('hr_delete_bonus', { p_id: id });
    if(error) throw error;
    await loadBonuses();
    render();
    if(document.getElementById('bonSheet').classList.contains('open')) renderBonus();
    await payAdminReload();
  }catch(e){
    console.error('deleteBonus failed:', e);
    alert('❌ ' + (e.message || e));
  }
}

// ============================================================
// 💳 ديون الموظف (ملف 73)
// ------------------------------------------------------------
// 🧸 بالبلدي: الدين «كشكول» لوحده. ممكن الموظف يبقى عليه كذا كشكول
//    (دين قديم · قسط بنك · مشتريات · صيانة · لبوس…).
//    • تسجيل الدين **مبيخصمش** — بيظهر كتذكير بس.
//    • HR بتختار كل شهر هتخصم كام من أنهي دين → ده بس اللي بينزل
//      من الصافي، والباقي بيترحّل لوحده.
//    • الصافي طلع بالسالب يوم الصرف؟ السيرفر بيسجّل الفرق دين
//      «عجز مرتب» ويترحّل مع الباقي.
//
// 🔴 كل الحسابات والحواجز في السيرفر (hr_debt_*). الصفحة بتعرض بس.
// ============================================================
const DEBT_KINDS = {
  old:       { t:'مديونية قديمة',        i:'📜' },
  external:  { t:'دين خارجي بضمان المرتب', i:'🏦' },
  purchase:  { t:'مشتريات من المحل',     i:'🛒' },
  repair:    { t:'صيانة',                i:'🔧' },
  damage:    { t:'لبوس',                 i:'💥' },
  carryover: { t:'عجز مرتب مترحّل',      i:'↪️' },
  other:     { t:'أخرى',                 i:'📌' }
};
let DEBTS = {};       // إيميل → [ديون بباقيها] من hr_debt_list
let DEBT_PAYS = {};   // رقم الدين → [سدادات]
let DEBT_ERR = '';
let DEBT_EMAIL = '';
let DEBT_SHOW_DONE = false;

async function loadDebts(){
  DEBT_ERR = '';
  try{
    const [l, p] = await Promise.all([
      hrAll(() => sb.rpc('hr_debt_list', { p_email: null }).order('id'), 'الديون'),
      hrAll(() => sb.from('hr_debt_payments')
        .select('id,debt_id,user_email,period,amount,note,created_by,created_at')
        .order('created_at', { ascending:false }).order('id'), 'سداد الديون')
    ]);
    DEBTS = {}; DEBT_PAYS = {};
    l.forEach(r => { const e = (r.user_email||'').toLowerCase(); (DEBTS[e] = DEBTS[e] || []).push(r); });
    Object.keys(DEBTS).forEach(e => DEBTS[e].sort((a,b) =>
      (Number(b.remaining) > 0) - (Number(a.remaining) > 0) ||
      String(b.debt_date).localeCompare(String(a.debt_date))));
    p.forEach(r => { (DEBT_PAYS[r.debt_id] = DEBT_PAYS[r.debt_id] || []).push(r); });
  }catch(e){
    // ⚠️ بنقول بصوت عالي — السكوت هنا = HR تفتكر إن الموظف مالوش ديون
    console.error('loadDebts failed:', e);
    DEBTS = {}; DEBT_PAYS = {};
    const t = (e && e.message) ? e.message : String(e);
    DEBT_ERR = /does not exist|42883|42P01|PGRST202|PGRST205/i.test(t)
      ? 'ميزة الديون لسه ماتركبتش — شغّل ملف 73-debts.sql' : t;
  }
}

function debtRemaining(email){
  const t = (DEBTS[(email||'').toLowerCase()] || [])
    .reduce((a, d) => a + Math.max(0, Number(d.remaining || 0)), 0);
  return Math.round(t * 100) / 100;
}

// تذكير تحت كشف الراتب: «عليه ديون — لسه ما اتخصمتش» + ترحيل السالب
function slipDebtNoteHtml(r){
  const bits = [];
  if(r.paid && Number(r.net) < 0){
    bits.push(`↪️ الصافي كان بالسالب — اترحّل <b>${lbMoney(-Number(r.net))}</b> ج.م دين على الشهر الجاي.`);
  }
  const rem = debtRemaining(SLIP.email);
  if(!r.paid && rem){
    bits.push(`💳 عليه ديون باقي منها <b>${lbMoney(rem)}</b> ج.م — <u>لسه ما اتخصمتش</u> من الصافي اللي فوق.`);
  }
  return bits.length ? `<div class="debt-note">${bits.join('<br>')}</div>` : '';
}

async function openDebts(email){
  DEBT_EMAIL = (email || '').toLowerCase();
  DEBT_SHOW_DONE = false;
  const list = allPeople();
  if(!list.length){ alert('مفيش موظفين متسجّلين — ضيفهم من لوحة الأدمن الأول'); return; }
  if(list.indexOf(DEBT_EMAIL) < 0) DEBT_EMAIL = list[0];
  document.getElementById('debtBody').innerHTML = '<div class="empty">جاري التحميل…</div>';
  openSheet('debtSheet');
  await loadDebts();          // ⚠️ طازة — ممكن حد تاني سدّد من موبايل تاني
  renderDebts();
}

  const rem = Number(d.remaining || 0);
  const pays = DEBT_PAYS[d.id] || [];
  const thisMonth = pays.filter(p => String(p.period).slice(0,7) === MONTH);
  const def = rem > 0 ? Math.min(rem, Number(d.monthly_installment || 0) || rem) : 0;
  return `
    <div class="debt-card${rem > 0 ? '' : ' done'}">
      <div class="debt-h">
        <b>${k.i} ${esc(d.title)}</b>
        <span class="debt-kind">${esc(k.t)}</span>
      </div>
      <div class="debt-nums">
        <div><b>${lbMoney(d.amount)}</b><span>الدين</span></div>
        <div><b style="color:var(--done)">${lbMoney(d.paid_total)}</b><span>اتسدّد</span></div>
        <div><b style="color:${rem > 0 ? 'var(--red)' : 'var(--done)'}">${lbMoney(rem)}</b><span>الباقي</span></div>
      </div>
      <div class="debt-hist">
        ${new Date(d.debt_date).toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' })}${
        d.monthly_installment ? ' · القسط الشهري ' + lbMoney(d.monthly_installment) + ' ج.م' : ''}${
        d.note ? ' · ' + esc(d.note) : ''}
        ${pays.map(p => `<div><span>✔️ ${lbMoney(p.amount)} من مرتب ${esc(new Date(p.period).toLocaleDateString('ar-EG', { month:'long', year:'numeric' }))}</span>
          <button class="ded-del" title="إلغاء السداد ده" onclick="debtUnpay('${esc(p.id)}')">↩️</button></div>`).join('')}
      </div>
      ${rem > 0 ? `
        <div class="debt-pay">
          <input type="number" id="dp_${esc(d.id)}" min="1" step="50" inputmode="decimal"
                 placeholder="المبلغ" value="${thisMonth.length ? '' : (def || '')}">
          <button onclick="debtPay('${esc(d.id)}')">💸 اخصم من مرتب ${esc(monthLabel())}</button>
        </div>` : ''}
      ${(!pays.length && d.kind !== 'carryover') ? `<button class="mini-btn danger" style="margin-top:8px;"
          onclick="debtDelete('${esc(d.id)}')">🗑️ امسح الدين (اتسجّل غلط)</button>` : ''}
    </div>`;
}

async function debtAdd(){
  const g = id => ((document.getElementById(id) || {}).value || '').trim();
  const kind = g('dbKind'), title = g('dbTitle'), note = g('dbNote'), day = g('dbDate');
  const amt = parseFloat(g('dbAmt')), inst = g('dbInst') === '' ? null : parseFloat(g('dbInst'));
  const now = g('dbNow') === '' ? 0 : parseFloat(g('dbNow'));
  if(!title){ alert('اكتب تفاصيل الدين'); return; }
  if(!amt || amt <= 0){ alert('اكتب المبلغ'); return; }
  if(inst !== null && !(inst > 0)){ alert('القسط لازم يكون أكبر من صفر أو فاضي'); return; }
  if(now && now > amt){ alert('اللي هيتخصم دلوقتي أكبر من الدين نفسه'); return; }
  const k = DEBT_KINDS[kind] || {};
  if(!confirm(`تسجيل دين\n\nالموظف: ${nameOf(DEBT_EMAIL)}\nالنوع: ${k.t}\nالتفاصيل: ${title}\nالمبلغ: ${amt} ج.م` +
              (inst ? `\nالقسط: ${inst} ج.م/شهر` : '') +
              (now ? `\n\n💸 هيتخصم دلوقتي ${now} ج.م من مرتب ${monthLabel()}` : '\n\n(تذكير بس — مش هيتخصم من الصافي)'))) return;
  const btn = document.getElementById('dbSave');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try{
    const { error } = await sb.rpc('hr_add_debt', {
      p_email: DEBT_EMAIL, p_kind: kind, p_title: title, p_amount: amt,
      p_installment: inst, p_date: day || null, p_note: note || null,
      p_pay_now: now || null, p_pay_period: now ? MONTH + '-01' : null });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    await notifyPay(DEBT_EMAIL, now
      ? `💳 اتسجّل عليك دين ${amt} ج.م (${title}) — واتخصم منه ${now} ج.م من مرتب ${monthLabel()}`
      : `💳 اتسجّل عليك دين ${amt} ج.م (${title}) — لسه ما اتخصمش من مرتبك`);
    await debtAfterChange();
    alert('✅ اتسجّل');
  }catch(e){
    console.error('debtAdd failed:', e);
    alert('❌ ' + (e.message || e));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '💳 سجّل الدين'; }
  }
}

async function debtPay(id){
  const d = (DEBTS[DEBT_EMAIL] || []).find(x => x.id === id);
  const el = document.getElementById('dp_' + id);
  const amt = parseFloat((el && el.value) || '');
  if(!d) return;
  if(!amt || amt <= 0){ alert('اكتب المبلغ'); return; }
  if(amt > Number(d.remaining)){ alert('المبلغ أكبر من الباقي (' + lbMoney(d.remaining) + ')'); return; }
  // ⚠️ تحذير لو الخصم هيخلّي الصافي بالسالب — مش منع، بس لازم تعرف
  const row = (PAYROWS[DEBT_EMAIL] || {})[MONTH + '-01'];
  const warn = (row && Number(row.net) - amt < 0)
    ? `\n\n⚠️ الصافي هيبقى بالسالب (${lbMoney(Number(row.net) - amt)}) — والفرق هيترحّل دين يوم الصرف.` : '';
  if(!confirm(`خصم ${amt} ج.م من مرتب ${monthLabel()}\nسداد: ${d.title}\nالباقي بعده: ${lbMoney(Number(d.remaining) - amt)}${warn}`)) return;
  try{
    const { error } = await sb.rpc('hr_debt_pay',
      { p_debt_id: id, p_amount: amt, p_period: MONTH + '-01', p_note: null });
    if(error) throw error;
    await notifyPay(DEBT_EMAIL, `💳 اتخصم ${amt} ج.م من مرتب ${monthLabel()} — سداد: ${d.title}`);
    await debtAfterChange();
  }catch(e){
    console.error('debtPay failed:', e);
    alert('❌ ' + (e.message || e));
  }
}

async function debtUnpay(payId){
  if(!confirm('تلغي السداد ده؟\nالمبلغ هيرجع على الدين، وهيتشال من خصم المرتب.')) return;
  try{
    const { error } = await sb.rpc('hr_debt_unpay', { p_payment_id: payId });
    if(error) throw error;
    await debtAfterChange();
  }catch(e){ alert('❌ ' + (e.message || e)); }
}

async function debtDelete(id){
  if(!confirm('تمسح الدين ده خالص؟ (للدين اللي اتسجّل غلط بس)')) return;
  try{
    const { error } = await sb.rpc('hr_delete_debt', { p_id: id });
    if(error) throw error;
    await debtAfterChange();
  }catch(e){ alert('❌ ' + (e.message || e)); }
}

async function saveDeduction(){
  const btn = document.getElementById('dedSave');
  const amt = parseFloat((document.getElementById('dedAmt') || {}).value);
  const why = ((document.getElementById('dedWhy') || {}).value || '').trim();

  // ⚠️ الفحص هنا **مجاملة للمستخدم بس**. الفحص الحقيقي جوه دالة
  //    hr_add_deduction في السيرفر — لو شيلنا السطرين دول، محدش
  //    هيقدر يعدّي خصم فاضي برضه.
  if(!amt || amt <= 0){ alert('اكتب مبلغ أكبر من صفر'); return; }
  if(!why){ alert('لازم تكتب سبب الخصم'); return; }
  if(!confirm(`تأكيد الخصم\n\nالموظف: ${nameOf(DED_EMAIL)}\nالمبلغ: ${amt} ج.م\nالسبب: ${why}`)) return;

  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try{
    const { data, error } = await sb.rpc('hr_add_deduction', {
      p_email:  DED_EMAIL,
      p_amount: amt,
      p_reason: why
    });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error. من غير السطر ده
    //    الشاشة هتقول «اتحفظ ✅» والخصم ما اتكتبش.
    if(error) throw error;

    await notifyDeduction(DED_EMAIL, amt, why);   // إشعار برّه التطبيق (اختياري)
    await loadDeductions();
    render();
    renderDeduction();
    // ⚠️ لو الخصم اتعمل من صفحة المرتبات، لازم أرقامها تتحدّث كمان —
    //    من غير السطر ده الصافي بيفضل قديم قدام عين المستخدم.
    await payAdminReload();   // الكارت بياخد أرقامه من الكشف — لازم يتقرا تاني
    const a = document.getElementById('dedAmt'); if(a) a.value = '';
    const w = document.getElementById('dedWhy'); if(w) w.value = '';
    alert('✅ اتسجّل الخصم — هيوصل للموظف في شاشة «مرتبك»');
  }catch(e){
    console.error('saveDeduction failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883|42P01/i.test(t)
      ? '❌ الميزة لسه ماتركبتش في قاعدة البيانات — شغّل ملف 32-hr-deductions.sql'
      : '❌ فشل الخصم: ' + t);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '💸 اعمل الخصم'; }
  }
}

async function deleteDeduction(id){
  if(!confirm('متأكد إنك عايز تمسح الخصم ده؟\n\nهيتشال من عند الموظف ومن المجموع.')) return;
  try{
    const { error } = await sb.rpc('hr_delete_deduction', { p_id: id });
    if(error) throw error;
    await loadDeductions();
    render();
    if(document.getElementById('dedSheet').classList.contains('open')) renderDeduction();
    await payAdminReload();   // الكارت بياخد أرقامه من الكشف — لازم يتقرا تاني
    alert('اتمسح ✅');
  }catch(e){
    console.error('deleteDeduction failed:', e);
    alert('❌ مقدرناش نمسحه: ' + (e.message || e));
  }
}

// الإشعار خارج التطبيق
// ------------------------------------------------------------
// ⚠️ ده **طبقة زيادة مش أساس**. لو الـ Edge Function مش متظبّطة،
//    الخصم بيتسجّل عادي وبيوصل في التطبيق — الإشعار الخارجي بس
//    اللي مش هيطلع. عشان كده الخطأ هنا بيتسجّل في الكونسول
//    وبس، ومش بيوقّف الحفظ.
// ============================================================
async function notifyPay(email, body){
  try{
    const { error } = await sb.functions.invoke('send-push', {
      body: {
        emails: [email],
        title:  '💰 تحديث في شاشة مرتبك',
        body:   body,
        url:    'index.html'
      }
    });
    if(error) throw error;
  }catch(e){
    console.warn('send-push failed (العملية اتسجّلت عادي):', e);
  }
}
function notifyDeduction(email, amount, reason){
  return notifyPay(email, `حصل خصم ${amount} ج.م — ${reason}`);
}

// ============================================================
// 🧾 كشوف الرواتب
// ------------------------------------------------------------
// 🔴 الكشف **قبل الصرف حي، وبعد الصرف متجمّد**.
//
//    قبل الصرف: الأرقام بتتحسب لحظة السؤال. لو شلتي خصم أو
//    ظبّطتي تسجيل، الكشف بيتصحّح لوحده. وده المفروض.
//
//    بعد الصرف: الأرقام بتتصوّر في جدول hr_payslips وتتقفل.
//    لو سيبناها حية، أي تعديل في السجل بعد سنة كان هيغيّر ورقة
//    قبض الموظف بأثر رجعي — والورقة مبقاش ليها معنى.
//
// ⚠️ التراجع بيمسح الصورة فالكشف يرجع حي. وده صح: التراجع معناه
//    «الصرف ده ما حصلش»، مش «حصل وبنعدّله».
// ============================================================
let SLIP = { email:'', rows:[], busy:false };

async function openPayslips(email){
  SLIP = { email:(email||'').toLowerCase(), rows:[], busy:false };
  SLIP_OLD_OPEN = false;   // كل موظف بيفتح ودرجه مقفول
  document.getElementById('slipTitle').textContent = '🧾 كشوف — ' + nameOf(SLIP.email);
  document.getElementById('slipBody').innerHTML = '<div class="empty">جاري التحميل…</div>';
  openSheet('slipSheet');
  await loadDebts();       // 💳 عشان تذكير «لسه ما اتخصمتش» يبقى طازة
  await loadPayslips();
  renderPayslips();
}

async function loadPayslips(){
  try{
    const { data, error } = await sb.rpc('hr_payroll_periods', { p_email: SLIP.email });
    if(error) throw error;
    SLIP.rows = data || [];
  }catch(e){
    // بنقول بصوت عالي: لو سكتنا، الشاشة هتقول «مفيش كشوف»
    // و HR تفتكر إن الموظف مالوش مستحقات
    console.error('loadPayslips failed:', e);
    SLIP.rows = [];
    const t = (e && e.message) ? e.message : String(e);
    document.getElementById('slipBody').innerHTML =
      '<div class="hintbox" style="background:var(--rejected-bg,#FEF2F2);color:var(--red);">' +
      (/does not exist|42883/i.test(t)
        ? '❌ الميزة لسه ماتركبتش — شغّل ملف 39-payslips.sql'
        : '❌ مقدرناش نقرا الكشوف: ' + esc(t)) + '</div>';
    throw e;
  }
}

function slipMonthName(p){
  return new Date(p).toLocaleDateString('ar-EG', { month:'long', year:'numeric' });
}

function renderPayslips(){
  const box = document.getElementById('slipBody');
  if(!box) return;
  if(!SLIP.rows.length){
    box.innerHTML = '<div class="empty">مفيش كشوف للموظف ده لسه<br>' +
      '<small>الكشف بيظهر أول ما يبقى ليه مرتب أو حضور أو خصم</small></div>';
    return;
  }

  const due  = SLIP.rows.filter(r => !r.paid);
  const paid = SLIP.rows.filter(r =>  r.paid);

  box.innerHTML = `
    ${due.length ? `
      <div style="font-weight:900;font-size:13.5px;margin:4px 0 10px;color:var(--waiting);">
        ⏳ لسه ماتصرفش (${due.length})</div>
      ${due.map(r => slipCard(r)).join('')}` : `
      <div class="hintbox" style="background:var(--done-bg);color:var(--done);">
        ✅ كل الكشوف اتصرفت</div>`}

    ${paid.length ? `
      <div class="wd-drawer" style="margin-top:16px;">
        <button class="wd-head" onclick="slipToggleOld()">
          <span class="wd-ttl">🗄️ درج المرتبات المصروفة</span>
          <span class="wd-sum">${paid.length} شهر</span>
          <span class="wd-arw">${SLIP_OLD_OPEN ? '▴' : '▾'}</span>
        </button>
        ${SLIP_OLD_OPEN ? `<div class="wd-body">${paid.map(r => slipCard(r)).join('')}</div>` : ''}
      </div>` : ''}`;
}

// ============================================================
// 🗄️ درج المرتبات المصروفة
// ------------------------------------------------------------
// 🐞 قبل كده الكروت المصروفة كانت بتظهر مفتوحة على طول: الدرج كان
//    معتمد على كلاس «hidden» والصفحة دي ماكانش فيها تعريف ليه.
// ✅ دلوقتي الكروت **مبتترسمش أصلاً** غير لما الدرج يتفتح — مفيش
//    حاجة تعتمد على CSS. والدرج بيرجع مقفول كل ما تفتح كشوف موظف.
// ============================================================
let SLIP_OLD_OPEN = false;
function slipToggleOld(){
  SLIP_OLD_OPEN = !SLIP_OLD_OPEN;
  renderPayslips();
}

// ============================================================
// سطور الأوفر تايم في كشف الراتب
// ------------------------------------------------------------
// ⚠️ الصافي بالموجب = أوفر تايم (بيتزوّد على المرتب).
//    بالسالب = عجز ساعات (بينزل من المرتب).
//    بنكتب الاتنين بلون وعلامة مختلفين عشان محدش يقراهم غلط.
// ============================================================
function slipOvertimeLines(r){
  const n  = v => Number(v || 0).toLocaleString('en-US');
  const om = Number(r.over_min  || 0);
  const sm = Number(r.short_min || 0);
  const nm = Number(r.net_min   || 0);
  const amt = Number(r.overtime_amt || 0);
  if(!om && !sm) return '';

  const plus = nm >= 0;
  return `
    <div><span>ساعات زيادة</span><b style="color:var(--done)">${fmtDur(om)}</b></div>
    <div><span>ساعات ناقصة</span><b class="minus">${fmtDur(sm)}</b></div>
    <div style="border-top:1px dashed var(--border);padding-top:7px;margin-top:3px;">
      <span>${plus ? '+ أوفر تايم' : '− عجز ساعات'}
        <small style="opacity:.75;">(${fmtDur(Math.abs(nm))} × ${
          Number(r.hour_value || 0).toFixed(2)} ج.م/س)</small></span>
      <b style="color:${plus ? 'var(--done)' : 'var(--red)'}">${n(Math.abs(amt))}</b>
    </div>`;
}

function slipCard(r){
  const n = v => Number(v || 0).toLocaleString('en-US');
  return `
  <div class="slip ${r.paid ? 'paid' : 'due'}">
    <div class="slip-h">
      <b>${esc(slipMonthName(r.period))}</b>
      <span class="slip-tag ${r.paid ? 'ok' : 'wait'}">${
        r.paid ? '✅ تم صرف الراتب' : '⏳ لسه ماتصرفش'}</span>
    </div>

    <div class="slip-lines">
      <div><span>المرتب</span><b>${n(r.salary)}</b></div>
      <div><span>− خصومات يدوية</span><b class="minus">${n(r.manual_ded)}</b></div>
      ${Number(r.withdraw_ded) ? `<div><span>− مسحوبات
        <small style="opacity:.75;">من ملف الإكسل</small></span>
        <b class="minus">${n(r.withdraw_ded)}</b></div>` : ''}
      <div><span>− خصومات تأخير</span><b class="minus">${n(r.late_ded)}</b></div>
      ${slipOvertimeLines(r)}
      ${Number(r.debt_ded) ? `<div><span>− 💳 سداد ديون</span>
        <b class="minus">${n(r.debt_ded)}</b></div>` : ''}
      ${Number(r.bonus) ? `<div><span>+ 🎁 حوافز ومكافآت</span>
        <b style="color:var(--done)">${n(r.bonus)}</b></div>` : ''}
      ${Number(r.leave_bonus) ? `<div><span>+ إجازات ما اتاخدتش</span>
        <b style="color:var(--done)">${n(r.leave_bonus)}</b></div>` : ''}
      <div class="eq"><span>= الصافي</span><b>${n(r.net)} ج.م</b></div>
    </div>
    ${slipDebtNoteHtml(r)}

    ${r.paid ? `
      <div class="slip-meta">
        اتصرف ${esc(new Date(r.paid_at).toLocaleDateString('ar-EG',
          { day:'numeric', month:'long', year:'numeric' }))}
        · بواسطة ${esc(r.paid_by || '—')}
        · ${r.seen_at ? '✔️ الموظف شافه' : '🔔 لسه ما شافوش'}
        <br>🔒 الأرقام دي متقفلة — أي تعديل في السجل بعد كده مش هيغيّرها.
      </div>
      <button class="slip-btn undo" onclick="unmarkPaid('${esc(r.period)}')">
        ↩️ تراجع عن الصرف</button>`
    : `
      <button class="slip-btn" onclick="markPaid('${esc(r.period)}')">
        ✅ تم صرف الراتب</button>`}
  </div>`;
}

async function markPaid(period){
  if(SLIP.busy) return;
  const row = SLIP.rows.find(r => String(r.period) === String(period));
  if(!row) return;

  if(!confirm('تسجيل صرف راتب ' + slipMonthName(period) + '\n\n'
            + 'الصافي: ' + Number(row.net || 0) + ' ج.م\n\n'
            + '⚠️ الأرقام دي هتتقفل. أي تعديل في السجل بعد كده مش هيغيّر الكشف.')) return;

  SLIP.busy = true;
  try{
    const { error } = await sb.rpc('hr_mark_paid',
      { p_email: SLIP.email, p_period: period });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    await notifyPay(SLIP.email,
      `تم صرف راتب ${slipMonthName(period)} — صافي ${Number(row.net || 0)} ج.م`);
    await loadPayslips();
    renderPayslips();
    alert('✅ اتسجّل — والموظف هيشوف الكشف في «مرتبك»');
  }catch(e){
    console.error('markPaid failed:', e);
    alert('❌ ' + (e.message || e));
  }finally{
    SLIP.busy = false;
  }
}

async function unmarkPaid(period){
  if(SLIP.busy) return;
  if(!confirm('تراجع عن صرف راتب ' + slipMonthName(period) + '؟\n\n'
            + 'الكشف هيرجع «لسه ماتصرفش» وأرقامه هترجع تتحسب لحظياً تاني.')) return;

  SLIP.busy = true;
  try{
    const { error } = await sb.rpc('hr_unmark_paid',
      { p_email: SLIP.email, p_period: period });
    if(error) throw error;
    await loadPayslips();
    renderPayslips();
  }catch(e){
    console.error('unmarkPaid failed:', e);
    alert('❌ ' + (e.message || e));
  }finally{
    SLIP.busy = false;
  }
}

// ============================================================
// 🛡️ تاريخ بداية تطبيق خصم التأخير
// ------------------------------------------------------------
// ⚠️ الشريط الأحمر لما يكون فاضي **مقصود ومهم**. لو سكتنا،
//    النظام هيفضل يخصم بأثر رجعي على شهور الموظف ما كانش يعرف
//    فيها إن فيه نظام خصم أصلاً — وده بيهدّ الثقة في النظام كله
//    من أول يوم.
// ============================================================
function penStartHtml(){
  const set = !!PEN_START;
  const nice = set ? new Date(PEN_START).toLocaleDateString('ar-EG',
    { day:'numeric', month:'long', year:'numeric' }) : '';

  return `
  <div class="pen-start${set ? '' : ' warn'}">
    <div class="pen-start-h">
      <b>🛡️ نظام المرتبات بيبدأ من</b>
      ${set ? `<span>${esc(nice)}</span>` : `<span class="bad">⚠️ مش متحدد</span>`}
    </div>

    ${set
      ? `<small>أي يوم قبل التاريخ ده بيبان في السجل إن الموظف كان متأخر —
           <b>بس من غير خصم فلوس</b>.<br>
           والكشوف بتبدأ من الشهر ده كمان — الشهور اللي قبله مش بتظهر.</small>`
      : `<small><b>النظام دلوقتي بيخصم على كل التاريخ</b>، بما فيه شهور الموظفين
           ما كانوش يعرفوا فيها إن فيه نظام خصم أصلاً. حدد تاريخ بداية.</small>`}

    <div class="pen-start-row">
      <input type="date" id="penStartInp" value="${esc(PEN_START || '')}">
      <button onclick="savePenaltyStart()">💾 حفظ</button>
    </div>
  </div>`;
}

async function savePenaltyStart(){
  const el = document.getElementById('penStartInp');
  if(!el) return;
  const v = (el.value || '').trim();

  // ⚠️ المسح بيرجّع النظام للخصم على كل التاريخ. مش بنمنعه —
  //    ممكن يكون مقصود — بس بنتأكد إن اللي بيعمله فاهم نتيجته.
  if(!v){
    if(!confirm('لو سيبته فاضي، الخصم هيتطبق على **كل تاريخ الحضور** '
              + 'من أول يوم في النظام.\n\nمتأكد؟')) return;
  }else{
    const nice = new Date(v).toLocaleDateString('ar-EG',
      { day:'numeric', month:'long', year:'numeric' });
    if(!confirm('نظام المرتبات هيبدأ من ' + nice + '.\n\n'
              + '• كل الأيام اللي قبله خصمها هيبقى صفر\n'
              + '• والكشوف اللي قبل الشهر ده مش هتظهر\n\n'
              + '(الكشف اللي اتصرف فعلاً بيفضل ظاهر في السجل.)')) return;
  }

  try{
    const { error } = await sb.rpc('hr_set_penalty_start', { p_date: v || null });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    // إعادة تحميل كاملة: كل الخصومات بتتحسب من أول وجديد
    await loadMonth();
    await payAdminReload();   // الكارت بياخد أرقامه من الكشف — لازم يتقرا تاني
    alert('✅ اتحفظ — الخصومات اتحسبت من أول وجديد');
  }catch(e){
    console.error('savePenaltyStart failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883/i.test(t)
      ? '❌ الميزة لسه ماتركبتش — شغّل ملف 38-penalty-start-date.sql'
      : '❌ ' + t);
  }
}

// ============================================================
// ✍️ التسجيل اليدوي — إضافة · تعديل · مسح
// ------------------------------------------------------------
// 🔴 جدول attendance **لسه مقفول** على الإدخال المباشر. كل حاجة
//    هنا بتمر من ٣ دوال في السيرفر بتفحص إن اللي بينده HR أو أدمن،
//    وبتحط ختم على الصف: مين كتبه بإيده وإمتى.
//
// 🔴 والختم بيظهر للموظف نفسه في سجله («✍️ يدوي»). لو HR قدرت
//    تعدّل السجل في الخفا، السجل كله يفقد قيمته كدليل — والموظف
//    يبقى معاه حق يشك في أي رقم.
//
// ⚠️ الوقت بيتبعت **نص** ('YYYY-MM-DD HH:MM') والسيرفر بيحوّله
//    بتوقيت القاهرة. لو بنينا timestamp في المتصفح، كان هيتبني
//    بساعة **الجهاز** — ولو جهاز الـ HR على توقيت تاني، كل
//    التسجيلات تتكتب غلط ومحدش ياخد باله.
// ============================================================
let PUNCH = { email:'', id:null, day:'' };

const PUNCH_KINDS = [
  { k:'in',     t:'🟢 حضور' },
  { k:'out',    t:'🔴 انصراف' },
  { k:'break',  t:'☕ بريك' },
  { k:'resume', t:'▶️ استئناف العمل' }
];

function openPunch(email, day, id){
  PUNCH = { email:(email||'').toLowerCase(), id:id || null, day:day || '' };
  renderPunch();
  openSheet('punchSheet');
}

function findPunch(id){
  return ROWS.find(r => String(r.id) === String(id)) || null;
}

// الوقت بتوقيت القاهرة في صيغة خانة datetime-local
function cairoLocal(iso){
  const p = new Date(iso).toLocaleString('sv-SE', { timeZone:'Africa/Cairo' });
  return p.slice(0,16).replace(' ', 'T');   // 'YYYY-MM-DDTHH:MM'
}

function renderPunch(){
  const editing = !!PUNCH.id;
  const row = editing ? findPunch(PUNCH.id) : null;
  const list = allPeople();

  if(editing && !row){
    document.getElementById('punchBody').innerHTML =
      '<div class="empty">التسجيل ده مش موجود — اقفل وافتح تاني</div>';
    return;
  }

  const kind = row ? row.kind : 'in';
  const day  = row ? row.work_date : (PUNCH.day || todayCairo());
  // الوقت الافتراضي: نص اليوم — عشان HR تكتبه بإيدها بدل ما تسيب
  // ساعة عشوائية تعدّي بالغلط
  const at   = row ? cairoLocal(row.at) : (day + 'T00:00');
  // الصف الموجود: اليوم المحاسبي مختلف عن يوم الوقت؟ يبقى ده
  // تسجيل بعد نص الليل
  const prevShift = row ? (String(row.work_date) !== at.slice(0,10)) : false;

  document.getElementById('punchTitle').textContent =
    (editing ? '✏️ تعديل تسجيل — ' : '✍️ تسجيل يدوي — ') + nameOf(PUNCH.email || (list[0]||''));

  document.getElementById('punchBody').innerHTML = `
    <div class="hintbox">
      التسجيل ده هيتكتب <b>باسمك</b> وهيظهر للموظف بعلامة «✍️ يدوي».<br>
      ومش هيبقى موثّق ببصمة ولا لوكيشن — طبيعي، الموظف مش موجود دلوقتي.<br>
      وأي تعديل هنا <b>بيعيد حساب الساعات والخصومات</b> لليوم ده لوحده.
    </div>

    ${editing ? '' : `
    <label class="fld"><span>👤 الموظف</span>
      <select id="pkEmail" onchange="PUNCH.email=this.value; renderPunch()">
        ${list.map(e => `<option value="${esc(e)}"${e===PUNCH.email?' selected':''}>${esc(nameOf(e))}</option>`).join('')}
      </select>
    </label>`}

    <label class="fld"><span>📌 نوع التسجيل</span>
      <select id="pkKind">
        ${PUNCH_KINDS.map(x => `<option value="${x.k}"${x.k===kind?' selected':''}>${x.t}</option>`).join('')}
      </select>
    </label>

    <label class="fld"><span>🕐 وقت التسجيل — بتوقيت القاهرة</span>
      <small>اكتب اليوم والساعة اللي حصل فيهم فعلاً. الكارت بيتحدد من هنا.</small>
      <input type="datetime-local" id="pkAt" value="${esc(at)}" oninput="punchPreview()">
    </label>

    <!-- ⚠️ كان فيه خانة تانية اسمها «اليوم المحاسبي». اتشالت.
         خانتين تاريخ في شاشة واحدة = دعوة للغلط: المستخدم بيغيّر
         واحدة وينسى التانية، فالتسجيل بيروح لكارت يوم تاني وهو
         مش فاهم ليه. دلوقتي التاريخ بيتاخد من الوقت أوتوماتيك،
         والحالة الاستثنائية الوحيدة بقت صح/غلط واضح. -->
    <label class="fld" style="display:flex;align-items:flex-start;gap:9px;">
      <input type="checkbox" id="pkPrev" ${prevShift ? 'checked' : ''}
             onchange="punchPreview()"
             style="width:auto;margin-top:3px;flex:none;">
      <span style="font-weight:700;font-size:13px;line-height:1.8;">
        ده تسجيل <b>بعد نص الليل</b> وبيتبع وردية اليوم اللي قبله<br>
        <small style="font-weight:400;color:var(--muted);">
          مثال: حضر ٣١ ومشي ٢ الفجر يوم ١ — الانصراف بيتحسب على وردية ٣١.</small>
      </span>
    </label>

    <div class="hintbox" id="pkPreview" style="background:var(--blue-bg);color:var(--blue);"></div>

    <label class="fld"><span>📝 ملاحظة (اختياري)</span>
      <input type="text" id="pkNote" placeholder="مثال: نسي يسجّل الانصراف"
             value="${esc(row && row.manual_note ? row.manual_note : '')}">
    </label>

    <button class="save" id="pkSave" onclick="savePunch()">

function todayCairo(){
  return new Date().toLocaleDateString('sv-SE', { timeZone:'Africa/Cairo' });
}

// إزاحة يوم على نص 'YYYY-MM-DD' — بـ UTC عشان التوقيت الصيفي
// ما يخليش اليوم يقفز يومين أو يقف مكانه
function shiftDay(ymd, delta){
  const [y,m,d] = ymd.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1, d));
  t.setUTCDate(t.getUTCDate() + delta);
  return t.toISOString().slice(0,10);
}

// 🔴 مصدر واحد لحساب اليوم المحاسبي — المعاينة والحفظ بيندهوه.
//    لو حسبناه في مكانين، المعاينة تقول كارت وهو يروح كارت تاني.
function punchWorkDate(){
  const atv = ((document.getElementById('pkAt') || {}).value || '').trim();
  if(!atv) return '';
  const day  = atv.slice(0,10);
  const prev = !!(document.getElementById('pkPrev') || {}).checked;
  return prev ? shiftDay(day, -1) : day;
}

// بتوري لـ HR الكارت اللي التسجيل هيروحه **قبل** ما تحفظ.
// ⚠️ ده مش زينة: الغلطة اللي حصلت كانت إن التسجيل راح لكارت يوم
//    تاني ومحدش عرف غير بعد ما دوّر. الشاشة بقت بتقول قبل الحفظ.
// 🔴 الغلطة الشائعة: انصراف بعد نص الليل بيتكتب بتاريخ نفس اليوم
//    من غير ما تتعلّم خانة «بعد نص الليل». النتيجة إن التسجيل
//    بيترتب **قبل** الحضور، فالوقت بعده مش بيتحسب شغل، والرقم
//    اللي فوق بيطلع أقل من الحقيقة من غير سبب واضح.
//    الدالة دي بتكشفها: التسجيل الجديد قبل أول تسجيل في اليوم؟
// بترجّع { bad, firstAt } أو null لو مفيش تسجيلات
function punchOrderIssue(){
  const atv = ((document.getElementById('pkAt') || {}).value || '').trim();
  const wd  = punchWorkDate();
  if(!atv || !wd) return null;
  const em = (PUNCH.email || '').toLowerCase();
  // تسجيلات اليوم — من غير اللي بنعدّله دلوقتي
  const same = ROWS.filter(r => (r.user_email || '').toLowerCase() === em
                             && r.work_date === wd
                             && String(r.id) !== String(PUNCH.id || ''));
  if(!same.length) return null;
  const firstAt = same.map(r => new Date(r.at).getTime()).sort((a,b) => a - b)[0];
  // الوقت المكتوب بتوقيت القاهرة → مللي ثانية للمقارنة
  const t = new Date(atv.replace('T', ' ').replace(/-/g, '/') + ':00').getTime();
  return { bad: t < firstAt, firstAt };
}

// بتظبط التسجيل: تعلّم «بعد نص الليل» وتزوّد يوم على التاريخ
function punchFixMidnight(){
  const el = document.getElementById('pkAt');
  const cb = document.getElementById('pkPrev');
  if(!el || !cb) return;
  el.value = shiftDay(el.value.slice(0,10), 1) + el.value.slice(10);
  cb.checked = true;
  punchPreview();
}

function punchPreview(){
  const box = document.getElementById('pkPreview');
  if(!box) return;
  const wd = punchWorkDate();
  if(!wd){ box.textContent = 'اكتب الوقت الأول'; return; }
  const nice = new Date(wd).toLocaleDateString('ar-EG',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  let html = '📍 هيتحط في كارت: <b>' + esc(nice) + '</b>';

  const iss = punchOrderIssue();
  if(iss && iss.bad){
    const ft = new Date(iss.firstAt).toLocaleTimeString('ar-EG',
      { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Cairo' });
    html += `<div style="margin-top:9px;padding:9px 11px;border-radius:9px;
        background:var(--waiting-bg,#FFF7ED);color:var(--waiting,#B45309);
        border:1px solid var(--waiting,#B45309);font-weight:700;line-height:1.8;">
      ⚠️ الوقت ده <b>قبل</b> أول تسجيل في اليوم (${esc(ft)}).<br>
      لو ده انصراف بعد نص الليل، الوقت لازم يبقى اليوم اللي بعده.
      من غير كده الساعات هتطلع ناقصة.
      <button class="mini-btn" style="margin-top:7px;" onclick="punchFixMidnight()">
        ✅ ظبّطها (يوم بعده + بعد نص الليل)</button>
    </div>`;
  }
  box.innerHTML = html;
}

async function savePunch(){
  const g   = id => ((document.getElementById(id) || {}).value || '').trim();
  const btn = document.getElementById('pkSave');
  const kind = g('pkKind'), note = g('pkNote');
  const atv  = g('pkAt');
  // 🔴 نفس الدالة اللي المعاينة بتستخدمها — عشان اللي شافته HR
  //    هو اللي هيتحفظ بالظبط
  const day  = punchWorkDate();

  if(!kind || !day || !atv){ alert('املا نوع التسجيل والوقت'); return; }

  // 🔴 آخر حاجز قبل الحفظ — المعاينة ممكن تكون اتقرت بسرعة
  const iss = punchOrderIssue();
  if(iss && iss.bad && !confirm(
      'الوقت ده قبل أول تسجيل في اليوم.\n\n' +
      'لو ده انصراف بعد نص الليل، لازم يتكتب باليوم اللي بعده مع علامة «بعد نص الليل».\n' +
      'لو حفظت كده، الساعات هتطلع ناقصة.\n\nتحفظ برضه؟')) return;
  // السيرفر عايز 'YYYY-MM-DD HH:MM' — الخانة بتدي 'YYYY-MM-DDTHH:MM'
  const local = atv.replace('T', ' ').slice(0,16);

  if(btn){ btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try{
    let error;
    if(PUNCH.id){
      ({ error } = await sb.rpc('hr_edit_punch', {
        p_id: PUNCH.id, p_kind: kind, p_work_date: day, p_local: local, p_note: note || null }));
    }else{
      const em = g('pkEmail') || PUNCH.email;
      if(!em){ alert('اختار الموظف'); return; }
      ({ error } = await sb.rpc('hr_manual_punch', {
        p_email: em, p_kind: kind, p_work_date: day, p_local: local, p_note: note || null }));
    }
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;

    closeSheet('punchSheet');
    // إعادة تحميل كاملة: الساعات والخصومات كلها بتتحسب من أول وجديد
    await loadMonth();
    alert('✅ اتحفظ');
  }catch(e){
    console.error('savePunch failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883/i.test(t)
      ? '❌ الميزة لسه ماتركبتش — شغّل ملف 37-hr-manual-attendance.sql'
      : '❌ ' + t);
  }finally{
    if(btn){ btn.disabled = false; }
  }
}

    const { error } = await sb.from('hr_day_schedules').upsert(row);

// ============================================================
// 💰 صفحة «المخصومات والمرتبات»
// ------------------------------------------------------------
// 🔴 الفرق الجوهري بينها وبين الصفحة الرئيسية:
//    الصفحة الرئيسية بتبني كروتها **من سجل الحضور** — يعني
//    الموظف اللي ما سجّلش حضور ولا مرة مالوش كارت أصلاً، ومكانش
//    ينفع تحطله مرتب ولا تخصم منه.
//
//    الصفحة دي بتبني كروتها **من قايمة الأدمن** (user-roles).
//    فأي حد الأدمن سجّله بيبان هنا، حضر أو ما حضرش.
//
// ⚠️ الكتابة كلها من دوال السيرفر. جدول hr_salaries زي جدول
//    hr_deductions بالظبط: **مفيهوش سياسة كتابة خالص**.
// ============================================================
let SALS  = {};    // إيميل → مرتبه
let PAY_Q = '';    // نص البحث

// كل الناس اللي الأدمن سجّلهم — ما عدا السوبر أدمن (صاحب المحل)
// ⚠️ مش بنستخدم allEmployees() هنا لأنها بتشيل دور hr، وشؤون
//    العاملين نفسها ليها مرتب زي أي حد.
function allPeople(){
  const out = [];
  for(const em of Object.keys(ROLES_MAP || {})){
    const v = ROLES_MAP[em];
    const r = typeof v === 'string' ? v : (v && v.role) || '';
    if(r === 'super_admin') continue;
    out.push(em.toLowerCase());
  }
  // وأي حد ظهر في سجل الحضور ومش في الخريطة (حساب اتشال مثلاً) —
  // مينفعش يختفي وعليه خصومات
  ROWS.forEach(r => {
    const e = (r.user_email||'').toLowerCase();
    if(e && out.indexOf(e) < 0) out.push(e);
  });
  return out.sort((a,b) => nameOf(a).localeCompare(nameOf(b),'ar'));
}

async function loadSalaries(){
  try{
    const { data, error } = await sb.from('hr_salaries').select('user_email,amount');
    if(error) throw error;
    SALS = {};
    (data || []).forEach(r => { SALS[(r.user_email||'').toLowerCase()] = Number(r.amount || 0); });
  }catch(e){
    // بنقول بصوت عالي بدل ما الصفحة توري «مفيش مرتب» لكل الناس
    console.error('loadSalaries failed:', e);
    SALS = {};
    if(e && (e.code === '42P01' || /hr_salaries/i.test(e.message||'')))
      console.warn('⚠️ جدول المرتبات لسه ماتعملش — شغّل 34-hr-salaries.sql');
  }
}

// ============================================================
// 🧾 أرقام الكارت من كشف الراتب نفسه — مصدر واحد
// ------------------------------------------------------------
// 🐞 الباج اللي اتصلّح:
//    الكارت كان بيحسب الصافي هنا في الصفحة:
//        مرتب **شهر واحد** − خصومات **كل الشهور** − تأخير الشهر
//    وكمان مسحوبات الإكسل كانت متجمعة مع الخصم اليدوي، والأوفر
//    تايم مش داخل خالص. فمن تاني شهر الرقم بيطلع أقل من الحقيقة،
//    ومختلف عن زرار «🧾 الكشوف» اللي جنبه.
//
// ✅ دلوقتي الكارت بيقرا من hr_payroll_periods — نفس الدالة اللي
//    الكشف وشاشة «مرتبك» عند الموظف بيقروا منها. رقم واحد في
//    تلات أماكن، ومستحيل يختلفوا.
//
// الشهر = الشهر المعروض في الصفحة الرئيسية (MONTH).
// ============================================================
let PAYROWS = {};      // إيميل → { 'YYYY-MM-01': صف الكشف }
let PAYROWS_ERR = '';

async function loadPayRows(){
  PAYROWS_ERR = '';
  try{
    const data = await hrAll(() => sb.rpc('hr_payroll_periods', { p_email: null })
      .order('user_email').order('period'), 'كشوف الرواتب');
    PAYROWS = {};
    data.forEach(r => {
      const e = (r.user_email || '').toLowerCase();
      (PAYROWS[e] = PAYROWS[e] || {})[String(r.period).slice(0,10)] = r;
    });
  }catch(e){
    // بنقول بصوت عالي — الكارت الفاضي هنا معناه «صافي صفر» وده كدب
    console.error('loadPayRows failed:', e);
    PAYROWS = {};
    PAYROWS_ERR = (e && e.message) ? e.message : String(e);
  }
}

// بتتنده بعد أي تغيير فلوس (مرتب · خصم · شيل · تاريخ البداية)
// ⚠️ لو الصفحة مقفولة مبتعملش حاجة — مفيش داعي نحمّل على الفاضي
async function payAdminReload(){
  const sh = document.getElementById('paySheet');
  if(!sh || !sh.classList.contains('open')) return;
  await loadSalaries();
  await loadPayRows();
  renderPayrollAdmin();
}

function payRowOf(email){
  return (PAYROWS[(email||'').toLowerCase()] || {})[MONTH + '-01'] || null;
}

async function openPayrollAdmin(){
  PAY_Q = '';
  const box = document.getElementById('payBody');
  if(box) box.innerHTML = '<div class="empty">جاري التحميل…</div>';
  openSheet('paySheet');
  const q = document.getElementById('paySearch'); if(q) q.value = '';
  // ⚠️ بنعيد التحميل عن قصد: ممكن الأدمن يكون ضاف موظف جديد
  //    والصفحة مفتوحة من ساعة
  await loadSalaries();
  await loadDeductions();
  await loadBonuses();
  await loadDebts();
  await loadPayRows();
  renderPayrollAdmin();
}

function renderPayrollAdmin(){
  const box = document.getElementById('payBody');
  if(!box) return;

  let list = allPeople();
  if(PAY_Q){
    const q = PAY_Q.trim().toLowerCase();
    list = list.filter(e => e.includes(q) || nameOf(e).toLowerCase().includes(q));
  }

  if(!list.length){
    box.innerHTML = '<div class="empty">' +
      (PAY_Q ? 'مفيش موظف بالاسم ده' :
       'مفيش موظفين متسجّلين<br><small>ضيفهم من لوحة الأدمن الأول</small>') +
      '</div>';
    return;
  }

  // ملخص فوق: كام مرتب متحدد، وإجمالي المرتبات والخصومات والصافي
  // ⚠️ كله للشهر المعروض بس — من نفس صفوف الكشف
  let setN = 0, totSal = 0, totDed = 0, totNet = 0;
  allPeople().forEach(e => {
    if(SALS[e] != null){ setN++; totSal += SALS[e]; }
    const r = payRowOf(e);
    if(r){
      totDed += Number(r.manual_ded || 0) + Number(r.late_ded || 0);
      totNet += Number(r.net || 0);
    }
  });
  const n = v => Math.round(v * 100) / 100;

  box.innerHTML = `
    ${penStartHtml()}

    <div style="margin:14px 2px 0;font-weight:900;font-size:13.5px;color:var(--ink-2);">
      🗓️ أرقام شهر ${esc(monthLabel())}
      <span style="font-weight:400;font-size:11.5px;color:var(--muted);">— غيّر الشهر من الصفحة الرئيسية</span>
    </div>
    ${PAYROWS_ERR ? `<div class="hintbox" style="margin-top:10px;background:var(--rejected-bg,#FEF2F2);color:var(--red);">
      ❌ مقدرناش نقرا الكشوف — الأرقام تحت <b>مش مضمونة</b>.<br><small>${esc(PAYROWS_ERR)}</small></div>` : ''}

    <div class="kpis" style="margin:10px 0 16px;">
      <div class="kpi"><div class="v">${setN}/${allPeople().length}</div><div class="l">مرتب متحدد</div></div>
      <div class="kpi"><div class="v">${n(totSal).toLocaleString('en-US')}</div><div class="l">إجمالي المرتبات</div></div>
      <div class="kpi"><div class="v" style="color:${totDed?'var(--red)':'inherit'}">${n(totDed).toLocaleString('en-US')}</div><div class="l">خصومات الشهر</div></div>
      <div class="kpi"><div class="v" style="color:var(--done)">${n(totNet).toLocaleString('en-US')}</div><div class="l">إجمالي الصافي</div></div>
    </div>
    ${list.map(prCardHtml).join('')}`;
}

function prCardHtml(e){
  const m   = manualDed(e);          // للجرس بس («لسه ما اتقراش»)
  const lt  = lateDed(e);            // لعدد أيام التأخير في الشهر
  const sal = SALS[e];
  const has = sal != null;
  // 🔴 الأرقام من كشف الراتب — شوف الشرح فوق loadPayRows
  const r   = payRowOf(e);
  const man = r ? Number(r.manual_ded   || 0) : 0;
  const wdr = r ? Number(r.withdraw_ded || 0) : 0;
  const lat = r ? Number(r.late_ded     || 0) : 0;
  const net = r ? Number(r.net          || 0) : null;
  const money = v => (Math.round(Number(v || 0) * 100) / 100).toLocaleString('en-US');
  // معرّف آمن للخانة: الإيميل فيه @ و . فمينفعش يبقى id مباشرة
  const uid = 'sal_' + e.replace(/[^a-z0-9]/gi, '_');
  return `
  <div class="pr-card${m.unseen ? ' alert' : ''}">
    <div class="pr-top">
      <div class="avatar" style="background:${avatarColor(e)}">${esc(nameOf(e).charAt(0))}</div>
      <div class="card-id">
        <b>${esc(nameOf(e))}</b>
        <span>${esc(e)}</span>
      </div>
    </div>

    <div class="pr-sal">
      <label>💵 المرتب</label>
      <input type="number" id="${uid}" min="0" step="50" inputmode="decimal"
             placeholder="لسه مش متحدد" value="${has ? sal : ''}">
      <button onclick="saveSalary('${esc(e)}','${uid}')">💾</button>
    </div>

    <div class="pr-nums">
      <div>
        <b style="color:${man ? 'var(--red)' : 'inherit'}">${money(man)}</b>
        <span>خصم يدوي</span>
      </div>
      <div>
        <b style="color:${lat ? 'var(--red)' : 'inherit'}">${money(lat)}</b>
        <span>خصم تأخير</span>
      </div>
      <div>
        <b style="color:${wdr ? 'var(--red)' : 'inherit'}">${money(wdr)}</b>
        <span>🔩 مسحوبات</span>
      </div>
      <div>
        <b style="color:${net == null ? 'var(--muted)' : (net < 0 ? 'var(--red)' : 'var(--done)')}">${
          net == null ? '—' : money(net)}</b>
        <span>الصافي ج.م</span>
      </div>
    </div>

    ${(() => {
      // الأوفر تايم/العجز **بالفلوس** زي ما هو في الكشف بالظبط
      if(!r) return '';
      const om = Number(r.over_min || 0), sm = Number(r.short_min || 0);
      if(!om && !sm) return '';
      const nm = Number(r.net_min || 0), amt = Number(r.overtime_amt || 0);
      const plus = nm >= 0;
      return `<div class="pr-bell" style="color:${plus ? 'var(--done)' : 'var(--red)'};">
        ${plus ? '⏫ أوفر تايم' : '⏬ عجز ساعات'} ${fmtDur(Math.abs(nm))} = ${plus ? '+' : '−'}${money(Math.abs(amt))} ج.م
        <span style="opacity:.75;font-weight:400;">(زيادة ${fmtDur(om)} · ناقص ${fmtDur(sm)})</span>
      </div>`;
    })()}
    ${r && Number(r.debt_ded) ? `<div class="pr-bell">💳 سداد ديون الشهر ده: −${money(r.debt_ded)} ج.م</div>` : ''}
    ${debtRemaining(e) ? `<div class="pr-bell" style="color:var(--waiting);">💳 ديون باقية: ${money(debtRemaining(e))} ج.م — لسه ما اتخصمتش من الصافي</div>` : ''}
    ${r && Number(r.bonus) ? `<div class="pr-bell" style="color:var(--done);">🎁 حوافز: +${money(r.bonus)} ج.م</div>` : ''}
    ${r && Number(r.leave_bonus) ? `<div class="pr-bell" style="color:var(--done);">💵 إجازات ما اتاخدتش: +${money(r.leave_bonus)} ج.م</div>` : ''}
    ${r && r.paid ? `<div class="pr-bell" style="color:var(--done);">🔒 مرتب الشهر ده اتصرف — الأرقام متقفلة</div>` : ''}
    ${!r && has ? `<div class="pr-bell" style="color:var(--muted);">مفيش كشف للشهر ده (مفيش حضور ولا خصومات فيه)</div>` : ''}
    ${lt.days ? `<div class="pr-bell" style="color:var(--waiting);">⏰ ${lt.days} يوم تأخير
      محسوب تلقائي — تقدر تشيله من 📋 السجل</div>` : ''}
    ${m.unseen ? `<div class="pr-bell">🔔 ${m.unseen} رسالة لسه ما قراهاش الموظف</div>` : ''}

    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="pr-ded-btn" style="margin:0;flex:1;"
              onclick="openDeduction('${esc(e)}')">💸 خصم</button>
      <button class="pr-slip-btn" style="flex:none;background:var(--done);color:#fff;border-color:var(--done);"
              onclick="openBonus('${esc(e)}')">🎁</button>
      <button class="pr-slip-btn" style="flex:none;" onclick="openDebts('${esc(e)}')">💳</button>
      <button class="pr-slip-btn" onclick="openPayslips('${esc(e)}')">🧾 الكشوف</button>
    </div>
  </div>`;
}

async function saveSalary(email, uid){
  const el = document.getElementById(uid);
  if(!el) return;
  const raw = (el.value || '').trim();

  // خانة فاضية = «لسه مش متحدد». مش بنكتب صفر عشان الموظف
  // ما يشوفش «مرتبك ٠ ج.م» وده مجرد إن حد نسي يكتبه.
  if(raw === ''){ alert('اكتب المرتب الأول'); el.focus(); return; }

  const amt = parseFloat(raw);
  if(isNaN(amt) || amt < 0){ alert('المرتب مينفعش يكون بالسالب'); return; }

  const btn = el.parentNode.querySelector('button');
  if(btn){ btn.disabled = true; btn.textContent = '⏳'; }
  try{
    const { error } = await sb.rpc('hr_set_salary', { p_email: email, p_amount: amt });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error. من غير السطر ده
    //    الزرار هيوري ✅ والمرتب ما اتكتبش.
    if(error) throw error;
    SALS[email] = amt;
    if(btn){ btn.textContent = '✅'; }
    // بنعيد الرسم بعد لحظة عشان الصافي يتحدّث، والعلامة تبان للمستخدم
    setTimeout(payAdminReload, 700);
  }catch(e){
    console.error('saveSalary failed:', e);
    if(btn){ btn.disabled = false; btn.textContent = '💾'; }
    const t = (e && e.message) ? e.message : String(e);
    alert(/does not exist|42883|42P01/i.test(t)
      ? '❌ الميزة لسه ماتركبتش في قاعدة البيانات — شغّل ملف 34-hr-salaries.sql'
      : '❌ فشل حفظ المرتب: ' + t);
  }
}

const STATE_LBL = {
  ontime: { t:'في الميعاد', c:'var(--done)' },
  grace:  { t:'جوه السماح', c:'var(--done)' },
  backup: { t:'المعاد الاحتياطي', c:'var(--waiting)' },
  late:   { t:'متأخر', c:'var(--red)' }
};

// ============================================================
// 🔩 مسحوبات الإكسل — ربط الأسماء
// ------------------------------------------------------------
// ملف الإكسل بيبعت أسماء زي «كريم» و«ميدو». النظام عنده إيميلات.
// الشاشة دي هي اللي بتقول للنظام: «كريم ده هو فلان».
//
// 🔴 قاعدة أساسية: **مفيش اسم بيتخصم منه غير لو إنسان ربطه.**
//    قفلنا المطابقة الأوتوماتيكية بالاسم عن قصد — «عمر» ممكن
//    يبقى أي عمر، والخصم اللي بيروح لواحد شبهه غلط شكله سليم،
//    وده أصعب غلط يتكتشف.
//
// 🔴 والشاشة دي **مبتسجّلش خصومات ولا بتمسحها**. بتربط بس.
//    التسجيل بيحصل لما الإكسل يبعت. السبب: يفضل فيه طريق واحد
//    بيحرّك الفلوس (hr_excel_sync) — لو عملنا تاني، الاتنين
//    هيختلفوا في يوم من الأيام ومحدش هيعرف مين الصح.
//
// ⚠️ استثناء واحد: فك الربط بيشيل الخصومات اللي طلعت من الاسم ده،
//    ماعدا الشهور اللي اتصرفت خلاص — دي مبتتلمسش.
// ============================================================
let EXW = { pending: [], linked: [], busy: false };

async function openExcelW(){
  const box = document.getElementById('exwBody');
  if(box) box.innerHTML = '<div class="empty">جاري التحميل…</div>';
  openSheet('exwSheet');
  await loadExcelW();
  renderExcelW();
}

async function loadExcelW(){
  EXW.pending = []; EXW.linked = [];
  try{
    const [p, l] = await Promise.all([
      sb.rpc('hr_excel_pending', { p_month: null }),
      sb.rpc('hr_excel_linked',  { p_month: null })
    ]);
    if(p.error) throw p.error;
    if(l.error) throw l.error;
    EXW.pending = p.data || [];
    EXW.linked  = l.data || [];
  }catch(e){
    // بنقول بصوت عالي — الشاشة الفاضية هنا معناها «مفيش أسماء واقفة»
    // وهي حاجة مطمّنة بالغلط
    console.error('loadExcelW failed:', e);
    const t = (e && e.message) ? e.message : String(e);
    const box = document.getElementById('exwBody');
    if(box) box.innerHTML =
      '<div class="hintbox" style="background:var(--rejected-bg,#FEF2F2);color:var(--red);">' +
      (/does not exist|42883|42P01/i.test(t)
        ? '❌ الميزة لسه ماتركبتش — شغّل ملفات 46 SQL'
        : '❌ مقدرناش نقرا البيانات: ' + esc(t)) + '</div>';
    throw e;
  }
}

function exwMoney(n){ return Number(n || 0).toLocaleString('ar-EG'); }

function renderExcelW(){
  const box = document.getElementById('exwBody');
  if(!box) return;

  const people = allPeople();
  const opts = people.map(e =>
    `<option value="${esc(e)}">${esc(nameOf(e))}</option>`).join('');

  const pend = EXW.pending.map((r, i) => `
    <div class="ded-row" style="flex-wrap:wrap; border-color:var(--waiting);">
      <div class="ded-amt" style="color:var(--waiting);">${exwMoney(r.total)}</div>
      <div class="ded-mid">
        <b>${esc(r.raw_name)}</b>
        <span>${r.rows_cnt} سحبة · ${esc(r.months || '')}</span>
      </div>
      <div style="flex-basis:100%; display:flex; gap:7px; margin-top:9px;">
        <select id="exwSel${i}" style="flex:1; min-width:0; border:1px solid var(--border);
          background:var(--surface-2); color:var(--ink); border-radius:10px;
          padding:10px; font-family:inherit; font-size:13.5px;">
          <option value="">— اختار الموظف —</option>
          ${opts}
        </select>
        <button class="mini-btn" style="flex:none; padding:10px 15px;"
                onclick="exwLink('${esc(r.raw_name)}', ${i})">🔗 اربط</button>
      </div>
    </div>`).join('');

  const lnk = EXW.linked.map(r => `
    <div class="ded-row">
      <div class="ded-amt" style="color:var(--done);">${exwMoney(r.total)}</div>
      <div class="ded-mid">
        <b>${esc(r.raw_name)} ← ${esc(nameOf(r.user_email))}</b>
        <span>${r.rows_cnt} سحبة · ${esc(r.user_email)}</span>
      </div>
      <button class="ded-del" title="فك الربط"
              onclick="exwUnmap('${esc(r.raw_name)}')">✖</button>
    </div>`).join('');

  box.innerHTML = `
    <div class="hintbox">
      🔩 الأسماء اللي في ملف الإكسل لازم تقول للنظام هي مين.
      <b>أي اسم مش مربوط، مبيتخصمش من حد</b> — بيقف ويستنى.
      <br><br>
      ⚠️ الربط لوحده مبيسجّلش الخصم. بعد ما تربط، <b>احفظ ملف الإكسل
      تاني</b> (أو شغّل IFix_Send) والخصومات تتسجّل لوحدها.
    </div>

    <div style="font-weight:900; font-size:13.5px; margin:4px 0 10px; color:var(--waiting);">
      ⏳ مستنية ربط (${EXW.pending.length})</div>
    ${EXW.pending.length ? pend
      : '<div class="empty" style="padding:18px;">مفيش أسماء واقفة ✅</div>'}

    <div style="font-weight:900; font-size:13.5px; margin:20px 0 10px; color:var(--done);">
      ✅ مربوطة ومتخصومة (${EXW.linked.length})</div>
    ${EXW.linked.length ? lnk
      : '<div class="empty" style="padding:18px;">لسه مفيش</div>'}`;
}

async function exwLink(alias, idx){
  if(EXW.busy) return;
  const sel = document.getElementById('exwSel' + idx);
  const email = sel ? sel.value : '';
  if(!email){ alert('اختار الموظف الأول'); return; }

  // ⚠️ تأكيد بالاسم الكامل — الربط الغلط بيخصم من الغلطان،
  //    وبيفضل غلط لحد ما حد ياخد باله
  if(!confirm('هتربط «' + alias + '» اللي في الإكسل بـ:\n' +
              nameOf(email) + '\n(' + email + ')\n\nمتأكد إنه هو؟')) return;

  EXW.busy = true;
  try{
    const { error } = await sb.rpc('hr_excel_map_name',
      { p_alias: alias, p_email: email });
    if(error) throw error;
    await loadExcelW();
    renderExcelW();
    alert('اتربط ✅\n\nدلوقتي احفظ ملف الإكسل تاني عشان الخصومات تتسجّل.');
  }catch(e){
    alert('❌ ' + (e.message || e));
  }finally{ EXW.busy = false; }
}

async function exwUnmap(alias){
  if(EXW.busy) return;
  if(!confirm('هتفك ربط «' + alias + '»؟\n\n' +
              'الخصومات اللي طلعت منه هتتشال — ماعدا الشهور اللي ' +
              'اتصرفت خلاص، دي هتفضل زي ما هي.')) return;

  EXW.busy = true;
  try{
    const { data, error } = await sb.rpc('hr_excel_unmap_name', { p_alias: alias });
    if(error) throw error;
    await loadExcelW();
    renderExcelW();
    const d = data || {};
    alert('اتفك ✅\n\nخصومات اتشالت: ' + (d.unlinked || 0) +
          '\nفضلت (شهور اتصرفت): ' + (d.kept_paid || 0));
  }catch(e){
    alert('❌ ' + (e.message || e));
  }finally{ EXW.busy = false; }
}
</script>
<script>
/* ============================================================
   🧰 أدوات الديسباتشر عند شؤون العاملين
   ------------------------------------------------------------
   🧠 بالبلدي:
      الأدمن يقدر يفتح للـHR ٤ خانات — نفس اللي عند الديسباتشر:
        🧾 فواتير المشتريات · 🧰 مخزن قطع الغيار   ← صلاحية purchases
        🔩 مراجعة قطع الغيار                      ← صلاحية parts_review
        📋 الجرد                                   ← صلاحية inventory_view

function hrAdapt(row){
  const d = row.data || {};
  return {
    id:       d.id || row.id,
    type:     d.deviceType || '',
    model:    d.model || '',
    customer: d.customerName || '',
    shop:     d.shopName || '',
    issue:    d.reportedIssue || '',
    status:   d.status || row.status || 'waiting',
    tech:     (d.technician || '').trim(),
    by:       (d.registeredBy || d.createdBy || '').trim(),
    intake:   d.intakeDate || row.intake_date || '',
    parts:    d.partsComment || '',
    _raw:     Object.assign({ id: row.id }, d)
  };
}

// ⚠️ PostgREST بيقص عند ١٠٠٠ صف — فبنجيب على صفحات (نفس owner.html)
async function hrFetchPaged(makeQuery){
  const PAGE = 1000, MAX_PAGES = 40, rows = [];
  for(let p = 0; p < MAX_PAGES; p++){
    const { data, error } = await makeQuery().range(p * PAGE, p * PAGE + PAGE - 1);
    if(error) throw error;
    if(!data || !data.length) break;
    rows.push(...data);
    if(data.length < PAGE) break;
  }
  return rows;
}

//    مرة واحدة بس لما تفتح أول أداة (مش مع كل ضغطة)، فالتكلفة معقولة.
const HR_DELIVERED_DAYS = 180;
const HR_IN_SHOP = ['waiting','diagnosing','repairing','done','returned'];
function hrEnsureDevices(){
  if(HR_DEV_PROMISE) return HR_DEV_PROMISE;
  HR_DEV_PROMISE = (async () => {
    const sel = 'id,status,intake_date,delivered_at,data';
    const inShop = await hrFetchPaged(() => sb.from('devices_hr').select(sel)
      .in('status', HR_IN_SHOP).order('intake_date', { ascending:false }));
    const cutoff = new Date(Date.now() - HR_DELIVERED_DAYS * 86400000).toISOString();
    const out = await hrFetchPaged(() => sb.from('devices_hr').select(sel)
      .eq('status', 'delivered').gte('delivered_at', cutoff)
      .order('delivered_at', { ascending:false }));
    const byId = new Map();
    for(const r of [...inShop, ...out]) if(r && r.data && !byId.has(r.id)) byId.set(r.id, r);
    devices = [...byId.values()].map(hrAdapt);
    // ⚠️ صفر أجهزة من غير خطأ = الشباك رفض في صمت (الصلاحية مقفولة
    //    أو ملف 63 ماتشغّلش). بنقول بدل ما الشاشة تبان «فاضية» وبس.
    if(!devices.length) toast('⚠️ مفيش أجهزة ظاهرة — اتأكد إن ملف 63 اتشغّل والأدمن فعّل الصلاحية');
    return devices;
  })();
  // لو فشل، نسيب المرة الجاية تحاول تاني بدل ما يفضل فاشل للأبد
  HR_DEV_PROMISE.catch(() => { HR_DEV_PROMISE = null; });
  return HR_DEV_PROMISE;
}

/* ── مساعد: هل كلام قطع الغيار معناه «مفيش» ── */
// ============================================================
// 🔩 قطع الغيار في تفاصيل الجهاز — عرض بحت
// ------------------------------------------------------------
// `partsComment` هو اللي الفني كتبه بإيده من صفحته. تلات حالات:
//   • فاضي          → الفني لسه ما ردّش
//   • «محتاجش قطع»  → داس الزرار الأخضر: الجهاز اتصلح من غير أي قطعة
//   • أي كلام تاني  → القطع اللي جابها زي ما هي
// ⚠️ الديسباتشر بيشوف بس — الكتابة من صفحة الفني.
// ============================================================
function dpPartsNorm(s){
  return String(s || '').replace(/[\s.,،!؟?\-—_]+/g, '').replace(/ه$/,'ة');
}
function dpPartsIsNone(s){
  const t = dpPartsNorm(s);
  if(!t) return false;                      // الفاضي حالة تانية خالص
  return ['مفيش', 'مافيش', 'مفيشحاجة', 'مافيشحاجة', 'لايوجد', 'لاشيء', 'لاشئ', 'لا', '0', 'ولاحاجة',
          dpPartsNorm('مفيش — الجهاز خلص ومحتاجش قطع غيار')].includes(t);
}

// ============================================================
// 🔩 مراجعة قطع الغيار (نفس صفحة المحاسب بالظبط)
// ------------------------------------------------------------
// كارت لكل فني → أجهزته في الفترة → الكومنت ظاهر على الكارت من برا.
// تدوس على الجهاز → بتفتح شاشة قطع الغيار (INV) عشان تربط القطع.
// ============================================================
const PR = { from:'', to:'', tech:null, quick:'today', q:'', folder:null };   // q = كلمة البحث

function prDayKey(iso){
  if(!iso) return '';
  const dt = new Date(iso);
  if(isNaN(dt)) return '';
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function prToday(){ return prDayKey(new Date().toISOString()); }

function prSetQuick(q){
  PR.quick = q;
  const now = new Date(), end = prToday();
  let start = end;
  if(q==='week')  start = prDayKey(new Date(now.getTime() - 6*86400000).toISOString());
  if(q==='month') start = prDayKey(new Date(now.getTime() - 29*86400000).toISOString());
  if(q==='half')  start = prDayKey(new Date(now.getTime() - (HR_DELIVERED_DAYS-1)*86400000).toISOString());
  PR.from = start; PR.to = end; PR.tech = null;
  prRender();
}
// ⏱️ «آخر تعديل» للجهاز — ده اللي المدة بتتحسب عليه، **مش** الدخول ولا الخروج.
// جهاز داخل من شهرين واتعدل فيه حاجة النهاردة → بيظهر في «النهاردة».
//   lastModifiedAt = أي تعديل عادي على الجهاز
//   partsReturnAt  = الفني جاوب «القطع رجعت؟» بعد الرفض (migration 42)
// ⚠️ «لسه مجبتش» (partsPendingAt) **مش** محسوب — ده الفني بيقول «مفيش
//    جديد»، ولو حسبناه كل جهاز مستني قطعة هيظهر في «النهاردة» كل يوم.
// ⚠️ ملحوظة: الصفحة دي بتحمّل كل أجهزة المحل + المسلَّمة في آخر ٦ شهور
//    بس (HR_DELIVERED_DAYS). جهاز اتسلّم من ٨ شهور ما هيظهرش هنا حتى لو
//    اتعدل النهاردة — بيظهر عند المحاسب في الداشبورد (عنده كل الأجهزة).
function prTouched(d){
  const r = d._raw || {};
  let best = '';
  for(const v of [r.lastModifiedAt, r.partsReturnAt]){
    if(v && (!best || new Date(v) > new Date(best))) best = v;
  }
  return best || d.intake || '';
}
function prInRange(d){
  const k = prDayKey(prTouched(d));
  if(!k) return false;
  return (!PR.from || k >= PR.from) && (!PR.to || k <= PR.to);
}
