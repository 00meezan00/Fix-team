<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
/* ============================================================
   🔒 اللغة متثبّتة على العربي
   ------------------------------------------------------------
   بنكتبها كل مرة الصفحة تفتح، مش مرة واحدة — عن قصد.
   ليه؟ لأن أي حد كان مبدّل على الإنجليزي قبل ما المبدّل يتشال،
   اختياره القديم متخزّن على جهازه هو. لو مكتبناهاش بالقوة،
   هيفضل شايف إنجليزي للأبد ومفيش أي طريقة يرجع بيها.
   ============================================================ */
try{ localStorage.setItem('ifix-lang', 'ar'); }catch(e){}
</script>
<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الصفحات (ifix-theme).
   من غير ده فيه ومضة بيضا قبل ما الغامق يشتغل. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    // 🎨 لون شريط الحالة على الموبايل لازم يطابق الهيدر،
    //    وإلا بيبان شريط بلون مختلف فوق الشاشة.
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', d ? '#0E1721' : '#16233A');
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شؤون العاملين — I Fix Team</title>
<meta name="theme-color" content="#16233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HR">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<!-- نفس مكتبة الداشبورد بالظبط — عشان شكل ملف الإكسل يبقى واحد في النظام كله -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="attendance.js"></script>
<!-- 🔎 بحث مرن + فلاتر البحث البيضاوية (للجرد ومراجعة قطع الغيار) -->
<script src="fuzzy-search.js"></script>
<script src="search-filters.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* نفس ألوان باقي النظام بالحرف — الصفحة دي مش بتخترع لغة تصميم جديدة */
  :root{
    --chrome:#16233A; --on-chrome:#FFFFFF;
    --paper:#EBEEF2; --card:#FFFFFF; --line:#E4E9EF;
    --ink:#17222E; --ink-2:#475569; --muted:#6B7A8C; --faint:#94A3B4;
    --red:#E8321E; --done:#15803D; --done-bg:#EAF6EE;
    --waiting:#B5651D; --waiting-bg:#FBF2E9;
    --blue:#2B6CB0; --blue-bg:#EAF1F8;
    --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  :root{ --bg:var(--paper); --surface:var(--card); --surface-2:var(--paper);
         --border:var(--line); --muted-2:var(--faint); }
  html[data-theme="dark"]{
    color-scheme:dark;
    --chrome:#0E1721; --on-chrome:#E9EFF5;
    --paper:#131E29; --card:#1B2A3A; --line:#2F4356;
    --ink:#E9EFF5; --ink-2:#C3D2DF; --muted:#92A6B8; --faint:#71879B;
    --red:#F0554A; --done:#4ADE80; --done-bg:rgba(74,222,128,.14);
    --waiting:#E0A15C; --waiting-bg:rgba(224,161,92,.15);
    --blue:#7BA9DC; --blue-bg:rgba(123,169,220,.15);
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Tajawal',system-ui,sans-serif; padding-bottom:40px;}

  .topbar{position:sticky; top:0; z-index:20; background:var(--chrome);
    color:var(--on-chrome); display:flex; align-items:center; gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 13px;}
  .topbar h1{flex:1; min-width:0; margin:0; font-family:'Cairo',sans-serif;
    font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar .who{font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; opacity:.92;}
  .icon-btn{border:none; background:rgba(255,255,255,.12); color:inherit;
    width:38px; height:38px; border-radius:11px; font-size:17px; cursor:pointer;}

  .wrap{padding:16px;}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .bar input, .bar select{border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px;}
  .bar input[type="search"]{flex:1; min-width:150px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:16px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .kpi .v{font-family:'Cairo',sans-serif; font-weight:900; font-size:21px;}
  .kpi .l{font-size:12px; color:var(--muted); margin-top:2px;}

  .day{border:1px solid var(--border); border-radius:11px; padding:11px 13px; margin-bottom:8px;}
  .day-h{display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-weight:800; font-size:13.5px; margin-bottom:7px;}
  .day-h .hrs{font-family:var(--mono); color:var(--done);}
  .punch{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--ink-2);}
  .punch .meta{font-size:11px; color:var(--faint);}
  .flag{display:inline-block; background:var(--waiting-bg); color:var(--waiting);
    border-radius:7px; padding:2px 8px; font-size:11px; font-weight:800; margin-inline-start:6px;}
  .empty{text-align:center; color:var(--muted); padding:40px 16px; font-size:14px; line-height:2;}
  .btn{border:none; border-radius:11px; padding:11px 15px; font-family:inherit;
    font-size:14px; font-weight:800; cursor:pointer; background:var(--blue); color:#fff;}

  /* ===== كارت الموظف ===== */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(16,16,20,.10);}
  .card-top{display:flex; align-items:center; gap:11px; padding:14px 15px 12px;
    border-bottom:1px solid var(--border);}
  .avatar{flex:none; width:42px; height:42px; border-radius:13px; display:flex;
    align-items:center; justify-content:center; font-family:'Cairo',sans-serif;
    font-weight:900; font-size:16px; color:#fff;}
  .card-id{flex:1; min-width:0;}
  .card-id b{display:block; font-size:15px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .card-id span{font-size:11.5px; color:var(--muted);}
  .card-stats{display:grid; grid-template-columns:repeat(3,1fr); text-align:center;
    padding:12px 8px; gap:4px;}
  .card-stats div b{display:block; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px;}
  .card-stats div span{font-size:11px; color:var(--muted);}
  .card-bar{height:6px; background:var(--surface-2); display:flex;}
  .card-bar i{display:block; height:100%;}
  .card-foot{display:flex; gap:8px; padding:10px 12px 13px;}
  .card-foot button{flex:1; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); border-radius:10px; padding:9px; font-family:inherit;
    font-size:12.5px; font-weight:800; cursor:pointer;}
  .card-foot button:hover{background:var(--surface);}

  /* ===== قايمة الثلاث نقط ===== */
  .menu-wrap{position:relative;}
  .menu-drop{position:absolute; inset-inline-end:0; top:46px; z-index:40; min-width:220px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 14px 36px rgba(0,0,0,.22); padding:6px; display:none;}
  .menu-drop.open{display:block;}
  .menu-drop button{display:block; width:100%; text-align:right; border:none;
    background:none; color:var(--ink); font-family:inherit; font-size:14px;
    padding:12px 13px; border-radius:10px; cursor:pointer;}
  .menu-drop button:hover{background:var(--surface-2);}
  .menu-drop hr{border:none; border-top:1px solid var(--border); margin:5px 8px;}
  /* 🗂️ عنوان المجموعة — صغير وباهت عشان مايتلخبطش مع الزراير.
     الخط الرفيع فوقه بيفصل المجموعة عن اللي قبلها. */
  .menu-drop .mh{font-size:11.5px; font-weight:800; color:var(--faint); letter-spacing:.2px;
    padding:11px 5px 4px; margin:4px 8px 0; border-top:1px solid var(--border); user-select:none;}
  /* أول عنوان ظاهر في القايمة مالوش خط فوقه */
  .menu-drop .mh.first{border-top:none; margin-top:0; padding-top:6px;}
  /* القايمة طويلة على الموبايل — لو مش هتكفي الشاشة تتسكرول جواها */
  .menu-drop{max-height:calc(100vh - 90px - env(safe-area-inset-top)); overflow-y:auto;
    -webkit-overflow-scrolling:touch;}

  /* ===== الشاشات المنبثقة ===== */
  .sheet{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; display:none;}
  .sheet.open{display:block;}
  .sheet-head{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;}
  .sheet-head h2{flex:1; min-width:0; margin:0; font-family:'Cairo',sans-serif; font-size:17px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-body{padding:16px 16px 60px;}

  .fld{display:block; margin-bottom:14px;}
  .fld > span{display:block; font-size:13px; font-weight:800; margin-bottom:6px;}
  .fld > small{display:block; font-size:11.5px; color:var(--muted); line-height:1.8; margin-bottom:6px;}
  .fld input, .fld select, .fld textarea{width:100%; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); border-radius:11px; padding:12px;
    font-family:inherit; font-size:15px;}
  .days{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .days button{border:1px solid var(--border); background:var(--surface); color:var(--ink-2);
    border-radius:10px; padding:10px 4px; font-family:inherit; font-size:12.5px;
    font-weight:800; cursor:pointer;}
  .days button.on{background:var(--red); border-color:var(--red); color:#fff;}
  .save{width:100%; border:none; border-radius:13px; padding:15px; background:var(--done);
    color:#fff; font-family:inherit; font-size:15px; font-weight:900; cursor:pointer;}
  .emp-top{display:flex; align-items:center; gap:12px;}
  .emp-acts{display:flex; gap:8px;}
  .emp-acts button{flex:1; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); border-radius:11px; padding:11px 6px; font-family:inherit;
    font-size:12.5px; font-weight:800; cursor:pointer;}
  .emp-acts button:hover{background:var(--surface);}
  /* زراير صغيرة جوه سطور السجل */
  .mini-btn{flex:none; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); border-radius:8px; padding:5px 10px; font-family:inherit;
    font-size:11.5px; font-weight:800; cursor:pointer;}
  .mini-btn.danger{border-color:var(--red); color:var(--red);}
  .punch .meta.manual{color:var(--blue); font-weight:800;}
  .punch .mini-btn{padding:3px 7px; font-size:11px; margin-inline-start:5px;}
  .ded-row.waived{opacity:.85; border-color:var(--done);}
  /* أيام المواعيد الخاصة */
  .dsch-days button.edit{outline:2px solid var(--blue); outline-offset:-2px;}
  .dsch-days button.on{background:var(--blue); border-color:var(--blue); color:#fff;}
  .dsch-form{margin-top:14px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:13px; padding:14px;}
  /* شريط تاريخ بداية الخصم */
  .pen-start{background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:13px 14px; margin-top:14px;}
  .pen-start.warn{border-color:var(--red); background:var(--rejected-bg,#FEF2F2);}
  html[data-theme="dark"] .pen-start.warn{background:rgba(240,85,74,.10);}
  .pen-start-h{display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; font-size:13.5px; margin-bottom:5px;}
  .pen-start-h span{font-weight:800; color:var(--done);}
  .pen-start-h span.bad{color:var(--red);}
  .pen-start small{display:block; font-size:12px; line-height:1.9; color:var(--muted);}
  .pen-start.warn small{color:var(--red);}
  .pen-start-row{display:flex; gap:8px; margin-top:10px;}
  .pen-start-row input{flex:1; min-width:0; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); border-radius:10px;
    padding:10px 11px; font-family:inherit; font-size:14.5px;}
  .pen-start-row button{flex:none; border:none; border-radius:10px; padding:10px 14px;
    background:var(--done); color:#fff; font-family:inherit; font-size:13.5px;
    font-weight:800; cursor:pointer;}
  /* ===== كروت صفحة المخصومات والمرتبات ===== */
  .pr-card{background:var(--surface); border:1px solid var(--border);
    border-radius:15px; padding:13px 14px; margin-bottom:11px;}
  .pr-card.alert{border-color:var(--red);}
  .pr-top{display:flex; align-items:center; gap:11px;}
  .pr-top .card-id b{font-size:15px;}
  .pr-top .card-id span{font-size:11px; color:var(--muted); direction:ltr; display:block;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pr-sal{display:flex; align-items:center; gap:7px; margin-top:11px;}
  .pr-sal label{flex:none; font-size:12.5px; font-weight:800; color:var(--ink-2);}
  .pr-sal input{flex:1; min-width:0; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); border-radius:10px; padding:10px 11px; font-family:inherit;
    font-size:15px; font-weight:800; text-align:center;}
  .pr-sal button{flex:none; border:none; border-radius:10px; padding:10px 13px;
    background:var(--done); color:#fff; font-family:inherit; font-size:14px;
    font-weight:800; cursor:pointer;}
  .pr-sal button:disabled{opacity:.5; cursor:default;}
  .pr-nums{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--border);}
  .pr-nums div{text-align:center;}
  .pr-nums b{display:block; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px;}
  .pr-nums span{font-size:11px; color:var(--muted);}
  .pr-ded-btn{width:100%; margin-top:10px; border:none; border-radius:11px; padding:11px;
    background:var(--red); color:#fff; font-family:inherit; font-size:13.5px;
    font-weight:800; cursor:pointer;}
  .pr-bell{margin-top:9px; font-size:11.5px; font-weight:800; color:var(--red);}
  .pr-slip-btn{flex:1; border:1px solid var(--border); border-radius:11px; padding:11px;
    background:var(--surface-2); color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:800; cursor:pointer;}
  /* كروت كشف الراتب */
  .slip{background:var(--surface); border:1px solid var(--border); border-radius:15px;
    padding:14px; margin-bottom:11px;}
  .slip.paid{border-color:var(--done);}
  .slip.due{border-color:var(--waiting);}
  .slip-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .slip-h b{font-size:15px;}
  .slip-tag{font-size:11px; font-weight:800; border-radius:7px; padding:3px 9px;}
  .slip-tag.ok{background:var(--done-bg); color:var(--done);}
  .slip-tag.wait{background:var(--waiting-bg); color:var(--waiting);}
  .slip-lines{margin-top:11px; padding-top:10px; border-top:1px solid var(--border);}
  .slip-lines div{display:flex; justify-content:space-between; align-items:baseline;
    gap:10px; padding:4px 0; font-size:13px; color:var(--muted);}
  .slip-lines b{font-family:'Cairo',sans-serif; font-weight:900; font-size:15px;
    color:var(--ink);}
  .slip-lines b.minus{color:var(--red);}
  .slip-lines .eq{margin-top:5px; padding-top:8px; border-top:1px solid var(--border);
    color:var(--ink);}
  .slip-lines .eq b{color:var(--done); font-size:18px;}
  .slip-btn{width:100%; margin-top:11px; border:none; border-radius:11px; padding:12px;
    font-family:inherit; font-size:14px; font-weight:800; cursor:pointer;
    background:var(--done); color:#fff;}
  .slip-btn.undo{background:var(--surface-2); color:var(--muted);
    border:1px solid var(--border); font-size:12.5px; padding:9px;}
  .slip-meta{margin-top:8px; font-size:11px; color:var(--muted); line-height:1.8;}
  .card-ded{background:var(--rejected-bg,#FEF2F2); color:var(--red); font-size:12px;
    font-weight:800; padding:8px 13px; border-top:1px solid var(--border);}
  html[data-theme="dark"] .card-ded{background:rgba(240,85,74,.13);}
  /* 🏖️ شاشة الغياب */
  .abs-head{margin-bottom:12px;}
  .abs-head .meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .abs-warn{margin-top:8px; background:var(--waiting-bg,#FFF7ED); color:var(--waiting,#B45309);
    border:1px solid var(--waiting,#B45309); border-radius:10px; padding:9px 11px;
    font-size:12.5px; font-weight:800; line-height:1.7;}
  .adj-line{background:var(--waiting-bg,#FFF7ED); border-radius:8px; padding:6px 9px; margin-top:6px;}
  .abs-acts{display:flex; gap:7px; margin-top:8px;}
  /* 💳 الديون */
  .debt-card{background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:12px 13px; margin-bottom:10px;}
  .debt-card.done{opacity:.7;}
  .debt-h{display:flex; align-items:flex-start; gap:10px;}
  .debt-h b{flex:1; min-width:0; font-size:14px; line-height:1.7; word-break:break-word;}
  .debt-kind{flex:none; font-size:11px; font-weight:800; border-radius:7px; padding:3px 8px;
    background:var(--surface-2); color:var(--ink-2);}
  .debt-nums{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:9px; text-align:center;}
  .debt-nums b{display:block; font-family:'Cairo',sans-serif; font-weight:900; font-size:15px;}
  .debt-nums span{font-size:11px; color:var(--muted);}
  .debt-pay{display:flex; gap:7px; margin-top:10px;}
  .debt-pay input{flex:1; min-width:0; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); border-radius:10px; padding:10px; font-family:inherit; font-size:15px; text-align:center;}
  .debt-pay button{flex:none; border:none; border-radius:10px; padding:10px 12px; background:var(--red);
    color:#fff; font-family:inherit; font-size:13px; font-weight:800; cursor:pointer;}
  .debt-hist{margin-top:8px; font-size:12px; color:var(--muted); line-height:1.9;}
  .debt-hist div{display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .debt-note{margin-top:10px; background:var(--waiting-bg); color:var(--waiting);
    border-radius:10px; padding:9px 11px; font-size:12.5px; font-weight:700; line-height:1.8;}
  /* 💵 فلوس الإجازة + عناوين أقسام شاشة الغياب والإجازات */
  .abs-sec{font-weight:900; font-size:13.5px; color:var(--ink-2); margin:18px 2px 10px;}
  .lb-box{background:var(--surface); border:1px solid var(--done); border-radius:13px;
    padding:12px 14px; margin-bottom:6px; line-height:1.9;}
  .lb-box .meta{font-size:12.5px; color:var(--muted);}
  .lb-ok{margin-top:6px; font-weight:800; color:var(--done);}
  .abs-acts .mini-btn{flex:1; padding:9px 6px;}
  .card-ded i{font-style:normal; opacity:.85;}
  /* قايمة الخصومات جوه سجل الموظف */
  .ded-row{display:flex; align-items:flex-start; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:8px;}
  .ded-row.unseen{border-color:var(--red);}
  .ded-amt{flex:none; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px;
    color:var(--red);}
  .ded-mid{flex:1; min-width:0;}
  .ded-mid b{display:block; font-size:13.5px; line-height:1.8; word-break:break-word;}
  .ded-mid span{font-size:11px; color:var(--muted);}
  .ded-del{flex:none; border:none; background:none; color:var(--muted);
    font-size:17px; cursor:pointer; padding:2px 4px;}
  /* 🗄️ درج المسحوبات جوه سجل الموظف */
  .hidden{display:none !important;}
  .wd-drawer{margin-top:18px; border:1px solid var(--border); border-radius:13px;
    background:var(--surface); overflow:hidden;}
  .wd-head{display:flex; align-items:center; gap:10px; width:100%; border:none;
    background:var(--surface-2); color:var(--ink); padding:13px 14px; cursor:pointer;
    font-family:inherit; text-align:right;}
  .wd-ttl{flex:1; min-width:0; font-weight:800; font-size:14px;}
  .wd-ttl small{font-weight:500; font-size:11.5px; color:var(--muted);}
  .wd-sum{flex:none; font-size:12px; color:var(--muted);}
  .wd-sum b{color:var(--red); font-size:13.5px;}
  .wd-arw{flex:none; font-size:15px; color:var(--muted);}
  .wd-body{padding:10px 10px 4px;}
  .wd-note{text-align:center; color:var(--muted); font-size:12.5px; line-height:1.9; padding:10px 6px 12px;}
  .hintbox{background:var(--waiting-bg); color:var(--waiting); border-radius:11px;
    padding:12px 14px; font-size:12.5px; line-height:1.9; margin-bottom:16px;}

  /* ============================================================
     📱 قاعدة الآيفون — متشيلهاش
     ------------------------------------------------------------
     🧠 المشكلة: لو خانة الكتابة خطها **أقل من ١٦ بكسل**، iOS
        بيكبّر الصفحة كلها أول ما تلمسها عشان يقرّب لك الخانة.
        في متصفح عادي بيرجع يصغّرها لما تسيبها — لكن في تطبيق
        مثبّت على الشاشة الرئيسية (PWA) **مبيرجعش**. فالصفحة
        بتفضل مكبّرة ومقصوصة من الجنب لحد ما تقفل التطبيق.

     ✅ الحل: كل خانات الكتابة على الموبايل ١٦ بكسل بالظبط.
        الفرق عن ١٥ مش باين للعين، بس بيمنع التكبير تماماً.

     ⚠️ !important مقصودة هنا. دي مش ذوق تصميم — ده شرط من
        نظام التشغيل. أي قاعدة تانية تتحط بعدين لازم تحترمه.
     ============================================================ */
  @media (max-width:820px){
    input, textarea, select, .tech-select{ font-size:16px !important; }
  }

  /* ============================================================
     🧰 أدوات الديسباتشر عند شؤون العاملين
     (فواتير المشتريات · مخزن قطع الغيار · مراجعة القطع · الجرد)
     ------------------------------------------------------------
     الاستايل تحت ده منقول من owner.html بالحرف (اللي هو نفسه من
     dispatch.html) — عشان الشاشات تبان بنفس الشكل في كل مكان.
     ⚠️ ألوان الحالات مش موجودة في الصفحة دي أصلاً، فبنعرّفها هنا
        (نفس قيم owner.html) — من غيرها شارات الحالة بتطلع شفافة.
     ============================================================ */
  :root{
    --on-color:#FFFFFF; --brand:#0891A8;
    --repairing:#2B6CB0; --repairing-bg:#EAF1F8;
    --diagnosing:#6E56CF; --diagnosing-bg:#F1EEFB;
    --delivered:#64748B; --delivered-bg:#EEF1F3;
    --rejected:#DC2626;  --rejected-bg:#FEF2F2;
    --returned:#9333EA;  --returned-bg:#F5EEFC;
    --rejected_shop:#C2185B; --rejected_shop-bg:#FCE7F1;
    --danger-bg:#FEF2F2; --danger-border:#FCA5A5;
    --success-bg:#F0FDF4; --success-border:#BBF7D0;
    --info-bg:#EFF6FF; --info-border:#BFDBFE; --warn-tint:#FFFBEB; --violet:#7C3AED;
  }
  html[data-theme="dark"]{
    --on-color:#0E1721;
    --repairing:#7BA9DC; --repairing-bg:rgba(123,169,220,.15);
    --diagnosing:#A78BFA; --diagnosing-bg:rgba(167,139,250,.15);
    --delivered:#94A3B8; --delivered-bg:rgba(148,163,184,.15);
    --rejected:#F87171;  --rejected-bg:rgba(248,113,113,.15);
    --returned:#C084FC;  --returned-bg:rgba(192,132,252,.15);
    --rejected_shop:#F472B6; --rejected_shop-bg:rgba(244,114,182,.15);
    --danger-bg:rgba(248,113,113,.15); --danger-border:rgba(248,113,113,.42);
    --success-bg:rgba(74,222,128,.13); --success-border:rgba(74,222,128,.40);
    --info-bg:rgba(96,165,250,.13); --info-border:rgba(96,165,250,.40);
    --warn-tint:rgba(251,191,36,.10); --violet:#A78BFA;
  }

  /* ══ منقول بالحرف من dispatch.html: الأوفرلاي + خانة البحث + شاشة الجرد + أسماء الألوان المرادفة ══ */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
    align-items:center; justify-content:center; z-index:30; padding:16px;
  }
  .overlay.hidden{display:none;}
  .summaries-page{background:var(--paper); min-height:100vh; width:100%;}
  .modal-head{position:sticky; top:0; z-index:101; background:var(--card); padding:6px 0 6px; margin-bottom:8px;}
  .modal-search{position:sticky; top:var(--head-h, 0px); z-index:100; background:var(--card); padding:8px 0 10px; margin-bottom:2px;}
  .close-btn{
    background:none; border:none; font-size:22px; color:var(--faint); cursor:pointer; line-height:1;
    min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .inv-section-title{font-family:'Cairo',sans-serif; font-size:17px; font-weight:800; margin:22px 0 10px; color:var(--ink);}
  .empty-col{font-size:11px; color:var(--faint); text-align:center; padding:24px 0;}

  /* ===== صفحة الجرد (ديسباتشر) — منقولة من dashboard.html، من غير أعمدة الفلوس ===== */
  .inv-filter{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px;}
  .inv-chip{
    border:1.5px solid var(--border-strong); background:var(--surface); color:var(--ink-2); border-radius:20px;
    padding:8px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .inv-chip.active{background:var(--chrome); border-color:var(--chrome); color:var(--on-chrome);}
  .inv-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:20px;}
  .inv-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(16,16,20,.04); cursor:pointer;}
  .inv-card-num{font-family:'Cairo',sans-serif; font-size:34px; font-weight:900; line-height:1;}
  .inv-card-label{font-size:13px; color:var(--ink-2); margin-top:8px; font-weight:600;}
  .inv-card-more{font-size:11px; color:var(--muted-2); margin-top:7px; font-weight:700;}
  .stuck-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--danger-border); border-inline-start:4px solid var(--danger);
    border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .stuck-item:hover{background:var(--danger-bg);}
  .stuck-days{font-family:'Cairo',sans-serif; font-size:18px; font-weight:900; color:var(--danger); white-space:nowrap;}
  .status-tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;}
  .iv-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:6px 0 16px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .iv-back{border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 14px; font-family:'Tajawal',sans-serif; font-weight:800; font-size:13.5px; color:var(--ink-2); cursor:pointer;}
  .iv-title{font-family:'Cairo',sans-serif; font-weight:900; font-size:17px; color:var(--ink); margin:0;}
  .iv-count{background:var(--surface-2); color:var(--ink-2); font-weight:800; font-size:12.5px; border-radius:11px; padding:3px 10px;}
  .iv-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:12px; background:var(--surface);}
  .iv-table{width:100%; border-collapse:collapse; min-width:600px;}
  .iv-table th{background:var(--surface-2); color:var(--ink-2); font-family:'Tajawal',sans-serif; font-weight:800; font-size:12.5px; text-align:start; padding:11px 13px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .iv-table td{padding:12px 13px; border-bottom:1px solid var(--border); font-size:13.5px; color:var(--ink); vertical-align:middle;}
  .iv-table tr:last-child td{border-bottom:none;}
  .iv-table tbody tr{cursor:pointer;}
  .iv-table tbody tr:hover{background:var(--surface-2);}
  .iv-ref{font-family:monospace; font-size:12px; font-weight:700; color:var(--muted);}
  .iv-dev{font-weight:800;}
  .iv-sub{font-size:12px; color:var(--muted-2); margin-top:2px;}
  .iv-issue{max-width:200px; color:var(--ink-2); font-size:12.5px; line-height:1.6;}

  /* الموديول بيقرا متغيّرات الداشبورد — بنعملها هنا أسماء مرادفة
     عشان يشتغل بألوان الديسباتشر بدل ما يطلع بلون ناقص */
  :root{
    --surface:var(--card); --surface-2:var(--paper); --surface-3:var(--paper);
    --bg:var(--paper); --border:var(--line); --border-strong:var(--line);
    --muted-2:var(--faint); --accent:var(--repairing);
    --on-accent:var(--on-color); --danger:var(--red); --success:var(--done);
    --warn:var(--waiting); --info:var(--repairing);
  }

  /* ══ منقول بالحرف من dispatch.html: مراجعة قطع الغيار + شاشة الحسابات ══ */
  /* ===== 🔩 مراجعة قطع الغيار ===== */
  .pr-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .pr-quick{display:flex;gap:6px;}
  .pr-q{border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:10px;padding:8px 14px;font:800 12.5px/1 inherit;cursor:pointer;}
  .pr-q.on{background:var(--brand,#0891A8);color:#fff;border-color:transparent;}
  .pr-dates{display:flex;gap:8px;flex-wrap:wrap;}
  .pr-dates label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .pr-dates input{border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:9px;padding:7px 9px;font:inherit;font-size:12.5px;}
  .pr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .pr-tech{text-align:start;border:1px solid var(--line);background:var(--paper);
    border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;}
  .pr-tech:active{transform:scale(.99);}
  .pr-tech-n{font-weight:800;font-size:14px;margin-bottom:5px;}
  .pr-tech-s{font-size:12px;color:var(--muted);}
  .pr-tech-s .ok{color:var(--green,#16a34a);font-weight:700;}
  .pr-back{border:none;background:none;color:var(--brand,#0891A8);font:800 13px/1 inherit;
    cursor:pointer;padding:6px 0;margin-bottom:8px;}
  .pr-th{font-weight:800;font-size:15px;margin:4px 0 12px;display:flex;align-items:center;gap:8px;}
  .pr-n{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;}
  .pr-dev{border:1px solid var(--line);background:var(--paper);border-radius:13px;
    padding:12px;margin-bottom:10px;cursor:pointer;}
  .pr-dev-t{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:13.5px;}
  .pr-dev-s{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;}
  .pr-dev-i{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .pr-cm{margin-top:8px;background:var(--bg);border-radius:9px;padding:8px 10px;
    font-size:13px;font-weight:700;line-height:1.7;}
  .pr-cm.none{color:var(--muted);font-weight:400;font-style:italic;background:none;padding:6px 0;}
  /* الفني قال إن الجهاز محتاجش قطع غيار — رد مكتمل مش خانة فاضية */
  .pr-cm.ok0{background:var(--done-bg);border:1px solid var(--done);color:var(--done);}
  .pr-empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:13.5px;}
  /* 🔍 بحث المراجعة — مربوط بالمدة المختارة */
  .pr-search{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--paper);
    color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;margin-bottom:14px;}
  .pr-search:focus{outline:none;border-color:var(--brand,#0891A8);}
  .pr-res-h{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 2px 10px;}
  /* 🧰 القطع المربوطة من المخزن جوه كارت المراجعة */
  .pr-link{margin-top:6px;font-size:12.5px;line-height:1.75;color:var(--ink);
    background:var(--done-bg);border:1px solid var(--done);border-radius:9px;padding:7px 9px;}
  .pr-link b{font-weight:800;}
  .pr-link-t{font-weight:800;color:var(--done);white-space:nowrap;}
  .pr-link.none,.pr-link.wait{background:none;border:1px dashed var(--line);color:var(--muted);font-style:italic;}
  /* 🗓️ رحلة الجهاز على كارت المراجعة (دخل · اتنقل · اتسلّم) */
  .pr-tl{margin-top:8px;border:1px solid var(--border);border-radius:9px;padding:5px 9px;background:var(--surface);}
  .pr-tl-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:11.5px;line-height:1.95;color:var(--muted);}
  .pr-tl-r b{font-weight:700;color:var(--ink);white-space:nowrap;}
  .pr-tl-r.soft b{font-weight:500;color:var(--muted);}

  /* سطر المحل والفني جوه كارت الجهاز */
  .pr-dev-m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px;}
  .pr-dev-m b{color:var(--ink);font-weight:700;}
  /* 📁 فولدرات المراجعة — نفس شكل الداشبورد */
  .pr-folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:10px;margin-bottom:14px;}
  .pr-folder{text-align:start;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:14px;padding:14px;cursor:pointer;font:inherit;}
  .pr-folder:active{transform:scale(.99);}
  .pr-folder.warn{border-inline-start:4px solid var(--waiting);}
  .pr-folder.ok{border-inline-start:4px solid var(--done);}
  .pr-folder-n{font-weight:800;font-size:13.5px;margin-bottom:5px;line-height:1.6;}
  .pr-folder-s{font-size:12px;color:var(--muted);}
  .pr-folder-s b{font-size:15px;color:var(--ink);}
  .pr-fact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .pr-fnote{font-size:12px;color:var(--muted);}
  .pr-cm.ok0{background:var(--done-bg);border:1px solid var(--done);color:var(--done);}


  /* الشاشتين فوق كل حاجة في الصفحة (أعلى sheet عندنا 65) */
  #inventoryOverlay, #prOverlay{z-index:69;}
  /* ⚠️ .overlay فليكس — من غير width:100% الصفحة بتتقلّص لتلتين الشاشة */
  #inventoryOverlay .acc-page, #prOverlay .acc-page{width:100%;}
  .acc-page{min-height:100%; background:var(--bg); padding-bottom:40px;}
  /* ⚠️ env(safe-area-inset-top) = نتش الأيفون — من غيره زرار × بيستخبى */
  .acc-head{display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; z-index:5;}
  .acc-head h2{font-family:'Cairo',sans-serif; font-size:18px; margin:0;
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .acc-close{flex:none; border:none; background:var(--surface-2); color:var(--ink);
    width:38px; height:38px; border-radius:10px; font-size:20px; cursor:pointer; line-height:1;}
  .modal-search input{width:100%; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:10px; padding:11px 13px; font-size:14.5px; font-family:inherit;}
  /* ai-invoice.js بيفتح نافذة «اختار قطعة» بكلاس .modal — الصفحة دي مكانش فيها */
  .modal{background:var(--surface); border-radius:16px; width:92vw; max-width:560px;
    max-height:85vh; overflow-y:auto; padding:16px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between;}
  .modal-head h2{font-family:'Cairo',sans-serif; font-size:17px; margin:0;}

  /* 📱 تفاصيل الجهاز — للقراية بس (فوق الجرد: 69) */
  #hrDevSheet{z-index:80;}
  .hd-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .hd-no{font-family:var(--mono); font-size:12.5px; color:var(--muted); font-weight:700;}
  .hd-card{background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:4px 13px; margin-bottom:11px;}
  .hd-row{display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .hd-row:last-child{border-bottom:none;}
  .hd-row span{color:var(--muted); font-weight:700; font-size:12.5px;}
  .hd-row b{text-align:left; word-break:break-word;}
  .hd-box{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; margin-bottom:11px; font-size:13.5px; line-height:1.8; white-space:pre-wrap;}
  .hd-box.ok{background:var(--done-bg); border-color:var(--done); color:var(--done); font-weight:800;}
  .hd-box.none{color:var(--muted); border-style:dashed;}

  /* رسايل صغيرة تحت */
  .hr-toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px); background:var(--chrome); color:var(--on-chrome);
    font-weight:700; font-size:13.5px; padding:12px 18px; border-radius:12px; max-width:88vw;
    box-shadow:0 12px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:100000; text-align:center;}
  .hr-toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<style id="ios-safe-head-fix">
/* 📱 «فواتير المشتريات» و«مخزن قطع الغيار» بيترسموا من ai-invoice.js
   برأس لازق فوق (modal-head). الصفحة مفرودة تحت شريط الساعة
   (viewport-fit=cover)، فالرأس كان بيقع تحته ويبان باهت/مستخبي.
   env(safe-area-inset-top) = طول الشريط بالظبط — على الكمبيوتر صفر.
   !important لأن البادينج مكتوب جوه الوسم نفسه في ai-invoice.js. */
.summaries-page > .modal-head,
#invOverlay .modal-head,
#purOverlay .modal-head{

<body>

<div class="topbar">
  <div style="flex:1; min-width:0;">
    <h1>👥 شؤون العاملين</h1>
    <div class="who" id="whoLbl">—</div>
  </div>
  <button class="icon-btn att-menu-btn" style="display:none;" title="المواعيد" onclick="openAttendance()">⏰</button>
  <div class="menu-wrap">
    <button class="icon-btn" title="القايمة" onclick="toggleMenu(event)">⋮</button>
    <!-- ============================================================
         🗂️ القايمة متقسّمة مجموعات — فوق كل مجموعة عنوان صغير (mh)
         ------------------------------------------------------------
         ⚠️ كل الزراير **ولاد مباشرين** للقايمة (مفيش div حواليهم) عن قصد:
            common.js بيدوّر على الزراير ويحط جنبها.

<div id="attOverlay" class="hidden"></div>

<script>
// ============================================================
// I Fix Team — شؤون العاملين (hr.html)
// ------------------------------------------------------------
// بتوري سجل مواعيد كل الموظفين بالشهر: حضور · انصراف · بريك ·
// وساعات الشغل الصافية.
//
// 🔴 الحماية الحقيقية في قاعدة البيانات مش هنا.
//    سياسة attendance_read بتقول: كل واحد سجله هو، إلا لو دوره
//    hr أو super_admin. فحتى لو حد فتح الصفحة دي بالعافية،
//    مش هيشوف غير سجله هو. الفحص اللي تحت للتوجيه بس.
//
// ⚠️ حساب الأوفر تايم والتأخير والخصومات **لسه ماتعملش**.
//    الصفحة دي بتوري الساعات الخام. القواعد جاية في خطوة تانية.
// ============================================================

let ME = '', MY_ROLE = '', ROLES_MAP = {};
let MONTH = (() => { const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
let ROWS = [], OPEN_EMP = null, SEARCH = '';

const KIND = {
  in:     { t:'حضور',   icon:'🟢' },
  out:    { t:'انصراف', icon:'🔴' },
  break:  { t:'بريك',   icon:'☕' },
  resume: { t:'استئناف', icon:'▶️' }
};

// ===== الدخول =====
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href = 'index.html'; return; }
  ME = (session.user.email || '').toLowerCase();

  // خريطة الأدوار — عشان نعرض الأسماء والصلاحيات
  try{
    const { data } = await sb.from('app_data').select('value').eq('key','user-roles').maybeSingle();
    if(data && data.value) ROLES_MAP = JSON.parse(data.value) || {};
  }catch(e){ console.error('user-roles failed:', e); }

  const mine = ROLES_MAP[ME];
  MY_ROLE = typeof mine === 'string' ? mine : (mine && mine.role) || '';
  document.getElementById('whoLbl').textContent =
    ME + (MY_ROLE ? ' — ' + roleLabel(MY_ROLE) : '');

  attSyncMenu();          // زرار المواعيد على الموبايل بس
  await loadMonth();
})();

function roleLabel(r){
  return { super_admin:'أدمن', accountant:'محاسب', dispatcher:'مسؤول حركة',
           technician:'فني', hr:'شؤون العاملين', staff:'موظف',
           owner:'المالك' }[r] || r;
}
function nameOf(email){
  const v = ROLES_MAP[email];
  const n = (v && typeof v === 'object' && v.techName) ? v.techName : '';
  return n || (email || '').split('@')[0];
}
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.href = 'index.html';
}

// ============================================================
// 📄 القراية على صفحات — عشان ولا تسجيل يضيع
// ------------------------------------------------------------
// 🐞 الباج اللي اتصلّح (سبتمبر ٢٠٢٦):
//    Supabase **بيدّي ١٠٠٠ صف بس في المرة** — ده حد ثابت عنده.
//    الصفحة كانت بتطلب «كل تسجيلات الشهر» وتاخد اللي جه وتسكت.
//    شهر ٩ وصل ١٠١٥ تسجيل، فآخر ١٥ اتقصّوا في صمت. ولأن الترتيب
//    من الأقدم للأحدث، اللي بيتقص هو **أحدث حاجة** — يعني الانصراف
//    اللي لسه حاصل. الموظف شايفه عنده (هو بيقرا تسجيلاته بس)،
//    و HR مش شايفاه، واليوم يبان «ناقص انصراف» فالأوفر تايم
//    والنقص مايتحسبوش. وكل يوم في الشهر كان هيقص أكتر.
//
// ✅ دلوقتي بنطلب صفحة ورا صفحة لحد ما السيرفر يرجّع فاضي.
//
// ⚠️ بنتحرك بعدد اللي **رجع فعلاً** مش بـ ١٠٠٠. لو حد غيّر الحد
//    في إعدادات Supabase لـ ٥٠٠ مثلاً، الطريقة التانية كانت هتفتكر
//    «رجع أقل من ١٠٠٠ يبقى خلصنا» — ونرجع لنفس الباج.
//
// ⚠️ makeQuery لازم فيها ترتيب **ثابت** (order). من غيره السيرفر
//    ممكن يرجّع نفس الصف في صفحتين، أو يفوّت صف بين صفحتين.
// ============================================================
const HR_PAGE = 1000;
async function hrAll(makeQuery, label){
  const rows = [];
  for(let off = 0, guard = 0; ; guard++){
    if(guard >= 200){
      // ٢٠٠ ألف صف — أكيد فيه حاجة غلط. بنقول بدل ما نلف للأبد.
      throw new Error('البيانات أكبر من المتوقع (' + (label || 'قراءة') + ') — كلّم المطوّر');
    }
    const { data, error } = await makeQuery().range(off, off + HR_PAGE - 1);
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    if(!data || !data.length) break;
    rows.push(...data);
    off += data.length;
  }
  return rows;
}

// ===== التحميل =====
async function loadMonth(){
  const root = document.getElementById('root');
  root.innerHTML = '<div class="empty">جاري التحميل…</div>';
  const [y,m] = MONTH.split('-').map(Number);
  const from = `${y}-${String(m).padStart(2,'0')}-01`;
  // اليوم صفر من الشهر اللي بعده = آخر يوم في الشهر ده
  const to = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
  try{
    // 🔴 على صفحات — شوف hrAll فوق. id في الترتيب عشان تسجيلين
    //    في نفس الثانية بالظبط ما يتلخبطوش بين صفحتين.
    ROWS = await hrAll(() => sb.from('attendance')
      // ⚠️ id لازم يكون هنا — من غيره مفيش تعديل ولا مسح.
      //    و manual_by هو ختم «اتكتب بإيد HR».
      .select('id,user_email,user_name,kind,at,work_date,distance_m,verified,manual_by,manual_note')
      .gte('work_date', from).lte('work_date', to)
      .order('at', { ascending:true })
      .order('id', { ascending:true }), 'سجل الحضور');
    await loadEmpSettings();   // القواعد لازم تكون موجودة قبل الرسم
    await loadPenaltyStart();       // الحاجز لازم يتقرا قبل العرض
    await loadPenalties(from, to);  // 🔴 خصم التأخير — من السيرفر
    await loadOvertime(from, to);   // 🔴 والأوفر تايم كمان
    await loadDeductions();    // والخصومات اليدوية كمان
    await loadBonuses();       // 🎁 والحوافز (ملف 72)
    await loadDebts();         // 💳 والديون (ملف 73)
    await loadAbsences(from, to);   // 🏖️ الغياب المقترح خصمه
    await loadLeaveBonus();         // 💵 الإجازات اللي ما اتاخدتش (ملف 71)
    await loadNoBreak(from, to);    // ☕🚫 مين قال إنه مطلعش بريك
    await loadBreakDecl(from, to);  // ⚠️ إقرارات البريك وقت الانصراف
    render();
  }catch(e){
    console.error('loadMonth failed:', e);
    root.innerHTML = '<div class="empty">❌ مقدرناش نحمّل السجل<br><small>' +
      esc(e.message || e) + '</small></div>';
  }
}

// ============================================================
// حساب ساعات اليوم
// ------------------------------------------------------------
// بنمشي على تسجيلات اليوم بالترتيب:
//   حضور/استئناف → بنفتح عدّاد
//   بريك/انصراف  → بنقفله ونضيف الفرق
// الوقت اللي جوه البريك مش بيتحسب — العدّاد بيبقى مقفول.
//
// ⚠️ لو الموظف نسي ينصرف، آخر فترة بتفضل مفتوحة ومش بتتحسب،
//    وبنعلّم اليوم بعلامة "ناقص انصراف" عشان HR تشوفه وتصلّحه.
//    الأأمن إننا نقول "مش عارفين" بدل ما نخمّن ساعة وننسبها له.
// ============================================================
function dayMinutes(punches){
  let total = 0, openAt = null, missingOut = false;
  for(const p of punches){
    const t = new Date(p.at).getTime();
    if(p.kind === 'in' || p.kind === 'resume'){
      if(openAt === null) openAt = t;
    }else if(p.kind === 'break' || p.kind === 'out'){
      if(openAt !== null){ total += (t - openAt); openAt = null; }
    }
  }
  // ⚠️ العلامة على **آخر تسجيل** مش على العدّاد.
  //    الاختبار كشف إن اللي بيروح بريك وميرجعش خالص كان بيعدّي
  //    نضيف: البريك قفل العدّاد فالعدّاد مش مفتوح — بس الراجل
  //    برضه ما سجّلش انصراف. أي يوم آخره مش 'out' ناقص.
  const last = punches.length ? punches[punches.length - 1].kind : null;
  missingOut = (last !== 'out');
  return { minutes: Math.round(total / 60000), missingOut };
}
function fmtHm(mins){
  if(!mins) return '0:00';
  return Math.floor(mins/60) + ':' + String(mins % 60).padStart(2,'0');
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('ar-EG',
    { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Cairo' });
}

// ===== العرض =====
// ============================================================
// 🐞 الباج اللي اتصلّح (أكتوبر ٢٠٢٦): البحث بيقفل الكيبورد بعد كل حرف
// ------------------------------------------------------------
// 🧠 بالبلدي: خانة البحث كانت جوه الحتة اللي render بترسمها من
//    الأول. فكل حرف تكتبه → render → الصفحة ترمي الخانة القديمة
//    وترسم واحدة جديدة مكانها → الكيبورد كان شغّال على الخانة
//    القديمة اللي «اختفت»، فيقفل. وتدوس تاني وتكتب حرف → نفس الحكاية.
//
// ✅ دلوقتي الرسم على جزئين (نفس فكرة مراجعة قطع الغيار):
//    • render()      = الشريط (الشهر + البحث) + المؤشرات + مكان الكروت
//    • renderCards() = الكروت بس — دي اللي بتتنده مع كل حرف
//    فخانة البحث نفسها مبتتلمسش وإنت بتكتب، والكيبورد بيفضل مفتوح.
//
// ⚠️ المؤشرات فوق (موظف · يوم · ساعات · ناقص انصراف) محسوبة على كل
//    الموظفين مش على نتيجة البحث — فمش محتاجة تتحدّث مع الكتابة.
// ============================================================

// تجميع: موظف → يوم → تسجيلات
function groupEmps(){
  const emps = {};
  for(const r of ROWS){
    const e = (r.user_email || '').toLowerCase();
    (emps[e] = emps[e] || {})[r.work_date] = (emps[e][r.work_date] || []);
    emps[e][r.work_date].push(r);
  }
  return emps;
}

function render(){
  const root = document.getElementById('root');

  // حد بيكتب في البحث دلوقتي وجه تحديث من بره؟ نحدّث الكروت بس —
  // عشان الكيبورد ما يقفلش في وشه
  const qEl = document.getElementById('hrQ');
  if(qEl && document.activeElement === qEl && document.getElementById('hrCards')){
    renderCards();
    return;
  }

  const emps = groupEmps();

  // مؤشرات فوق
  let totalMin = 0, totalDays = 0, flagged = 0;
  for(const e of Object.keys(emps)){
    for(const d of Object.keys(emps[e])){
      const s = dayMinutes(emps[e][d]);
      totalMin += effMin(e, emps[e][d], d); totalDays++;
      if(s.missingOut) flagged++;
    }
  }

  const bar = `
    <div class="bar">
      <input type="month" value="${MONTH}" onchange="MONTH=this.value; loadMonth()">
      <input type="search" id="hrQ" autocomplete="off" placeholder="ابحث باسم الموظف…" value="${esc(SEARCH)}"
             oninput="SEARCH=this.value; renderCards()">
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${Object.keys(emps).length}</div><div class="l">موظف</div></div>
      <div class="kpi"><div class="v">${totalDays}</div><div class="l">يوم حضور</div></div>
      <div class="kpi"><div class="v">${fmtHm(totalMin)}</div><div class="l">إجمالي الساعات</div></div>
      <div class="kpi"><div class="v" style="color:var(--waiting)">${flagged}</div><div class="l">يوم ناقص انصراف</div></div>
    </div>`;

  root.innerHTML = bar + '<div id="hrCards"></div>';
  renderCards(emps);
  // ⚠️ السجل بقى شاشة كاملة (empSheet) مش قسم بيتفتح تحت الكارت.
  //    لو كان مفتوح وحصل تحديث، بنعيد رسمه بالبيانات الجديدة.
  if(OPEN_EMP && emps[OPEN_EMP]) renderEmpSheet(OPEN_EMP, emps[OPEN_EMP]);
}

// الكروت بس — من غير ما نلمس خانة البحث
function renderCards(emps){
  const host = document.getElementById('hrCards');
  if(!host) return;
  emps = emps || groupEmps();

  let keys = Object.keys(emps).sort((a,b) => nameOf(a).localeCompare(nameOf(b),'ar'));
  const q = (SEARCH || '').trim().toLowerCase();
  if(q){
    keys = keys.filter(k => k.includes(q) || nameOf(k).toLowerCase().includes(q));
  }

  if(!keys.length){
    // فيه تسجيلات بس البحث مالقاش حد → نقول كده، مش «مفيش تسجيلات»
    host.innerHTML = (q && Object.keys(emps).length)
      ? '<div class="empty">مفيش موظف بالاسم «' + esc(SEARCH.trim()) + '» في الشهر ده</div>'
      : '<div class="empty">مفيش تسجيلات في الشهر ده' +
        (ROWS.length ? '' : '<br><small>لو إنت مش HR ولا أدمن، مش هتشوف غير سجلك إنت</small>') +
        '</div>';
    return;
  }

  host.innerHTML = '<div class="cards">' +
    keys.map(e => cardHtml(e, emps[e])).join('') + '</div>';
}

// تجميع أيام موظف واحد — بيتستخدم في الكروت وفي الشاشة
function daysOf(email){
  const days = {};
  ROWS.filter(r => (r.user_email||'').toLowerCase() === email)
      .forEach(r => { (days[r.work_date] = days[r.work_date] || []).push(r); });
  return days;
}

// لون ثابت لكل موظف من اسمه — عشان يعرفه بالشكل بسرعة،
// ونفس اللون يفضل معاه كل شهر
function avatarColor(e){
  let h = 0;
  for(let i=0;i<e.length;i++) h = (h*31 + e.charCodeAt(i)) % 360;
  return `hsl(${h} 55% 42%)`;
}

function cardHtml(e, days){
  let mins = 0, flags = 0, penalty = 0, late = 0, over = 0, short = 0;
  const dkeys = Object.keys(days);
  dkeys.forEach(d => {
    const st = dayMinutes(days[d]);
    mins += effMin(e, days[d], d);
    if(st.missingOut) flags++;
    const r = applyRules(e, days[d], d);
    if(r){ penalty += r.penalty; if(r.state === 'late') late++; }
    const o = dayOvertime(e, days[d], d);
    // ⚠️ اليوم اللي ناقصه انصراف ساعاته مش موثوقة، فمش بنحسبه
    //    لا أوفر تايم ولا نقص — وإلا هنطلع أرقام متخيّلة.
    if(o.has && !st.missingOut){ over += o.over; short += o.short; }
  });
  const c = EMP_SET[e] || {};
  // الشريط الملوّن: أيام سليمة / متأخرة / ناقصة — قراءة بنظرة
  const good = Math.max(0, dkeys.length - late - flags);
  const pct  = n => dkeys.length ? (n / dkeys.length * 100) : 0;
  return `
  <div class="card">
    <div class="card-top">
      <div class="avatar" style="background:${avatarColor(e)}">${esc(nameOf(e).charAt(0))}</div>
      <div class="card-id">
        <b>${esc(nameOf(e))}</b>
        <span>${c.shift_start ? '🕙 ' + String(c.shift_start).slice(0,5) : '⚠️ مفيش ميعاد محدد'}</span>
      </div>
    </div>
    <div class="card-bar">
      <i style="width:${pct(good)}%;background:var(--done)"></i>
      <i style="width:${pct(late)}%;background:var(--red)"></i>
      <i style="width:${pct(flags)}%;background:var(--waiting)"></i>
    </div>
    <div class="card-stats">
      <div><b>${dkeys.length}</b><span>يوم</span></div>
      <div><b>${fmtHm(mins)}</b><span>ساعات</span></div>
      <div><b style="color:${over ? 'var(--done)' : 'inherit'}">${fmtHm(over)}</b><span>أوفر تايم</span></div>
    </div>
    <div class="card-stats" style="padding-top:0;">
      <div><b style="color:${short ? 'var(--waiting)' : 'inherit'}">${fmtHm(short)}</b><span>نقص</span></div>
      <div><b style="color:${late ? 'var(--red)' : 'inherit'}">${late}</b><span>تأخير</span></div>
      <div><b style="color:${penalty ? 'var(--red)' : 'inherit'}">${penalty || 0}</b><span>خصم تلقائي</span></div>
    </div>
    ${(() => {
      // شريط الخصم اليدوي — بيظهر لو فيه خصم بس، عشان الكارت
      // ما يتزحمش على الموظفين اللي مالهمش خصومات
      // ⚠️ الشهر المعروض بس — زي باقي أرقام الكارت (الساعات
      //    والأوفر تايم). قبل كده كان مجموع كل الشهور جنب أرقام
      //    شهر واحد، والمسحوبات متجمعة معاه كمان.
      const m = manualDed(e, MONTH);
      const bn = bonusSum(e, MONTH);
      const dr = debtRemaining(e);
      if(!m.total && !m.wd && !m.unseen && !bn.total && !dr) return '';
      const bits = [];
      if(bn.total) bits.push(`<span style="color:var(--done)">🎁 حوافز: <b>+${bn.total}</b> ج.م</span>`);
      if(dr) bits.push(`💳 ديون باقية: <b>${lbMoney(dr)}</b> ج.م`);
      if(m.total) bits.push(`💸 خصم يدوي: <b>${m.total}</b> ج.م`);
      if(m.wd)    bits.push(`🔩 مسحوبات: <b>${m.wd}</b> ج.م`);
      if(m.unseen) bits.push(`<i>${m.unseen} لسه ما اتقراش</i>`);
      return `<div class="card-ded">${bits.join(' · ')}</div>`;
    })()}
    ${absBoxHtml(e)}
    <div class="card-foot">
      <button onclick="openEmpLog('${esc(e)}')">📋 السجل</button>
      <button onclick="openDeduction('${esc(e)}')" title="خصم">💸</button>
      <button onclick="openBonus('${esc(e)}')" title="حافز">🎁</button>
      <button onclick="openHrSettings('${esc(e)}')" title="نظام العمل">⚙️</button>
      <button onclick="exportEmpPdf('${esc(e)}')">📄</button>
      <button onclick="exportEmpExcel('${esc(e)}')">📊</button>
    </div>
  </div>`;
}

// ============================================================
// سجل الموظف — شاشة كاملة
// ------------------------------------------------------------
// كان قسم بيتفتح تحت الكارت، فالمستخدم كان لازم يعدّي على كل
// الكروت عشان يوصله، والملخص كان بيفضل فوق برّه الشاشة.
// دلوقتي شاشة مستقلة: الملخص فوق ثابت، وتحته كل الأيام.
// ============================================================
function openEmpLog(email){
  OPEN_EMP = email;
  renderEmpSheet(email, daysOf(email));
  openSheet('empSheet');
}
function closeEmpLog(){ OPEN_EMP = null; WD_DRAWER_OPEN = false; closeSheet('empSheet'); }

function renderEmpSheet(email, days){
  const box = document.getElementById('empSheetBody');
  const ttl = document.getElementById('empSheetTitle');
  if(!box) return;
  if(ttl) ttl.textContent = '📋 سجل ' + nameOf(email);

  const dkeys = Object.keys(days).sort().reverse();
  let mins=0, over=0, short=0, pen=0, late=0, flags=0;
  dkeys.forEach(d => {
    const st = dayMinutes(days[d]);
    mins += effMin(email, days[d], d);
    if(st.missingOut) flags++;
    const r = applyRules(email, days[d], d);
    if(r){ pen += r.penalty; if(r.state === 'late') late++; }
    const o = dayOvertime(email, days[d], d);
    if(o.has && !st.missingOut){ over += o.over; short += o.short; }
  });

  const c = EMP_SET[email] || {};
  box.innerHTML = `
    <div class="emp-top">
      <div class="avatar" style="background:${avatarColor(email)}">${esc(nameOf(email).charAt(0))}</div>
      <div style="flex:1;min-width:0;">
        <b style="display:block;font-size:17px;">${esc(nameOf(email))}</b>
        <span style="font-size:12px;color:var(--muted);">
          ${esc(monthLabel())}${c.shift_start ? ' · 🕙 ' + String(c.shift_start).slice(0,5) : ''}</span>
      </div>
    </div>

    <div class="kpis" style="margin:14px 0 16px;">
      <div class="kpi"><div class="v">${dkeys.length}</div><div class="l">يوم</div></div>
      <div class="kpi"><div class="v">${fmtHm(mins)}</div><div class="l">ساعات</div></div>
      <div class="kpi"><div class="v" style="color:${over?'var(--done)':'inherit'}">${fmtHm(over)}</div><div class="l">أوفر تايم</div></div>
      <div class="kpi"><div class="v" style="color:${short?'var(--waiting)':'inherit'}">${fmtHm(short)}</div><div class="l">نقص</div></div>
      <div class="kpi"><div class="v" style="color:${late?'var(--red)':'inherit'}">${late}</div><div class="l">تأخير</div></div>
      <div class="kpi"><div class="v" style="color:${pen?'var(--red)':'inherit'}">${pen||0}</div><div class="l">خصم ج.م</div></div>
    </div>

    <div class="emp-acts">
      <button onclick="openDeduction('${esc(email)}')" style="background:var(--red);color:#fff;border-color:var(--red);">💸 خصم</button>
      <button onclick="openBonus('${esc(email)}')" style="background:var(--done);color:#fff;border-color:var(--done);">🎁 حافز</button>
      <button onclick="openDebts('${esc(email)}')">💳 الديون</button>
      <button onclick="openPunch('${esc(email)}')">✍️ تسجيل يدوي</button>
      <button onclick="openHrSettings('${esc(email)}')">⚙️ نظام العمل</button>
      <button onclick="exportEmpPdf('${esc(email)}')">📄 PDF</button>
      <button onclick="exportEmpExcel('${esc(email)}')">📊 Excel</button>
    </div>

    ${debtSectionHtml(email)}
    ${bonusSectionHtml(email)}
    ${dedSectionHtml(email)}

    ${flags ? `<div class="hintbox" style="margin-top:14px;">⚠️ فيه ${flags} يوم ناقص انصراف —
      ساعاتهم مش محسوبة في الإجمالي.</div>` : ''}
    ${(() => {
      // ⚠️ التسجيلات من غير بصمة: يا إما جهاز الموظف مالوش بصمة
      //    أصلاً، يا إما البصمة بايظة. المهم إن HR تشوف العدد —
      //    لو موظف كل تسجيلاته من غير بصمة، ده يستاهل سؤال.
      const nb = dkeys.reduce((n,d) => n + days[d].filter(r => !r.verified).length, 0);
      const all = dkeys.reduce((n,d) => n + days[d].length, 0);
      if(!nb) return '';
      return `<div class="hintbox" style="margin-top:10px;">🔓 ${nb} من ${all} تسجيل
        اتعمل <b>من غير بصمة</b> — جهازه غالباً مالوش بصمة أو بايظة.
        (اللوكيشن اتفحص في كل الحالات.)</div>`;
    })()}

    <div style="margin-top:14px;">
      ${dkeys.length
        ? dkeys.map(d => dayHtml(d, days[d], email)).join('')
        : '<div class="empty">مفيش تسجيلات في الشهر ده</div>'}
    </div>`;
}

// سبب الخصم بالكلام — الموظف والـHR لازم يعرفوا الفلوس راحت ليه
function penaltyWhy(r){
  const bits = [];
  if(r.latePen)  bits.push(`تأخير ${r.latePen} ج.م`);
  if(r.breakPen) bits.push(`تعدّي البريك ${r.breakPen} ج.م (بريك ${fmtDur(r.breakMin)} والمسموح ${fmtDur(r.breakLimit)})`);
  return bits.length ? 'خصم تلقائي: ' + bits.join(' + ') : 'الخصم ده تلقائي حسب المواعيد';
}

function dayHtml(d, punches, email){
  const s = dayMinutes(punches);
  const r = email ? applyRules(email, punches, d) : null;
  // سطر القواعد: بيوري الحضور الفعلي والمحتسب والمفروض ينصرف
  const rules = !r ? '' : `
    <div class="punch" style="border-bottom:1px solid var(--border); padding-bottom:7px; margin-bottom:5px;">
      <span style="color:${STATE_LBL[r.state].c}; font-weight:800;">${STATE_LBL[r.state].t}
        ${r.penalty ? `<span class="flag" style="background:var(--rejected-bg,#FEF2F2);color:var(--red)">خصم ${r.penalty} ج.م</span>` : ''}
        ${r.breakPen ? `<span class="flag" style="background:var(--rejected-bg,#FEF2F2);color:var(--red)">☕ زوّد البريك ${fmtDur(r.breakOver)}</span>` : ''}
        ${(!r.breakPen && r.breakOver && r.breakLimit) ? `<span class="flag">☕ زوّد ${fmtDur(r.breakOver)}</span>` : ''}
        ${r.breakOpen ? `<span class="flag">☕ بريك مفتوح</span>` : ''}
        ${r.waived ? `<span class="flag" style="background:var(--done-bg);color:var(--done)">✋ الخصم اتشال</span>` : ''}</span>
      <span class="meta">${r.isOff ? '🏖️ يوم إجازته — نزل ' + fmtMinTime(r.arrived) + (((dayOvertime(email, punches, d) || {}).offMode === 'day') ? ' · كمّل ساعاته = يوم كامل، والزيادة بس أوفر تايم' : ' · كل ساعاته أوفر تايم') : 'ميعاده ' + fmtMinTime(r.shift) + ' · حضر ' + fmtMinTime(r.arrived)}${
        (!r.isOff && r.lateBy) ? ' (متأخر ' + fmtDur(r.lateBy) + ')' : ''}${r.isOff ? '' : ' · يتحسب ' + fmtMinTime(r.counted) + ' · ينصرف ' + fmtMinTime(r.leaveAt)}${
        r.breakMin ? ' · ☕ بريك ' + fmtDur(r.breakMin) + (r.breakLimit ? ' من ' + fmtDur(r.breakLimit) : '') : ''}${(() => {
          // البريك اللي ضحّى بيه + الشغل الخام قبل ما يتشال منه
          const o = email ? dayOvertime(email, punches, d) : null;
          if(!o || !o.has || !o.brkUnused) return '';
          return ' · ☕ ضحّى بـ ' + fmtDur(o.brkUnused) +
                 (o.eff !== o.worked ? ' · شغل فعلي ' + fmtHm(o.worked) : '');
        })()}</span>
    </div>
    ${r.beforeStart ? `
      <div class="punch" style="padding-bottom:7px;">
        <span class="meta" style="flex:1;">🛡️ اليوم ده قبل بداية تطبيق الخصم — متأخر بس من غير فلوس</span>
      </div>` :
      (r.waived ? `
      <div class="punch" style="padding-bottom:7px;">
        <span class="meta" style="flex:1;">سبب الشيل: ${esc(r.waiveReason || '—')}</span>
        <button class="mini-btn" onclick="unwaivePenalty('${esc(email)}','${esc(d)}')">↩️ رجّع الخصم</button>
      </div>` :
      (r.penalty ? `
      <div class="punch" style="padding-bottom:7px;">
        <span class="meta" style="flex:1;">${penaltyWhy(r)}</span>
        <button class="mini-btn danger" onclick="waivePenalty('${esc(email)}','${esc(d)}')">✋ شيل الخصم</button>
      </div>` : ''))}`;
  return `
  <div class="day">
    <div class="day-h">
      <span>${new Date(d).toLocaleDateString('ar-EG',
        { weekday:'long', day:'numeric', month:'long' })}
        ${s.missingOut ? '<span class="flag">ناقص انصراف</span>' : ''}
        ${(() => {
          // ☕ بريك من غير استئناف: العدّاد بيقف عند البريك، والوقت
          // اللي بعده مش شغل. من غير التوضيح ده الرقم بيبان «ملوش
          // مبرر» — وده اللي حصل فعلاً في المراجعة.
          const kinds = punches.map(x => x.kind);
          const nB = kinds.filter(x => x === 'break').length;
          const nR = kinds.filter(x => x === 'resume').length;
          return nB > nR ? '<span class="flag">☕ بريك من غير استئناف</span>' : '';
        })()}
        ${(() => {
          const o = email ? dayOvertime(email, punches, d) : null;
          return (o && o.has && o.isOff)
            ? '<span class="flag" style="background:var(--done-bg);color:var(--done)">🏖️ نزل في إجازته' +
              (o.offMode === 'day' ? ' · 📅 يوم كامل' : (o.offMode === 'overtime' ? ' · ⏱️ أوفر تايم' : '')) + '</span>' : '';
        })()}
        ${(email && NOBRK[(email||'').toLowerCase()] && NOBRK[(email||'').toLowerCase()][d])
          ? '<span class="flag" title="الموظف أعلن إنه ما أخدش بريك">☕🚫 مطلعش بريك</span>' : ''}
        ${breakDeclFlag(email, d)}</span>
      <span class="hrs">${fmtHm(email ? effMin(email, punches, d) : s.minutes)}${(() => {
        const o = email ? dayOvertime(email, punches, d) : null;
        if(!o || !o.has || s.missingOut) return '';
        if(o.over)  return ` <span style="color:var(--done)">+${fmtHm(o.over)}</span>`;
        if(o.short) return ` <span style="color:var(--waiting)">−${fmtHm(o.short)}</span>`;
        return '';
      })()}</span>
    </div>
    ${rules}
    ${punches.map(p => `
      <div class="punch">
        <span style="flex:1;min-width:0;">${KIND[p.kind].icon} ${KIND[p.kind].t}
          ${p.manual_by
            ? '<span class="meta manual">✍️ يدوي</span>'
            : (p.verified ? '' : '<span class="meta">(من غير بصمة)</span>')}</span>
        <span>${fmtTime(p.at)}
          <span class="meta">${p.distance_m != null ? Math.round(p.distance_m) + 'م' : ''}</span>
        </span>
        ${email && p.id ? `
          <button class="mini-btn" title="تعديل"
                  onclick="openPunch('${esc(email)}','${esc(d)}','${esc(p.id)}')">✏️</button>
          <button class="mini-btn danger" title="مسح"
                  onclick="deletePunch('${esc(p.id)}')">🗑️</button>` : ''}
      </div>`).join('')}
    ${email ? (() => {
      // ⏱️ تعديل الساعات — سطر بيبان بس لو فيه تعديل، وزرار دايماً
      const o = dayOvertime(email, punches, d);

      const line = cur ? `
        <div class="punch adj-line">
          <span style="flex:1;min-width:0;">⏱️ ${cur > 0 ? 'اتخصم' : 'اتزاد'} ${fmtDur(Math.abs(cur))}
            <span class="meta">${esc(o.adjWhy || '')}</span>
            <span class="meta">(الأصل ${fmtHm(o.raw)})</span></span>
          <button class="mini-btn danger" title="شيل التعديل"
                  onclick="adjustHours('${esc(email)}','${esc(d)}', 0)">↩️</button>

      return line + `

    })() : ''}
  </div>`;
}


// ============================================================
// ⏱️ خصم ساعات من يوم معيّن
// ------------------------------------------------------------
// سجل الحضور نفسه مبيتلمسش — بنسجّل تعديل منفصل على اليوم بسبب
// مكتوب. الساعات بتقل، والأوفر تايم/العجز بيتحدّثوا من السيرفر.
// 🔴 مفيش فلوس بتتخصم هنا: الساعات بتترجم لفلوس في كشف الراتب
//    بنفس المعادلة الموجودة. لو عايز خصم فلوس مباشر استخدم «💸 خصم».
// ============================================================
async function adjustHours(email, date, force){
  // بنقرا التعديل الحالي من صف السيرفر مباشرة — مش محتاجين التسجيلات هنا
  const row = (OVER[(email || '').toLowerCase()] || {})[date];
  const cur = row ? Number(row.adjust_min || 0) : 0;

  let mins = 0, why = '';
  if(force === 0){
    if(!confirm('تشيل تعديل الساعات عن اليوم ده؟\nالساعات هترجع زي ما كانت.')) return;
  }else{
    const ans = prompt(
      'اخصم كام ساعة من اليوم ده؟\n' +
      'مثال: 2 يعني ساعتين · 0.5 يعني نص ساعة\n' +
      'اكتب رقم بالسالب لو عايز تزوّد ساعات (تعويض).',
      cur ? String(Math.round((cur / 60) * 100) / 100) : '');
    if(ans === null) return;
    const h = parseFloat(String(ans).replace(',', '.'));
    if(isNaN(h)){ alert('اكتب رقم صحيح'); return; }
    mins = Math.round(h * 60);
    if(mins === 0){
      if(!confirm('صفر = شيل التعديل خالص. تمام؟')) return;
    }else{
      if(Math.abs(mins) > 1440){ alert('التعديل مينفعش يزيد عن ٢٤ ساعة'); return; }
      // 🔴 السبب إجباري — ده وقت بيتشال من حساب موظف
      why = prompt('السبب (إجباري — الموظف هيشوفه):', '') || '';
      if(!why.trim()){ alert('لازم تكتب السبب'); return; }
      const label = mins > 0 ? 'خصم' : 'إضافة';
      if(!confirm(`تأكيد ${label} الساعات\n\nالموظف: ${nameOf(email)}\nاليوم: ${date}\nالمقدار: ${fmtDur(Math.abs(mins))}\nالسبب: ${why.trim()}`)) return;
    }
  }

  try{
    const { error } = await sb.rpc('hr_adjust_hours',
      { p_email: email, p_date: date, p_minutes: mins, p_reason: why.trim() || null });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    // الساعات بتتحسب في السيرفر، فلازم نعيد تحميلها مش نعدّلها محلياً
    const y = +MONTH.slice(0,4), m = +MONTH.slice(5,7);
    const from = MONTH + '-01';
    const to = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
    await loadOvertime(from, to);
    render();
    // لو شاشة سجل الموظف مفتوحة، تتحدّث هي كمان
    if(typeof OPEN_EMP !== 'undefined' && OPEN_EMP) renderEmpSheet(OPEN_EMP, daysOf(OPEN_EMP));
    alert(mins === 0 ? 'اتشال ✅' : 'اتسجّل ✅');
  }catch(e){
    alert('❌ ' + (e.message || e));
  }
}

// ملخص غياب الموظف في الشهر المعروض
function absSum(email){
  const byDay = ABS[(email||'').toLowerCase()] || {};
  const days = Object.keys(byDay).sort().reverse();
  let pending = 0, pendingDays = 0, charged = 0, excused = 0, free = 0;
  days.forEach(d => {
    const r = byDay[d];
    if(r.status === 'charged'){ charged += Number(r.amount || r.total_amount || 0); return; }
    if(r.status === 'excused'){ excused++; return; }
    if(r.is_over){ pending += Number(r.total_amount || 0); pendingDays++; }
    else free++;
  });
  return { days, pending: Math.round(pending*100)/100, pendingDays,
           charged: Math.round(charged*100)/100, excused, free, count: days.length };
}

// أيام الراحة اللي نزل فيها في الشهر المعروض (من hr_overtime)
function offDaysOf(email){
  const byDay = OVER[(email || '').toLowerCase()] || {};
  return Object.keys(byDay).filter(d => byDay[d].is_off_day).sort().reverse()
    .map(d => byDay[d]);
}

function lbMoney(n){ return (Math.round(Number(n || 0) * 100) / 100).toLocaleString('en-US'); }

function absBoxHtml(email){
  const a  = absSum(email);

  const od = offDaysOf(email);
  if(!a.count && !lb && !od.length) return '';

  if(a.free)    bits.push(`${a.free} جوه المسموح`);
  if(a.excused) bits.push(`${a.excused} بإذن`);
  if(a.charged) bits.push(`اتخصم ${a.charged} ج.م`);
  const nDay = od.filter(r => r.off_mode === 'day').length;

  return `

      🏖️ الغياب والإجازات${bits.length ? ': ' + bits.join(' · ') : ''}
      ${a.pending ? `<div style="margin-top:4px;font-weight:800;">المقترح خصمه: ${a.pending} ج.م</div>` : ''}
      ${od.length ? `<div style="margin-top:4px;">🏖️ نزل في راحته ${od.length} يوم${
        nDay ? ` · ${nDay} يوم كامل` : ''}${nOt ? ` · ${nOt} أوفر تايم` : ''}</div>` : ''}
      ${lbLineHtml(lb)}
      <button class="mini-btn" style="margin-top:6px;" onclick="openAbsences('${esc(email)}')">📋 راجع الأيام</button>

}

async function absDecide(date, status){
  const nm = nameOf(ABS_EMAIL);
  const byDay = ABS[(ABS_EMAIL||'').toLowerCase()] || {};
  const r = byDay[date];
  if(!r) return;
  let why = '';
  if(status === 'excused'){
    why = prompt('سبب الإذن (هيتسجّل):', '');
    if(why === null) return;
  }else{
    // 🔴 تأكيد صريح: دي فلوس بتتشال من مرتب حد
    if(!confirm(`تأكيد الخصم\n\nالموظف: ${nm}\nاليوم: ${date}\nالمبلغ: ${Number(r.total_amount||0)} ج.م\n\nهيتسجّل كخصم والموظف هيتبلّغ بيه.`)) return;
    why = prompt('سبب إضافي (اختياري):', '') || '';
  }
  try{
    const { error } = await sb.rpc('hr_absence_decide',
      { p_email: ABS_EMAIL, p_date: date, p_status: status, p_reason: why || null });
    // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
    if(error) throw error;
    await loadDeductions();
    await reloadAbsences();
    render(); renderAbsences();
    alert(status === 'charged' ? 'اتخصم ✅' : 'اتسجّل إذن ✅');
  }catch(e){
    alert('❌ ' + (e.message || e));
  }
}

// كل الموظفين — من خريطة الأدوار، مش من السجل.
// ⚠️ لو اعتمدنا على السجل، الموظف الجديد اللي لسه ما سجّلش حضور
//    مش هيظهر في القايمة — ومش هتقدر تحطله ميعاد أصلاً.
function allEmployees(){
  const out = [];
  for(const em of Object.keys(ROLES_MAP || {})){
    const v = ROLES_MAP[em];
    const r = typeof v === 'string' ? v : (v && v.role) || '';
    if(r === 'hr') continue;          // HR مش بتسجّل حضور موظفين
    out.push(em.toLowerCase());
  }
  // وأي حد في السجل ومش في الخريطة (حساب اتشال مثلاً)
  ROWS.forEach(r => {
    const e = (r.user_email||'').toLowerCase();
    if(e && out.indexOf(e) < 0) out.push(e);
  });
  return out.sort((a,b) => nameOf(a).localeCompare(nameOf(b),'ar'));
}

function toggleOff(i){
  const c = EMP_SET[SET_EMAIL] = EMP_SET[SET_EMAIL] || { user_email: SET_EMAIL };
  const off = Array.isArray(c.off_days) ? c.off_days.slice() : [];
  const at = off.indexOf(i);
  if(at >= 0) off.splice(at,1); else off.push(i);
  // ⚠️ بنحفظ اللي متكتب في الخانات قبل إعادة الرسم — من غير كده
  //    أي حاجة كتبتها وما حفظتهاش بتضيع أول ما تدوس على يوم.
  stashForm(c);
  c.off_days = off.sort();
  renderHrSettings();
}

function stashForm(c){
  const g = id => (document.getElementById(id) || {}).value;
  if(g('fStart')   !== undefined) c.shift_start   = g('fStart')  || null;
  if(g('fGrace')   !== undefined) c.grace_minutes = parseInt(g('fGrace'),10) || 0;
  if(g('fHours')   !== undefined) c.work_hours    = parseFloat(g('fHours')) || 8;
  if(g('fBackup')  !== undefined) c.backup_start  = g('fBackup') || null;
  if(g('fPenalty') !== undefined) c.late_penalty  = parseFloat(g('fPenalty')) || 0;
  if(g('fBreak')      !== undefined) c.break_minutes       = parseInt(g('fBreak'),10) || 0;
  if(g('fBreakGrace') !== undefined) c.break_grace_minutes = parseInt(g('fBreakGrace'),10) || 0;
  // ⚠️ الإجازات: فاضي معناه «تلقائي» مش صفر — والفرق كبير.
  //    صفر = مفيش أي إجازة والكل يتخصم.
  if(g('fLeave')      !== undefined) c.monthly_leave_days  = (g('fLeave') === '' ? null : (parseInt(g('fLeave'),10) || 0));
  if(g('fAbsPen')     !== undefined) c.absence_penalty     = parseFloat(g('fAbsPen')) || 0;
  // 💵 فاضي = «تلقائي» (المرتب ÷ ٣٠) — مش صفر. صفر معناه «مفيش فلوس».
  if(g('fLeaveVal')   !== undefined) c.leave_day_value     = (g('fLeaveVal') === '' ? null : Math.max(0, parseFloat(g('fLeaveVal')) || 0));
  if(g('fNote')    !== undefined) c.note          = g('fNote') || null;
}

// ============================================================
// تطبيق قواعد الميعاد على يوم واحد
// ------------------------------------------------------------
// بترجّع: وقت الحضور الفعلي · المحتسب · المفروض ينصرف · الخصم
// ⚠️ لو الموظف مالوش إعدادات، بنرجّع null والعرض بيوري الساعات
//    الخام بس — **ما بنخترعش ميعاد افتراضي**، لأن ميعاد متخيّل
//    معناه خصم على حد ملوش ذنب.
// ============================================================
function hhmmOf(iso){
  // الساعة والدقيقة بتوقيت مصر — مش بتوقيت الجهاز اللي بيتفرّج
  const p = new Date(iso).toLocaleTimeString('en-GB',
    { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Africa/Cairo' });
  const [h,m] = p.split(':').map(Number);
  return h*60 + m;
}
function toMin(t){
  if(!t) return null;
  const [h,m] = String(t).slice(0,5).split(':').map(Number);
  return h*60 + m;
}
// مدة بالساعة والدقيقة
function fmtDur(mins){
  const m = Math.max(0, Math.round(Number(mins) || 0));
  const h = Math.floor(m / 60), r = m % 60;
  if(!h) return r + ' د';
  if(!r) return h + ' س';
  return h + ' س و ' + r + ' د';
}

function fmtMinTime(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  return String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins%60).padStart(2,'0');
}

// 🔴🔴 الدالة دي **مبقتش بتحسب حاجة** — بقت بتقرا من السيرفر.
// ------------------------------------------------------------
// كانت بتطبّق القواعد هنا في الجافاسكريبت. المشكلة ظهرت أول ما
// الموظف بقى يشوف خصمه في شاشة «مرتبك»: يا إما نكتب نفس الحساب
// تاني في payroll.js، يا إما نخلّي مصدر واحد.
//
// كتابة الحساب مرتين معناها إن أول تعديل على واحد فيهم من غير
// التاني = HR شايفة رقم والموظف شايف رقم تاني، ومحدش هياخد باله
// غير لما تحصل خناقة على المرتب.
//
// دلوقتي دالة hr_late_penalties في السيرفر هي المصدر الوحيد،
// والاتنين بيقروا منها. الدالة دي بقت **مترجم** بس.
//
// ⚠️ بترجّع null لو اليوم مش في رد السيرفر — وده بيحصل في حالتين
//    شرعيتين: الموظف مالوش ميعاد محدد، أو مسجّلش «حضور» في اليوم
//    ده أصلاً. العرض ساعتها بيوري الساعات الخام وبس.
function applyRules(email, punches, workDate){
  const byDay = PENS[(email || '').toLowerCase()];
  const row = byDay && workDate ? byDay[workDate] : null;
  if(!row) return null;
  const need = Number(row.need_min || 0);
  return {
    arrived: Number(row.arrived_min),
    // ⚠️ shift = ميعاده الحقيقي · counted = الوقت اللي بيتحسب منه
    //    شغله. الاتنين بيتساووا لو جه بدري أو جوه السماح، وبيختلفوا
    //    لو اتأخر. خلطهم كان بيطلع «حضرت ١٨ وميعادك ١٨» على يوم
    //    فيه خصم — كلام متناقض.
    shift:   Number(row.shift_min != null ? row.shift_min : row.counted_min),
    lateBy:  Number(row.late_min || 0),
    counted: Number(row.counted_min),
    // ⚠️ ميعاد الانصراف = اللي بيتحسب منه + الشغل المطلوب + البريك
    //    اللي أخده فعلاً. اللي ما خدش بريك بيمشي أبدر — وده حقه،
    //    لأن البريك المتساب مش بيتحوّل أوفر تايم أصلاً.
    leaveAt: Number(row.counted_min) + need + Number(row.break_min || 0),
    need,
    // السيرفر بيصفّر الخصم لوحده لو HR شالته — مش بنكرّر الفحص هنا
    // 🔴 penalty = المجموع (تأخير + بريك) — السيرفر بيجمعهم.
    //    التفصيل تحت عشان العرض يقول السبب الصح.
    penalty: Number(row.penalty || 0),
    latePen:   Number(row.late_penalty_amt  || 0),
    breakPen:  Number(row.break_penalty_amt || 0),
    breakMin:  Number(row.break_min || 0),
    breakLimit:Number(row.break_allow_min || 0),
    breakOver: Number(row.break_over_min || 0),
    breakOpen: !!row.break_open,
    isOff:   !!row.is_off_day,        // 🏖️ يوم إجازة نزل فيه
    state:   row.state,
    waived:  !!row.waived,
    waiveReason: row.waive_reason || '',
    beforeStart: !!row.before_start
  };
}

// ============================================================
// الأوفر تايم
// ------------------------------------------------------------
// بيبدأ بعد ما الموظف يخلّص عدد ساعاته ويفضل في الفرع.
//
// ⚠️ تفصيلة مهمة: الساعات بتتحسب من **الوقت المحتسب** مش من
//    وقت الحضور الفعلي. يعني اللي جه ١٠:٢٠ وسماحه لـ ١٠:٣٠،
//    الـ ٢٠ دقيقة دي بتتحسبله شغل — لأننا اتفقنا إنه "كأنه جه
//    الساعة ١٠". من غير السطر ده كان هيخسر الوقت ده من ساعاته
//    وممكن يطلع ناقص وهو ملوش ذنب.
//
//    والبريك مش داخل في الحساب أصلاً (dayMinutes بتقفل العدّاد
//    عنده)، فالأوفر تايم شغل حقيقي مش قعدة.
// ============================================================
// 🔴 زي applyRules — **مبقتش بتحسب**، بقت بتقرا من السيرفر.
// ------------------------------------------------------------
// الأوفر تايم بقى بيتحوّل لفلوس في كشف الراتب. فلو الحساب اتكتب
// هنا وكمان في السيرفر، أول تعديل على واحد فيهم من غير التاني
// معناه إن HR شايفة «٣ ساعات زيادة» والكشف بيحسب ساعتين — وده
// فرق فلوس مباشر.
//
// ⚠️ النقص بيرجع صفر لليوم اللي لسه ما اتقفلش بانصراف. من غير
//    الشرط ده، اليوم اللي الموظف شغال فيه دلوقتي كان هيبان عليه
//    عجز يوم كامل — وكل واحد يفتح الشاشة الصبح يلاقي «عجز ٨
//    ساعات» وهو لسه بادئ.
// الساعات المعروضة لأي يوم — من السيرفر لو موجود، وإلا الخام
function effMin(email, punches, d){
  const o = email ? dayOvertime(email, punches, d) : null;
  return (o && o.has) ? o.eff : dayMinutes(punches).minutes;
}

function dayOvertime(email, punches, workDate){
  const byDay = OVER[(email || '').toLowerCase()];
  const row = byDay && workDate ? byDay[workDate] : null;

  // السيرفر مبيرجّعش اليوم ده (مفيش ميعاد محدد، أو مفيش «حضور»)
  // → نوري ساعاته الخام من غير ما نخترع زيادة ولا نقص
  if(!row){
    const raw = dayMinutes(punches);
    return { worked: raw.minutes, eff: raw.minutes, over: 0, short: 0, need: 0, has: false };
  }

  // 🔴 «الساعات المحسوبة» = الشغل الفعلي ناقص البريك اللي ضحّى بيه،
  //    بس **في حدود الزيادة بس**. يعني:
  //      • قعد ١٠:٣١ ومطلوب ٨:٣٠ وضحّى بساعتين → يتحسبله ٨:٣١
  //        (بدل ما يبان ١٠:٣١ وكأن عنده ساعتين أوفر تايم)
  //      • قعد ٤ ساعات ومطلوب ٩ → يفضل ٤، والنقص ٥ ساعات
  //        ⚠️ البريك المتساب **مبيغطّيش النقص** — اللي بيمشي بدري
  //           مكانش ينفع ياخد ساعتين مجاناً كل يوم.
  //    والنتيجة إن الرقم المعروض دايماً = المطلوب ± الزيادة/النقص،
  //    فمفيش رقمين متناقضين قدام عين الموظف.
  const _w = Number(row.worked_min || 0);
  const _n = Number(row.need_min   || 0);
  const _u = Number(row.break_unused_min || 0);
  const _eff = _w - Math.min(_u, Math.max(0, _w - _n));

  return {
    worked: _w,
    eff:    _eff,
    over:   Number(row.over_min   || 0),
    short:  Number(row.short_min  || 0),
    need:   Number(row.need_min   || 0),
    closed: !!row.closed,
    // ⏱️ تعديل HR اليدوي على اليوم (موجب = اتشال من الساعات)
    adj:    Number(row.adjust_min || 0),
    brk:       Number(row.break_min || 0),          // البريك اللي أخده
    brkUnused: Number(row.break_unused_min || 0),   // وضحّى بكام منه
    isOff:     !!row.is_off_day,
    offMode:   row.off_mode || null,       // 🆕 (71) 'day' أو 'overtime'
    adjWhy: row.adjust_reason || '',
    raw:    Number(row.raw_min != null ? row.raw_min : (row.worked_min || 0)),
    has:    true
  };
}

// صفوف الكشف — مصدر واحد للاتنين، عشان الملفين ما يختلفوش
function empRows(email){
  const days = {};
  ROWS.filter(r => (r.user_email||'').toLowerCase() === email)
      .forEach(r => { (days[r.work_date] = days[r.work_date] || []).push(r); });

  const out = [];
  let tW=0, tO=0, tS=0, tP=0, flags=0;
  Object.keys(days).sort().forEach(d => {
    const p = days[d];
    const st = dayMinutes(p);
    const r  = applyRules(email, p, d);
    const o  = dayOvertime(email, p, d);
    const firstIn = p.find(x => x.kind === 'in');
    const lastOut = [...p].reverse().find(x => x.kind === 'out');
    if(st.missingOut) flags++;
    const counted = !st.missingOut && o.has;
    if(counted){ tW += o.eff; tO += o.over; tS += o.short; }
    if(r) tP += r.penalty;
    out.push({
      date: d,
      day:  new Date(d).toLocaleDateString('ar-EG', { weekday:'long' }),
      in:   firstIn ? fmtTime(firstIn.at) : '—',
      out:  lastOut ? fmtTime(lastOut.at) : '—',
      counted: r ? fmtMinTime(r.counted) : '—',
      due:  r ? fmtMinTime(r.leaveAt) : '—',
      worked: fmtHm(o.has ? o.eff : st.minutes),
      over:  counted && o.over  ? fmtHm(o.over)  : '',
      short: counted && o.short ? fmtHm(o.short) : '',
      pen:   r && r.penalty ? r.penalty : '',
      state: r ? STATE_LBL[r.state].t : '—',
      flag:  st.missingOut ? 'ناقص انصراف' : ''
    });
  });
  return { rows: out, tW, tO, tS, tP, flags, days: Object.keys(days).length };
}
