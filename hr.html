// ------------------------------------------------------------
// 🔍 البحث — نفس منطق الداشبورد بالظبط
// ------------------------------------------------------------
// كلمة واحدة كفاية. ولو أكتر من كلمة، كل كلمة لازم تتلاقي في أي خانة.
// IFixSearch = نفس بحث الصفحة الرئيسية (بيفهم «بلال» و«belal»).
// ⚠️ مش بنستخدم الفهرس المشترك بتاعه — ده متبني على حقول البحث الرئيسي.
// ⚠️ لو غيّرت المنطق هنا غيّره في dashboard.html كمان — نفس الشاشة.

// ------------------------------------------------------------
// 🔩 القطع المربوطة من المخزن — نسخة ٢
// ------------------------------------------------------------
// فرق مهم: `partsComment` هو اللي **الفني كتبه بإيده**، والقطع دي
// هي اللي **اتربطت فعلاً من المخزن** (جدول spare_parts) وليها تكلفة.
//
// 🐞 الباج اللي اتصلّح: «القطعة مربوطة وباينة من جوه، ومن برا
//    مكتوب مفيش قطع مربوطة».
//    🧠 بالبلدي: الصفحة كانت بتصوّر قطع كل جهاز **مرة واحدة** وتحط
//    الصورة في درج، ومبتفتحش الدرج تاني أبداً طول ما الصفحة مفتوحة.
//    فلو القطعة اتربطت بعد الصورة (من جوه الجهاز، أو من المخزن، أو
//    حد تاني من موبايله) — الكارت يفضل يوري الصورة القديمة «مفيش».
//    وجوه الجهاز كان صح لأنه بيسأل السيرفر من جديد كل مرة.
//    وكمان لو النت فصل لحظة، الصفحة كانت بتكتب «مفيش قطع» بدل
//    «مقدرناش نجيب» — كدبة صغيرة شكلها سليم.
//
// ✅ دلوقتي:
//    • كل جهاز ليه وقت اتجابت فيه قطعه، وبعد دقيقة بيتجاب تاني.
//    • فتح الشاشة، والرجوع من الجهاز، وربط/فك قطعة → بيمسحوا
//      الصورة القديمة فوراً.
//    • الفشل بيتقال «فشل» وبيتعاد لوحده بعد ١٥ ثانية.
//    • النتيجة بتـ«تستبدل» اللي قبلها مش بتـ«تتزوّد» عليه — قبل كده
//      طلبين في نفس اللحظة كانوا بيكرروا القطع (٢ بدل ١).
// ------------------------------------------------------------
var PR_LINK = {};          // رقم الجهاز → [قطع] (آخر نسخة من السيرفر)
var PR_LINK_AT = {};       // رقم الجهاز → إمتى اتجابت
var PR_LINK_ERR = {};      // رقم الجهاز → 1 لو آخر محاولة فشلت
var PR_LINK_BUSY = {};     // رقم الجهاز → 1 وهي بتتجاب دلوقتي
var PR_LINK_TTL = 60000;   // دقيقة وبعدها نسأل تاني
var PR_LINK_RETRY = 15000; // لو فشلت: نحاول تاني بعد ١٥ ثانية

// ننسى صورة جهاز واحد (أو كله لو من غير رقم) — عشان تتجاب طازة
function prLinkForget(id){
  if(id){ delete PR_LINK_AT[id]; return; }
  PR_LINK = {}; PR_LINK_AT = {}; PR_LINK_ERR = {};
}

async function prLoadLinked(ids){
  const now = Date.now();
  const need = [...new Set(ids || [])].filter(id => id && !PR_LINK_BUSY[id]
    && (!PR_LINK_AT[id] || now - PR_LINK_AT[id] > PR_LINK_TTL));
  if(!need.length) return false;
  need.forEach(id => { PR_LINK_BUSY[id] = 1; });
  const CH = 60;   // على دفعات — الرابط بيتبعت في العنوان وليه حد أقصى
  try{
    for(let i = 0; i < need.length; i += CH){
      const chunk = need.slice(i, i + CH);
      const { data, error } = await sb.from('spare_parts')
        .select('device_id,name,total_cost').in('device_id', chunk);
      // ⚠️ Supabase مبيرميش خطأ — بيرجّعه في .error
      if(error) throw error;
      const fresh = {};
      chunk.forEach(id => { fresh[id] = []; });
      (data || []).forEach(p => { if(fresh[p.device_id]) fresh[p.device_id].push(p); });
      const at = Date.now();
      chunk.forEach(id => {
        PR_LINK[id] = fresh[id];          // استبدال، مش إضافة
        PR_LINK_AT[id] = at;
        delete PR_LINK_ERR[id];
        delete PR_LINK_BUSY[id];
      });
      // فولدر «مش مربوط بيها قطع» (عند المحاسب بس) — نحدّثه بنفس الحقيقة
      if(typeof PR_HAS !== 'undefined' && PR_HAS && PR_HAS.set){
        chunk.forEach(id => { fresh[id].length ? PR_HAS.set.add(id) : PR_HAS.set.delete(id); });
      }
    }
  }catch(e){
    console.error('prLoadLinked failed:', e);
    // مش بنقول «مفيش قطع» — بنقول «فشل»، ونحاول تاني بعد شوية
    const retryAt = Date.now() - PR_LINK_TTL + PR_LINK_RETRY;
    need.forEach(id => { if(PR_LINK_BUSY[id]){ PR_LINK_ERR[id] = 1; PR_LINK_AT[id] = retryAt; } });
  }finally{
    need.forEach(id => { delete PR_LINK_BUSY[id]; });
  }
  return true;   // اتغيّر حاجة (نتيجة أو فشل) → الكارت يترسم تاني مرة واحدة
}

// سطر القطع المربوطة جوه كارت الجهاز
function prLinkHtml(id){
  const list = PR_LINK[id];
  if(!list){
    return PR_LINK_ERR[id]
      ? `<div class="pr-link none">⚠️ مقدرناش نجيب القطع المربوطة — هنحاول تاني لوحدنا</div>`
      : `<div class="pr-link wait">⏳ بنجيب القطع المربوطة…</div>`;
  }
  if(!list.length) return `<div class="pr-link none">🧰 مفيش قطع مربوطة من المخزن</div>`;
  const tot = list.reduce((a, p) => a + Number(p.total_cost || 0), 0);
  return `<div class="pr-link">🧰 <b>مربوط من المخزن (${list.length}):</b> ` +
    list.map(p => esc(p.name)).join('، ') +
    ` <span class="pr-link-t">${tot.toLocaleString()} ج.م</span></div>`;
}

// ------------------------------------------------------------
// 🗓️ رحلة الجهاز على الكارت — دخل إمتى، اتنقل لأنهي خانة إمتى،
//    اتسلّم إمتى، وآخر تعديل.
// ------------------------------------------------------------
// 🧠 المصدر: statusHistory — الكشكول اللي النظام بيكتب فيه سطر مع
//    كل تغيير حالة. بناخد منه **النقلات بس**: السطر اللي حالته زي
//    اللي قبله (زي «اتحصّل» أو «المالك سعّر») مش نقلة لخانة تانية،
//    فمبنكرّروش.
// ⚠️ كل التواريخ بتوقيت القاهرة — مش توقيت الموبايل اللي بيتفرّج.
// ------------------------------------------------------------
var PR_TL_ICON = { waiting:'⏳', diagnosing:'🔍', repairing:'🔧', done:'✅',
                   delivered:'📦', rejected:'🚫', returned:'↩️', trashed:'🗑' };

function prTlDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  try{
    return d.toLocaleString('ar-EG', { day:'numeric', month:'short',
      hour:'numeric', minute:'2-digit', timeZone:'Africa/Cairo' });
  }catch(e){ return d.toLocaleString(); }
}

function prTimelineHtml(raw){
  raw = raw || {};
  const steps = [];
  if(raw.intakeDate) steps.push({ ic:'📥', t:'دخل المحل', at:raw.intakeDate, by:raw.registeredBy });
  let prev = 'waiting';   // كل جهاز بيبدأ «قيد الانتظار» — فمش بنكرّرها بعد الدخول
  (Array.isArray(raw.statusHistory) ? raw.statusHistory : []).forEach(h => {
    if(!h || !h.status || !h.date || h.status === prev) return;
    prev = h.status;
    steps.push({ ic: PR_TL_ICON[h.status] || '•', t: prStName(h.status), at: h.date, by: h.by });
  });
  // آخر تعديل — بس لو بعد آخر نقلة بأكتر من دقيقة (وإلا هو نفسه)
  const lastAt = steps.length ? steps[steps.length - 1].at : '';
  if(raw.lastModifiedAt && (!lastAt || new Date(raw.lastModifiedAt) - new Date(lastAt) > 60000)){
    steps.push({ ic:'✏️', t:'آخر تعديل', at:raw.lastModifiedAt, by:raw.lastModifiedBy, soft:true });
  }
  if(!steps.length) return '';
  return `<div class="pr-tl">${steps.map(s =>
    `<div class="pr-tl-r${s.soft ? ' soft' : ''}"${s.by ? ` title="${esc(s.by)}"` : ''}>
       <span>${s.ic} ${esc(s.t)}</span><b>${esc(prTlDate(s.at))}</b></div>`).join('')}</div>`;
}

// اسم الحالة بالعربي للرحلة
function prStName(k){ return (ST[k] && ST[k].label) || k; }

function prCm(d){ return ((d._raw && d._raw.partsComment) || '').trim(); }
function prFields(d){
  return [d.model, d.type, d.customer, d.shop, d.issue, prCm(d), d.tech];
}
function prMatch(d, q){
  const words = String(q || '').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return true;
  const f = prFields(d);
  return words.every(w => window.IFixSearch
    ? IFixSearch.match(w, f)
    : f.some(v => v && String(v).toLowerCase().includes(w.toLowerCase())));
}

// كارت الجهاز — كل المعلومات ظاهرة من برا من غير ما تفتحه
function prDevHtml(d, showTech){
  const cm   = prCm(d);
  const shop = (d.shop || '').trim();
  const meta = [];
  if(shop) meta.push(`🏪 <b>${esc(shop)}</b>`);
  if(showTech && d.tech) meta.push(`🔧 <b>${esc(d.tech)}</b>`);
  return `
        <div class="pr-dev" onclick="prOpenDevice('${d.id}')">
          <div class="pr-dev-t"><span>${esc([d.type, d.model].filter(Boolean).join(' ') || 'جهاز')} · ${esc(d.customer||'')}</span>
            <span class="pr-dev-s">${(ST[d.status]&&ST[d.status].label)||''}</span></div>
          ${meta.length ? `<div class="pr-dev-m">${meta.join('<span>·</span>')}</div>` : ''}
          <div class="pr-dev-i">⚠️ ${esc(d.issue||'—')}</div>
          ${cm ? `<div class="pr-cm">🔩 ${esc(cm)}</div>`
               : `<div class="pr-cm none">— الفني ما كتبش قطع غيار</div>`}
          ${prLinkHtml(d.id)}
          ${prTimelineHtml(d._raw)}
        </div>`;
}

// ============================================================
// 📁 الفولدرين (نفس اللي عند المحاسب في الداشبورد)
// ------------------------------------------------------------
//   📭 مش مربوط بيها قطع غيار = الفني اشتغل عليه، ومفيش ولا قطعة
//       من المخزن مربوطة بيه، ومحدش قال إنه مش محتاج.
//   ✅ مش محتاجة قطع غيار      = الفني قال «مفيش» أو المحاسب علّمه.
// ⚠️ هنا للعرض بس — زرار «مش محتاج قطعة» من عند المحاسب.
// ⚠️ الصفحة دي شايفة أجهزة المحل + المسلَّم آخر ٦ شهور بس، فالرقم
//    ممكن يطلع أقل من المحاسب في المدد الطويلة.
// «مين مربوط بيه قطع؟» = طلب واحد بعمود device_id بس من المخزن،
// بدل طلب لكل جهاز.
// ============================================================
var PR_FLOOR = '2026-09-01';   // أول يوم النظام اشتغل فيه (زي الداشبورد)
var PR_HAS = { set: null, loading: false };

async function prLoadHasParts(){
  if(PR_HAS.loading || PR_HAS.set) return false;
  PR_HAS.loading = true;
  try{
    const ids = new Set();
    const PAGE = 1000;
    for(let from = 0, guard = 0; guard < 50; guard++, from += PAGE){
      const { data, error } = await sb.from('spare_parts')
        .select('device_id').not('device_id', 'is', null)
        .range(from, from + PAGE - 1);
      if(error) throw error;
      if(!data || !data.length) break;
      data.forEach(r => { if(r.device_id) ids.add(r.device_id); });
      if(data.length < PAGE) break;
    }
    PR_HAS.set = ids;
    return true;
  }catch(e){
    console.error('[المراجعة] فشل جلب الأجهزة المربوطة:', e);
    PR_HAS.set = PR_HAS.set || new Set();
    return false;
  }finally{
    PR_HAS.loading = false;
  }
}

function prNoNeed(d){
  const r = d._raw || {};
  if(r.noPartsNeeded === true) return true;
  return dpPartsIsNone(r.partsComment);
}

// آخر تعديل بس — من غير الرجوع لتاريخ الدخول (زي الداشبورد).
// جهاز محدش لمسه من ساعة ما دخل مالوش مكان في الفولدرات.
function prTouchedEdit(d){
  const r = d._raw || {};
  let best = '';
  for(const v of [r.lastModifiedAt, r.partsReturnAt]){
    if(v && (!best || new Date(v) > new Date(best))) best = v;
  }
  return best;
}

function prFolderBase(){
  return devices
    .filter(d => d.status !== 'rejected')
    .filter(d => (d.tech || '').trim())
    .filter(d => {
      const k = prDayKey(prTouchedEdit(d));
      if(!k || k < PR_FLOOR) return false;
      return (!PR.from || k >= PR.from) && (!PR.to || k <= PR.to);
    });
}

function prFolderLists(){
  const base = prFolderBase();
  const noNeed  = base.filter(prNoNeed);
  const noParts = PR_HAS.set
    ? base.filter(d => !prNoNeed(d) && !PR_HAS.set.has(d.id))
    : null;                       // null = لسه بنحسب
  return { noNeed, noParts };
}

function prFolderCardsHtml(){
  const { noNeed, noParts } = prFolderLists();
  return `<div class="pr-folders">
    <button class="pr-folder warn" onclick="PR.folder='noparts';PR.tech=null;prRender()">
      <div class="pr-folder-n">📭 مش مربوط بيها قطع غيار</div>
      <div class="pr-folder-s">${noParts ? `<b>${noParts.length}</b> جهاز` : '⏳ بنحسب…'}</div>
    </button>
    <button class="pr-folder ok" onclick="PR.folder='noneed';PR.tech=null;prRender()">
      <div class="pr-folder-n">✅ مش محتاجة قطع غيار</div>
      <div class="pr-folder-s"><b>${noNeed.length}</b> جهاز</div>
    </button>
  </div>`;
}

// كارت الجهاز جوه الفولدر = الكارت العادي + سطر صغير «مين قال»
function prFolderDevHtml(d, mode){
  const r = d._raw || {};
  let note;
  if(mode === 'noparts')                         note = '📭 مفيش قطع مربوطة — المحاسب بيراجعه';
  else if(dpPartsIsNone(r.partsComment))         note = '🔧 الفني هو اللي قال إنه مش محتاج قطع غيار';
  else note = '✅ اتعلّم إنه مش محتاج قطع غيار' + (r.noPartsBy ? ' — ' + esc(r.noPartsBy) : '');
  return prDevHtml(d, true).replace(/<\/div>\s*$/, `<div class="pr-fact"><span class="pr-fnote">${note}</span></div></div>`);
}

function prRenderFolder(){
  const host = $('prList');
  if(!host) return;
  const mode = PR.folder;
  const { noNeed, noParts } = prFolderLists();
  let list = mode === 'noparts' ? (noParts || []) : noNeed;
  const q = (PR.q || '').trim();
  list = list.filter(d => ifxMatch('prQ', d, q, prMatch));
  list = list.slice().sort((a, b) =>
    new Date(prTouchedEdit(b) || 0) - new Date(prTouchedEdit(a) || 0));
  const title = mode === 'noparts' ? '📭 مش مربوط بيها قطع غيار' : '✅ مش محتاجة قطع غيار';
  const loading = mode === 'noparts' && !noParts;
  host.innerHTML = `
    <button class="pr-back" onclick="PR.folder=null;prRender()">‹ رجوع للمراجعة</button>
    <div class="pr-th">${title} <span class="pr-n">${loading ? '…' : list.length}</span></div>
    ${loading
      ? `<div class="pr-empty">⏳ بنراجع المخزن…</div>`
      : (list.length
          ? list.map(d => prFolderDevHtml(d, mode)).join('')
          : `<div class="pr-empty">${q ? 'مفيش نتايج لـ «' + esc(q) + '» في الفولدر ده' : 'الفولدر فاضي في الفترة دي'}</div>`)}`;
}

function prByTouchedDesc(a, b){ return new Date(prTouched(b) || 0) - new Date(prTouched(a) || 0); }

// الرسم على جزئين (نفس الداشبورد):
//   prRender     = الشريط (المدة + مربع البحث) + القايمة
//   prRenderList = القايمة بس
// ⚠️ لو كل حرف بيعيد رسم مربع البحث، الكيبورد بيقفل بعد كل حرف.
function prRender(){
  const host = $('prBody');
  if(!host) return;
  // حد بيكتب في البحث دلوقتي وجه تحديث من بره؟ نحدّث القايمة بس
  const qEl = $('prQ');
  if(qEl && document.activeElement === qEl){ prRenderList(); return; }

  host.innerHTML = `
    <div class="pr-bar">
      <div class="pr-quick">
        <button class="pr-q${PR.quick==='today'?' on':''}" onclick="prSetQuick('today')">النهاردة</button>
        <button class="pr-q${PR.quick==='week'?' on':''}"  onclick="prSetQuick('week')">أسبوع</button>
        <button class="pr-q${PR.quick==='month'?' on':''}" onclick="prSetQuick('month')">شهر</button>
        <button class="pr-q${PR.quick==='half'?' on':''}"  onclick="prSetQuick('half')">٦ شهور</button>
      </div>
      <div class="pr-dates">
        <label>من <input type="date" value="${PR.from}" onchange="PR.from=this.value;PR.quick='';PR.tech=null;prRender()"></label>
        <label>إلى <input type="date" value="${PR.to}" onchange="PR.to=this.value;PR.quick='';PR.tech=null;prRender()"></label>
      </div>
    </div>
    <input id="prQ" class="pr-search" type="search" autocomplete="off" value="${esc(PR.q)}"
      placeholder="🔍 دوّر في الفترة دي: جهاز، عميل، محل، عطل، قطعة، فني…"
      oninput="PR.q=this.value;prRenderList()">
    <div id="prList"></div>`;
  prRenderList();
}

function prRenderList(){
  const host = $('prList');
  if(!host) return;
  const rows = devices.filter(prInRange).filter(d => (d.tech||'').trim());
  // القطع المربوطة بتتجاب بعد الرسم، وأول ما توصل بنعيد الرسم مرة واحدة
  // prRenderList بتخرج لوحدها لو الشاشة اتقفلت (مفيش prList)
  prLoadLinked(rows.map(d => d.id)).then(got => { if(got) prRenderList(); });
  // «مين مربوط بيه أصلاً» — مرة واحدة لكل فتح للشاشة
  if(!PR_HAS.set && !PR_HAS.loading){
    prLoadHasParts().then(got => { if(got) prRenderList(); });
  }
  // فولدر مفتوح → نعرضه لوحده
  if(PR.folder){ prRenderFolder(); return; }

  // (٠) فيه بحث → قايمة واحدة بكل النتايج، من كل الفنيين
  const q = (PR.q || '').trim();
  if(q || ifxOn('prQ')){
    const hits = rows.filter(d => ifxMatch('prQ', d, q, prMatch)).sort(prByTouchedDesc);
    host.innerHTML = hits.length
      ? `<div class="pr-res-h">🔍 ${hits.length} ${hits.length === 1 ? 'نتيجة' : 'نتايج'} في الفترة دي</div>`
        + hits.map(d => prDevHtml(d, true)).join('')
      : `<div class="pr-empty">مفيش نتايج ${q ? 'لـ «' + esc(q) + '»' : 'بالفلتر ده'} في الفترة دي<br><small>جرّب مدة أطول (أسبوع / شهر)</small></div>`;
    return;
  }

  const byTech = {};
  rows.forEach(d => { const k=(d.tech||'').trim(); (byTech[k]=byTech[k]||[]).push(d); });
  const techs = Object.keys(byTech).sort((a,b)=>byTech[b].length-byTech[a].length);

  if(PR.tech){
    const list = (byTech[PR.tech]||[]).slice().sort(prByTouchedDesc);
    host.innerHTML = `
      <button class="pr-back" onclick="PR.tech=null;prRender()">‹ رجوع لكل الفنيين</button>
      <div class="pr-th">🔧 ${esc(PR.tech)} <span class="pr-n">${list.length}</span></div>
      ${list.length ? list.map(d => prDevHtml(d, false)).join('')
                    : `<div class="pr-empty">مفيش أجهزة للفني ده في الفترة دي</div>`}`;
    return;
  }

  host.innerHTML = prFolderCardsHtml() + (techs.length ? `
    <div class="pr-grid">
      ${techs.map(tn => {
        const l = byTech[tn];
        const withCm = l.filter(d => prCm(d)).length;
        return `<button class="pr-tech" onclick="PR.tech='${esc(tn).replace(/'/g,"\\'")}';prRender()">
          <div class="pr-tech-n">🔧 ${esc(tn)}</div>
          <div class="pr-tech-s"><b>${l.length}</b> جهاز · <span class="${withCm?'ok':''}">${withCm} فيهم قطع غيار</span></div>
        </button>`;
      }).join('')}
    </div>` : `<div class="pr-empty">مفيش شغل في الفترة دي</div>`);
}

// فتح شاشة ربط قطع الغيار للجهاز — نفس آلية الربط الموجودة
// (بنظبط DP.openId عن طريق openDeviceIdFn، وبنفتح شاشة الاختيار
//  اللي بتعرض القطع غير الموجهة + خانة بحث)
let sheetId = null;
let prPickingId = null;

async function prOpenDevice(id){
  if(!window.INV || typeof INV.openPickForDevice !== 'function'){
    toast('شاشة قطع الغيار لسه بتحمّل — جرّب تاني بعد ثانية'); return;
  }
  sheetId = id;            // ai-invoice بيقرا الجهاز المفتوح من هنا
  prPickingId = id;
  await prShowDeviceParts(id);
}

// كارت الجهاز: القطع المربوطة حالياً + زرار "اربط قطعة"
async function prShowDeviceParts(id){
  const d = devices.find(x => x.id === id);
  const host = $('prBody');
  if(!host || !d) return;
  host.innerHTML = `
    <button class="pr-back" onclick="prPickingId=null;prRender()">‹ ${PR.q ? 'رجوع لنتايج البحث' : (PR.tech ? 'رجوع لأجهزة الفني' : 'رجوع')}</button>
    <div class="pr-th">📱 ${esc([d.type, d.model].filter(Boolean).join(' ') || 'جهاز')} · ${esc(d.customer||'')}</div>
    ${((d._raw&&d._raw.partsComment)||'').trim()
      ? (dpPartsIsNone(d._raw.partsComment)
          ? `<div class="pr-cm ok0">✅ الفني قال: الجهاز محتاجش قطع غيار</div>`
          : `<div class="pr-cm">🔩 ${esc(d._raw.partsComment)}</div>`) : ''}
    <div id="prLinked" class="pr-empty">بنجيب القطع المربوطة…</div>
    <button class="pr-q on" style="width:100%;margin-top:10px;padding:12px;"
      onclick="prPickParts()">➕ اربط قطعة غيار بالجهاز</button>`;

  try{
    const { data, error } = await sb.from('spare_parts')
      .select('id,name,total_cost').eq('device_id', id);
    if(error) throw error;
    const box = $('prLinked');
    if(!box) return;
    box.className = '';
    box.innerHTML = (data && data.length)
      ? `<div style="font-weight:800;margin:10px 0 6px;">القطع المربوطة (${data.length})</div>` +
        data.map(p => `<div class="pr-dev" style="cursor:default;">
          <div class="pr-dev-t"><span>🔩 ${esc(p.name)}</span>
            <span class="pr-dev-s">${Number(p.total_cost||0).toLocaleString()} ج.م</span></div>
          <button class="pr-back" style="margin:6px 0 0;" onclick="prUnlink('${p.id}')">✕ فك الربط</button>
        </div>`).join('')
      : `<div class="pr-empty">مفيش قطع مربوطة بالجهاز ده لسه</div>`;
  }catch(e){
    const box = $('prLinked');
    if(box){ box.className=''; box.innerHTML = `<div class="pr-empty">تعذّر جلب القطع: ${esc(e.message||e)}</div>`; }
  }
}

function prPickParts(){
  if(window.INV && typeof INV.openPickForDevice === 'function') INV.openPickForDevice();
  else toast('شاشة قطع الغيار لسه بتحمّل');
}

async function prUnlink(partId){
  try{
    const { error } = await sb.from('spare_parts')
      .update({ category:'unallocated', device_id:null, device_label:null }).eq('id', partId);
    if(error) throw error;
    toast('اتفك الربط ✅');
    prLinkForget(prPickingId);   // الكارت من برا يتحدّث هو كمان
    if(prPickingId) prShowDeviceParts(prPickingId);
  }catch(e){ toast('فشل فك الربط: ' + (e.message||e)); }
}

// ai-invoice بينده دي بعد أي ربط عشان الشاشة تتحدّث
window.prOnPartsChanged = function(){
  if(prPickingId) prLinkForget(prPickingId);   // 🐞 الكارت من برا يشوف القطعة الجديدة
  if(prPickingId) prShowDeviceParts(prPickingId);
};

// ============================================================
// صفحة الجرد (ديسباتشر) — قراءة فقط
// ------------------------------------------------------------
// منقولة من dashboard.html بنفس الفكرة (فلتر فترة + كروت أعداد +
// أداء الفنيين + الواقف كتير)، وبنفس أسماء الحقول اللي devices
// هنا بتستخدمها (adapt() في أول الملف: type · shop · issue · intake).
//
// ⚠️ فرقين عن نسخة المحاسب، عن قصد:
//   ١) مفيش عمود سعر ولا كارت "مدفوع/غير مدفوع" — devices_dispatch
//      بتشيل الأسعار قبل ما توصل للمتصفح، فمفيش بيانات فلوس أصلاً
//      نبني عليها الكارت ده.
//   ٢) فلتر الفترة هنا لحد "٦ شهور" بس، من غير "الكل" أو
//      مدى مخصص — لأن loadDevices() بتحمّل الأجهزة المسلَّمة لآخر
//      ٦ شهور بس (HR_DELIVERED_DAYS — مش الأرشيف كله)، فأي فلتر أوسع من
//      شهر هيدّي عدد ناقص من غير ما يبان إنه ناقص.
// ============================================================
const INV_STUCK_DAYS = 3;
let invPeriod = { mode: 'today' };
let invView = null;      // {kind:'card'|'tech', key} أو null للقائمة
let invLists = {};
let invTechLists = {};

// ============================================================
// 🗂️ الأجهزة اللي مش مكتوب عليها فني
// ------------------------------------------------------------
// قبل كده كانت بتختفي من الجرد خالص. دلوقتي بتتلم في كارتين:
//   🗂️ النظام القديم → جهاز مستورد من النظام القديم
//   ❓ من غير فني     → جهاز من النظام الحالي ولسه ملوش فني
//
// نفس منطق شاشة المحاسب بالحرف — عشان العدّ يطلع واحد في
// الشاشتين، مايبقاش كل واحد بيقول رقم.
//
// ⚠️ البادئة ivx مقصودة: الصفحة بتحمّل كذا ملف في نفس المساحة،
//    وأي اسم متكرر بيوقّع السكريبت كله.
// ============================================================
const IVX_LEGACY_BY = 'النظام القديم';   // الاسم المتخزّن في الأجهزة وقت الاستيراد
function ivxLegacyName(){ return 'النظام القديم'; }
function ivxNoTechName(){ return 'من غير فني'; }

// الجهاز ده جاي من النظام القديم؟ أي علامة من التلاتة تكفي.
function ivxIsLegacy(d){
  if(!d) return false;
  if(String(d.id || '').indexOf('old_') === 0) return true;
  if(String(d.by || '').trim() === IVX_LEGACY_BY) return true;
  const h = (d._raw && d._raw.statusHistory) || [];
  if(h.length && String(h[0].by || '').trim() === IVX_LEGACY_BY) return true;
  return false;
}

// اسم الكارت اللي الجهاز ده المفروض يقف فيه
function ivxKey(d){
  const tech = (d.tech || '').trim();
  if(tech) return tech;                 // عليه فني → كارت الفني، مبنلمسوش
  return ivxIsLegacy(d) ? ivxLegacyName() : ivxNoTechName();
}

// الأيقونة اللي قدّام اسم الكارت
function ivxIcon(name){
  if(name === ivxLegacyName()) return '🗂️';
  if(name === ivxNoTechName()) return '❓';
  return '🔧';
}

function setInvPeriod(mode){ invPeriod.mode = mode; renderInventory(); }

function invRange(){
  const now = new Date();
  const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
  if(invPeriod.mode === 'today') return [startOfDay(now), null];
  if(invPeriod.mode === 'week'){ const s = startOfDay(now); s.setDate(s.getDate() - 6); return [s, null]; }
  if(invPeriod.mode === 'month'){ const s = startOfDay(now); s.setDate(s.getDate() - 29); return [s, null]; }
  if(invPeriod.mode === 'half'){ const s = startOfDay(now); s.setDate(s.getDate() - (HR_DELIVERED_DAYS-1)); return [s, null]; }
  return [null, null];
}
function invInRange(iso){
  if(!iso) return false;
  const [f, t] = invRange();
  const d = new Date(iso);
  if(f && d < f) return false;
  if(t && d > t) return false;
  return true;
}

const INV_ACTIVE_STATUSES = ['waiting','diagnosing','repairing','done'];
const INV_OPEN_STATUSES   = ['waiting','diagnosing','repairing','returned'];
const INV_TECH_STATUSES   = ['waiting','diagnosing','repairing','returned'];

// آخر حركة على الجهاز — من statusHistory المحفوظ في _raw
function invLastChange(d){
  const h = (d._raw && d._raw.statusHistory) || [];
  return h.length ? h[h.length - 1].date : d.intake;
}
function invDaysSince(iso){
  if(!iso) return 0;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
// أول تسليم بعد آخر رجوع (زي دالة الداشبورد، بس على statusHistory الخام)
function invDeliveredDate(d){
  const h = (d._raw && d._raw.statusHistory) || [];
  return h.length ? (h.filter(x => x.status === 'delivered').slice(-1)[0] || {}).date || null : null;
}

function invStuckDevices(){
  return devices
    .filter(d => INV_ACTIVE_STATUSES.includes(d.status))
    .map(d => ({ d, days: invDaysSince(invLastChange(d)) }))
    .filter(x => x.days >= INV_STUCK_DAYS)
    .sort((a,b) => b.days - a.days);
}

function invMatchesSearch(d, q){
  const hay = [d.customer, d.shop, d.tech, d.type, d.model, d.phone, d.issue].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function openInventory(){
  const _shield = document.getElementById('kebabShield'); if(_shield) _shield.classList.add('hidden');
  invView = null;
  const _s = document.getElementById('invSearch'); if(_s) _s.value = '';
  ifxReset('invSearch');
  document.getElementById('inventoryOverlay').classList.remove('hidden');
  document.body.classList.add('inv-open');
  renderInventory();
}
function closeInventory(){
  document.getElementById('inventoryOverlay').classList.add('hidden');
  document.body.classList.remove('inv-open');
}

function openInvView(kind, key){
  invView = { kind, key };
  renderInventory();
  const sc = document.getElementById('inventoryOverlay');
  if(sc) sc.scrollTop = 0;
}
function closeInvView(){ invView = null; renderInventory(); }

function invStatusTag(status){
  const s = ST[status] || { label: status, c: '--muted' };
  return `<span class="status-tag" style="background:var(${s.c}-bg);color:var(${s.c})">${esc(s.label)}</span>`;
}

function invViewData(){
  if(!invView) return null;
  if(invView.kind === 'tech') return { title: ivxIcon(invView.key) + ' ' + invView.key, list: invTechLists[invView.key] || [] };
  const labels = { received:'📥 استلمت الفترة دي', progress:'⏳ قيد التنفيذ', delivered:'✅ اتسلّمت', stuck:`⚠️ واقفة ${INV_STUCK_DAYS} أيام فأكتر` };
  return { title: labels[invView.key] || invView.key, list: invLists[invView.key] || [] };
}

function invViewHtml(){
  const data = invViewData();
  if(!data) return '';
  const rows = data.list.length === 0
    ? `<tr><td colspan="5" style="text-align:center;padding:34px;color:var(--muted-2);">مفيش أجهزة هنا</td></tr>`
    : data.list.map(d => `<tr onclick="showInfo('${d.id}')">
        <td class="iv-ref">${esc(ticketNo(d.id))}</td>
        <td><div class="iv-dev">${esc([d.type, d.model].filter(Boolean).join(' ') || '—')}</div></td>
        <td><div style="font-weight:700;">${esc(d.customer) || '—'}</div>${d.shop ? `<div class="iv-sub">${esc(d.shop)}</div>` : ''}</td>
        <td class="iv-issue">${esc(d.issue) || '—'}</td>
        <td>${invStatusTag(d.status)}</td>
      </tr>`).join('');
  return `
    <div class="iv-head">
      <button class="iv-back" onclick="closeInvView()">⬅️ رجوع للقائمة</button>
      <h3 class="iv-title">${esc(data.title)}</h3>
      <span class="iv-count">${data.list.length}</span>
    </div>
    <div class="iv-scroll">
      <table class="iv-table">
        <thead><tr><th>الرقم</th><th>الجهاز</th><th>العميل</th><th>العطل</th><th>الحالة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderInventory(){
  const chip = (mode, label) => `<button class="inv-chip ${invPeriod.mode===mode?'active':''}" onclick="setInvPeriod('${mode}')">${label}</button>`;
  const filterBar = `<div class="inv-filter">${chip('today','اليوم')}${chip('week','الأسبوع')}${chip('month','الشهر')}${chip('half','٦ شهور')}</div>`;

  const received  = devices.filter(d => invInRange(d.intake));
  const delivered = devices.filter(d => { const dd = invDeliveredDate(d); return dd && invInRange(dd); });
  const inProgress = devices.filter(d => INV_OPEN_STATUSES.includes(d.status));
  const stuck = invStuckDevices();
  invLists = { received, delivered, progress: inProgress, stuck: stuck.map(x => x.d) };

  const card = (key, num, color, label) => `
    <div class="inv-card" onclick="openInvView('card','${key}')">
      <div class="inv-card-num" style="color:${color};">${num}</div>
      <div class="inv-card-label">${label}</div>
      <div class="inv-card-more">عرض الأجهزة ←</div>
    </div>`;
  const cards = `<div class="inv-cards">
      ${card('received', received.length, 'var(--info)', '📥 استلمت الفترة دي')}
      ${card('progress', inProgress.length, 'var(--warn)', '⏳ قيد التنفيذ')}
      ${card('delivered', delivered.length, 'var(--success)', '✅ اتسلّمت الفترة دي')}
      ${card('stuck', stuck.length, 'var(--danger)', `⚠️ واقفة ${INV_STUCK_DAYS} أيام+`)}
    </div>`;

  // ===== بحث =====
  const q = (document.getElementById('invSearch')?.value || '').trim();
  let searchHtml = '';
  if(q || ifxOn('invSearch')){
    const found = devices.filter(d => ifxMatch('invSearch', d, q, invMatchesSearch));
    searchHtml = `
      <div class="inv-section-title">🔍 نتائج البحث "${esc(q)}" — ${found.length}</div>
      <div class="iv-scroll" style="margin-bottom:20px;">
        <table class="iv-table">
          <thead><tr><th>الرقم</th><th>الجهاز</th><th>العميل</th><th>العطل</th><th>الحالة</th></tr></thead>
          <tbody>${found.length === 0
            ? `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted-2);">مفيش نتايج</td></tr>`
            : found.map(d => `<tr onclick="showInfo('${d.id}')">
                <td class="iv-ref">${esc(ticketNo(d.id))}</td>
                <td><div class="iv-dev">${esc([d.type, d.model].filter(Boolean).join(' ') || '—')}</div></td>
                <td><div style="font-weight:700;">${esc(d.customer) || '—'}</div>${d.shop ? `<div class="iv-sub">${esc(d.shop)}</div>` : ''}</td>
                <td class="iv-issue">${esc(d.issue) || '—'}</td>
                <td>${invStatusTag(d.status)}</td>
              </tr>`).join('')}</tbody>
        </table>
      </div>`;
  }

  // ===== أداء الفنيين: الأجهزة اللي معاهم ولسه ما اتسلمتش =====
  const withTech = {};
  devices.forEach(d => {
    if(!INV_TECH_STATUSES.includes(d.status)) return;
    // ⚠️ مفيش return للجهاز اللي من غير فني. ivxKey بترجّع اسم كارت
    //    مناسب ليه (النظام القديم / من غير فني) بدل ما يختفي.
    const key = ivxKey(d);
    (withTech[key] = withTech[key] || []).push(d);
  });
  invTechLists = withTech;
  // الفنيين الأول (الأكتر أجهزة فوق)، والكارتين الخاصين آخر القايمة دايماً
  const _ivxExtra = [ivxLegacyName(), ivxNoTechName()];
  const techNames = Object.keys(withTech).sort((a,b) => {
    const ea = _ivxExtra.indexOf(a) !== -1, eb = _ivxExtra.indexOf(b) !== -1;
    if(ea !== eb) return ea ? 1 : -1;
    return withTech[b].length - withTech[a].length;
  });
  const techCards = techNames.length === 0
    ? `<div class="empty-col">مفيش أجهزة موزّعة على فنيين دلوقتي</div>`
    : `<div class="inv-cards">${techNames.map(tn => {
        const late = withTech[tn].filter(d => invDaysSince(invLastChange(d)) >= INV_STUCK_DAYS).length;
        const safe = esc(tn).replace(/'/g, "\\'");
        return `<div class="inv-card" onclick="openInvView('tech','${safe}')">
          <div class="inv-card-num" style="color:var(--repairing);">${withTech[tn].length}</div>
          <div class="inv-card-label">${ivxIcon(tn)} ${esc(tn)}</div>
          ${late ? `<div style="font-size:11px;color:var(--danger);font-weight:800;margin-top:4px;">${late} متأخرة</div>` : ''}
          <div class="inv-card-more">عرض الأجهزة ←</div>
        </div>`;
      }).join('')}</div>`;

  document.getElementById('inventoryBody').innerHTML = invView
    ? `${filterBar}${invViewHtml()}`
    : `${filterBar}${searchHtml}${cards}
       <div class="inv-section-title">🔧 حسب الفني</div>
       ${techCards}`;
}


/* ============================================================
   🔐 مين يشوف أنهي خانة — السيرفر هو اللي بيقرر (has_cap)
   ------------------------------------------------------------
   الافتراضي **مقفول**: لو السؤال فشل، الزراير بتفضل مخفية.
   ⚠️ بنستنى الجلسة الأول — من غيرها has_cap بيتسأل من غير
      توكن وبيرجّع false، والزراير تفضل مخفية وهي مفتوحة.
   ============================================================ */
async function applyHrCaps(){
  const ask = cap => sb.rpc('has_cap', { p_cap: cap })
                       .then(r => !!(r && r.data === true))
                       .catch(() => false);
  let pur = false, rev = false, inv = false;
  try{
    [pur, rev, inv] = await Promise.all([ask('purchases'), ask('parts_review'), ask('inventory_view')]);
  }catch(e){ console.warn('الصلاحيات:', e); return; }
  CAN_PURCHASES = pur; CAN_PARTS_REVIEW = rev; CAN_INVENTORY = inv;
  const show = sel => document.querySelectorAll(sel).forEach(b => { b.style.display = ''; });
  if(pur) show('.hr-cap-pur');
  if(rev) show('.hr-cap-rev');
  if(inv) show('.hr-cap-inv');
  // مراجعة القطع بتربط قطع بالأجهزة → محتاجة موديول المشتريات هي كمان
  if(pur || rev) loadPurchasesModule();
}
sb.auth.getSession().then(() => applyHrCaps()).catch(() => {});

</script>
