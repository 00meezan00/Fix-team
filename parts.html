<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الصفحات (ifix-theme). من غير ده فيه ومضة بيضا. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', d ? '#0F1823' : '#16233A');
  }catch(e){}
})();
</script>

<style>
  /* ============================================================
     🛵🔩 مسؤول قطع الغيار — نفس ألوان باقي النظام بالحرف
     ============================================================ */
  :root{
    --chrome:#16233A; --on-chrome:#FFFFFF;
    --paper:#EBEEF2; --card:#FFFFFF; --line:#E4E9EF; --soft:#F2F5F8;
    --ink:#17222E; --ink-2:#475569; --muted:#6B7A8C; --faint:#94A3B4;
    --red:#DC2626; --red-bg:#FEF2F2;
    --done:#15803D; --done-bg:#EAF6EE;
    --wait:#B5651D; --wait-bg:#FBF2E9;
    --blue:#2B6CB0; --blue-bg:#EAF1F8;
    --violet:#6E56CF; --violet-bg:#F1EEFB;
    --accent:#0891A8;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --chrome:#0F1823; --on-chrome:#F2F5F8;
    --paper:#0E1620; --card:#16202C; --line:#233040; --soft:#1D2937;
    --ink:#E9EEF4; --ink-2:#B7C3D0; --muted:#8A99A9; --faint:#67788A;
    --red:#F87171; --red-bg:rgba(248,113,113,.14);
    --done:#4ADE80; --done-bg:rgba(74,222,128,.13);
    --wait:#F0A552; --wait-bg:rgba(240,165,82,.14);
    --blue:#7FB2E5; --blue-bg:rgba(127,178,229,.14);
    --violet:#A78BFA; --violet-bg:rgba(167,139,250,.15);
    --accent:#2AB5CE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Tajawal',system-ui,sans-serif; min-height:100dvh;}
  button{font-family:inherit; cursor:pointer;}

  /* ===== الهيدر ===== */
  .topbar{background:var(--chrome); color:var(--on-chrome); position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;}
  .tb-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .topbar h1{font-family:'Cairo',sans-serif; font-size:17px; margin:0; font-weight:900;}
  .who{font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; opacity:.85; margin-top:1px;}
  .kebab-wrap{position:relative; flex:none;}
  .kebab-btn{position:relative; width:40px; height:40px; border:none; border-radius:11px;
    background:rgba(255,255,255,.12); color:var(--on-chrome); font-size:20px; line-height:1;}
  .kebab-menu{position:absolute; top:48px; inset-inline-end:0; min-width:200px; background:var(--card);
    border:1px solid var(--line); border-radius:13px; box-shadow:0 12px 30px rgba(16,16,20,.22); overflow:hidden; z-index:30;}
  .kebab-menu.hidden{display:none;}
  .kebab-menu button{display:block; width:100%; text-align:start; border:none; background:none; color:var(--ink);
    padding:13px 16px; font-size:14.5px; font-weight:700;}
  .kebab-menu button + button{border-top:1px solid var(--line);}
  .kebab-menu button.danger{color:var(--red);}
  .kebab-shield{position:fixed; inset:0; z-index:25;}
  .kebab-shield.hidden{display:none;}

  /* ===== التابات ===== */
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none; border:none; border-radius:999px; padding:8px 13px; font-weight:800; font-size:13px;
    background:rgba(255,255,255,.10); color:var(--on-chrome); white-space:nowrap; position:relative;}
  .tab.on{background:var(--on-chrome); color:var(--chrome);}
  .tab .n{display:inline-block; min-width:18px; margin-inline-start:4px; border-radius:9px; padding:0 5px;
    background:var(--red); color:#fff; font-size:11px; line-height:18px; text-align:center;}
  .tab .n.soft{background:rgba(255,255,255,.25);}
  .tab.on .n.soft{background:var(--soft); color:var(--ink);}

  .wrap{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 90px); max-width:760px; margin:0 auto;}
  .sec-h{display:flex; align-items:center; gap:8px; margin:16px 2px 9px; font-family:'Cairo',sans-serif;
    font-weight:900; font-size:14.5px;}
  .sec-h:first-child{margin-top:2px;}
  .sec-h .c{font-family:system-ui; font-size:12px; font-weight:800; color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:1px 9px;}
  .sec-h .rule{flex:1; height:1px; background:var(--line);}
  .hint{font-size:12.5px; color:var(--muted); line-height:1.8; margin:-2px 2px 10px;}
  .empty{background:var(--card); border:1px dashed var(--line); border-radius:13px; padding:26px 14px;
    text-align:center; color:var(--muted); font-size:13.5px; line-height:1.9;}
  .err{background:var(--red-bg); color:var(--red); border-radius:12px; padding:12px 14px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:12px; word-break:break-word;}

  /* ===== الكروت ===== */
  .card{background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--edge,var(--line));
    border-radius:13px; padding:12px 13px; margin-bottom:9px;}
  .card.new{--edge:var(--red);}
  .card.going{--edge:var(--blue);}
  .card.bought{--edge:var(--done);}
  .card.closed{--edge:var(--faint); opacity:.85;}
  .c-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .c-t{font-family:'Cairo',sans-serif; font-weight:900; font-size:15.5px; line-height:1.45;}
  .c-s{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.7;}
  .c-s b{color:var(--ink-2);}
  .pill{flex:none; font-size:11.5px; font-weight:800; border-radius:20px; padding:3px 9px; white-space:nowrap;
    background:var(--soft); color:var(--ink-2);}
  .pill.red{background:var(--red-bg); color:var(--red);}
  .pill.blue{background:var(--blue-bg); color:var(--blue);}
  .pill.green{background:var(--done-bg); color:var(--done);}
  .pill.wait{background:var(--wait-bg); color:var(--wait);}
  .pill.violet{background:var(--violet-bg); color:var(--violet);}
  /* 📑 (ملف 104) رقم المستند — PI / SP / PR */
  .pill.doc{font-family:monospace; direction:ltr; background:var(--soft); color:var(--ink); border:1px solid var(--line);}
  .box{margin-top:8px; background:var(--soft); border-radius:9px; padding:8px 10px; font-size:13px; line-height:1.7;
    color:var(--ink-2); word-break:break-word;}
  .acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
  .btn{flex:1 1 auto; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:10px;
    padding:10px 10px; font-size:13px; font-weight:800; white-space:nowrap;}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.go{background:var(--blue); border-color:var(--blue); color:#fff;}
  .btn.ok{background:var(--done); border-color:var(--done); color:#fff;}
  .btn.bad{color:var(--red); border-color:var(--red);}
  .btn.ghost{background:none;}
  .btn.sm{flex:0 0 auto; padding:7px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:default;}
  [data-theme="dark"] .btn.pri,[data-theme="dark"] .btn.go,[data-theme="dark"] .btn.ok{color:#0E1620;}
  .money{font-family:'Cairo',sans-serif; font-weight:900; white-space:nowrap;}
  .money.neg{color:var(--done);}
  .unk{color:var(--wait); font-weight:900;}

  /* ===== صف القطعة ===== */
  .row{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line);}
  .row:first-of-type{border-top:none;}
  .row .m{flex:1; min-width:0;}
  .row .t{font-weight:800; font-size:13.5px; line-height:1.5;}
  .row .s{font-size:11.5px; color:var(--muted); line-height:1.6;}
  .strike .t{text-decoration:line-through; color:var(--muted);}

  /* ===== الزرار العايم ===== */
  .fab{position:fixed; inset-inline-start:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:15;
    border:none; border-radius:16px; padding:14px 18px; background:var(--accent); color:#fff;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:14.5px; box-shadow:0 10px 26px rgba(8,145,168,.38);}
  [data-theme="dark"] .fab{color:#0E1620;}

  /* ===== الشيت (النافذة اللي بتطلع من تحت) ===== */
  .ov{position:fixed; inset:0; z-index:60; background:rgba(8,14,20,.55); display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:620px; max-height:92dvh; overflow-y:auto; background:var(--paper);

  .sh-h{position:sticky; top:0; z-index:2; background:var(--paper); display:flex; align-items:center; gap:10px;
    padding:14px 16px 10px; border-bottom:1px solid var(--line);}
  .sh-h h3{flex:1; margin:0; font-family:'Cairo',sans-serif; font-size:16px; font-weight:900;}
  .sh-x{border:none; background:var(--card); color:var(--ink); width:36px; height:36px; border-radius:10px; font-size:18px;}
  .sh-b{padding:14px 16px;}
  .f{display:block; margin-bottom:12px;}
  .f > span{display:block; font-size:12.5px; font-weight:800; color:var(--ink-2); margin-bottom:5px;}
  .f input,.f textarea,.f select{width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:11px; padding:11px 12px; font-family:inherit; font-size:15px;}
  .f input:disabled{opacity:.6;}
  .f textarea{resize:vertical; min-height:56px;}
  .f2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
    padding:9px 14px; font-weight:800; font-size:13px;}
  .chip.on{border-color:var(--blue); background:var(--blue-bg); color:var(--blue);}
  .chip.add{border-style:dashed; color:var(--muted);}
  .chip.unk.on{border-color:var(--wait); background:var(--wait-bg); color:var(--wait);}
  .note-in{font-size:12px; color:var(--muted); line-height:1.8; margin-top:5px;}
  .big{width:100%; border:none; border-radius:13px; padding:15px; background:var(--accent); color:#fff;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:15.5px;}
  .big:disabled{opacity:.5;}
  [data-theme="dark"] .big{color:#0E1620;}
  .warnbox{background:var(--wait-bg); color:var(--wait); border-radius:11px; padding:10px 12px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:12px;}
  .okbox{background:var(--done-bg); color:var(--done); border-radius:11px; padding:10px 12px; font-size:13px;
    font-weight:700; line-height:1.8; margin-bottom:12px;}

  /* ===== الفاتورة ===== */
  .ln{background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--edge,var(--line));
    border-radius:12px; padding:10px 11px; margin-bottom:9px;}
  .ln.g{--edge:var(--done);} .ln.y{--edge:var(--wait);} .ln.r{--edge:var(--red);}
  .ln-grid{display:grid; grid-template-columns:2.2fr .8fr 1fr 1fr; gap:6px;}
  .ln-grid input{width:100%; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:9px;
    padding:9px 8px; font-family:inherit; font-size:15px; min-width:0;}
  .ln-lbl{display:grid; grid-template-columns:2.2fr .8fr 1fr 1fr; gap:6px; font-size:10.5px; color:var(--muted); font-weight:800; margin:0 2px 3px;}
  .mchip{display:inline-flex; align-items:center; gap:5px; border-radius:9px; padding:5px 8px; margin:6px 4px 0 0;
    background:var(--done-bg); color:var(--done); font-size:12px; font-weight:800; border:none;}
  .mchip.low{background:var(--wait-bg); color:var(--wait);}
  .pick{display:block; width:100%; text-align:start; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:9px 11px; margin-top:6px; font-size:13px;}
  .sum{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:11px 13px; margin:10px 0; font-size:13px;}
  .inv-img{width:100%; max-height:55vh; object-fit:contain; border-radius:12px; background:var(--card); margin-bottom:10px;}

  /* ===== المطابقة ===== */
  .vs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .vs > div{background:var(--soft); border-radius:10px; padding:8px 10px; font-size:12.5px; line-height:1.75; word-break:break-word;}
  .vs .k{display:block; font-size:11px; font-weight:900; color:var(--muted); margin-bottom:2px;}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    z-index:100000; background:var(--chrome); color:var(--on-chrome); border-radius:12px; padding:12px 16px; font-weight:800;
    font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--red); color:#fff;}

  /* ============================================================
     📱 قاعدة الآيفون — متشيلهاش: خط الخانات ١٦px على الموبايل،
        أقل من كده الأيفون بيكبّر الصفحة ومبيرجعش في وضع التطبيق.
     ============================================================ */
  @media (max-width:820px){
    input, textarea, select{ font-size:16px !important; }
  }
</style>
</head>

<script>
// ============================================================
// 🛵🔩 صفحة مسؤول قطع الغيار (ملفات SQL رقم 95 و 104)
// ------------------------------------------------------------
// 🧸 الحكاية:
//   الفني / مدير الإنتاج يطلب قطعة → المسؤول يدوس «🚶 رايح أجيبها»
//   (الطلب يتقفل باسمه) → يشتريها ويكتب التاجر، والسعر لو يعرفه (وإلا ⏳)
//   → الفني يستلم → الفاتورة توصل (يومي أو أسبوعي) → **المحاسب العام**
//   يراجعها مع التاجر ويدخّلها فالأسعار تنزل → المحاسب العام يدفع للتاجر.
//
// 👀 مين بيفتح الصفحة دي:
//   🛵 مسؤول القطع (parts)   → الطلبات والشراء والقطع بالأسعار — من غير فواتير ولا دفعات
//   🧾 المحاسب العام          → كل حاجة + 🧾 الفواتير + 💸 الدفعات + ⚖️ المطابقة + ⚠️ التنبيهات
//   🏭 مدير الإنتاج           → الطلبات + ⚖️ المطابقة + التكرار — **من غير أي سعر**
//   (السيرفر هو اللي بيشيل الأسعار ويقفل الفواتير — مش الشاشة اللي بتخبّيها)
//
// 📑 (ملف 104) الورق بقى ليه أرقام في كشكول الـERP:
//   🧾 PI فاتورة مشتريات · 💸 SP سند صرف لتاجر · ↩️ PR مرتجع مشتريات
//   وبعد ما القطعة تدخل فاتورة، سعرها بيتعدّل من المحاسب العام بس.
//
// ⚠️ الصفحة مابتقراش جدول الأجهزة خالص. كل حاجة من دالة parts_board
//    على السيرفر — بتدّي رقم التذكرة والموديل والعطل بس (مفيش عميل ولا تليفون).
// ============================================================
const $ = id => document.getElementById(id);
let B = null, ROLE = '', ME = '', UID = '', loadErr = '', loading = false;
const S = { tab: 'req', supFocus: null };
let lastReqIds = null;

const ROLE_LBL = { parts:'مسؤول قطع الغيار', super_admin:'المحاسب العام', production:'مدير الإنتاج' };
const isRunner = () => ROLE === 'parts';
const isBoss   = () => ROLE === 'super_admin';
const isProd   = () => ROLE === 'production';
const money    = () => ROLE === 'parts' || ROLE === 'super_admin';

// ---------- أدوات ----------
function fmt(n){ return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-EG'); }
function num(v){
  const s = String(v == null ? '' : v).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660)
    .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0).replace(/[^\d.\-]/g, '');
  const n = parseFloat(s); return Number.isFinite(n) ? n : null;
}
// نفس تبسيط السيرفر (parts_norm): «شاشة أصلي» = «شاشه اصلى»
function norm(t){
  return String(t || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ـ/g, '')
    .replace(/[\s.,،؛؟!?\-_/\\()+*:;"'«»]+/g, ' ').trim();
}
function cairoDay(d){ try{ return new Intl.DateTimeFormat('en-CA', { timeZone:'Africa/Cairo' }).format(d ? new Date(d) : new Date()); }catch(e){ return ''; } }
function ago(iso){
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if(!(m >= 0)) return '';
  if(m < 1) return 'دلوقتي';
  if(m < 60) return 'من ' + m + ' دقيقة';
  const h = Math.floor(m / 60); if(h < 24) return 'من ' + h + ' ساعة';
  const d = Math.floor(h / 24); return d === 1 ? 'من يوم' : 'من ' + d + ' يوم';
}

// ⚠️ Supabase مابيرميش خطأ — بيرجّعه في .error. الدالة دي بترميه بصوت عالي.
async function rpc(name, args){
  if(!navigator.onLine) throw new Error('مفيش نت — العملية دي محتاجة اتصال');
  const { data, error } = await sb.rpc(name, args || {});

}

  return m;
}

// 📅 الفاتورة اتأخرت؟ (يومي: من بكره · أسبوعي: بعد ٧ أيام من أقدم قطعة)
function invoiceDue(s){
  if(!s || !s.oldest_pending || s.cycle === 'none') return null;
  const today = cairoDay();
  const oldestDay = cairoDay(s.oldest_pending);
  const days = Math.floor((new Date(today) - new Date(oldestDay)) / 86400000);
  if(s.cycle === 'daily'){
    if(days >= 1) return { late: days, txt: '⏰ فاتورته اليومية متأخرة ' + days + ' يوم' };
    return { late: 0, txt: '📅 فاتورة النهارده' };
  }
  const todayDow = new Date(today + 'T12:00:00').getDay();
  if(days > 7) return { late: days - 7, txt: '⏰ فاتورته الأسبوعية متأخرة ' + (days - 7) + ' يوم' };
  if(s.inv_dow != null && todayDow === Number(s.inv_dow)) return { late: 0, txt: '📅 فاتورته النهارده (' + DOW[s.inv_dow] + ')' };
  return null;
}
function alerts(){
  if(!B || !money()) return [];
  const a = [];
  (B.suppliers || []).forEach(s => {
    const due = invoiceDue(s);
    // 🧾 المحاسب العام بيعرف بعد يوم زيادة (أسبوعي) أو يومين (يومي)
    //    🛵 المسؤول بيعرف على طول — عشان يفكّر التاجر يبعتها
    if(due && due.late > 0 && (isRunner() || due.late >= (s.cycle === 'daily' ? 2 : 1)))
      a.push({ k:'inv', s, txt: '🧾 ' + s.name + ': ' + due.txt + ' (' + s.pending_n + ' قطعة مستنية)'
                                + (isRunner() ? ' — فكّر التاجر يبعتها للمحاسب العام' : '') });
    if(s.credit_limit != null && Number(s.balance) > Number(s.credit_limit))
      a.push({ k:'limit', s, txt: '💳 ' + s.name + ': الحساب ' + fmt(s.balance) + ' عدّى الحد ' + fmt(s.credit_limit) });
  });
  const old7 = unpriced().filter(p => Date.now() - new Date(p.bought_at) > 7 * 86400000);
  if(old7.length) a.push({ k:'old', txt: '⏳ ' + old7.length + ' قطعة من غير سعر من أكتر من ٧ أيام' });
  if(isBoss()){
    P().filter(p => p.price_flag === 'jump').forEach(p => a.push({ k:'jump', p,
      txt: '🔺 سعر «' + p.part + '» من ' + p.supplier + ' قفز لـ ' + fmt(p.unit_price) + ' (أكتر من ٢٠٪)' }));
    P().filter(p => p.from_invoice && p.part !== 'فرق إجمالي الفاتورة' && Date.now() - new Date(p.bought_at) < 14 * 86400000)
      .forEach(p => a.push({ k:'extra', p, txt: '🧾 «' + p.part + '» في فاتورة ' + p.supplier + ' ومالهاش شراء مسجّل (دخلت المخزن)' }));
  }
  return a;
}

    .sort((a, b) => ((b.supplier_id === sid) - (a.supplier_id === sid)) || (new Date(b.bought_at) - new Date(a.bought_at)));
  return list[0] || null;

function reBuy(){
  // نحفظ اللي اتكتب قبل ما نعيد الرسم
  ['bPart','bQty','bPrice','bNote'].forEach(id => { const e = $(id); if(e){ const k = { bPart:'part', bQty:'qty', bPrice:'price', bNote:'note' }[id]; BUY[k] = e.value; } });

}
function bUnk(){ const b = $('bUnkBtn'); if(b) b.classList.toggle('on', BUY.unk); }
function bHint(){ const h = $('bHint'); if(h){ const g = BUY.part ? lastPriceTxt(BUY.part, BUY.sup) : ''; h.innerHTML = g ? '💡 ' + g : ''; } }
let findT = 0;
function findDev(v){
  clearTimeout(findT);
  findT = setTimeout(async () => {
    const host = $('bDevRes'); if(!host) return;
    if(String(v).replace(/\D/g, '').length < 3){ host.innerHTML = ''; return; }
    try{
      const rows = await rpc('parts_find_device', { p_q: v });
      BUY.found = rows || [];
      host.innerHTML = BUY.found.length ? BUY.found.map((r, i) => `<button class="pick" onclick="pickDev(${i})"><b>${esc(r.label)}</b><br><span style="color:var(--muted);font-size:12px;">${esc(r.issue || '')}${r.tech ? ' · 🔧 ' + esc(r.tech) : ''}</span></button>`).join('')
        : '<div class="note-in">مفيش جهاز شغّال بالرقم ده</div>';
    }catch(e){ host.innerHTML = `<div class="note-in" style="color:var(--red)">${esc(errMsg(e))}</div>`; }
  }, 350);
}
function pickDev(i){ const r = BUY.found[i]; if(!r) return; BUY.dev = { id:r.id, label:r.label }; reBuy(); }

async function buyGo(force){
  if(BUY.busy) return;
  const part = String(BUY.part || '').trim();
  const qty = num(BUY.qty) || 1;
  const price = BUY.unk ? null : num(BUY.price);
  if(part.length < 2){ toast('اكتب اسم القطعة', true); return; }
  if(!BUY.sup){ toast('🏪 اختار التاجر اللي جبت منه', true); return; }
  if(!BUY.unk && (price == null || price < 0)){ toast('اكتب السعر صح — أو دوس «⏳ مش معروف»', true); return; }
  if(!BUY.req && !BUY.dev && !BUY.stock){ toast('📱 اختار الجهاز — أو «للمخزن»', true); return; }
  BUY.busy = true; reBuy();
  try{
    const r = await rpc('part_buy', { p_request_id: BUY.req ? BUY.req.id : null, p_device_id: BUY.dev ? BUY.dev.id : null,
      p_part: part, p_qty: qty, p_supplier_id: BUY.sup, p_price: price, p_note: BUY.note || '', p_force: !!force });
    closeSheet();
    toast('✅ اتسجّلت على حساب ' + (supById(BUY.sup) || {}).name + (price == null ? ' — ⏳ من غير سعر' : ''));
    if(r && r.warn) setTimeout(() => toast('💳 ' + r.warn, true), 2900);
    load();
  }catch(e){
    BUY.busy = false;
    const m = errMsg(e);
    // 🔴 تكرار: «DUP|مين|القطعة|إمتى»
    if(/^DUP\|/.test(m)){
      const [, who, what, when] = m.split('|');
      if(confirm('🔴 استنى!\n' + who + ' جاب «' + what + '» لنفس الجهاز ده (' + when + ').\n\nمتأكد إنها قطعة تانية محتاجينها؟\n(لو سجّلتها، مدير الإنتاج هيقرر: تفضل · ترجع للتاجر · تدخل المخزن)')){
        BUY.busy = false; return buyGo(true);
      }
      reBuy(); return;
    }
    reBuy(); toast(m, true);
  }
}

async function newSupplier(fromBuy){

// 📒 كشف الحساب: كل قطعة (+) وكل دفعة (−) والرصيد بعد كل سطر
async function openStatement(id){
  const s = supById(id);
  sheet('📒 كشف حساب ' + (s ? s.name : ''), '<div class="empty">⏳ …</div>');
  try{
    const d = await rpc('supplier_statement', { p_supplier_id:id });
    const rows = [];
    (d.purchases || []).forEach(p => rows.push({ at:p.bought_at, kind:'p', p }));
    (d.payments || []).forEach(y => rows.push({ at:y.paid_at, kind:'y', y }));
    rows.sort((a, b) => new Date(a.at) - new Date(b.at));
    let bal = 0, unk = 0;
    const html = rows.map(r => {
      if(r.kind === 'p'){
        const p = r.p;
        const amt = p.status === 'returned' || p.unit_price == null ? 0 : Number(p.qty) * Number(p.unit_price);
        if(p.unit_price == null && p.status !== 'returned') unk++;
        bal += amt;
        return `<div class="row${p.status === 'returned' ? ' strike' : ''}"><div class="m"><div class="t">${esc(p.part)}${Number(p.qty) > 1 ? ' ×' + fmt(p.qty) : ''}</div>

const INV = { sid:'', date:'', no:'', total:'', adjust:false, lines:[], file:null, url:'', mime:'', model:'manual', raw:null, busy:false, reading:false, pickFor:null, uid:0 };
function openInvoice(sid){

  if(INV.url){ try{ URL.revokeObjectURL(INV.url); }catch(e){} }
  Object.assign(INV, { sid: sid || '', date: cairoDay(), no:'', total:'', adjust:false, lines:[], file:null, url:'', mime:'',
    model:'manual', raw:null, busy:false, reading:false, pickFor:null });
  sheet('🧾 فاتورة جديدة', invHtml());
}
function invPending(){
  if(!INV.sid) return [];
  return pendingOf(INV.sid).sort((a, b) => new Date(a.bought_at) - new Date(b.bought_at));
}
// القطعة دي من فترة الفاتورة؟ (يومي: نفس اليوم · أسبوعي: آخر ٧ أيام قبل تاريخها)
function inPeriod(p){
  const s = supById(INV.sid); if(!s || !INV.date) return true;
  const d = cairoDay(p.bought_at);
  if(s.cycle === 'daily') return d === INV.date;
  const from = new Date(new Date(INV.date + 'T12:00:00') - 7 * 86400000).toISOString().slice(0, 10);
  return d > from && d <= INV.date;
}
// 🔤 قد إيه الاسمين شبه بعض (من ٠ لـ ١)
function sim(a, b){
  const A = norm(a), Bn = norm(b);
  if(!A || !Bn) return 0;
  if(A === Bn) return 1;
  if(A.includes(Bn) || Bn.includes(A)) return 0.85;
  const ta = new Set(A.split(' ')), tb = new Set(Bn.split(' '));
  let inter = 0; ta.forEach(x => { if(tb.has(x)) inter++; });
  return inter / Math.max(ta.size, tb.size);
}
// 🤝 المطابقة الأوتوماتيك: كل سطر ياخد القطع ⏳ اللي اسمها شبهه لحد ما يكمّل كميته
function autoMatch(){
  const pool = invPending();
  const used = new Set();
  INV.lines.forEach(l => l.purchases.forEach(id => used.add(id)));
  INV.lines.forEach(l => {
    if(l.manual) return;
    let have = l.purchases.reduce((t, id) => t + (Number((pool.find(p => p.id === id) || {}).qty) || 0), 0);
    const want = num(l.qty) || 1;
    const cands = pool.filter(p => !used.has(p.id)).map(p => ({ p, s: sim(l.name, p.part) + (inPeriod(p) ? 0.05 : 0) }))
      .filter(x => x.s >= 0.5).sort((a, b) => b.s - a.s || (new Date(a.p.bought_at) - new Date(b.p.bought_at)));
    for(const c of cands){
      if(have + Number(c.p.qty) > want) continue;
      l.purchases.push(c.p.id); used.add(c.p.id); have += Number(c.p.qty);
      if(have >= want) break;
    }
  });
}
function lineState(l){
  const pool = invPending();
  const ps = l.purchases.map(id => pool.find(p => p.id === id)).filter(Boolean);
  const have = ps.reduce((t, p) => t + Number(p.qty), 0);
  const want = num(l.qty) || 1;
  const low = ps.some(p => sim(l.name, p.part) < 0.75);
  if(have === want && !low) return 'g';
  if(have > 0) return 'y';
  return 'r';
}
function lineTotal(l){ const q = num(l.qty) || 0, u = num(l.unit), t = num(l.total); return t != null ? t : (u != null ? q * u : 0); }
function invHtml(){

  const needOk = INV.lines.filter(l => lineState(l) !== 'g' && !l.ok).length;
  const s = supById(INV.sid);
  if(INV.reading) return `<div class="empty">🤖 بنقرا الفاتورة… (من ١٠ لـ ٣٠ ثانية)</div>`;
  return `
    <label class="f"><span>🏪 التاجر</span><div class="chips">${sups.map(x => `<button class="chip${INV.sid === x.id ? ' on' : ''}" onclick="invSup('${x.id}')">${esc(x.name)}${x.pending_n ? ' <b style="color:var(--wait)">' + x.pending_n + '</b>' : ''}</button>`).join('')}</div></label>
    ${INV.sid ? `

    <div class="acts" style="margin:0 0 12px;">

    <div class="acts" style="margin:0 0 10px;"><button class="btn" onclick="invAdd()">➕ سطر</button>

    ${needOk ? `<div class="warnbox">🟡 فيه ${needOk} سطر محتاج تأكيد — دوس «✓ تمام» على كل واحد بعد ما تراجعه.</div>` : ''}
    <button class="big" onclick="invSave()" ${INV.busy || needOk || !INV.lines.length ? 'disabled' : ''}>${INV.busy ? '⏳ بنحفظ…' : '💾 احفظ الفاتورة'}</button>

    ` : '<div class="hint">اختار التاجر الأول.</div>'}
    <input type="file" id="invCam" accept="image/*" capture="environment" style="display:none" onchange="invPick(this)">
    <input type="file" id="invFile" accept="image/*,application/pdf" style="display:none" onchange="invPick(this)">`;
}
function lineHtml(l, i, pool){
  const st = lineState(l);
  const ps = l.purchases.map(id => pool.find(p => p.id === id)).filter(Boolean);
  const icon = st === 'g' ? '✅' : st === 'y' ? '🟡' : '🔴';

  const cands = pool.filter(p => !used.has(p.id)).map(p => ({ p, s: sim(l.name, p.part) })).sort((a, b) => b.s - a.s);
  return `<div class="ln ${st}">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><b>${icon} ${i + 1}</b><span style="flex:1"></span>
      ${st !== 'g' ? `<button class="btn sm ${l.ok ? 'ok' : ''}" onclick="INV.lines[${i}].ok=!INV.lines[${i}].ok;reInv()">${l.ok ? '✓ اتأكد' : '✓ تمام'}</button>` : ''}
      <button class="btn ghost sm" onclick="INV.lines.splice(${i},1);reInv()">🗑</button></div>
    <div class="ln-lbl"><span>الصنف</span><span>كمية</span><span>الواحدة</span><span>الإجمالي</span></div>

      <input inputmode="decimal" value="${esc(l.qty)}" onchange="lnSet(${i},'qty',this.value)">
      <input inputmode="decimal" value="${l.unit == null ? '' : esc(l.unit)}" onchange="lnSet(${i},'unit',this.value)">
      <input inputmode="decimal" value="${l.total == null ? '' : esc(l.total)}" onchange="lnSet(${i},'total',this.value)">
    </div>
    <div>${ps.map(p => `<button class="mchip${sim(l.name, p.part) < 0.75 ? ' low' : ''}" onclick="lnDrop(${i},'${p.id}')">${esc(p.part)}${Number(p.qty) > 1 ? ' ×' + fmt(p.qty) : ''} · ${p.device_id ? esc(p.device_label.split(' — ')[0]) : '📦'} ✕</button>`).join('')}</div>
    ${INV.pickFor === i ? `<div style="margin-top:6px;">${cands.length ? cands.slice(0, 12).map(c => `<button class="pick" onclick="lnAdd(${i},'${c.p.id}')">${esc(c.p.part)}${Number(c.p.qty) > 1 ? ' ×' + fmt(c.p.qty) : ''} — ${c.p.device_id ? esc(c.p.device_label) : '📦'} <span style="color:var(--muted);font-size:11.5px;">(${dt(c.p.bought_at)})</span></button>`).join('') : '<div class="note-in">مفيش قطع ⏳ فاضلة من التاجر ده</div>'}
      <button class="btn ghost sm" style="margin-top:6px;" onclick="INV.pickFor=null;reInv()">قفل</button></div>`
      : `<button class="btn ghost sm" style="margin-top:6px;" onclick="INV.pickFor=${i};reInv()">➕ اربط بقطعة</button>`}
  </div>`;
}
function invSumHtml(sumL, tot, diff){
  return `<div class="sum"><span>مجموع السطور: <b class="money">${fmt(sumL)}</b></span>
    ${tot != null ? `<span>الإجمالي: <b class="money">${fmt(tot)}</b></span><span style="color:${Math.abs(diff) > 0.5 ? 'var(--red)' : 'var(--done)'}">الفرق: <b>${fmt(diff)}</b></span>` : ''}</div>
    ${tot != null && Math.abs(diff) > 0.5 ? `<label class="f" style="display:flex;gap:8px;align-items:flex-start;"><input type="checkbox" style="width:auto;margin-top:4px;" ${INV.adjust ? 'checked' : ''} onchange="INV.adjust=this.checked">
      <span style="margin:0;font-weight:700;">⚖️ الإجمالي المكتوب هو الصح — سجّل الفرق (${fmt(diff)}) سطر لوحده على حساب التاجر (خصم أو مصاريف)</span></label>` : ''}`;
}
function invLive(){
  const sumL = INV.lines.reduce((t, l) => t + lineTotal(l), 0);
  const tot = num(INV.total);
  const h = $('invSum'); if(h) h.innerHTML = invSumHtml(sumL, tot, tot != null ? tot - sumL : 0);
}
function reInv(){ const y = (document.querySelector('.ov .sheet') || {}).scrollTop || 0; setSheetBody(invHtml()); const sh = document.querySelector('.ov .sheet'); if(sh) sh.scrollTop = y; }
function invSup(id){ INV.sid = id; INV.lines.forEach(l => { l.purchases = []; l.ok = false; l.manual = false; }); autoMatch(); reInv(); }
function newLine(o){ return Object.assign({ uid: ++INV.uid, name:'', qty:1, unit:null, total:null, purchases:[], ok:false, manual:false }, o || {}); }
function invAdd(){ INV.lines.push(newLine()); reInv(); }
// ⚡ سطر لكل قطعة ⏳ فاضلة — للتاجر اللي فاتورته بنفس ترتيب المشتريات
function invFill(){
  const used = new Set(); INV.lines.forEach(l => l.purchases.forEach(id => used.add(id)));
  invPending().filter(p => !used.has(p.id)).forEach(p =>
    INV.lines.push(newLine({ name:p.part, qty:Number(p.qty), unit:p.unit_price, purchases:[p.id], ok:true, manual:true })));
  reInv();
}
function lnSet(i, k, v){
  const l = INV.lines[i]; if(!l) return;
  l[k] = String(v).trim() === '' ? null : num(v);
  if(k === 'qty' && !(l.qty > 0)) l.qty = 1;
  if((k === 'unit' || k === 'qty') && l.unit != null && !l.totalTyped) l.total = +(l.unit * (l.qty || 1)).toFixed(2);
  if(k === 'total'){ l.totalTyped = l.total != null; if(l.total != null && (l.unit == null || !l.unitTyped)) l.unit = +(l.total / (l.qty || 1)).toFixed(2); }
  if(k === 'unit') l.unitTyped = l.unit != null;
  reInv();
}
function lnDrop(i, id){ const l = INV.lines[i]; l.purchases = l.purchases.filter(x => x !== id); l.ok = false; l.manual = true; reInv(); }
function lnAdd(i, id){ const l = INV.lines[i]; l.purchases.push(id); l.ok = false; l.manual = true; INV.pickFor = null; reInv(); }

// 📷 قراية الفاتورة بالذكاء الاصطناعي — نفس دالة parse-invoice بتاعة فواتير المشتريات
async function invPick(inp){
  const f = inp.files && inp.files[0]; inp.value = '';
  if(!f) return;
  if(!/^image\//.test(f.type) && f.type !== 'application/pdf'){ toast('صورة أو PDF بس', true); return; }
  if(f.size > 20 * 1024 * 1024){ toast('الملف كبير — صوّرها تاني', true); return; }
  const { blob, mime } = await shrink(f);
  if(INV.url){ try{ URL.revokeObjectURL(INV.url); }catch(e){} }
  INV.file = blob; INV.mime = mime; INV.url = URL.createObjectURL(blob);
  INV.reading = true; reInv();
  try{
    const b64 = await toB64(blob);
    const res = await parseInvoice(mime, b64);
    const d = (res && res.data) || {};
    INV.model = (res && res.model) || 'ai'; INV.raw = (res && res.raw) || null;
    if(d.invoice_date) INV.date = d.invoice_date;
    if(d.invoice_number) INV.no = d.invoice_number;
    if(d.grand_total) INV.total = String(d.grand_total);
    if(!INV.sid && d.supplier_name){
      const hit = (B.suppliers || []).find(s => sim(s.name, d.supplier_name) >= 0.85);
      if(hit) INV.sid = hit.id;
    }
    INV.lines = (d.items || []).map(it => newLine({ name: it.item_name || '', qty: num(it.quantity) || 1,
      unit: num(it.unit_cost_price), total: num(it.total_price) }));
    autoMatch();
    INV.reading = false; reInv();
    toast(INV.lines.length ? '🤖 اتقرت ' + INV.lines.length + ' سطر — راجعها' : 'مالقيناش سطور — اكتبها بإيدك', !INV.lines.length);
  }catch(e){
    console.error('parse-invoice:', e);
    INV.reading = false; INV.model = 'manual'; reInv();
    toast('🤖 القراية الأوتوماتيك ما نجحتش — اكتب السطور بإيدك وإنت شايف الصورة (' + errMsg(e) + ')', true);
  }
}
async function shrink(file){
  if(!/^image\//.test(file.type)) return { blob:file, mime:file.type };
  try{
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if(sc >= 1 && file.size < 1.5 * 1024 * 1024) return { blob:file, mime:file.type };
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return (!out || out.size > file.size) ? { blob:file, mime:file.type } : { blob:out, mime:'image/jpeg' };
  }catch(e){ return { blob:file, mime:file.type || 'image/jpeg' }; }
}
function toB64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); }); }
async function parseInvoice(mime, b64){
  const { data:{ session } } = await sb.auth.getSession();
  const base = String(sb.supabaseUrl || '').replace(/\/+$/, '');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 90000);
  try{
    const r = await fetch(base + '/functions/v1/parse-invoice', { method:'POST', signal:ctl.signal,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + (session && session.access_token), 'apikey': sb.supabaseKey || '' },
      body: JSON.stringify({ mimeType:mime, dataBase64:b64 }) });
    const j = await r.json().catch(() => null);
    if(!r.ok) throw new Error((j && (j.message || j.error)) || ('HTTP ' + r.status));
    return j;
  }finally{ clearTimeout(t); }
}

async function invSave(){
  if(INV.busy) return;
  if(!isBoss()){ toast('🧾 فواتير التجار عند المحاسب العام بس', true); return; }
  if(!INV.sid){ toast('اختار التاجر', true); return; }
  if(!INV.lines.length){ toast('الفاتورة فاضية', true); return; }
  for(const [i, l] of INV.lines.entries()){
    if(!String(l.name || '').trim()){ toast('سطر ' + (i + 1) + ' — اكتب الصنف', true); return; }
    if(num(l.unit) == null && num(l.total) == null){ toast('سطر ' + (i + 1) + ' («' + l.name + '») — اكتب السعر', true); return; }
  }
  const s = supById(INV.sid);
  const extra = INV.lines.filter(l => lineState(l) === 'r').length;
  if(!confirm('💾 فاتورة ' + (s ? s.name : '') + ' — ' + INV.lines.length + ' سطر' + (extra ? '\n🔴 ' + extra + ' سطر مالوش قطعة مسجّلة (هيدخل المخزن)' : '') + '\n\nنحفظ؟')) return;
  INV.busy = true; reInv();
  // صورة الفاتورة — لو الرفع فشل بنكمّل، الفاتورة أهم من صورتها
  let path = null;
  if(INV.file){
    try{
      path = INV.date + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + (/pdf/.test(INV.mime) ? '.pdf' : '.jpg');
      const up = await sb.storage.from('invoices').upload(path, INV.file, { contentType: INV.mime, upsert:false });
      if(up.error){ console.warn('رفع صورة الفاتورة:', up.error); path = null; }
    }catch(e){ path = null; }
  }
  try{
    const lines = INV.lines.map(l => ({ name: String(l.name).trim(), qty: num(l.qty) || 1,
      unit: num(l.unit), total: num(l.total), purchases: l.purchases }));
    const r = await rpc('supplier_invoice_save', { p_supplier_id: INV.sid, p_date: INV.date, p_number: INV.no || '',
      p_total: num(INV.total), p_image_path: path, p_lines: lines, p_adjust: !!INV.adjust,
      p_ai_model: INV.model || 'manual', p_ai_raw: INV.raw });
    closeSheet();
    toast('🧾 اتحفظت' + (r.erp_no ? ' — ' + r.erp_no : '') + ' · ' + r.priced + ' قطعة اتسعّرت' + (r.extra ? ' · ' + r.extra + ' زيادة دخلت المخزن' : ''));
    load();
  }catch(e){ INV.busy = false; reInv(); toast(errMsg(e), true); }
}

// ============================================================
// 🪟 الشيت
// ============================================================
function sheet(title, body){
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'sheetOv';
  ov.onclick = e => { if(e.target === ov) closeSheet(); };
  ov.innerHTML = `<div class="sheet" dir="rtl"><div class="sh-h"><h3>${esc(title)}</h3><button class="sh-x" onclick="closeSheet()">✕</button></div><div class="sh-b" id="shBody">${body}</div></div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
}
function setSheetBody(html){ const b = $('shBody'); if(b) b.innerHTML = html; }
function closeSheet(){ const o = $('sheetOv'); if(o) o.remove(); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

// ============================================================
// قايمة التلت نقط + الخروج
// ============================================================
function toggleKebab(){
  const m = $('kebabMenu'), sh = $('kebabShield');
  const open = m.classList.contains('hidden');
  m.classList.toggle('hidden', !open); sh.classList.toggle('hidden', !open);
}
function closeKebab(){ $('kebabMenu').classList.add('hidden'); $('kebabShield').classList.add('hidden'); }
async function doLogout(){
  if(!confirm('تسجيل الخروج؟')) return;
  try{ await sb.auth.signOut(); }catch(e){}
  location.href = 'index.html';
}
