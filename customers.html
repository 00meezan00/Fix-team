<script>
/* المظهر قبل أي رسم — نفس مفتاح باقي الصفحات (ifix-theme). من غير ده فيه ومضة بيضا. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme') || 'auto';
    var h = new Date().getHours();
    var d = m === 'dark' || (m === 'auto' && (h >= 19 || h < 7));
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', d ? '#0F1823' : '#16233A');
  }catch(e){}
})();
</script>

<style>
  /* ============================================================
     📒 حسابات العملاء — نفس ألوان باقي النظام بالحرف (زي parts.html)
     ============================================================ */
  :root{
    --chrome:#16233A; --on-chrome:#FFFFFF;
    --paper:#EBEEF2; --card:#FFFFFF; --line:#E4E9EF; --soft:#F2F5F8;
    --ink:#17222E; --ink-2:#475569; --muted:#6B7A8C; --faint:#94A3B4;
    --red:#DC2626; --red-bg:#FEF2F2;
    --done:#15803D; --done-bg:#EAF6EE;
    --wait:#B5651D; --wait-bg:#FBF2E9;
    --blue:#2B6CB0; --blue-bg:#EAF1F8;
    --violet:#6E56CF; --violet-bg:#F1EEFB;
    --accent:#0891A8;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --chrome:#0F1823; --on-chrome:#F2F5F8;
    --paper:#0E1620; --card:#16202C; --line:#233040; --soft:#1D2937;
    --ink:#E9EEF4; --ink-2:#B7C3D0; --muted:#8A99A9; --faint:#67788A;
    --red:#F87171; --red-bg:rgba(248,113,113,.14);
    --done:#4ADE80; --done-bg:rgba(74,222,128,.13);
    --wait:#F0A552; --wait-bg:rgba(240,165,82,.14);
    --blue:#7FB2E5; --blue-bg:rgba(127,178,229,.14);
    --violet:#A78BFA; --violet-bg:rgba(167,139,250,.15);
    --accent:#2AB5CE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Tajawal',system-ui,sans-serif; min-height:100dvh;}
  button{font-family:inherit; cursor:pointer;}

  .topbar{background:var(--chrome); color:var(--on-chrome); position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;}
  .tb-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .topbar h1{font-family:'Cairo',sans-serif; font-size:17px; margin:0; font-weight:900;}
  .who{font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; opacity:.85; margin-top:1px;}
  .back-btn{border:none; border-radius:11px; background:rgba(255,255,255,.12); color:var(--on-chrome);
    padding:9px 12px; font-weight:800; font-size:13px; white-space:nowrap;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none; border:none; border-radius:999px; padding:8px 13px; font-weight:800; font-size:13px;
    background:rgba(255,255,255,.10); color:var(--on-chrome); white-space:nowrap;}
  .tab.on{background:var(--on-chrome); color:var(--chrome);}
  .tab .n{display:inline-block; min-width:18px; margin-inline-start:4px; border-radius:9px; padding:0 5px;
    background:var(--red); color:#fff; font-size:11px; line-height:18px; text-align:center;}

  .wrap{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 90px); max-width:820px; margin:0 auto;}
  .sec-h{display:flex; align-items:center; gap:8px; margin:16px 2px 9px; font-family:'Cairo',sans-serif;
    font-weight:900; font-size:14.5px;}
  .sec-h .c{font-family:system-ui; font-size:12px; font-weight:800; color:var(--muted); background:var(--card);

  .err{background:var(--red-bg); color:var(--red); border-radius:12px; padding:12px 14px; font-size:13px;

  /* ===== أرقام فوق ===== */
  .stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-bottom:12px;}

  /* ===== البحث والفلاتر ===== */

  .card{background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--edge,var(--line));
    border-radius:13px; padding:11px 13px; margin-bottom:8px;}
  button.card{display:block; width:100%; text-align:start; color:var(--ink);}
  .card.k-shop{--edge:var(--blue);} .card.k-acquisition{--edge:var(--violet);} .card.k-retail{--edge:var(--done);}
  .card.review{--edge:var(--wait);}
  .card.off{opacity:.6;}
  .c-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .c-t{font-family:'Cairo',sans-serif; font-weight:900; font-size:15px; line-height:1.45; min-width:0; word-break:break-word;}
  .c-s{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.7;}

  .code{font-family:ui-monospace,Menlo,monospace; font-size:12px; font-weight:700; color:var(--muted); direction:ltr; unicode-bidi:isolate;}
  .pill{flex:none; font-size:11.5px; font-weight:800; border-radius:20px; padding:3px 9px; white-space:nowrap;

  /* ===== الشيت ===== */

  .sheet{width:100%; max-width:640px; max-height:92dvh; overflow-y:auto; background:var(--paper);

  .sh-h{position:sticky; top:0; z-index:2; background:var(--paper); display:flex; align-items:center; gap:10px;

  .warnbox{background:var(--wait-bg); color:var(--wait); border-radius:11px; padding:10px 12px; font-size:13px;

  .pick{display:block; width:100%; text-align:start; border:1px solid var(--line); background:var(--card); color:var(--ink);

  .pick.on{border-color:var(--accent); background:var(--blue-bg);}

  .fab{position:fixed; inset-inline-start:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:15;
    border:none; border-radius:16px; padding:14px 18px; background:var(--accent); color:#fff;

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    z-index:100000; background:var(--chrome); color:var(--on-chrome); border-radius:12px; padding:12px 16px; font-weight:800;
    font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--red); color:#fff;}

  /* 📱 قاعدة الآيفون — متشيلهاش: خط الخانات ١٦px على الموبايل */
  @media (max-width:820px){
    input, textarea, select{ font-size:16px !important; }
  }
</style>

<script>
// ============================================================
// 📒 حسابات العملاء (ملفات SQL رقم 98 و 99) — المحاسب العام بس
// ------------------------------------------------------------
// 🧸 الحكاية:
//   كل محل له كود ثابت (S-0001…) وزباين المحل كلهم كود واحد R-001.
//   تحت كل كود: كل الأشكال اللي اتكتب بيها اسمه («حفيلة» و«حفيله»).
//   الصفحة دي بقت هي «📒 الحسابات» + «🪪 العملاء» في مكان واحد:
//     💵 دفعة · 🏷️ خصم · 📌 رصيد افتتاحي · ↩️ إلغاء بسبب · ♻️ ترجيع · ⇄ نقل جهاز
//     📄 PDF · 📊 Excel · 💬 واتساب
//     ✏️ بيانات العميل (النوع: عادي/استحواذ/قطاعي · مدة السداد · الحد)
//     🔗 دمج / فك دمج · 🟡 الأسامي الجديدة
//
// ⚠️ كل كتابة من دوال السيرفر (erp_ledger_post · erp_ledger_void · …)
//    — الشاشة مابتكتبش الدفتر بنفسها خالص. السيرفر بيكتب في الدفتر
//    القديم كمان، عشان الديسباتشر والمالك يفضلوا شايفين نفس الأرقام.
// ⚠️ PDF وExcel بيستعملوا نفس كود الكشف القديم (accounts.js) — فالكشف
//    بيطلع بنفس الشكل اللي المحلات متعودة عليه.
// ============================================================
const $ = id => document.getElementById(id);
const S = { tab:'acc', q:'', kind:'all', sort:'bal', limit:60 };
let C = [], A = [], BAL = {}, MERGES = [], ERRS = [], GONE = [], RECENT = [], PHONES = {};
let loadErr = '', loaded = false, busy = false, ME = '';
// 📄 accounts.js بيقرا الأجهزة من «devices» — بنحط فيها أجهزة العميل اللي بنطبع كشفه بس
var devices = [];

const KIND = { shop:['🏪 محل','blue'], acquisition:['🤝 استحواذ','violet'], retail:['🛍️ قطاعي','green'] };
const TYPE_LBL = { debit:'📦 آجل', credit:'💵 دفعة', discount:'🏷️ خصم', opening:'📌 رصيد افتتاحي' };

// ---------- أدوات ----------
function fmt(n){ return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-EG'); }
function num(v){
  const s = String(v == null ? '' : v).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660)
    .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0).replace(/[^\d.\-]/g, '');
  const n = parseFloat(s); return Number.isFinite(n) ? n : null;
}
// نفس تبسيط السيرفر (erp_norm) — لازم الاتنين يطلعوا نفس النتيجة
function norm(t){
  return String(t || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ـ/g, '')
    .replace(/[\s!-\/:-@\[-`{-~،؛؟«»]+/g, ' ').trim();
}
function dt(iso){ try{ return new Date(iso).toLocaleDateString('ar-EG', { day:'numeric', month:'numeric', year:'2-digit', timeZone:'Africa/Cairo' }); }catch(e){ return ''; } }
function dtt(iso){ try{ return new Date(iso).toLocaleString('ar-EG', { day:'numeric', month:'numeric', hour:'numeric', minute:'2-digit', timeZone:'Africa/Cairo' }); }catch(e){ return ''; } }
function cairoDay(d){ try{ return new Intl.DateTimeFormat('en-CA', { timeZone:'Africa/Cairo' }).format(d ? new Date(d) : new Date()); }catch(e){ return ''; } }
function escH(s){ return (typeof esc === 'function') ? esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

let toastT;
function toast(msg, bad){
  const el = $('toast'); el.textContent = msg; el.classList.toggle('bad', !!bad); el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), bad ? 5200 : 2800);
}
// ⚠️ Supabase مابيرميش خطأ — بيرجّعه في .error. الدوال دي بترميه بصوت عالي.
async function rpc(name, args){
  if(!navigator.onLine) throw new Error('مفيش نت — العملية دي محتاجة اتصال');
  const { data, error } = await sb.rpc(name, args || {});
  if(error) throw error;
  return data;
}
async function sel(table, cols, build){
  let all = [], from = 0;
  // بنجيب على دفعات (السيرفر بيرجّع ١٠٠٠ بالكتير في المرة)
  for(;;){
    let q = sb.from(table).select(cols).range(from, from + 999);
    if(build) q = build(q);
    const { data, error } = await q;
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < 1000) break;
    from += 1000;
  }
  return all;
}
function errMsg(e){
  const m = (e && (e.message || e.hint)) || String(e);
  if(/erp_ledger|erp_customer_create|erp_my_name/i.test(m) && /schema cache|does not exist|PGRST20/i.test(m)) return m + ' — (ملف SQL رقم 99 لسه ما اتشغّلش؟)';
  if(/customer|erp_|schema cache|does not exist|PGRST20/i.test(m)) return m + ' — (ملف SQL رقم 98 لسه ما اتشغّلش؟)';
  return m;
}

// ============================================================
// 🚪 الدخول — المحاسب العام بس
// ============================================================
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  try{
    await rpc('erp_need_super');
  }catch(e){
    const m = errMsg(e);
    if(/المحاسب العام بس/.test(m)){ location.replace('dashboard.html'); return; }
    loadErr = m; render(); return;
  }
  try{ ME = await rpc('erp_my_name'); }catch(e){ ME = session.user.email || ''; }
  $('whoLbl').textContent = ME + ' — المحاسب العام';
  await load();
  document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
})();

async function load(manual){
  if(busy) return;
  busy = true;
  try{
    const [c, a, b, m, e, g, r, ph] = await Promise.all([
      sel('customers', 'id,code,name,kind,phone,payment_terms_days,credit_limit,note,active,merged_into,reviewed,auto_created,created_at,updated_at,updated_by', q => q.order('code')),
      sel('customer_aliases', 'alias_norm,customer_id,sample_raw,source'),
      rpc('customer_balances'),

// 🔍 «ممكن يكونوا نفس المحل»: نفس الاسم لو شلنا المسافات، أو فرق حرف واحد
function lev1(a, b){
  if(a === b) return true;
  const la = a.length, lb = b.length;
  if(Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while(i < la && j < lb){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++diff > 1) return false;
    if(la > lb) i++; else if(lb > la) j++; else { i++; j++; }
  }
  return diff + (la - i) + (lb - j) <= 1;
}
let IGN = new Set();
try{ IGN = new Set(JSON.parse(localStorage.getItem('ifix-cust-ign') || '[]')); }catch(e){}

function pairs(){
  const L = live().filter(c => c.code !== 'R-001').map(c => ({ c, k: norm(c.name).replace(/ /g, '') }));
  const out = [];
  for(let i = 0; i < L.length; i++){
    for(let j = i + 1; j < L.length; j++){
      const a = L[i], b = L[j];
      if(a.k.length < 4 || b.k.length < 4) continue;
      const same = a.k === b.k;
      if(!same && !lev1(a.k, b.k)) continue;
      const key = [a.c.id, b.c.id].sort().join('|');
      if(IGN.has(key)) continue;
      out.push({ a:a.c, b:b.c, key, why: same ? 'نفس الاسم لو شلنا المسافات' : 'فرق حرف واحد' });
    }
  }
  return out.sort((x, y) => (x.why === y.why ? 0 : x.why.startsWith('نفس') ? -1 : 1));
}

function matches(c, q){

  if(norm(c.name).includes(n)) return true;
  if(c.phone && c.phone.replace(/\D/g, '').includes(q.replace(/\D/g, '') || '§')) return true;
  return aliasesOf(c.id).some(a => a.alias_norm.includes(n));
}

    name: (a, b) => a.name.localeCompare(b.name, 'ar'),

  CUR = byId(id); if(!CUR) return;
  CTAB = tab || 'led'; LED = null;
  sheet(CUR.name + ' — ' + CUR.code, custHtml());
  if(CTAB === 'led') loadLed();
}
function custHtml(){
  const c = CUR, b = BAL[c.id] || {};

function pickKind(el){ document.querySelectorAll('#cKind .chip').forEach(x => x.classList.toggle('on', x === el)); }
async function saveCust(){
  const c = CUR;
  const on = document.querySelector('#cKind .chip.on');
  const terms = String($('cTerms').value).trim(), lim = String($('cLimit').value).trim();
  if(terms !== '' && !(num(terms) >= 0)){ toast('مدة السداد لازم تبقى رقم', true); return; }
  if(lim !== '' && !(num(lim) >= 0)){ toast('الحد لازم يبقى رقم', true); return; }
  try{
    await rpc('customer_update', updArgs(c, { p_name:$('cName').value, p_kind: on ? on.dataset.k : c.kind,
      p_phone:$('cPhone').value, p_terms_days: terms === '' ? null : Math.round(num(terms)),
      p_credit_limit: lim === '' ? null : num(lim), p_note:$('cNote').value, p_active:$('cActive').checked }));
    closeSheet(); toast('💾 اتحفظ'); load();
  }catch(e){ toast(errMsg(e), true); }
}

// 📒 الكشف — من الجدول الجديد. الحركة اللي اتلغت بتظهر مشطوبة بالسبب.
async function loadLed(){
  const id = CUR.id;
  try{
    const rows = await sel('customer_ledger', 'legacy_key,type,amount,signed_amount,entry_at,intake_at,device_id,device_label,issue,kind,note,by_name,removed_at,shop_raw,raw',
      q => q.eq('customer_id', id).order('entry_at', { ascending:true, nullsFirst:true }));
    const goneKeys = rows.filter(r => r.removed_at).map(r => r.legacy_key);
    if(goneKeys.length){
      const lg = await sel('customer_ledger_log', 'legacy_key,action,reason,by_email,at',
        q => q.in('legacy_key', goneKeys).eq('action', 'remove').order('at', { ascending:false }));
      const lastBy = {}; lg.forEach(x => { if(!lastBy[x.legacy_key]) lastBy[x.legacy_key] = x; });
      rows.forEach(r => { r._log = lastBy[r.legacy_key] || null; });
    }
    if(!CUR || CUR.id !== id) return;
    LED = rows;
  }catch(e){ LED = { err: errMsg(e) }; }
  if(CTAB === 'led'){ const h = $('cBody'); if(h) h.innerHTML = ledHtml(); }
}
function ledHtml(){
  const c = CUR;
  const tools = `<div class="acts" style="margin:0 0 10px;">
      <button class="btn pri" onclick="openPay('${c.id}','credit')">💵 دفعة</button>
      <button class="btn" onclick="openPay('${c.id}','discount')">🏷️ خصم</button>
      <button class="btn" onclick="openPay('${c.id}','opening')">📌 رصيد افتتاحي</button></div>
    <div class="acts" style="margin:0 0 12px;">
      <button class="btn" onclick="printCust('pdf')">📄 PDF</button>
      <button class="btn" onclick="printCust('xlsx')">📊 Excel</button>
      <button class="btn" onclick="waBalance()">💬 واتساب</button></div>`;
  if(!LED) return tools + '<div class="empty">⏳ …</div>';
  if(LED.err) return tools + `<div class="err">${escH(LED.err)}</div>`;
  if(!LED.length) return tools + '<div class="empty">لسه مفيش حركات</div>';
  let bal = 0;
  const rows = LED.map(l => {
    const gone = !!l.removed_at;
    if(!gone) bal += Number(l.signed_amount) || 0;
    const sgn = Number(l.signed_amount) || 0;
    const k = escH(l.legacy_key).replace(/'/g, '&#39;');
    const act = gone
      ? `<button class="btn sm" style="margin-top:4px;" onclick="restoreEntry('${k}')">♻️ رجّعها</button>`
      : l.type === 'debit'
        ? `<button class="btn ghost sm" style="margin-top:4px;" onclick="openTransfer('${k}')">⇄ نقل</button>`
        : `<button class="btn ghost sm" style="margin-top:4px;color:var(--red);" onclick="voidEntry('${k}')">↩️ إلغاء</button>`;
    const prev = l.raw && l.raw.prevShop ? ` · <span style="color:var(--wait)">منقول من «${escH(l.raw.prevShop)}»</span>` : '';
    return `<div class="row${gone ? ' strike' : ''}"><div class="m">
        <div class="t">${TYPE_LBL[l.type] || l.type}${l.device_label ? ' · ' + escH(l.device_label) : ''}${l.kind === 'return' ? ' · 🔁 مرتجع' : ''}</div>
        <div class="s">${l.entry_at ? dt(l.entry_at) : '—'}${l.by_name ? ' · ' + escH(l.by_name) : ''}${l.shop_raw && norm(l.shop_raw) !== norm(c.name) ? ' · مكتوب «' + escH(l.shop_raw) + '»' : ''}${prev}</div>
        ${l.issue || l.note ? `<div class="s">${escH([l.issue, l.note].filter(Boolean).join(' · '))}</div>` : ''}
        ${gone ? `<div class="s" style="text-decoration:none;color:var(--red);">↩️ اتلغت ${dt(l.removed_at)}${l._log ? ' · ' + escH(l._log.by_email) + (l._log.reason ? ' · ' + escH(l._log.reason) : ' · من غير سبب') : ''}</div>` : ''}</div>
      <div class="e"><div class="money ${sgn > 0 ? 'pos' : 'neg'}">${sgn > 0 ? '+' : ''}${fmt(sgn)}</div><div class="s">${gone ? '' : fmt(bal)}</div>${act}</div></div>`;
  }).reverse();
  return tools + `<div class="hint">الأحدث فوق. الرقم الصغير تحت المبلغ = الرصيد بعد الحركة دي.</div><div class="card">${rows.join('')}</div>`;
}
async function voidEntry(key){
  const l = (LED || []).find(x => x.legacy_key === key); if(!l) return;
  const why = prompt(`↩️ إلغاء ${TYPE_LBL[l.type] || ''} بـ ${fmt(l.amount)} ج.م\nالحركة هتفضل ظاهرة مشطوبة بالسبب.\n\nاكتب السبب:`);
  if(why === null) return;
  try{ await rpc('erp_ledger_void', { p_key:key, p_reason:why }); toast('↩️ اتلغت'); load(); }
  catch(e){ toast(errMsg(e), true); }
}

const PK = { q:'', sel:null, exclude:null };
function pickerHtml(title){
  const q = PK.q.trim();
  const base = live().filter(x => x.id !== PK.exclude && x.code !== 'R-001');
  const res = q ? base.filter(x => matches(x, q)).slice(0, 12)
                : base.filter(x => balOf(x.id) >= 1).sort((a, b) => balOf(b.id) - balOf(a.id)).slice(0, 8);
  const pick = x => `<button class="pick${PK.sel && PK.sel.id === x.id ? ' on' : ''}" onclick="pkPick('${x.id}')"><b>${escH(x.name)}</b> <span class="code">${escH(x.code)}</span>
      <span style="color:var(--muted);font-size:12px;"> · ${fmt(balOf(x.id))} ج.م</span></button>`;
  return `<label class="f"><span>${title}</span>
    ${PK.sel ? `<div class="chips"><span class="chip on">${escH(PK.sel.name)} · ${escH(PK.sel.code)}</span><button class="chip" onclick="PK.sel=null;PK.q='';pkRe()">تغيير</button></div>`
      : `<input class="search" id="pkQ" type="search" value="${escH(PK.q)}" placeholder="اسم أو كود" oninput="PK.q=this.value;pkReList()" style="margin-bottom:0;">
         <div id="pkRes">${q ? '' : '<div class="note-in">الأكتر عليهم فلوس:</div>'}${res.map(pick).join('') || '<div class="note-in">مفيش نتايج</div>'}</div>`}</label>`;
}
let PK_RENDER = null;
function pkRe(){ if(PK_RENDER) PK_RENDER(); }
function pkReList(){
  const h = $('pkRes'); if(!h) return;
  const tmp = document.createElement('div'); tmp.innerHTML = pickerHtml('');
  const r = tmp.querySelector('#pkRes'); h.innerHTML = r ? r.innerHTML : '';
}
function pkPick(id){ PK.sel = byId(id); pkRe(); }

// 💵 دفعة · 🏷️ خصم · 📌 رصيد افتتاحي
// ============================================================
const PAY_T = { credit:['💵 دفعة','المبلغ اللي المحل دفعه'], discount:['🏷️ خصم','قيمة الخصم'], opening:['📌 رصيد افتتاحي','المديونية القديمة قبل السيستم'] };
let PAY = { type:'credit', amount:'', note:'', date:'', wa:true, busy:false };
function openPay(cid, type){
  PAY = { type, amount:'', note:'', date: cairoDay(), wa: type === 'credit', busy:false };
  Object.assign(PK, { q:'', sel: cid ? byId(cid) : null, exclude:null });
  PK_RENDER = () => { savePayForm(); setSheetBody(payHtml()); };
  sheet(PAY_T[type][0] + (PK.sel ? ' — ' + PK.sel.name : ''), payHtml());
  setTimeout(() => { const a = $('payAmt'); if(a && PK.sel) a.focus(); }, 60);
}
function savePayForm(){
  const a = $('payAmt'); if(a) PAY.amount = a.value;
  const n = $('payNote'); if(n) PAY.note = n.value;
  const d = $('payDate'); if(d) PAY.date = d.value;
  const w = $('payWa'); if(w) PAY.wa = w.checked;
}
function payHtml(){
  const t = PAY_T[PAY.type];
  const c = PK.sel;
  return `${pickerHtml('🏪 العميل')}
    ${c ? `<div class="hint">عليه دلوقتي: <b class="money">${fmt(balOf(c.id))} ج.م</b></div>` : ''}
    <div class="chips" style="margin-bottom:12px;">${Object.entries(PAY_T).map(([k, v]) =>
      `<button class="chip${PAY.type === k ? ' on' : ''}" onclick="savePayForm();PAY.type='${k}';setSheetBody(payHtml())">${v[0]}</button>`).join('')}</div>
    <label class="f"><span>💰 ${t[1]}</span><input id="payAmt" inputmode="decimal" value="${escH(PAY.amount)}" placeholder="بالجنيه"></label>
    ${PAY.type === 'credit' && c && balOf(c.id) > 0 ? `<div class="chips" style="margin:-4px 0 12px;"><button class="chip" onclick="$('payAmt').value='${Math.round(balOf(c.id))}'">الحساب كله (${fmt(balOf(c.id))})</button></div>` : ''}
    <div class="f2">
      <label class="f"><span>📅 التاريخ</span><input id="payDate" type="date" value="${escH(PAY.date)}" max="${cairoDay()}"></label>
      <label class="f"><span>📝 ملاحظة</span><input id="payNote" value="${escH(PAY.note)}" placeholder="${PAY.type === 'credit' ? 'مثال: كاش مع حمادة' : 'اختياري'}"></label>
    </div>
    ${PAY.type === 'credit' ? `<label class="f" style="display:flex;align-items:center;gap:8px;"><input id="payWa" type="checkbox" style="width:auto;"${PAY.wa ? ' checked' : ''}> <span style="margin:0;">💬 ابعت للمحل رسالة «استلمنا دفعة» على الواتساب</span></label>` : ''}
    <button class="big" onclick="payGo()" ${PAY.busy ? 'disabled' : ''}>${PAY.busy ? '⏳ …' : '✅ سجّل'}</button>
    <div class="note-in">🔒 الحركة بتتسجّل على السيرفر باسمك. لو طلعت غلط، بتتلغي بسبب — مابتتمسحش.</div>`;
}
async function payGo(){
  if(PAY.busy) return;
  savePayForm();
  const c = PK.sel;
  const amt = num(PAY.amount);
  if(!c){ toast('🏪 اختار العميل', true); return; }
  if(!(amt > 0)){ toast('اكتب المبلغ', true); return; }
  // التاريخ: لو النهارده → دلوقتي بالظبط · لو يوم قبل كده → ضهر اليوم ده
  const today = cairoDay();
  const when = (!PAY.date || PAY.date === today) ? null : new Date(PAY.date + 'T12:00:00+03:00').toISOString();
  if(!confirm(`${PAY_T[PAY.type][0]} ${fmt(amt)} ج.م — ${c.name}\n${when ? 'بتاريخ ' + PAY.date + '\n' : ''}نسجّل؟`)) return;
  PAY.busy = true; setSheetBody(payHtml());
  try{
    const r = await rpc('erp_ledger_post', { p_customer:c.id, p_type:PAY.type, p_amount:amt, p_note:PAY.note || '', p_date:when });
    closeSheet();
    toast('✅ اتسجّلت — الرصيد دلوقتي ' + fmt(r && r.balance) + ' ج.م');
    const wa = PAY.type === 'credit' && PAY.wa;
    await load();
    // 💬 بعد الحفظ عن قصد (نفس درس الشاشة القديمة: الواتس بيخلّي الصفحة تنام)
    if(wa) sendPaymentNotice(c, amt, Number(r && r.balance) || 0);
  }catch(e){ PAY.busy = false; setSheetBody(payHtml()); toast(errMsg(e), true); }
}

  }catch(e){ toast(errMsg(e), true); }
}

async function newCustGo(){
  const name = String($('nName').value || '').trim();
  const on = document.querySelector('#cKind .chip.on');
  const terms = String($('nTerms').value).trim(), op = num($('nOpen').value);
  if(name.length < 2){ toast('اكتب الاسم', true); return; }
  try{
    const c = await rpc('erp_customer_create', { p_name:name, p_kind: on ? on.dataset.k : 'shop', p_phone:$('nPhone').value || '',
      p_terms_days: terms === '' ? null : Math.round(num(terms) || 0), p_credit_limit:null, p_note:'' });
    if(op > 0) await rpc('erp_ledger_post', { p_customer:c.id, p_type:'opening', p_amount:op, p_note:'رصيد افتتاحي سابق (قبل السيستم)', p_date:null });
    toast('➕ اتضاف ' + c.code); await load(); openCust(c.id, 'led');
  }catch(e){ toast(errMsg(e), true); }
}

// 📄📊 الكشف PDF / Excel — بنفس كود الكشف القديم (accounts.js)
// ------------------------------------------------------------
// 🧸 بنحط حركات العميل في «ledger» (اللي accounts.js بيقرا منه)
//    وكلها باسم العميل الحالي — عشان «حفيلة» و«حفيله» يطلعوا كشف واحد.
//    وبنجيب أجهزته عشان تاريخ الدخول والخروج والعطل يطلعوا صح.
// ============================================================
async function prepStatement(){
  if(!LED || LED.err) await loadLed();
  if(!LED || LED.err) throw new Error('الكشف لسه ما اتحمّلش');
  const act = LED.filter(l => !l.removed_at);
  ledger = act.map(l => Object.assign({}, l.raw, { shop: CUR.name }));
  const ids = [...new Set(act.map(l => l.device_id).filter(Boolean))];
  devices = [];
  for(let i = 0; i < ids.length; i += 100){
    const { data, error } = await sb.from('devices_data').select('id,data').in('id', ids.slice(i, i + 100));
    if(error) throw error;
    (data || []).forEach(r => devices.push(Object.assign({}, r.data || {}, { id: r.id })));
  }
}
async function printCust(fmtK){
  try{
    toast('⏳ بنجهّز الكشف…');
    await prepStatement();
    accRangeShop(fmtK, CUR.name);
  }catch(e){ toast(errMsg(e), true); }
}

// ============================================================
// 💬 واتساب
// ============================================================
function phoneOf(c){
  if(!c) return '';
  if(c.phone) return c.phone;
  // الرقم القديم (اتحفظ من «📒 الحسابات» القديمة باسم المحل زي ما اتكتب)
  for(const a of aliasesOf(c.id)){
    for(const k of Object.keys(PHONES || {})){ if(norm(k) === a.alias_norm && PHONES[k]) return PHONES[k]; }
  }
  return '';
}
function waPhone(raw){
  let p = String(raw||'').replace(/[^\d]/g,'');
  if(!p) return '';
  if(p.startsWith('00')) p = p.slice(2);
  if(p.startsWith('20')) return p;
  if(p.startsWith('0'))  return '2' + p;
  return p;
}
async function ensurePhone(c){
  let ph = phoneOf(c);
  if(ph) return ph;
  ph = (prompt(`رقم واتساب «${c.name}»:`) || '').trim();
  if(!ph) return '';
  try{ await rpc('customer_update', updArgs(c, { p_phone: ph })); c.phone = ph; }catch(e){ toast(errMsg(e), true); }
  return ph;
}
function openWa(phone, msg){
  const p = waPhone(phone); if(!p) return;
  const text = encodeURIComponent(msg);
  let web = false; try{ web = localStorage.getItem('ifix_wa_mode') === 'web'; }catch(e){}
  if(web){ window.open('https://web.whatsapp.com/send?phone=' + p + '&text=' + text, '_blank'); return; }
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){ location.href = 'whatsapp://send?phone=' + p + '&text=' + text; return; }
  window.open('https://wa.me/' + p + '?text=' + text, '_blank');
}
async function waBalance(){
  const c = CUR; const ph = await ensurePhone(c); if(!ph) return;
  const act = (LED || []).filter(l => !l.removed_at && !LED.err);
  const debit = act.filter(l => Number(l.signed_amount) > 0).reduce((t, l) => t + Number(l.signed_amount), 0);
  const credit = act.filter(l => Number(l.signed_amount) < 0).reduce((t, l) => t - Number(l.signed_amount), 0);
  openWa(ph,
    `السلام عليكم 🌹\nده ملخص حسابكم عندنا في *FIX TEAM* لغاية ${new Date().toLocaleDateString('ar-EG')}:\n\n` +
    `إجمالي الأجهزة الآجلة: *${fmt(debit)} ج.م*\n` +
    `إجمالي المدفوع: *${fmt(credit)} ج.م*\n` +
    `المتبقي: *${fmt(debit - credit)} ج.م*\n\n` +
    `ولو حابين كشف الحساب التفصيلي PDF نبعتهولكم في نفس الشات 📄`);
}
// نفس رسالة «استلمنا دفعة» بتاعة الشاشة القديمة بالحرف
async function sendPaymentNotice(c, amount, balance){
  const ph = await ensurePhone(c); if(!ph) return;
  let day = '';
  try{ day = new Date().toLocaleDateString('ar-EG', { weekday:'long', year:'numeric', month:'long', day:'numeric' }); }
  catch(e){ day = new Date().toLocaleDateString('ar-EG'); }
  const L = ['السلام عليكم 🌹'];
  L.push(`تم استلام دفعة بمبلغ *${fmt(amount)} ج.م* من حسابكم لدى *شركة FIX TEAM للصيانة* يوم ${day} ✅`);
  if(balance > 0)      L.push(`📒 المتبقي على حسابكم: *${fmt(balance)} ج.م*`);
  else if(balance < 0) L.push(`📒 حسابكم خالص، وليكم رصيد عندنا *${fmt(-balance)} ج.م* 💚`);
  else                 L.push('📒 حسابكم بقى *خالص تمامًا* 🎉 متشكرين جدًا على التزامكم');
  L.push('نشكر ثقتكم، ونتمنى لكم يوم سعيد وشغل موفّق دايمًا 🌟');
  openWa(ph, L.join('\n'));
}

// 🔗 الدمج من الشيت: اختار المحل اللي هيفضل
// ============================================================
let MG = { from:null };
function openMerge(id){
  const c = byId(id); if(!c) return;
  MG = { from:c };
  const sug = suggestFor(c);
  Object.assign(PK, { q:'', sel: sug[0] || null, exclude: c.id });
  PK_RENDER = () => setSheetBody(mergeHtml());
  sheet('🔗 دمج «' + c.name + '»', mergeHtml());
}
function mergeHtml(){
  const f = MG.from;
  const sug = suggestFor(f).slice(0, 6);
  return `<div class="warnbox">«${escH(f.name)}» (${escH(f.code)}) هيختفي من القايمة، وكل حركاته (${(BAL[f.id] || {}).entries || 0}) وأشكال اسمه هتروح للمحل اللي هتختاره. لو طلع غلط بيتفك من «📜 الدمج».</div>
    ${sug.length && !PK.sel ? `<div class="sec-h">💡 شبهه<span class="rule"></span></div>${sug.map(x => `<button class="pick" onclick="pkPick('${x.id}')"><b>${escH(x.name)}</b> <span class="code">${escH(x.code)}</span></button>`).join('')}` : ''}
    ${pickerHtml('🏪 المحل اللي هيفضل')}
    <label class="f" style="margin-top:12px;"><span>📝 السبب</span><input id="mgWhy" value="نفس المحل — اتكتب بطريقتين"></label>
    <button class="big" onclick="mgGo()" ${PK.sel ? '' : 'disabled'}>${PK.sel ? '🔗 ادمجه في «' + escH(PK.sel.name) + '»' : 'اختار المحل الأول'}</button>`;
}
async function mgGo(){
  if(!PK.sel) return;
  const why = $('mgWhy').value;
  if(!confirm(`🔗 «${MG.from.name}» ← «${PK.sel.name}»\nمتأكد؟`)) return;
  await doMerge(MG.from.id, PK.sel.id, why);
}
async function doMerge(fromId, intoId, why){
  try{
    await rpc('customer_merge', { p_from:fromId, p_into:intoId, p_reason:why });
    closeSheet(); toast('🔗 اتدمجوا'); load();
  }catch(e){ toast(errMsg(e), true); }
}

// ============================================================
// 🪟 الشيت
// ============================================================
function sheet(title, body){
  const old = $('sheetOv'); if(old) old.remove();   // من غير ما نصفّر CUR / PK_RENDER
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'sheetOv';
  ov.onclick = e => { if(e.target === ov) closeSheet(); };
  ov.innerHTML = `<div class="sheet" dir="rtl"><div class="sh-h"><h3>${escH(title)}</h3><button class="sh-x" onclick="closeSheet()">✕</button></div><div class="sh-b" id="shBody">${body}</div></div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
}
function setSheetBody(html){ const b = $('shBody'); if(b) b.innerHTML = html; }
function closeSheet(){ const o = $('sheetOv'); if(o) o.remove(); document.body.style.overflow = ''; PK_RENDER = null; }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !document.getElementById('accRangeOv')) closeSheet(); });
</script>
