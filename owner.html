/* ============================================================
   🔐 صلاحيات المالك الإضافية
   ------------------------------------------------------------
   🧠 الخمس خانات (المشتريات · المخزن · مراجعة القطع · الحسابات ·
      الجرد) مش بتظهر لمجرد إن الحساب «مالك». بتظهر بس لو الأدمن
      فعّلها للحساب ده من لوحة الأدمن.

   ⚡ الأربع أسئلة بتتبعت **مع بعض** مش واحد ورا التاني.
      واحد ورا التاني = ٤ رحلات للسيرفر ورا بعض؛ على الموبايل دي
      ثانية أو اتنين على الفاضي. مع بعض = رحلة واحدة.

   🔒 والإخفاء ده شكل بس. القفل الحقيقي في قاعدة البيانات:
      has_cap بتسأل السيرفر، والسياسات بترفض أي قراءة أو كتابة
      مالهاش صلاحية — حتى لو حد عدّل الصفحة بإيده.

   ⚠️ لو الشبكة وقعت، الافتراضي **مقفول** مش مفتوح.
   ============================================================ */
async function applyCaps(){
  const show = sel => document.querySelectorAll(sel).forEach(el => el.style.display = '');
  const ask  = cap => sb.rpc('has_cap', { p_cap: cap })
                        .then(r => !!(r && r.data === true))
                        .catch(() => false);
  let pur = false, rev = false, acc = false, inv = false;
  try{
    [pur, rev, acc, inv] = await Promise.all([
      ask('purchases'), ask('parts_review'), ask('accounts_view'), ask('inventory_view')
    ]);
  }catch(e){ console.warn('الصلاحيات:', e); return; }

  CAN_PURCHASES = pur; CAN_PARTS_REVIEW = rev;
  CAN_ACCOUNTS  = acc; CAN_INVENTORY    = inv;

  if(pur){ loadPurchasesModule(); show('.cap-purchases'); }
  if(rev){
    // مراجعة القطع بتحتاج موديول المشتريات عشان الربط يشتغل
    if(!pur) loadPurchasesModule();
    show('.cap-partsreview');
  }

  // 🔴 ACC_CAN_EDIT = false **ثابتة** — زي صفحة الديسباتشر بالظبط.
  //    المالك بيشوف الحسابات ومش بيسجّل فيها دفعة ولا خصم.
  //    والسبب مش الشكل: accounts.js نفسه مفيهوش كود الكتابة،
  //    وسياسات قاعدة البيانات بترفض الكتابة على دفتر الحسابات
  //    من أي حد غير الأدمن والمحاسب. تلات طبقات مستقلة.
  ACC_CAN_EDIT = false;
  if(acc){
    show('.cap-accounts');
    // ⚠️ لو accounts.js مارفعش على السيرفر، loadLedger مش هتبقى
    //    موجودة — والنداء عليها من غير الفحص ده كان هيوقّع الصفحة.
    if(typeof loadLedger === 'function') loadLedger().catch(() => {});
  }
  if(inv) show('.cap-inventory');
}

async function boot(){
  if(!navigator.onLine){
    const c = localStorage.getItem(CACHE_KEY), u = localStorage.getItem('ifix_owner_me');
    if(c && u){
      try{
        const p = JSON.parse(u); ME = p.name || ''; MY_TECH = ME; MY_EMAIL = p.email || '';
        devices = (JSON.parse(c) || []).map(adapt); reindexSearch();
        offline = true; showOffline(); finish(); return;
      }catch(e){}
    }
    location.replace('index.html'); return;
  }

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace('index.html'); return; }

  // ═══════════════════════════════════════════════════════════
  // بوابة الاشتراك
  // -----------------------------------------------------------
  // ⚠️ لازم تكون هنا، مش جوه الكود اللي بيقرا app_data تحت.
  //    لأن app_data نفسه بيتقفل مع انتهاء المدة، فالفحص اللي
  //    جواه مكانش بيشتغل أصلاً — والصفحة كانت هتفضل فاضية من
  //    غير ما المستخدم يعرف السبب.
  //    جدول shop بيتقرا دايماً، فهو المكان الصح للفحص.
  // ═══════════════════════════════════════════════════════════
  try{
    const { data:sh } = await sb.from('shop')
      .select('paid_until, trial_until').eq('id',1).maybeSingle();
    if(sh){
      const nowT = new Date();
      const okPaid  = !!(sh.paid_until  && new Date(sh.paid_until)  > nowT);
      const okTrial = !!(sh.trial_until && new Date(sh.trial_until) > nowT);
      if(!okPaid && !okTrial){ try{ showServiceStopped(false); }catch(e){} return; }
    }
  }catch(e){ console.error('[الاشتراك] فشل فحص المدة:', e); }

  MY_EMAIL = (session.user.email || '').toLowerCase();

  // الدور والاسم الظاهر — من نفس مكان باقي الشاشات
  let role = 'accountant', dispName = '';
  try{
    const { data:row } = await sb.from('app_data').select('value').eq('key','user-roles').maybeSingle();
    const roles = (row && row.value) ? JSON.parse(row.value) : {};
    userRoles = roles;                       // محتاجينها لقايمة الفنيين
    const ent = roles[MY_EMAIL];
    if(typeof ent === 'string') role = ent;
    else if(ent && typeof ent === 'object'){
      role = ent.role || 'accountant';
      dispName = (ent.techName || '').trim();
    }
  }catch(e){ console.error('user-roles:', e); }

  if(role !== 'owner'){ location.replace('dashboard.html'); return; }

  // 🔴 من غير اسم ظاهر، تبويب «أجهزتي» مستحيل يلاقي حاجة —
  //    لأن الربط بيتم بمقارنة الاسم المكتوب على الجهاز.
  //    فبنوقف هنا برسالة واضحة بدل تبويب فاضي محدش يفهمه.
  if(!dispName){
    veilFail('حسابك مسجّل كمالك بس مفيش <b>اسم ظاهر</b> مربوط بيه.<br>' +
             'الاسم ده هو اللي بيربط أجهزتك بحسابك.<br>' +
             'كلّم الإدارة تظبّطه من لوحة الأدمن.<br><br>' +
             '<a href="index.html">تسجيل الخروج</a>');
    return;
  }
  ME = dispName; MY_TECH = dispName;

  // 👤 خانة «حسابي» — بتظهر بس لو وصله منشور خطط الاشتراك
  try{ syncAccountShared(MY_EMAIL, ME, 'المالك'); }catch(e){}

  // 🔐 الصلاحيات الإضافية — **من غير await** عن قصد.
  //    كانت بتستنّى ٤ ردود من السيرفر ورا بعض قبل ما الصفحة ترسم،
  //    فشاشة «جاري التحميل» كانت بتفضل واقفة ثواني زيادة على الفاضي.
  //    الخانات دي مخبّية جوه قايمة التلت نقط أصلاً — محدش محتاجها
  //    في أول لحظة. فالصفحة بترسم، وهي بتظهر لوحدها لما الرد يوصل.
  applyCaps();

  localStorage.setItem('ifix_owner_me', JSON.stringify({ name:ME, email:MY_EMAIL }));
  loadNotices();   // من غير await — ما توقفش عرض الصفحة

  // نحدّث الدور المخزّن — الداشبورد بيستخدمه في التحويل المبكّر،
  // فلو المالك ما فتحش الداشبورد تاني يفضل التحويل شغال
  try{
    localStorage.setItem('ifix-last-role', 'owner');
    localStorage.setItem('ifix-last-email', MY_EMAIL);
    sessionStorage.removeItem('ifix-bounced');
  }catch(e){}

  loadTechNames();          // مش await — القايمة تتعبّى في الخلفية
  await loadDevices();
  finish();
}

function finish(){
  booted = true;
  const nm = $('ownName');
  if(nm) nm.textContent = ME;
  render();
  $('veil').classList.add('gone');
  // 💰 العدّاد اللي جنب «تسعير أجهزة» في قايمة التلت نقط.
  //    بيتنده من غير await عن قصد — لو فشل، الصفحة تكمّل عادي.
  try{ pzRefreshBadge(); }catch(e){}
  // شريط STAGING في common.js (موحّد في كل الصفحات)
}

/* ============================================================
   التحديث
   ------------------------------------------------------------
   مفيش اشتراك Realtime على الأجهزة — بياكل حصة الـRealtime على
   الخطة المجانية وكان سبب مشترك في «تجاوز الحصة».
   البديل: تحديث لما ترجع للصفحة + زرار تحديث يدوي.
   ============================================================ */
async function refresh(){
  if(!booted || !navigator.onLine) return;
  await loadDevices();
  render();
  try{ pzRefreshBadge(); }catch(e){}
}

// ⚠️ كبح ضروري. المالك شغال على موبايل: بيقفل الشاشة، بيرد على
//    واتساب، بيفتح الكاميرا، بيرجع — مية مرة في اليوم. وكل رجوع
//    كان بيعمل تحميل كامل. بألف جهاز الرد ~٧٠٠ كيلو، يعني مئات
//    الميجات في اليوم من حساب واحد.
//    دقيقة ونص كفاية: الجهاز الجديد بيتسجّل عنده هو، والباقي
//    تغييرات مش لحظية.
const REFRESH_MIN_MS = 90000;
let lastLoadAt = 0;
function refreshIfStale(){
  if(Date.now() - lastLoadAt < REFRESH_MIN_MS) return;
  refresh();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshIfStale(); });
addEventListener('online', refresh);
addEventListener('offline', () => { offline = true; showOffline(); });

// شبكة أمان: ما نسيبش المستخدم ورا الستارة للأبد
setTimeout(() => {
  const v = $('veil');
  if(v && !v.classList.contains('gone')){
    veilFail('التحميل واخد وقت أطول من المعتاد.<br><a href="index.html">تسجيل الدخول تاني</a>');
  }
}, 15000);

/* ============================================================
   الحفظ — كله عبر device_patch
   ============================================================ */
// الملاحظات المتولّدة من النظام بتتخزّن **مركّبة** (kind + args) مش
// نص جاهز — عشان اللي بيقرا يشوفها بلغته هو، مش بلغة اللي عملها.
// الـtext بيتحفظ كاحتياطي: للملاحظات القديمة، وللشاشات اللي
// مبتعرفش تفكّ التركيب (زي تقارير الإكسل).
const mkNote = (txt, kind, args) => {
  const n = { text:txt, at:nowIso(), by:ME, role:'المالك' };
  if(kind){ n.kind = kind; n.args = args || {}; }
  return n;
};
const noteText = n => (n && n.kind && window.I18N && I18N.has(n.kind))
  ? t(n.kind, n.args || {}) : (n ? n.text : '');

async function patch(id, p){
  if(!navigator.onLine){ toast('مفيش نت — التعديل مش هيتحفظ'); return false; }
  const { error } = await sb.rpc('device_patch', { p_id:id, p_patch:p });
  if(error){ toast('فشل الحفظ: ' + esc(error.message || error)); return false; }
  return true;
}

/* ============================================================
   🔴 قاعدة الملاحظات — أهم قاعدة في الملف
   ------------------------------------------------------------
   أي ملاحظة جديدة بتتضاف على **نسخة السيرفر** مش نسخة الصفحة.

   ليه؟ activityNotes بتتحفظ كقايمة كاملة — يعني اللي بنبعته
   **بيحلّ محل** اللي على السيرفر. ولو بعتنا نسخة الصفحة:
     ١) الصفحة مفيهاش ريل تايم — لو المحاسب أو الفني كتب ملاحظة
        من ساعة، مش عندنا → هتتمسح.
     ٢) لو الصفحة اتفتحت من غير نت، الأجهزة جاية من الكاش اللي
        بيحتفظ بآخر ٨ ملاحظات بس → الباقي هيتمسح.

   زي ما تكتب على صورة آخر ٨ صفحات من الكشكول وتبعتها بدل
   الكشكول. فبنجيب الكشكول الأصلي الأول ونكتب في آخره.

   ⚠️ لو معرفناش نجيبه → **مبنحفظش**. ملاحظة متأخرة أحسن من
      ملاحظات ممسوحة.
   ============================================================ */
async function notesWith(id, note){
  try{
    const { data, error } = await sb.from('devices_owner')
      .select('n:data->activityNotes').eq('id', id).maybeSingle();
    if(error) throw error;
    if(!data) throw new Error('الجهاز مش موجود');
    const fresh = Array.isArray(data.n) ? data.n : [];
    return [...fresh, note];
  }catch(e){
    console.error('notesWith:', e);
    toast('⚠️ مقدرناش نجيب ملاحظات الجهاز من السيرفر — جرّب تاني');
    return null;
  }
}

// ⚠️ Supabase مبيرميش خطأ لو السيرفر تجاهل حقل (لو الحقل مش في
//    قايمة المسموح للدور). فبعد الحفظ بنقرا الحقل ده بس ونتأكد
//    إنه اتكتب. لو القراية نفسها فشلت (نت) بنعدّيها — الحفظ قال
//    إنه نجح.
async function verifyField(id, key, expected, label){
  try{
    const { data, error } = await sb.from('devices_owner')
      .select('v:data->>' + key).eq('id', id).maybeSingle();
    if(error) throw error;
    if(!data || (data.v || '') !== expected){
      toast('⚠️ السيرفر مسجّلش ' + label + ' — الحقل «' + key + '» مش مسموح. بلّغ الإدارة');
      console.error(key + ' لم يُحفظ:', id, data);
      return false;
    }
  }catch(e){ console.error('تأكيد ' + key + ':', e); }
  return true;
}

async function verifyNotes(id, expectedLen){
  try{
    const { data, error } = await sb.from('devices_owner')
      .select('n:data->activityNotes').eq('id', id).maybeSingle();
    if(error) throw error;
    const len = (data && Array.isArray(data.n)) ? data.n.length : -1;
    if(len < expectedLen){
      toast('⚠️ السيرفر مسجّلش الملاحظة — بلّغ الإدارة');
      console.error('activityNotes لم تُحفظ:', id, len, expectedLen);
      return false;
    }
  }catch(e){ console.error('تأكيد الملاحظة:', e); }
  return true;
}

/* ===== توست ===== */
let toastT;
function toast(msg){
  const el = $('toast'); el.innerHTML = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

/* ===== الخروج ===== */
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  try{
    localStorage.removeItem('ifix_owner_me');
    localStorage.removeItem(CACHE_KEY);
    // ⚠️ مهم: لازم نمسح الدور المخزّن. من غير كده لو حد تاني سجّل
    //    دخول من نفس الجهاز، الداشبورد هيحوّله لصفحة المالك بالغلط.
    sessionStorage.removeItem('ifix-bounced');
  }catch(e){}
  location.replace('index.html');
}

/* ============================================================
   البحث
   ------------------------------------------------------------
   الفهرس بيتبني مرة واحدة بعد كل تحميل بدل ما يتحسب مع كل
   ضغطة زرار. على ألف جهاز الفرق ملحوظ على الموبايل.
   ⚠️ العطل لازم يكون في الفهرس **وفي** قايمة الاحتياطي تحت —
      الفهرس هو اللي بيشتغل فعلياً، فلو زوّدناه في الاحتياطي بس
      البحث بالعطل مش هيشتغل خالص.
   ============================================================ */
function reindexSearch(){
  try{
    if(window.IFixSearch)
      IFixSearch.index(devices, d => [d.type, d.model, d.customer, d.shop,
        d.phone, d.tech, d.by, d.issue, d.serial], true);
  }catch(e){}
}

function matchDev(d, q){
  if(!q) return true;
  if(window.IFixSearch && IFixSearch.isIndexed(d)) return IFixSearch.matchIndexed(q, d);
  const fields = [d.type,d.model,d.customer,d.shop,ticketNo(d.id),d.issue,d.serial,d.tech];
  if(window.IFixSearch) return IFixSearch.match(q, fields);
  return fields.some(v => v && String(v).includes(q));
}

function statusPill(st){
  const s = ST[st] || {label:st, c:'--muted'};
  return `<span class="tk-status" style="--st:var(${s.c}); --st-bg:var(${s.c}-bg);">${esc(s.label)}</span>`;
}

/* ============================================================
   🚦 كارت الديسباتشر — للتلات تبويبات
   ------------------------------------------------------------
   الأزرار: تسليم · رفض · تفاصيل
   ⚠️ التسليم والرفض **طلبات اعتماد** مش تغيير حالة. المحاسب
      هو اللي بيوافق من الداشبورد. ولو فيه طلب معلّق، الأزرار
      بتختفي — مينفعش طلبين على نفس الجهاز.
   ============================================================ */
function dispTicket(d){
  const s = ST[d.status] || {c:'--muted'};
  const delivered = d.status === 'delivered';
  const pend = d.pending
    ? `<div class="pend">⏳ ${d.pending.type === 'return' ? 'طلب إرجاع' : (d.pending.type === 'reject' ? 'طلب رفض' : 'طلب تسليم')} بانتظار اعتماد المحاسب
        <span style="font-weight:700;opacity:.8;">· ${esc(d.pending.requestedBy||'')}</span></div>`
    : '';
  const actions = d.pending ? ''
    : delivered
    ? `<div class="tk-actions">
         <button class="act act-ret" onclick="event.stopPropagation();requestApproval('${d.id}','return')">↩️ إرجاع</button>
         <button class="act act-view" onclick="event.stopPropagation();showInfo('${d.id}')">تفاصيل</button>
       </div>`
    : `<div class="tk-actions">
         <button class="act act-hand" onclick="event.stopPropagation();requestApproval('${d.id}','handover')">📦 تسليم</button>
         <button class="act act-rej" onclick="event.stopPropagation();requestReject('${d.id}')">🚫 رفض</button>
         <button class="act act-view" onclick="event.stopPropagation();showInfo('${d.id}')">تفاصيل</button>
       </div>`;
  // 🔑 لو الجهاز ده عليه اسمه هو كفني، بنعلّمه — عشان يعرف إنه
  //    موجود في تبويب «أجهزتي» كمان ومايتلغبطش
  const crown = d.isMine ? `<span class="tk-own">🔑 إنت الفني</span>` : '';
  return `<div class="ticket" style="--sp:var(${s.c});" onclick="showInfo('${d.id}')">
    <div class="tk-top"><span class="tk-no">${ticketNo(d.id)}</span>${statusPill(d.status)}</div>
    <div class="tk-title">${esc(d.type)} ${esc(d.model)}</div>
    <div class="tk-sub">${esc(d.customer)}${d.shop?`<span class="dot">•</span>${esc(d.shop)}`:''}</div>
    ${d.issue?`<div class="tk-issue"><span class="w">🛠️</span><span>${esc(d.issue)}</span></div>`:''}
    <div class="tk-meta">
      <span class="chip">سجّلها: <b>${esc(d.by === ME ? 'إنت' : d.by)}</b></span>
      ${d.tech?`<span class="chip">الفني: <b>${esc(d.tech)}</b></span>`
              :`<span class="chip" style="color:var(--waiting);">لسه من غير فني</span>`}
      ${crown}
      <span>· ${fmtDate(d.intake)}</span>
    </div>
    ${pend}
    ${actions}
  </div>`;
}

/* ============================================================
   🔧 كارت الفني — لتبويب «أجهزتي»
   ------------------------------------------------------------
   نفس كارت صفحة الفني بالحرف: الباسورد ظاهر، وسبب الرجوع لو
   الجهاز مرتجع، والأزرار شغل ورشة مش شغل تسليم.

   ⚠️ مفيش زرار «تسليم» هنا عن قصد. التسليم من تبويب الديسباتشر
      (وبيمر على اعتماد المحاسب). الفصل ده بيمنع المالك يخلط
      بين إنه بيصلّح الجهاز وإنه بيسلّمه للعميل.

   ⚠️ الجهاز المرتجع: بنخفي «جاري العمل» بس. «تم الإصلاح» بتحوّله
      لـdone ويخرج من المرتجعات — والمحاسب بيشوفه في شاشته
      معلّم إنه كان مرتجع.
   ============================================================ */
function techTicket(d){
  const s = ST[d.status] || {c:'--muted'};
  const isRet = d.status === 'returned';
  const lock = d.lockText
    ? `<div class="tk-lock">🔒 <b>${esc(d.lockText)}</b></div>`
    : (d.lockType === 'pattern' || d.lockType === 'image')
      ? `<div class="tk-lock">🔒 <span style="font-size:11.5px;">افتح التفاصيل تشوف النمط</span></div>`
      : '';
  const assisting = d.tech !== MY_TECH;   // هو مساعد مش أساسي
  const actions = assisting
    ? `<div class="assist-tag">🤝 إنت مساعد — الفني الأساسي: ${esc(d.tech || '—')}</div>`
    : `<div class="tk-actions">
        ${(!isRet && d.status !== 'repairing')
          ? `<button class="act act-work" onclick="event.stopPropagation();setStatus('${d.id}','repairing')">🔧 جاري العمل</button>` : ''}
        ${(d.status !== 'done')
          ? `<button class="act act-done" onclick="event.stopPropagation();setStatus('${d.id}','done')">✅ تم الإصلاح</button>` : ''}
        <button class="act act-prob" onclick="event.stopPropagation();editIssue('${d.id}')">🛠️ تعديل العطل</button>
        <button class="act act-rej" onclick="event.stopPropagation();rejectDevice('${d.id}')">🗄️ درج الرفض</button>
      </div>`;
  const retNote = isRet
    ? `<div class="tk-issue" style="color:var(--returned);font-weight:800;"><span class="w">🔁</span><span>${
        (d._raw && (d._raw.returnComplaint || d._raw.discoveredFault))
          ? esc('سبب الرجوع: ' + (d._raw.returnComplaint || d._raw.discoveredFault))
          : 'الجهاز رجع — محتاج مراجعة'}</span></div>`
    : '';
  return `<div class="ticket" style="--sp:var(${s.c});" onclick="openTechSheet('${d.id}')">
    <div class="tk-top"><span class="tk-no">${ticketNo(d.id)}</span>${statusPill(d.status)}</div>
    <div class="tk-title">${esc(d.type)} ${esc(d.model)}</div>
    <div class="tk-sub">${esc(d.customer)}${d.shop?`<span class="dot">•</span>${esc(d.shop)}`:''}</div>
    ${d.issue?`<div class="tk-issue"><span class="w">🛠️</span><span>${esc(d.issue)}</span></div>`:''}
    ${retNote}
    ${lock}
    ${actions}
  </div>`;
}

/* ============================================================
   الرسم
   ============================================================ */
let flash = '';   // شريط أخضر مؤقت (جهاز خرج من قايمتي)

function render(){
  const q = ($('q').value || '').trim();

  // التبويبات بعدّاداتها — العدّاد **مش** بيتأثر بالبحث عن قصد،
  // عشان تعرف إن فيه ٥ أجهزة في التبويب التاني وإنت بتدوّر
  $('tabs').innerHTML = TABS.map(tb => {
    const n = devices.filter(tb.filter).length;
    return `<div class="tab ${tb.crown?'mine':''} ${activeTab===tb.key?'on':''}"
                 onclick="activeTab='${tb.key}';render()">
      <span class="cnt">${n}</span><span>${tb.crown?'🔑 ':''}${tb.label}</span>
    </div>`;
  }).join('');

  const tab = curTab();

  // ⚠️ الترتيب بآخر تعديل مش بتاريخ الاستلام.
  //    الجهاز اللي اتلمس دلوقتي هو اللي بتدوّر عليه — مش اللي
  //    اتسجّل الصبح وسايب من ساعتها.
  //    lastModifiedAt ممكن يكون فاضي على الأجهزة القديمة، فبننزل
  //    لتاريخ الاستلام بدل ما نحطهم آخر القايمة بالغلط.
  const touch = x => new Date((x._raw && x._raw.lastModifiedAt) || x.intake || 0);
  const list = devices.filter(tab.filter).filter(d => matchDev(d, q))
                      .sort((a,b) => touch(b) - touch(a));

  const cardFn = tab.mode === 'tech' ? techTicket : dispTicket;

  const emptyMsg = q ? 'مفيش نتايج للبحث ده'
    : activeTab === 'mine' ? 'مفيش أجهزة عليها اسمك كفني دلوقتي'
    : activeTab === 'reg'  ? 'لسه ما سجّلتش أي جهاز — ابدأ بـ«جهاز جديد»'
    : activeTab === 'out'  ? 'مفيش أجهزة اتسلّمت في آخر شهر'
    : 'مفيش أجهزة في المحل دلوقتي';

  $('app').innerHTML =
    (flash ? `<div class="flash">✅ ${esc(flash)}</div>` : '')
    + (list.length
       ? `<div class="grid">${list.map(cardFn).join('')}</div>`
       : `<div class="empty"><span class="big">${q?'🔍':(activeTab==='mine'?'🔧':(activeTab==='out'?'📦':'🗂️'))}</span>${emptyMsg}</div>`);
}

/* ============================================================
   أسماء الفنيين — نفس مصدر باقي الشاشات بالظبط
   ------------------------------------------------------------
     ١) فنيين ليهم حسابات (user-roles، role = technician أو owner)
     ٢) فنيين معلّقين (pending-technicians) لسه مستنيين إيميل

   ⚠️ 'owner' جوه القايمة عن قصد: المالك نفسه فني، فلازم يظهر
      في قايمة الاختيار — يعني يقدر يسجّل جهاز على نفسه.

   الحقل اختيار مقفول — مفيش كتابة حرة عشان مايحصلش تكرار ولا
   أخطاء إملائية في الأسماء (الاسم هو اللي بيربط الجهاز بالحساب).
   ============================================================ */
let pendingTechs = [];

async function loadTechNames(){
  try{
    const { data } = await sb.from('app_data').select('value')
      .eq('key','pending-technicians').maybeSingle();
    pendingTechs = (data && data.value) ? (JSON.parse(data.value) || []) : [];
  }catch(e){ pendingTechs = []; }
  renderTechSelect();
}

function accountTechNames(){
  return Object.values(userRoles)
    .map(v => (typeof v === 'string') ? null : v)
    .filter(v => v && (v.role === 'technician' || v.role === 'owner') && v.techName)
    .map(v => String(v.techName).trim()).filter(Boolean);
}

function allTechNames(){
  const acc = [...new Set(accountTechNames())].sort((a,b) => a.localeCompare(b,'ar'));
  const accSet = new Set(acc);
  const pend = [...new Set(pendingTechs.map(x => (x.name||'').trim())
                 .filter(n => n && !accSet.has(n)))].sort((a,b) => a.localeCompare(b,'ar'));
  return acc.map(n => ({name:n, pending:false}))
      .concat(pend.map(n => ({name:n, pending:true})));
}

function renderTechSelect(){
  const sel = $('f_tech'); if(!sel) return;
  const cur = sel.value;
  const list = allTechNames();
  // 🔑 اسمي الأول في القايمة — أغلب الوقت المالك بيسجّل على نفسه
  const mine = list.filter(x => x.name === MY_TECH);
  const rest = list.filter(x => x.name !== MY_TECH);
  sel.innerHTML = '<option value="">— اختار الفني —</option>'
    + mine.map(x => `<option value="${esc(x.name)}">🔑 ${esc(x.name)} (إنت)</option>`).join('')
    + rest.map(x => `<option value="${esc(x.name)}">${esc(x.name)}${x.pending?' ⏳':''}</option>`).join('');
  if(cur) sel.value = cur;

  // مفيش فنيين خالص؟ نوضّح إيه المطلوب بدل قايمة فاضية صامتة
  const hint = $('f_techHint');
  if(hint){
    hint.textContent = list.length ? '' : 'مفيش فنيين مسجّلين — كلّم الإدارة تضيف فني من لوحة الأدمن';
    hint.style.display = list.length ? 'none' : 'block';
  }
}

/* ============================================================
   مسح الباركود بالكاميرا
   ------------------------------------------------------------
   الباركود على الليبل فيه كود الجهاز. بنطابق بالأرقام: مبتتأثرش
   بلغة الكيبورد ولا بالمسافات — نفس أسلوب باقي الشاشات.
   ============================================================ */
function scanFind(text){
  const raw = String(text || '').trim();
  if(!raw) return null;
  const digits = raw.replace(/[^0-9]/g, '');
  if(digits.length >= 10){
    const byDigits = devices.find(d => {
      const idd = String(d.id).replace(/[^0-9]/g, '');
      return idd && (idd === digits || idd.endsWith(digits) || digits.endsWith(idd));
    });
    if(byDigits) return byDigits;
  }
  const up = raw.toUpperCase().replace(/^#/, '');
  return devices.find(d =>
    String(d.id).toUpperCase() === up ||
    String(d.id).slice(-5).toUpperCase() === up) || null;
}

function scanWithCamera(){
  if(!window.IFixScan) return;
  IFixScan.open(text => {
    const hit = scanFind(text);
    // الجهاز بتاعي كفني؟ نفتح شيت الفني. غير كده شيت الديسباتشر.
    if(hit) return hit.isMine ? openTechSheet(hit.id) : showInfo(hit.id);
    // مفيش نتيجة؟ نحط النص في البحث بدل ما نسيب المستخدم في اللاشيء
    const box = $('q');
    if(box){ box.value = text; render(); box.focus(); }
    toast('الكود ده مش في قايمتك');
  });
}

function mountScanBtn(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    const box = $('q');
    if(!box || !window.IFixScan) return;
    const b = IFixScan.mountButton(box, () => {});
    if(b) b.onclick = e => { e.preventDefault(); scanWithCamera(); };
  }catch(e){}
}

/* ============================================================
   شيت الأكشن العام
   ============================================================ */
function openAct(title, bodyHtml){
  $('actTitle').textContent = title;
  $('actBody').innerHTML = bodyHtml;
  $('actSheet').classList.add('on');
  $('actBg').classList.add('on');
}
function closeAct(){
  $('actSheet').classList.remove('on');
  $('actBg').classList.remove('on');
}
function actDevBlock(d){
  const name = [d.type, d.model].filter(Boolean).join(' ');
  const sub  = [d.customer, d.shop].filter(Boolean).join(' · ');
  return `<div class="act-dev"><span class="act-dev-ic">📱</span><div>
    <div class="act-dev-name">${esc(name)}</div>
    ${sub?`<div class="act-dev-sub">${esc(sub)}</div>`:''}</div></div>`;
}

// رقم الواتساب: مصر بتبدأ بصفر، وواتساب عايز كود الدولة
function waNum(tel){
  let n = String(tel || '').replace(/\D/g, '');
  if(n.startsWith('0')) n = '2' + n;          // 010… → 2010…
  else if(!n.startsWith('2')) n = '2' + n;
  return n;
}

/* ============================================================
   🚦 طلب اعتماد: تسليم / إرجاع
   ------------------------------------------------------------
   🔴 دي مش تغيير حالة — دي **طلب**. الجهاز بيفضل في مكانه،
      وبيتعلّم عليه «بانتظار اعتماد المحاسب»، والمحاسب هو اللي
      بيقرر من الداشبورد.

   ليه؟ لأن التسليم بيحرّك فلوس (سعر · فوري/آجل · حساب المحل).
   والمالك مايقدرش يأكد دفع — ده كان شرط أساسي في التصميم.
   ============================================================ */
async function requestApproval(id, kind){
  const d = devices.find(x => x.id === id); if(!d) return;
  if(d.pending){ toast('فيه طلب معلّق على الجهاز ده بالفعل ⏳'); return; }
  const isRet = kind === 'return';
  const accent = isRet ? '--returned' : '--repairing';
  const icon   = isRet ? '↩️' : '📦';
  openAct(isRet ? 'إرجاع' : 'تسليم', `
    ${actDevBlock(d)}
    <p class="act-note">${isRet
      ? 'طلب الإرجاع هيتبعت للمحاسب للاعتماد.'
      : 'طلب التسليم هيتبعت للمحاسب للاعتماد — هو اللي بيحدد السعر والدفع.'}</p>
    <button class="act-btn act-primary" style="background:var(${accent});"
            onclick="doApproval('${d.id}','${kind}')">${icon} ابعت الطلب</button>
    <button class="act-btn act-ghost" onclick="closeAct()">إلغاء</button>`);
}

async function doApproval(id, kind){
  const d = devices.find(x => x.id === id); if(!d){ closeAct(); return; }
  if(d.pending){ closeAct(); toast('فيه طلب معلّق بالفعل ⏳'); return; }
  const isRet = kind === 'return';
  const label = isRet ? 'إرجاع' : 'تسليم';
  const req = {
    id: 'apr_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    type: isRet ? 'return' : 'handover',
    requestedBy: ME,
    requestedByEmail: MY_EMAIL,
    requestedAt: nowIso(),
    // المالك مايحددش الدفع — المحاسب بيحدده وقت الاعتماد
    payload: { status: isRet ? 'returned' : 'delivered', paymentChoice: null },
    status: 'pending',
    decidedBy: null, decidedAt: null, reason: null
  };
  const notes = await notesWith(id, mkNote('⏳ طلب ' + label + ' — بانتظار اعتماد المحاسب'));
  if(!notes) return;

  if(!(await patch(id, { pendingApproval: req, activityNotes: notes,
                         lastModifiedAt: nowIso(), lastModifiedBy: ME }))) return;

  d.pending = req;
  if(d._raw){ d._raw.pendingApproval = req; d._raw.activityNotes = notes; }
  closeAct(); render();
  toast('اتبعت طلب ' + label + ' ' + (isRet ? '↩️' : '📦'));
}

/* ============================================================
   🚦 الرفض من تبويب الديسباتشر
   ------------------------------------------------------------
   بيسأل: الجهاز لسه في المحل ولا العميل خده؟ والفرق مهم —
   «درج الرفض» يعني لسه عندنا، و«اتسلّم» يعني خرج.
   وبرضه بيمر على اعتماد المحاسب.
   ============================================================ */
function requestReject(id){
  const d = devices.find(x => x.id === id); if(!d) return;
  if(d.pending){ toast('فيه طلب معلّق على الجهاز ده بالفعل ⏳'); return; }
  openAct('رفض', `
    ${actDevBlock(d)}
    <p class="act-q">الجهاز لسه في المحل، ولا العميل خده؟</p>
    <button class="act-btn act-drawer" onclick="doReject('${d.id}',true)">🗄️ لسه في المحل (درج الرفض)</button>
    <button class="act-btn act-out" onclick="doReject('${d.id}',false)">📤 العميل خده وخرج</button>
    <button class="act-btn act-ghost" onclick="closeAct()">إلغاء</button>`);
}

async function doReject(id, inShop){
  const d = devices.find(x => x.id === id); if(!d){ closeAct(); return; }
  if(d.pending){ closeAct(); toast('فيه طلب معلّق بالفعل ⏳'); return; }
  const req = {
    id: 'apr_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    type: 'reject',
    requestedBy: ME,
    requestedByEmail: MY_EMAIL,
    requestedAt: nowIso(),
    payload: { status: 'rejected', paymentChoice: null, rejectedInShop: !!inShop },
    status: 'pending',
    decidedBy: null, decidedAt: null, reason: null
  };
  const notes = await notesWith(id, mkNote('⏳ طلب رفض — بانتظار اعتماد المحاسب'));
  if(!notes) return;

  if(!(await patch(id, { pendingApproval: req, activityNotes: notes,
                         lastModifiedAt: nowIso(), lastModifiedBy: ME }))) return;

  d.pending = req;
  if(d._raw){ d._raw.pendingApproval = req; d._raw.activityNotes = notes; }
  closeAct(); render();
  toast('اتبعت طلب الرفض 🚫');
}

   🚦 تفاصيل الجهاز — شكل الديسباتشر

   فيها زرار اتصال وواتساب. ليه؟ الرقم مكتوب وبس مكانش بينفع
   تدوس عليه، والمالك بيكلّم عملاء طول اليوم.
   والأزرار (تسليم/إرجاع/رفض) **من هنا كمان** — قبل كده كانت
   على الكارت من برّه بس، فلو فتحت التفاصيل تتأكد كنت تقفل
   وتدوّر على الكارت تاني.
   ============================================================ */
function showInfo(id){
  const d = devices.find(x => x.id === id); if(!d) return;

      : `<button class="di-act di-hand" onclick="closeAct();requestApproval('${d.id}','handover')">📦 تسليم</button>

  openAct('تفاصيل', `
    <div class="di">

        <span class="info-chip" style="--st:var(${s.c}); --st-bg:var(${s.c}-bg);">${esc(s.label)}</span>
      </div>

      <div class="di-issue"><span>🛠️</span>
        <span class="di-issue-t">${d.issue ? esc(d.issue) : '<span style="color:var(--muted)">— مفيش عطل مكتوب</span>'}</span>
        <button class="di-edit" onclick="editIssue('${d.id}','disp')">✏️ ${d.issue ? 'تعديل' : 'اكتب'}</button>
      </div>

      <div class="di-card">
        <div class="di-card-h">👤 العميل</div>
        ${row('العميل', esc(d.customer || '—'))}
        ${row('المحل', d.shop ? esc(d.shop) : '')}
        ${row('التليفون', d.phone ? `<span dir="ltr">${esc(d.phone)}</span>` : '')}
        ${tel ? `<div class="di-contact">
          <a class="di-btn di-call" href="tel:${esc(tel)}">📞 اتصال</a>
          <a class="di-btn di-wa" target="_blank" rel="noopener" href="https://wa.me/${esc(waNum(tel))}">💬 واتساب</a>
        </div>` : ''}
      </div>

      <div class="di-card">
        <div class="di-card-h">🔧 الصيانة</div>
        ${row('🎨 اللون', esc(d.color || ''))}
        ${d.serial ? row('🔢 السريال', `<span style="font-family:var(--mono,monospace);direction:ltr;display:inline-block;">${esc(d.serial)}</span>`) : ''}

      <div class="di-card">
        <div class="di-card-h">🔒 باسورد الجهاز</div>

/* ============================================================
   🔩 قطع الغيار في التفاصيل — عرض بحت
   ------------------------------------------------------------
   partsComment هو اللي الفني كتبه بإيده من صفحته. تلات حالات:
     • فاضي          → الفني لسه ما ردّش
     • «مفيش»        → داس الزرار الأخضر: اتصلح من غير أي قطعة
     • أي كلام تاني  → القطع اللي جابها زي ما هي
   ⚠️ المالك بيشوف بس — الكتابة من صفحة الفني.
   ============================================================ */
function partsNorm(s){
  return String(s || '').replace(/[\s.,،!؟?\-—_]+/g, '').replace(/ه$/,'ة');
}
function partsIsNone(s){
  const t2 = partsNorm(String(s || '').split(' · 🏪')[0]);
  if(!t2) return false;                      // الفاضي حالة تانية خالص
  return ['مفيش','مافيش','مفيشحاجة','مافيشحاجة','لايوجد','لاشيء','لاشئ','لا','0','ولاحاجة',
          partsNorm('مفيش — الجهاز خلص ومحتاجش قطع غيار')].includes(t2);
}
function partsHtml(d){
  const cm = (d.parts || '').trim();
  const box = 'border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.7;';
  if(!cm){
    return `<div style="${box}background:var(--card);border:1px solid var(--line);color:var(--muted);">
      — الفني لسه ما كتبش قطع غيار للجهاز ده</div>`;
  }
  if(partsIsNone(cm)){
    return `<div style="${box}background:var(--done-bg);border:1px solid var(--done);">
      <b style="color:var(--done);">✅ الفني قال: الجهاز خلص ومحتاجش قطع غيار</b></div>`;
  }
  return `<div style="${box}background:var(--card);border:1px solid var(--line);white-space:pre-wrap;">
    🔩 ${esc(cm)}</div>`;
}

// الملاحظات — الأقدم فوق والأحدث تحت (نفس الداشبورد)
function notesHtml(d){
  const list = d.notes || [];
  if(!list.length) return `<div class="dn-empty">مفيش ملاحظات لسه</div>`;
  return `<div class="dn-list">${list.map(n => {
    let when = '';
    try{ when = new Date(n.at).toLocaleString('ar-EG', { timeZone:'Africa/Cairo' }); }catch(e){}
    return `<div class="dn">
      <div class="dn-t">${esc(noteText(n))}</div>
      <div class="dn-m">${esc(when)}${n.by ? ' — ' + esc(n.by) : ''}${n.role ? ' (' + esc(n.role) + ')' : ''}</div>
    </div>`;
  }).join('')}</div>`;
}

// ➕ إضافة ملاحظة من تفاصيل الديسباتشر
// ⚠️ الملاحظة **مبتحدّثش** lastModifiedAt عن قصد. الملاحظة كلام
//    عن الجهاز، مش تعديل فيه — فمبتغيّرش ترتيبه في القايمة.
async function addDispNote(id){
  const d = devices.find(x => x.id === id); if(!d) return;
  const ta = $('dnNew');
  const text = ((ta && ta.value) || '').trim();
  if(!text){ toast('اكتب الملاحظة الأول'); return; }

  const btn = $('dnGo'); if(btn) btn.disabled = true;
  const notes = await notesWith(id, mkNote(text));
  const ok = notes && await patch(id, { activityNotes: notes })
                   && await verifyNotes(id, notes.length);
  if(btn) btn.disabled = false;
  if(!ok) return;     // الكلام فاضل في المربع — ميضيعش

  if(!d._raw) d._raw = {};
  d._raw.activityNotes = notes;
  d.notes = notes.map(n => ({ by:n.by||'', role:n.role||'', at:n.at||'', text:n.text||'', kind:n.kind, args:n.args }));
  toast('📝 الملاحظة اتضافت');
  showInfo(id);
}

/* ============================================================
   ✏️ تعديل العطل — بيشتغل من التبويبين
   ------------------------------------------------------------
   `back` بيقول نرجع لأنهي شيت بعد الحفظ ('disp' أو 'tech').
   من غيره كنا هنرجع المالك لشاشة غلط ويلخبط.

   ⚠️ النص القديم **مش بيضيع**. بيتسجّل في سجل الجهاز قبل
      الكتابة، فأي حد يفتح السجل يشوف: كان كذا وبقى كذا ومين
      غيّره وإمتى. ده الفرق بين «تعديل» و«مسح».
   ============================================================ */
function editIssue(id, back){
  const d = devices.find(x => x.id === id); if(!d) return;
  openAct('🛠️ تعديل العطل', `
    ${actDevBlock(d)}
    <textarea id="deIssue" class="de-ta" maxlength="300" placeholder="اكتب العطل…">${esc(d.issue || '')}</textarea>
    <button class="act-btn act-primary" id="deGo" onclick="doEditIssue('${d.id}','${back || 'tech'}')">💾 حفظ العطل</button>
    <button class="act-btn act-ghost" onclick="backFrom('${d.id}','${back || 'tech'}')">إلغاء</button>`);
  // المؤشر في آخر الكلام — عشان يكمّل على طول
  setTimeout(() => { const ta = $('deIssue'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 250);
}

function backFrom(id, back){
  if(back === 'disp') showInfo(id);
  else { closeAct(); openTechSheet(id); }
}

async function doEditIssue(id, back){
  const d = devices.find(x => x.id === id); if(!d) return;
  const val = (($('deIssue') || {}).value || '').trim();
  if(!val){ toast('اكتب العطل'); return; }
  const old = (d.issue || '').trim();
  if(val === old){ backFrom(id, back); return; }

  const note = mkNote('🛠️ العطل اتعدّل: «' + (old || '—') + '» ← «' + val + '»');
  const btn = $('deGo'); if(btn) btn.disabled = true;
  const notes = await notesWith(id, note);
  const p = notes && { reportedIssue: val, activityNotes: notes,
                       lastModifiedAt: nowIso(), lastModifiedBy: ME };
  const ok = !!p && await patch(id, p) && await verifyField(id, 'reportedIssue', val, 'العطل');
  if(btn) btn.disabled = false;
  if(!ok) return;

  applyLocal(d, p);
  toast('✅ العطل اتعدّل');
  backFrom(id, back);
}

/* ============================================================
   🔄 تغيير الفني
   ------------------------------------------------------------
   🔒 مسموح **بس** والجهاز لسه شغّال: قيد الانتظار · جاري الكشف
      · جاري الصيانة.

   ⚠️ ليه؟ نقط الفني بتتحسب على اسم الفني المكتوب على الجهاز لما
      يخلص. لو غيّرنا فني جهاز خلص/اتسلّم، النقط (يعني فلوس)
      بتتنقل من فني لفني من غير ما المحاسب يعرف. والمرتجعات ليها
      نظام نقط خاص عند المحاسب.
      نفس القاعدة متطبّقة على السيرفر — مش على الشاشة بس.
   ============================================================ */
const TECH_EDITABLE = ['waiting','diagnosing','repairing'];
function canChangeTech(d){ return !!d && TECH_EDITABLE.includes(d.status); }
function techLockMsg(){ return '🔒 الجهاز ده مش في الصيانة — تغيير الفني بيحرّك النقط، فده من عند المحاسب'; }

function editTech(id){
  const d = devices.find(x => x.id === id); if(!d) return;
  if(!canChangeTech(d)){ toast(techLockMsg()); return; }
  const cur  = (d.tech || '').trim();
  const list = allTechNames().filter(x => x.name !== cur);
  if(!list.length){ toast('مفيش فنيين تانيين تنقل ليهم'); return; }
  openAct('🔄 تغيير الفني', `
    ${actDevBlock(d)}
    <div class="de-cur">الفني دلوقتي: <b>${esc(cur || 'لسه من غير فني')}</b></div>
    <select id="deTech" class="tech-select" style="margin-bottom:14px;">
      <option value="">— اختار الفني الجديد —</option>
      ${list.map(x => `<option value="${esc(x.name)}">${x.name === MY_TECH ? '🔑 ' : ''}${esc(x.name)}${x.name === MY_TECH ? ' (إنت)' : ''}${x.pending ? ' ⏳' : ''}</option>`).join('')}
    </select>
    <div class="de-hint">الجهاز هيختفي من عند «${esc(cur || '—')}» ويظهر عند الفني الجديد.</div>
    <button class="act-btn act-primary" id="deGo" onclick="doEditTech('${d.id}')">🔄 انقل الجهاز</button>
    <button class="act-btn act-ghost" onclick="showInfo('${d.id}')">إلغاء</button>`);
}

async function doEditTech(id){
  const d = devices.find(x => x.id === id); if(!d) return;
  const target = (($('deTech') || {}).value || '').trim();
  if(!target){ toast('اختار الفني الجديد'); return; }
  if(!canChangeTech(d)){ toast(techLockMsg()); return; }   // الحالة ممكن تكون اتغيّرت وهو فاتح الشيت
  const from = (d.tech || '').trim();
  if(target === from){ showInfo(id); return; }

  const raw = d._raw || {};
  const note = mkNote('🔄 الجهاز اتحوّل من «' + (from || '—') + '» لـ «' + target + '»');
  const btn = $('deGo'); if(btn) btn.disabled = true;
  const notes = await notesWith(id, note);
  const p = notes && { technician: target, activityNotes: notes,
                       lastModifiedAt: nowIso(), lastModifiedBy: ME };
  const ok = !!p && await patch(id, p) && await verifyField(id, 'technician', target, 'الفني الجديد');
  if(btn) btn.disabled = false;
  if(!ok) return;

  // لو الفني الجديد كان مساعد على نفس الجهاز، مبقاش مساعد — بقى
  // الأساسي. السيرفر بيعمل ده لوحده — إحنا بس بنحدّث الشاشة.
  if((raw.assistTechnician || '').trim() === target) p.assistTechnician = '';
  applyLocal(d, p);
  toast('🔄 الجهاز اتنقل لـ ' + target);
  showInfo(id);
}

// تحديث الجهاز في الذاكرة بعد الحفظ — عشان الشاشة تتحدّث من غير تحميل
function applyLocal(d, raw){
  if(!d._raw) d._raw = {};
  Object.assign(d._raw, raw);
  if('technician'    in raw){
    d.tech = (raw.technician || '').trim();
    // 🔑 الجهاز اتحوّل لي أو مني؟ علامة «أجهزتي» لازم تتحدّث فوراً
    d.isMine = (d.tech === MY_TECH) || (d.assist === MY_TECH);
  }
  if('assistTechnician' in raw){
    d.assist = (raw.assistTechnician || '').trim();
    d.isMine = (d.tech === MY_TECH) || (d.assist === MY_TECH);
  }
  if('reportedIssue' in raw) d.issue = raw.reportedIssue || '';
  if('partsComment'  in raw) d.parts = raw.partsComment || '';
  if('status'        in raw) d.status = raw.status;
  if('activityNotes' in raw){
    d.notes = (raw.activityNotes || []).map(n => ({
      by:n.by||'', role:n.role||'', at:n.at||'', text:n.text||'', kind:n.kind, args:n.args }));
  }
  // الفهرس بيتخزن على الجهاز نفسه — لازم يتبني تاني عشان البحث
  // بالفني/العطل الجديد يلاقيه
  try{ if(window.IFixSearch) IFixSearch.invalidate(d); }catch(e){}
  reindexSearch();
  render();
}

/* ============================================================
   معاينة وطباعة الليبل
   ------------------------------------------------------------
   المحرك كله في label.js (نفس ملف الداشبورد بالحرف)، فمفيش أي
   منطق طباعة هنا — الصفحة بتفتح المعاينة وبس.
   ⚠️ label.js بيقرا الحقول بأسماء النظام (deviceType · customerName)
      والصفحة دي بتخزّنها بأسماء مختصرة (type · customer). فبنبعتله
      السجل الخام لو موجود — وإلا بنركّب واحد بالأسماء الصح.
      من غير ده الليبل كان هيطلع فاضي من غير أي خطأ يظهر.
   ============================================================ */
function toggleLabel(id){
  const area = $('ownLabelArea');
  if(!area) return;
  if(area.innerHTML.trim() !== ''){ area.innerHTML = ''; return; }
  const d = devices.find(x => x.id === id);
  if(!d) return;
  const raw = d._raw || {
    id: d.id, deviceType: d.type, model: d.model,
    customerName: d.customer, shopName: d.shop,
    reportedIssue: d.issue, status: d.status, intakeDate: d.intake
  };
  try{ renderLabelInto('ownLabelArea', raw); }
  catch(e){ toast('مقدرناش نجهّز الليبل'); console.error('label:', e); }
}

/* ============================================================
   🔒 باسورد الجهاز — كتابة وعرض وتعديل
   ------------------------------------------------------------
   نوعين بيتكتبوا من هنا: «رقم/نص» و«نمط».
   (نوع «صورة» بيتعمل من الداشبورد بس — المالك بيشوفه للقراية
   ويقدر يستبدله.)

   النمط بيتحفظ حاجتين مع بعض:
     lockPattern = ترتيب النقط '1-5-9-6'  ← للتشغيل خطوة بخطوة
     lockImage   = صورة صغيرة للرسمة      ← الداشبورد وصفحة الفني
                   بيعرضوا النمط **من الصورة دي**. لو مبعتناش
                   الصورة، النمط هيبان فاضي عندهم.

   🔴 الباسورد **مش** بيتحمّل مع قايمة الأجهزة.
      الصور تقيلة، ولو كانت في الـview كانت هتتحمّل مع كل جهاز
      في كل تحديث. فبنجيبه لجهاز واحد بس لما تفتح تفاصيله —
      device_lock_get.
   ============================================================ */
let lockTab = 'text';
let patSeq  = [];
let patThumb = '';

// بنبني محتوى القفل بالـJS مش في الـHTML عشان نفس الشاشة تتركّب
// مرة في فورم الاستلام ومرة في شيت التعديل — من غير IDs مكررة.
function ownMountLock(hostId){
  ['ownLockHostIntake', 'ownLockHostEdit'].forEach(h => {
    const el = $(h); if(el && h !== hostId) el.innerHTML = '';
  });
  const host = $(hostId); if(!host) return;
  lockTab = 'text'; patSeq = []; patThumb = '';
  host.innerHTML = `
    <div class="lk-tabs">
      <button type="button" class="lk-tab on" id="ownLkT_text"    onclick="ownSetLockTab('text')">١٢٣ رقم / نص</button>
      <button type="button" class="lk-tab"    id="ownLkT_pattern" onclick="ownSetLockTab('pattern')">⠿ نمط</button>

function ownSetLockTab(k){
  lockTab = k;
  ['text','pattern'].forEach(x => {
    const tb = $('ownLkT_' + x); if(tb) tb.classList.toggle('on', x === k);
    const pn = $('ownLkP_' + x); if(pn) pn.style.display = x === k ? 'block' : 'none';
  });
  if(k === 'pattern') ownInitPattern();
}

function ownToggleLockEye(){
  const i = $('ownLkText'), e = $('ownLkEye'); if(!i) return;
  i.type = i.type === 'password' ? 'text' : 'password';
  if(e) e.textContent = i.type === 'password' ? '👁' : '🙈';   // ظاهر = الزرار بيخفي
}

// شبكة ٣×٣ — نفس منطق الداشبورد
function ownPatPoints(size){
  const g = size / 3, pts = [];
  for(let r = 0; r < 3; r++) for(let c = 0; c < 3; c++)
    pts.push({ n:r*3+c+1, x:g*c+g/2, y:g*r+g/2 });
  return pts;
}

function ownInitPattern(){
  const pad = $('ownPatPad'); if(!pad) return;
  const size = 190, pts = ownPatPoints(size);
  patSeq = []; patThumb = '';
  pad.style.width = size + 'px'; pad.style.height = size + 'px';
  pad.innerHTML = `<svg width="${size}" height="${size}" style="position:absolute;inset:0;">
    <polyline id="ownPatLine" fill="none" stroke="var(--repairing)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points=""/>
    ${pts.map(p => `<circle data-n="${p.n}" cx="${p.x}" cy="${p.y}" r="9" fill="var(--line)"/>`).join('')}
  </svg>`;
  const hint = $('ownPatHint'); if(hint) hint.textContent = 'ارسم النمط بإصبعك';
  const svg = pad.querySelector('svg'), line = pad.querySelector('#ownPatLine');
  const R = 30;
  const pos = e => { const r = svg.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  const hit = (x,y) => { for(const p of pts){ if(Math.hypot(p.x-x, p.y-y) < R && !patSeq.includes(p.n)) return p; } return null; };
  function redraw(cur){
    let str = patSeq.map(n => { const p = pts[n-1]; return p.x + ',' + p.y; }).join(' ');
    if(cur) str += ' ' + cur.x + ',' + cur.y;
    line.setAttribute('points', str);
    svg.querySelectorAll('circle').forEach(c =>
      c.setAttribute('fill', patSeq.includes(+c.dataset.n) ? 'var(--repairing)' : 'var(--line)'));
  }
  let drawing = false;
  svg.addEventListener('pointerdown', e => { e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    drawing = true; patSeq = []; const {x,y} = pos(e); const h = hit(x,y); if(h) patSeq.push(h.n); redraw({x,y}); });
  svg.addEventListener('pointermove', e => { if(!drawing) return; e.preventDefault();
    const {x,y} = pos(e); const h = hit(x,y); if(h) patSeq.push(h.n); redraw({x,y}); });
  const fin = () => { if(!drawing) return; drawing = false; redraw(null); ownFinalizePattern(pts, size); };
  svg.addEventListener('pointerup', fin);
  svg.addEventListener('pointercancel', fin);
}

function ownFinalizePattern(pts, size){
  const hint = $('ownPatHint');
  if(patSeq.length < 2){ patThumb = ''; if(hint) hint.textContent = 'النمط لازم نقطتين على الأقل — أعد الرسم'; return; }
  if(hint) hint.textContent = 'النمط: ' + patSeq.join('-');
  // ⚠️ الصورة بخلفية بيضا وألوان ثابتة عن قصد — مش متغيرات الثيم.
  //    دي بتتحفظ مرة واحدة وبتتعرض في ٣ صفحات بثيمات مختلفة، فلو
  //    اترسمت بلون الوضع الداكن هتبقى مش واضحة في الفاتح.
  const S = 200, cvs = document.createElement('canvas'); cvs.width = S; cvs.height = S;
  const ctx = cvs.getContext('2d'), k = S / size;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
  ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
  patSeq.forEach((n, i) => { const p = pts[n-1]; i ? ctx.lineTo(p.x*k, p.y*k) : ctx.moveTo(p.x*k, p.y*k); });
  ctx.stroke();
  pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x*k, p.y*k, patSeq.includes(p.n) ? 9 : 6, 0, Math.PI*2);
    ctx.fillStyle = patSeq.includes(p.n) ? '#2563EB' : '#CBD5E1'; ctx.fill(); });
  patThumb = cvs.toDataURL('image/png');
}

// بيجمع اللي اتكتب. بيرجّع null لو مفيش حاجة (الحقل اتساب فاضي)
function ownCollectLock(){
  const txt = (($('ownLkText') || {}).value || '').trim();
  if(lockTab === 'text' && txt)
    return { lockType:'text', lockText:txt, lockPattern:'', lockImage:'' };
  if(lockTab === 'pattern' && patSeq.length >= 2)
    return { lockType:'pattern', lockText:'', lockPattern:patSeq.join('-'), lockImage:patThumb };
  return null;
}

// الباسورد بيتحمّل بعد ما الشاشة تتفتح، فبنبدأ بـ«بنحمّل…»
function lockViewHtml(d){
  const L = d._lock;
  if(!L) return `<div class="lk-none">⏳ بنحمّل…</div>`;
  const btn = `<button class="lk-btn" onclick="editLock('${d.id}')">🔐 ${L.lockType ? 'تعديل الباسورد' : 'إضافة باسورد'}</button>`;
  if(L.lockType === 'text' && L.lockText)
    return `<div class="di-row"><span class="di-k">الرمز</span><span class="di-v lk-code">${esc(L.lockText)}</span></div>${btn}`;
  if((L.lockType === 'pattern' || L.lockType === 'image') && L.lockImage)
    return `<div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <img id="ownLkImg" class="lk-img" src="${L.lockImage}" onclick="viewLockImg('${d.id}')">
        <div id="ownPatReplay" style="display:none;"></div>
      </div>
      ${L.lockPattern ? `<div class="lk-code" style="margin-top:7px;">${esc(L.lockPattern)}</div>
        <button class="lk-btn" onclick="replayPattern('${esc(L.lockPattern)}')">▶️ إعادة الرسم خطوة خطوة</button>` : ''}
      ${btn}`;
  return `<div class="lk-none">🔓 مفيش باسورد على الجهاز ده</div>${btn}`;
}

// تحميل الباسورد لجهاز واحد — بيتندَه من showInfo و openTechSheet
async function loadLock(id){
  const d = devices.find(x => x.id === id); if(!d) return;
  if(d._lock){ paintLock(id); return; }        // اتحمّل قبل كده
  try{
    const { data, error } = await sb.rpc('device_lock_get', { p_id: id });
    if(error) throw error;
    d._lock = data || { lockType:'', lockText:'', lockPattern:'', lockImage:'' };
  }catch(e){
    console.error('device_lock_get:', e);
    d._lock = null;
    const box = $('ownLockView') || $('techLockView');
    if(box) box.innerHTML = `<div class="lk-none">⚠️ مقدرناش نجيب الباسورد — اقفل وافتح تاني</div>`;
    return;
  }
  paintLock(id);
}

function paintLock(id){
  const d = devices.find(x => x.id === id);
  const box = $('ownLockView') || $('techLockView');
  if(d && box) box.innerHTML = lockViewHtml(d);
}

function viewLockImg(id){
  const d = devices.find(x => x.id === id);
  const src = d && d._lock && d._lock.lockImage;
  if(!src) return;
  // عارض بسيط فوق كل حاجة — بيتقفل بأي ضغطة
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML = '<img src="' + src + '" style="max-width:100%;max-height:100%;border-radius:12px;">';
  ov.onclick = () => ov.remove();
  document.body.appendChild(ov);
}

// ▶️ تشغيل النمط خطوة بخطوة (٣٠٠ جزء من الثانية للنقطة)
function replayPattern(seqStr){
  const seq = String(seqStr || '').split('-').map(n => parseInt(n)).filter(n => n >= 1 && n <= 9);
  if(seq.length < 2) return;
  const box = $('ownPatReplay'), img = $('ownLkImg');
  if(!box) return;
  box.style.display = 'block';
  if(img) img.style.display = 'none';
  const S = 130, g = S / 3, pts = [];
  for(let r = 0; r < 3; r++) for(let c = 0; c < 3; c++) pts.push({ n:r*3+c+1, x:g*c+g/2, y:g*r+g/2 });
  box.innerHTML = `<svg width="${S}" height="${S}" style="border:1px solid var(--line);border-radius:12px;background:var(--card);">
    <polyline id="ownRpLine" fill="none" stroke="var(--repairing)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points=""/>
    ${pts.map(p => `<circle data-n="${p.n}" cx="${p.x}" cy="${p.y}" r="6" fill="var(--line)"/>`).join('')}
  </svg><div id="ownRpStep" style="text-align:center;font-size:12px;color:var(--muted);margin-top:4px;"></div>`;
  const line = box.querySelector('#ownRpLine'), lbl = box.querySelector('#ownRpStep');
  let i = 0;
  const timer = setInterval(() => {
    // الشاشة اتقفلت وإحنا بنرسم؟ نوقف — مفيش عداد شغال على الفاضي
    if(!document.body.contains(box)){ clearInterval(timer); return; }
    if(i >= seq.length){
      clearInterval(timer);
      setTimeout(() => { if(img) img.style.display = ''; box.style.display = 'none'; }, 1200);
      return;
    }
    const p = pts[seq[i]-1];
    const dot = box.querySelector('circle[data-n="' + seq[i] + '"]');
    if(dot){ dot.setAttribute('fill', 'var(--repairing)'); dot.setAttribute('r', '9'); }
    const cur = line.getAttribute('points');
    line.setAttribute('points', (cur ? cur + ' ' : '') + p.x + ',' + p.y);
    if(lbl) lbl.textContent = `خطوة ${i+1} من ${seq.length} — نقطة ${seq[i]}`;
    i++;
  }, 300);
}

/* ---------- التعديل ---------- */
function editLock(id){
  const d = devices.find(x => x.id === id); if(!d) return;
  const L = d._lock || {};
  const cur = L.lockType === 'text'    ? 'رمز: ' + (L.lockText || '')
            : L.lockType === 'pattern' ? 'نمط: ' + (L.lockPattern || 'مرسوم')
            : L.lockType === 'image'   ? 'صورة'
            : 'مفيش باسورد';
  openAct('🔐 باسورد الجهاز', `
    ${actDevBlock(d)}
    <div class="de-cur">الحالي: <b>${esc(cur)}</b></div>
    <div id="ownLockHostEdit"></div>
    <div class="de-hint">اللي هتكتبه هيمسح القديم ويحل محله.</div>
    <button class="act-btn act-primary" id="ownLkGo" onclick="saveLock('${d.id}')">💾 حفظ الباسورد</button>
    ${L.lockType ? `<button class="act-btn act-ghost" onclick="clearLock('${d.id}')">🗑️ شيل الباسورد</button>` : ''}
    <button class="act-btn act-ghost" onclick="showInfo('${d.id}')">إلغاء</button>`);
  ownMountLock('ownLockHostEdit');
}

async function saveLock(id){
  const lock = ownCollectLock();
  if(!lock){ toast(lockTab === 'pattern' ? 'ارسم النمط الأول (نقطتين على الأقل)' : 'اكتب الرمز الأول'); return; }
  await writeLock(id, lock, lock.lockType === 'text' ? 'رمز رقمي/نصي' : 'نمط مرسوم');
}

async function clearLock(id){
  if(!confirm('متأكد إنك عايز تشيل باسورد الجهاز ده؟')) return;
  await writeLock(id, { lockType:'', lockText:'', lockPattern:'', lockImage:'' }, 'اتشال');
}

// بيتأكد إن السيرفر كتب القفل فعلاً
// ⚠️ التأكد عبر device_lock_get مش الـview: الـview مبتعرضش صور
//    القفل أصلاً، فقرايتها كانت هتقول «ماتحفظتش» وهي متحفظة.
async function verifyLock(id, expectType){
  try{
    const { data, error } = await sb.rpc('device_lock_get', { p_id: id });
    if(error) throw error;
    if(!data || (data.lockType || '') !== expectType){
      toast('⚠️ السيرفر مسجّلش الباسورد — بلّغ الإدارة');
      console.error('lockType لم يُحفظ:', id, data);
      return false;
    }
  }catch(e){ console.error('تأكيد الباسورد:', e); }
  return true;
}

async function writeLock(id, lock, label){
  const d = devices.find(x => x.id === id); if(!d) return;
  const note = mkNote('🔒 باسورد الجهاز اتحدّث (' + label + ')');
  const btn = $('ownLkGo'); if(btn) btn.disabled = true;
  const notes = await notesWith(id, note);
  const p = notes && { ...lock, activityNotes: notes, lastModifiedAt: nowIso(), lastModifiedBy: ME };
  const ok = !!p && await patch(id, p) && await verifyLock(id, lock.lockType);
  if(btn) btn.disabled = false;
  if(!ok) return;

  d._lock = { lockType:lock.lockType, lockText:lock.lockText,
              lockPattern:lock.lockPattern, lockImage:lock.lockImage };
  d.lockType = lock.lockType;
  d.lockText = lock.lockType === 'text' ? lock.lockText : '';
  if(!d._raw) d._raw = {};
  d._raw.activityNotes = notes;
  d.notes = notes.map(n => ({ by:n.by||'', role:n.role||'', at:n.at||'', text:n.text||'', kind:n.kind, args:n.args }));
  toast(lock.lockType ? '🔒 الباسورد اتحفظ' : '🔓 الباسورد اتشال');
  render();
  showInfo(id);
}

    </div>`;
}

/* ============================================================
   🔧 تغيير حالة الجهاز
   ------------------------------------------------------------
   🔒 السيرفر بيسمح بحالات الورشة بس، وعلى أجهزة عليها اسمي:
      قيد الانتظار · جاري الكشف · جاري الصيانة · تم الصيانة · تم الرفض
      «تم التسليم» و«المرتجعات» ممنوعين — دول بيمروا على المحاسب.

   ⚠️ «تم الإصلاح» بتخرّج الجهاز من تبويب «أجهزتي» — عشان خلاص
      خلص شغلك فيه. بس بيفضل ظاهر في «كل أجهزة المحل» لحد ما
      يتسلّم. الشريط الأخضر بيشرح ده للمالك بدل ما يفتكر إن
      الجهاز ضاع.
   ============================================================ */
async function setStatus(id, st){
  const d = devices.find(x => x.id === id); if(!d || d.status === st) return;

  const hist = [...((d._raw && d._raw.statusHistory) || []),
                { status:st, date:nowIso(), by:ME }];
  const lbl  = (ST[st] || {}).label || st;
  const from = (ST[d.status] || {}).label || d.status;
  const note = mkNote('الحالة اتغيّرت من «' + from + '» لـ «' + lbl + '»');
  const notes = await notesWith(id, note);
  if(!notes) return;

  const p = { status:st, statusHistory:hist,
              ...(st === 'rejected' ? { rejectedInShop: true } : {}),
              activityNotes: notes,
              lastModifiedAt: nowIso(), lastModifiedBy: ME };
  if(!(await patch(id, p))) return;
  if(!(await verifyField(id, 'status', st, 'الحالة الجديدة'))) return;

  applyLocal(d, p);

  // خرج من شغلي؟ نوضّح فين راح بدل ما يبان إنه ضاع
  const stillMine = TECH_ACTIVE.includes(st) || st === 'returned';
  if(!stillMine){
    if(techId === id) closeTechSheet();
    flash = `${d.type} ${d.model} — «${lbl}». خرج من «أجهزتي» وبقى في «كل أجهزة المحل».`;
    render();
    setTimeout(() => { flash = ''; render(); }, 6000);
  } else {
    render();
    if(techId === id) renderTechSheet();
  }
  toast(st === 'repairing' ? 'بدأت الشغل في الجهاز 🔧' : 'تم ✅');
}

// الرفض بيخرّج الجهاز من قايمتي نهائياً، فبيتأكد الأول
async function rejectDevice(id){
  if(!confirm('تحط الجهاز في درج الرفض؟\nهيخرج من قايمة أجهزتك.')) return;
  await setStatus(id, 'rejected');
}

async function addTechNote(){
  const d = devices.find(x => x.id === techId); if(!d) return;
  const ta = $('techNoteTxt');
  const txt = ((ta && ta.value) || '').trim();
  if(!txt){ toast('اكتب الملاحظة الأول'); return; }

  const notes = await notesWith(d.id, mkNote(txt));
  if(!notes) return;
  if(!(await patch(d.id, { activityNotes: notes }))) return;
  if(!(await verifyNotes(d.id, notes.length))) return;

  if(!d._raw) d._raw = {};
  d._raw.activityNotes = notes;
  d.notes = notes.map(n => ({ by:n.by||'', role:n.role||'', at:n.at||'', text:n.text||'', kind:n.kind, args:n.args }));
  renderTechSheet();
  toast('📝 الملاحظة اتحفظت');
}

/* ============================================================
   🔄 التحويل لفني تاني
   ------------------------------------------------------------
   نوعين:
     🤝 مساعد      → إنت تفضل المسؤول الأساسي، وهو بيساعدك
     🔄 تسليم كامل → المسؤولية تتنقل بالكامل والجهاز يخرج من قايمتك

   ⚠️ التسليم الكامل بيشيل الجهاز من «أجهزتي» على طول. لو المستلم
      كان مسجّل مساعد قبل كده، مبقاش مساعد — بقى الأساسي.
   ============================================================ */
async function doHandoff(){
  const d = devices.find(x => x.id === techId); if(!d || !handMode || !handTarget) return;

  const full = handMode === 'full';
  const note = mkNote(full
    ? '🔄 الجهاز اتسلّم بالكامل من «' + (d.tech || '—') + '» لـ «' + handTarget + '»'
    : '🤝 «' + handTarget + '» بقى فني مساعد — الفني الأساسي: «' + (d.tech || '—') + '»');

  const notes = await notesWith(d.id, note);
  if(!notes) return;

  const p = { activityNotes: notes, lastModifiedAt: nowIso(), lastModifiedBy: ME };
  if(full){
    p.technician = handTarget;
    // لو المستلم كان هو المساعد، مبقاش مساعد — بقى الأساسي
    if(d.assist === handTarget) p.assistTechnician = '';
  } else {
    p.assistTechnician = handTarget;
    // ⚠️ ٢٥٪ قيمة مبدئية زي باقي النظام. المحاسب بيعدّلها.
    p.assistPercent = '25';
  }

  if(!(await patch(d.id, p))) return;
  if(!(await verifyField(d.id, full ? 'technician' : 'assistTechnician', handTarget,
                         full ? 'الفني الجديد' : 'الفني المساعد'))) return;

  applyLocal(d, p);

  if(full){
    closeTechSheet();
    flash = `الجهاز اتسلّم بالكامل لـ ${handTarget} 🔄`;
    render();
    setTimeout(() => { flash = ''; render(); }, 6000);
  } else {
    handOn = false; handMode = ''; handTarget = '';
    renderTechSheet();
    toast(handTargetSafe(handTarget) + ' بقى فني مساعد 🤝');
  }
}
// الاسم في التوست — بنأمّنه عشان اسم فيه علامات مايكسرش العرض
function handTargetSafe(n){ return esc(String(n || '')); }

/* ============================================================
   📥 إدخال جهاز جديد
   ------------------------------------------------------------
   اقتراح اسم العميل + ملء رقمه، واقتراح اسم المحل.

   ⚠️ محدودية لازم تكون معروفة: الصفحة بتحمّل اللي في المحل +
      المسلَّم آخر ٣٠ يوم بس. فعميل آخر زيارة ليه من شهرين مش
      هيطلع هنا — عكس الداشبورد اللي شايف الكل. ده مقصود عشان
      النقل (Egress)، مش سهو.

   ⚠️ والمطابقة **محافظة** عن قصد: مسافات وحالة حروف بس. مفيش
      تطبيع مرن زي البحث — لأن نتيجة البحث بتراجعها بعينك، لكن
      رقم اتحط تلقائي مبيتراجعش. دمج غلط هنا معناه رقم عميل
      تاني خالص.
   ============================================================ */
const sKey = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

let custNames = [];      // [{ name, ts, seq }]
let phoneMap  = {};      // key -> [{ phone, ts, seq }]
let shopList  = [];      // [{ name, ts }]

function buildSuggest(){
  custNames = []; phoneMap = {}; shopList = [];
  const nameSeen = new Map(), shopSeen = new Map();
  for(const d of devices){
    const ts  = new Date(d.intake||0).getTime() || 0;
    // المعرّف 'dev_' + الوقت بالملي — فاصل التعادل لما التاريخ يتساوى
    // (خانة وقت الدخول دقتها دقيقة، فجهازين في نفس الدقيقة واردين)
    const seq = Number(String(d.id||'').replace(/^dev_/,'')) || 0;

    const name = (d.customer||'').trim();
    const phone = (d.phone||'').trim();
    if(name){
      const k = sKey(name);
      if(k){
        const prev = nameSeen.get(k);
        if(!prev || ts > prev.ts || (ts === prev.ts && seq > prev.seq)) nameSeen.set(k, { name, ts, seq });
        if(phone) (phoneMap[k] = phoneMap[k] || []).push({ phone, ts, seq });
      }
    }
    const shop = (d.shop||'').trim();
    if(shop){
      const sk = sKey(shop);
      const prev = shopSeen.get(sk);
      if(!prev || ts > prev.ts) shopSeen.set(sk, { name: shop, ts });
    }
  }
  custNames = [...nameSeen.values()].sort((a,b)=>(b.ts-a.ts)||(b.seq-a.seq));
  shopList  = [...shopSeen.values()].sort((a,b)=>b.ts-a.ts);
  const sl = $('ownShopList');
  if(sl) sl.innerHTML = shopList.map(x=>`<option value="${esc(x.name)}">`).join('');
}

function onOwnCustInput(){
  const el = $('f_cust'), nameDl = $('ownCustList'), phDl = $('ownPhoneList'), ph = $('f_phone');
  if(!el) return;
  const key = sKey(el.value||'');

  // اقتراح الأسامي: **بادئة** بس ومقصوص على ١٥ — قايمة أطول
  // مبتتقريش على الموبايل وبتثقّل الكتابة
  if(nameDl) nameDl.innerHTML = key.length < 1 ? '' :
    custNames.filter(x => sKey(x.name).indexOf(key) === 0).slice(0,15)
             .map(x=>`<option value="${esc(x.name)}">`).join('');

  const list = key && phoneMap[key];
  if(!list){ if(phDl) phDl.innerHTML=''; return; }

  const seen = new Set(), phones = [];
  list.slice().sort((a,b)=>(b.ts-a.ts)||(b.seq-a.seq))
      .forEach(x=>{ if(!seen.has(x.phone)){ seen.add(x.phone); phones.push(x.phone); } });
  if(phDl) phDl.innerHTML = phones.map(p=>`<option value="${esc(p)}">`).join('');

  // بنملا لو الخانة فاضية، أو لو اللي فيها إحنا اللي حطيناه.
  // ⚠️ من غير الشرط التاني: عميل اسمه «بل» وإنت بتكتب «بلال» —
  //    رقمه بيتحط عند حرف «ل» وبيفضل محطوط لما تكمّل الاسم.
  //    واللي المستخدم كتبه بإيده مابنلمسوش.
  if(ph && phones.length && (!ph.value.trim() || ph.dataset.autoFill === '1')){
    ph.value = phones[0];              // أحدث رقم
    ph.dataset.autoFill = '1';
  }
}

function openIntake(){
  buildSuggest();
  ownMountLock('ownLockHostIntake');   // 🔒 شاشة الباسورد (فاضية كل مرة)
  renderTechSelect();
  const ph = $('f_phone'); if(ph && ph.dataset) ph.dataset.autoFill = '';
  $('sheet').classList.add('on'); $('sheetBg').classList.add('on');

function closeIntake(){ $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on'); }

// 📝 الملاحظة و🔒 الباسورد واللون والسريال → على الجهاز الجديد
// ⚠️ ليه مش جوه device_intake نفسها؟ الدالة دي بتنقّي حقول محددة
//    من الحمولة وبتتجاهل أي حاجة تانية **في صمت**. فبدل ما نعتمد
//    على إنها بتاخدهم، بنضيفهم بعدها بـdevice_patch.
//    الكتابة مرتين بنفس القيمة مالهاش أي ضرر.
async function afterIntake(newId, text, lock, color, serial){
  if(!newId) return false;
  const p = {};
  if(lock) Object.assign(p, lock);
  if(color) p.deviceColor = color;
  if(serial) p.serialNumber = serial;
  if(text){
    const notes = await notesWith(newId, mkNote('📝 ' + text));
    if(!notes) return false;
    p.activityNotes = notes;
  }
  if(Object.keys(p).length === 0) return true;
  if(!await patch(newId, p)) return false;
  if(text && !await verifyNotes(newId, p.activityNotes.length)) return false;
  if(lock && !await verifyLock(newId, lock.lockType)) return false;
  return true;
}

let saving = false;
async function saveIntake(){
  if(saving) return;
  const type = $('f_type').value.trim(), model = $('f_model').value.trim();
  const cust = $('f_cust').value.trim(), color = $('f_color').value.trim();

  // ⚠️ مفيش `return` ساكت هنا — الزرار يتداس وميحصلش حاجة والمالك
  //    مش فاهم ليه. بنقول الناقص إيه وبنوديه على الخانة.
  const missing = [];
  if(!type) missing.push('نوع الجهاز');
  if(!cust) missing.push('اسم العميل');
  if(!color) missing.push('لون الجهاز');
  if(missing.length){
    toast('لازم تكتب: ' + missing.join('، '));
    const first = !type ? 'f_type' : (!cust ? 'f_cust' : 'f_color');
    const el = $(first); if(el) el.focus();
    return;
  }

  // 🔢 السريال اختياري — بس لو مكرر بنسأل
  const serial = $('f_serial').value.trim();
  if(serial){
    const dup = devices.find(d => (d.serial || '').trim().toLowerCase() === serial.toLowerCase());
    // ⚠️ التحذير ده مش شامل كل تاريخ المحل (بنحمّل ٣٠ يوم للمسلّم
    //    بس) — تنبيه مساعد مش ضمان.
    if(dup && !confirm('الرقم ده متسجّل قبل كده لجهاز «' + (dup.model || dup.type) + '» — ' + dup.customer + '.\nتكمّل التسجيل برضه؟')) return;
  }
  if(!navigator.onLine){ toast('مفيش نت — مش هينفع تسجّل جهاز دلوقتي 📴'); return; }

  const btn = $('btnSave');
  saving = true;
  if(btn){ btn.disabled = true; btn.textContent = 'بنسجّل...'; }

  // device_intake بتولّد الرقم والتوكن والتاريخ على السيرفر،
  // وبتحدد السعر صفر — المالك مايكتبش سعر خالص
  const { data, error } = await sb.rpc('device_intake', { p_payload: {
    deviceType:    type,
    model:         model,
    customerName:  cust,
    customerPhone: $('f_phone').value.trim(),
    shopName:      $('f_shop').value.trim(),
    reportedIssue: $('f_issue').value.trim(),
    technician:    ($('f_tech') ? $('f_tech').value : ''),
    deviceColor:   color,
    serialNumber:  serial,
    registeredBy:  ME
  }});

  saving = false;
  if(btn){ btn.disabled = false; btn.textContent = 'سجّل الجهاز في المحل'; }

  if(error){ toast('فشل التسجيل: ' + esc(error.message || error)); return; }

  const noteText0 = (($('f_note') || {}).value || '').trim();
  const lock0 = ownCollectLock();
  let lost = false;
  if(noteText0 || lock0 || color || serial){
    // device_intake بترجّع رقم الجهاز — بس شكل الرد مش موثّق،
    // فبنقبل الأشكال المعقولة كلها بدل ما نفترض واحد.
    let newId = (typeof data === 'string') ? data
              : (data && (data.id || (data.data && data.data.id) || data.device_id)) || '';
    // مش لاقيين الرقم في الرد؟ ندوّر عليه: أحدث جهاز سجّلته أنا
    // بنفس اسم العميل في آخر دقيقتين — ولازم يكون **واحد بس**،
    // وإلا منخمّنش.
    if(!newId){
      try{
        const since = new Date(Date.now() - 120000).toISOString();
        const { data: rows } = await sb.from('devices_owner').select('id,data')
          .gte('intake_date', since).order('intake_date', { ascending:false }).limit(10);
        const mine = (rows || []).filter(r => r.data && r.data.registeredBy === ME
                                            && (r.data.customerName || '').trim() === cust);
        if(mine.length === 1) newId = mine[0].id;
      }catch(e){ console.error('البحث عن الجهاز الجديد:', e); }
    }
    lost = !(await afterIntake(newId, noteText0, lock0, color, serial));
  }

  ownMountLock('ownLockHostIntake');   // 🔒 تصفير شاشة الباسورد
  ['f_type','f_model','f_cust','f_phone','f_shop','f_issue','f_note','f_color','f_serial'].forEach(id=>{
    const e = $(id); if(!e) return; e.value=''; if(e.dataset) e.dataset.autoFill='';
  });
  ['ownCustList','ownPhoneList'].forEach(id=>{ const e=$(id); if(e) e.innerHTML=''; });
  if($('f_tech')) $('f_tech').value = '';
  closeIntake();
  await loadDevices();
  // 🔑 لو سجّلته على نفسي، أوديه على «أجهزتي» — وإلا على «اللي سجّلتها»
  activeTab = 'reg';
  render();

  if(lost){
    toast('✅ الجهاز اتسجّل — ⚠️ بس الملاحظة/الباسورد ماتحفظوش، ضيفهم من «تفاصيل»');
    console.error('ملاحظة/باسورد الاستلام ضاعوا:', noteText0, lock0);
  } else {
    toast('✅ الجهاز اتسجّل في «قيد الانتظار»');
  }
}

/* ============================================================
   الإعدادات — المظهر واللغة
   ------------------------------------------------------------
   نفس مفتاح باقي الشاشات (ifix-theme)، فاختيار المالك بيسري على
   أي شاشة يفتحها في النظام.
   التلقائي: فاتح من ٧ص لـ ٧م، وداكن بعد كده.
   ============================================================ */
const THEMES = [
  { k:'light', i:'☀️', n:'فاتح' },
  { k:'dark',  i:'🌙', n:'داكن' },
  { k:'auto',  i:'⏰', n:'تلقائي' },
];
const LANGS = [{k:'ar', i:'🇪🇬', n:'العربية'}, {k:'en', i:'🇬🇧', n:'English'}];

function themeMode(){ try{ return localStorage.getItem('ifix-theme') || 'auto'; }catch(e){ return 'auto'; } }
function isDarkNow(m){
  if(m === 'dark') return true;
  if(m === 'light') return false;
  const h = new Date().getHours();
  return h >= 19 || h < 7;
}
function applyTheme(){
  const d = isDarkNow(themeMode());
  document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
  const mt = document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', d ? '#0E1721' : '#1B2A3A');
}
function curLang(){ try{ return I18N.getLang(); }catch(e){ return 'ar'; } }
function pickLang(l){
  if(l === curLang()){ closeSettings(); return; }
  try{ I18N.setLang(l); }catch(e){}   // بيحفظ ويعيد التحميل
}
function openSettings(){ closeKebab(); renderSettings(); $('setSheet').classList.add('on'); $('setBg').classList.add('on'); }
function closeSettings(){ $('setSheet').classList.remove('on'); $('setBg').classList.remove('on'); }
function renderSettings(){
  const cur = themeMode();
  $('setRow').innerHTML = THEMES.map(x =>
    `<div class="mode ${x.k===cur?'sel':''}" onclick="pickTheme('${x.k}')">
       <div class="mi">${x.i}</div><div class="mt">${x.n}</div></div>`).join('');
  const lg = curLang();
  $('setLang').innerHTML = LANGS.map(x =>
    `<div class="mode ${x.k===lg?'sel':''}" onclick="pickLang('${x.k}')">
       <div class="mi">${x.i}</div><div class="mt">${x.n}</div></div>`).join('');
  $('setNote').textContent = cur === 'auto'
    ? 'فاتح من ٧ص لـ ٧م، وداكن بعد كده. دلوقتي: ' + (isDarkNow('auto') ? 'داكن' : 'فاتح') + '.'
    : '';
}
function pickTheme(m){
  try{ localStorage.setItem('ifix-theme', m); }catch(e){}
  applyTheme(); renderSettings();
}
// في الوضع التلقائي الشاشة تتبدّل لوحدها لما الساعة تعدّي الحد
setInterval(() => { if(themeMode() === 'auto') applyTheme(); }, 60000);

/* ============================================================
   الترجمة للمحتوى المتولّد
   ------------------------------------------------------------
   applyI18n بتشتغل مرة واحدة وقت التحميل، لكن معظم الواجهة هنا
   بتتبني بعد كده من قوالب جافاسكريبت. فبنلفّ innerHTML: أي حقن
   جديد بتتطبّق عليه الترجمة على طول.
   ============================================================ */
(function(){
  const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  if(!d || !d.set) return;
  Object.defineProperty(Element.prototype, 'innerHTML', {
    configurable: true, enumerable: d.enumerable, get: d.get,
    set: function(v){
      d.set.call(this, v);
      try{ if(window.I18N && I18N.applyI18n) I18N.applyI18n(this); }catch(e){}
    }
  });
})();
