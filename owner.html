/* ============================================================
   💰 شاشة التسعير — الصندوق اللي السوبر أدمن بيشارك فيه أجهزة
   ------------------------------------------------------------
   🧠 الحكاية بالبلدي:
      السوبر أدمن عنده قايمة «تم التسليم وبانتظار الدفع».
      بيختار منها أجهزة ويبعتها هنا. إنت بتفتح الخانة دي،
      بتكتب سعر كل جهاز، وبتقول:

        💵 فوري  → الجهاز بيفضل مكانه عند المحاسب لحد ما
                    يستلم الفلوس ويدوس «تأكيد الدفع».
                    ⚠️ إنت مش بتأكد إن الفلوس اتحصّلت.

        📒 آجل   → الفلوس بتتحوّل لدَين على حساب المحل فوراً،
                    والجهاز بيختفي من «بانتظار الدفع».

        ⏸️ لسه   → بتكتب السعر وبس، من غير ما تحدد حاجة.

   🔒 وكل ده محروس من قاعدة البيانات مش من الصفحة:
      • الصندوق ده شباك (devices_owner_pricing) مبيفتحش غير
        على الأجهزة اللي اتشاركت معاك إنت بالذات.
      • الكتابة بتمر على دالة (owner_set_price) بترفض أي حاجة
        برة القواعد دي، حتى لو حد عدّل في الصفحة بإيده.
   ============================================================ */

let pzRows  = [];        // الأجهزة اللي في الصندوق
let pzBusy  = false;     // بيحفظ دلوقتي؟ (عشان مايدوسش مرتين)
let pzOpen  = false;     // الشاشة مفتوحة؟
let pzShowDone = false;  // نعرض اللي اتسعّر خلاص؟

/* عدّاد الخانة في قايمة التلت نقط — بيتحدّث لوحده */
async function pzRefreshBadge(){
  try{
    const { count, error } = await sb.from('devices_owner_pricing')
      .select('id', { count:'exact', head:true })
      .is('data->ownerPriced', null);
    if(error) throw error;
    const b = $('pzBadge');
    if(b){ b.textContent = count ? String(count) : ''; b.style.display = count ? '' : 'none'; }
  }catch(e){ /* مش مشكلة — العدّاد كمالة */ }
}

async function openPricing(){
  closeKebab();
  pzOpen = true;
  $('pzSheet').classList.add('on');
  $('pzBg').classList.add('on');
  $('pzBody').innerHTML = '<div class="empty">⏳ بيحمّل...</div>';
  await pzLoad();
}

function closePricing(){
  pzOpen = false;
  $('pzSheet').classList.remove('on');
  $('pzBg').classList.remove('on');
}

async function pzLoad(){
  try{
    // 🧠 الصندوق صغير بطبعه (أجهزة معدودة بيشاركها السوبر أدمن)،
    //    بس بنستخدم نفس التقسيم بتاع باقي الصفحة عشان لو يوم
    //    شارك ٥٠٠ جهاز الصفحة ما تقعش ولا نتعدى حصة المشروع.
    const rows = await fetchPaged(() => sb.from('devices_owner_pricing')
      .select('id,status,payment_status,delivered_at,data')
      .order('delivered_at', { ascending:false }));

    pzRows = (rows || []).map(r => {
      const d = r.data || {};
      return {
        id:       d.id || r.id,
        type:     d.deviceType || '',
        model:    d.model || '',
        customer: d.customerName || '',
        phone:    d.customerPhone || '',
        shop:     (d.billedShop || d.shopName || '').trim(),
        issue:    d.reportedIssue || '',
        tech:     (d.technician || '').trim(),
        price:    (d.agreedPrice === 0 || d.agreedPrice) ? String(d.agreedPrice) : '',
        payType:  d.paymentType || '',
        payState: r.payment_status || d.paymentStatus || '',
        answered: d.ownerPriced || null,
        sharedAt: (d.ownerShare && d.ownerShare.at) || '',
        out:      r.delivered_at || ''
      };
    });
    pzRender();
  }catch(e){
    console.error('pzLoad failed:', e);
    $('pzBody').innerHTML = '<div class="empty">📴 مقدرناش نحمّل الصندوق.<br>'
      + '<span style="font-size:12.5px;">' + esc(e.message || String(e)) + '</span></div>';
  }
}

/* ===== الرسم ===== */
function pzRender(){
  const box = $('pzBody');
  if(!box) return;

  if(!pzRows.length){
    box.innerHTML = '<div class="empty">📭 مفيش أجهزة في صندوقك لسه.<br>'
      + '<span style="font-size:12.5px;">السوبر أدمن هو اللي بيشارك الأجهزة هنا '
      + 'من قايمة «تم التسليم وبانتظار الدفع».</span></div>';
    return;
  }

  const todo = pzRows.filter(r => !r.answered);
  const done = pzRows.filter(r => r.answered);

  let html = '';

  if(todo.length){
    html += '<div class="pz-h">📥 مستنية منك (' + todo.length + ')</div>'
          + todo.map(pzCard).join('');
  } else {
    html += '<div class="pz-ok">✅ خلصت كل اللي عندك. تسلم إيدك.</div>';
  }

  if(done.length){
    html += '<button class="pz-toggle" onclick="pzToggleDone()">'
          + (pzShowDone ? '▲ إخفاء' : '▼ عرض') + ' اللي جاوبت عليه (' + done.length + ')</button>';
    if(pzShowDone) html += done.map(pzCard).join('');
  }

  box.innerHTML = html;
}

function pzToggleDone(){ pzShowDone = !pzShowDone; pzRender(); }

function pzCard(r){
  // 🔒 اتحصّل خلاص → للعرض بس، مفيش أي تعديل
  const locked = (r.payState === 'paid');

  // الشريط العلوي: الحالة الحالية بكلمتين
  let badge = '';
  if(locked && r.payType === 'deferred'){
    badge = '<span class="pz-b pz-b-ok">📒 راح على حساب «' + esc(r.shop || '—') + '»</span>';
  } else if(locked){
    badge = '<span class="pz-b pz-b-ok">✅ اتحصّل</span>';
  } else if(r.answered && r.answered.pay === 'cash'){
    badge = '<span class="pz-b pz-b-cash">💵 فوري — مستني تحصيل المحاسب</span>';
  } else if(r.answered){
    badge = '<span class="pz-b pz-b-wait">⏸️ سعر متسجّل، من غير تحديد</span>';
  } else {
    badge = '<span class="pz-b pz-b-new">🆕 محتاج تسعير</span>';
  }

  const title = (esc(r.type + ' ' + r.model).trim() || 'جهاز') + ' — ' + esc(r.customer || 'عميل');

  let body = '<div class="pz-card">'
    + '<div class="pz-top">' + badge + '<span class="pz-no">' + ticketNo(r.id) + '</span></div>'
    + '<div class="pz-t">' + title + '</div>'
    + '<div class="pz-s">'
      + (r.shop ? '🏬 ' + esc(r.shop) + ' · ' : '')
      + (r.tech ? '🔧 ' + esc(r.tech) + ' · ' : '')
      + '📤 ' + (r.out ? fmtDate(r.out) : '—')
    + '</div>'
    + (r.issue ? '<div class="pz-i">🩺 ' + esc(r.issue) + '</div>' : '');

  if(locked){
    body += '<div class="pz-final">💰 ' + esc(r.price || '—') + ' ج.م</div>';
  } else {
    const idJs = esc(r.id);
    body += '<div class="pz-row">'
      + '<input class="pz-in" id="pz_' + idJs + '" inputmode="numeric" autocomplete="off" '
      + 'value="' + esc(r.price) + '" placeholder="السعر بالجنيه" '
      + 'oninput="pzFixDigits(this)" />'
      + '<span class="pz-eg">ج.م</span>'
      + '</div>'
      + '<div class="pz-btns">'
      + '<button class="pz-btn pz-cash' + (r.answered && r.answered.pay === 'cash' ? ' on' : '') + '" '
        + 'onclick="pzSave(\'' + idJs + '\',\'cash\')">💵 فوري</button>'
      + '<button class="pz-btn pz-def" onclick="pzSave(\'' + idJs + '\',\'deferred\')">📒 آجل</button>'
      + '<button class="pz-btn pz-none' + (r.answered && r.answered.pay === 'none' ? ' on' : '') + '" '
        + 'onclick="pzSave(\'' + idJs + '\',\'none\')">⏸️ لسه</button>'
      + '</div>';

    if(!r.shop){
      body += '<div class="pz-warn">⚠️ الجهاز ده مش مكتوب عليه اسم محل، '
            + 'فالآجل مش هينفع عليه — الآجل لازم يتقيّد على حساب محل.</div>';
    }
  }

  body += '</div>';
  return body;
}

/* أرقام إنجليزية بس — نفس تنضيف الداشبورد */
function pzFixDigits(el){
  const en = String(el.value)
    .replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0))
    .replace(/[^0-9]/g, '');
  if(el.value !== en) el.value = en;
}

/* ===== الحفظ ===== */
async function pzSave(id, pay){
  if(pzBusy) return;
  const r = pzRows.find(x => x.id === id);
  if(!r) return;

  const inp = $('pz_' + id);
  const price = inp ? String(inp.value || '').trim() : '';

  // ── تحذيرات قبل ما نبعت — عشان ميستناش رد السيرفر ──
  if(pay !== 'none' && price === ''){ toast('⚠️ اكتب السعر الأول'); if(inp) inp.focus(); return; }
  if(pay === 'deferred'){
    if(!r.shop){ toast('⚠️ مفيش اسم محل — الآجل لازم يتقيّد على حساب محل'); return; }
    if(Number(price) <= 0){ toast('⚠️ الآجل لازم له سعر أكبر من صفر'); return; }
    const ok = confirm('هتحط ' + price + ' ج.م على حساب «' + r.shop + '».\n\n'
      + 'الجهاز هيختفي من قايمة «بانتظار الدفع» ويروح على الحساب علطول، '
      + 'ومش هتقدر تعدّله بعد كده.\n\nأكمل؟');
    if(!ok) return;
  }

  pzBusy = true;
  const btns = document.querySelectorAll('.pz-btn');
  btns.forEach(b => b.disabled = true);

  try{
    const { data, error } = await sb.rpc('owner_set_price',
      { p_id: id, p_price: price, p_pay: pay });
    if(error) throw error;

    // ✅ Supabase مبترميش أخطاء لوحدها — بنتأكد بعينينا من اللي رجع
    const res = data || {};
    if(String(res.agreedPrice === undefined ? '' : res.agreedPrice) !== String(pzNorm(price))){
      throw new Error('السيرفر سجّل سعر مختلف (' + res.agreedPrice + ') — بلّغ الإدارة');
    }

    if(pay === 'deferred'){
      if(res.paymentStatus !== 'paid') throw new Error('القيد ما اتعملش — بلّغ الإدارة');
      toast('📒 اتقيّد ' + price + ' ج.م على حساب «' + esc(r.shop) + '»');
    } else if(pay === 'cash'){
      // 🔒 الحارس الأهم — لو السيرفر كتب paid في الفوري يبقى فيه غلط كبير
      if(res.paymentStatus !== 'unpaid') throw new Error('حالة الدفع اتكتبت غلط — بلّغ الإدارة فوراً');
      toast('💵 اتسجّل ' + price + ' ج.م — فوري، والمحاسب هو اللي يأكد التحصيل');
    } else {
      toast(price === '' ? '🧹 السعر اتمسح' : '⏸️ اتسجّل ' + price + ' ج.م من غير تحديد');
    }

    await pzLoad();
    pzRefreshBadge();
  }catch(e){
    console.error('pzSave failed:', e);
    toast('⚠️ ' + (e.message || String(e)));
  }finally{
    pzBusy = false;
    document.querySelectorAll('.pz-btn').forEach(b => b.disabled = false);
  }
}

/* نفس تنضيف السعر اللي في السيرفر — عشان المقارنة تطلع صح */
function pzNorm(v){
  const raw = String(v == null ? '' : v)
    .replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0))
    .replace(/[^0-9.]/g, '');
  if(raw === '' || raw === '.') return '';
  const n = Math.round(Number(raw));
  return (isFinite(n) && n >= 0) ? String(n) : '';
}


/* ============================================================
   🧰 أدوات الديسباتشر عند المالك
   ------------------------------------------------------------
   ⚠️ كل اللي تحت منقول **بالحرف** من dispatch.html.
      متعدّلش فيه هنا — لو فيه باج، اتصلح هناك الأول
      وبعدين يتنقل تاني، وإلا الصفحتين هيفرقوا في السلوك.
   ============================================================ */

/* ── مساعد: هل كلام قطع الغيار معناه «مفيش» ── */
// ============================================================
// 🔩 قطع الغيار في تفاصيل الجهاز — عرض بحت
// ------------------------------------------------------------
// `partsComment` هو اللي الفني كتبه بإيده من صفحته. تلات حالات:
//   • فاضي          → الفني لسه ما ردّش
//   • «محتاجش قطع»  → داس الزرار الأخضر: الجهاز اتصلح من غير أي قطعة
//   • أي كلام تاني  → القطع اللي جابها زي ما هي
// ⚠️ الديسباتشر بيشوف بس — الكتابة من صفحة الفني.
// ============================================================
function dpPartsNorm(s){
  return String(s || '').replace(/[\s.,،!؟?\-—_]+/g, '').replace(/ه$/,'ة');
}
function dpPartsIsNone(s){
  const t = dpPartsNorm(s);
  if(!t) return false;                      // الفاضي حالة تانية خالص
  return ['مفيش', 'مافيش', 'مفيشحاجة', 'مافيشحاجة', 'لايوجد', 'لاشيء', 'لاشئ', 'لا', '0', 'ولاحاجة',
          dpPartsNorm('مفيش — الجهاز خلص ومحتاجش قطع غيار')].includes(t);
}
// ملاحظة الفني — عشان نعرف مين قالها وإمتى

/* ── تحميل موديول المشتريات + فتح الشاشات ── */
let CAN_INVENTORY = false;

// الموديول بيتحمّل عند الحاجة بس — مايتنزّلش على جهاز ديسباتشر
// مقفولة عليه الميزة أصلاً

/* ── مراجعة قطع الغيار ── */

// ============================================================
// 🔩 مراجعة قطع الغيار (نفس صفحة المحاسب بالظبط)
// ------------------------------------------------------------
// كارت لكل فني → أجهزته في الفترة → الكومنت ظاهر على الكارت من برا.
// تدوس على الجهاز → بتفتح شاشة قطع الغيار (INV) عشان تربط القطع.
// ============================================================
const PR = { from:'', to:'', tech:null, quick:'today', q:'' };   // q = كلمة البحث

function prDayKey(iso){
  if(!iso) return '';
  const dt = new Date(iso);
  if(isNaN(dt)) return '';
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function prToday(){ return prDayKey(new Date().toISOString()); }

function prSetQuick(q){
  PR.quick = q;
  const now = new Date(), end = prToday();
  let start = end;
  if(q==='week')  start = prDayKey(new Date(now.getTime() - 6*86400000).toISOString());
  if(q==='month') start = prDayKey(new Date(now.getTime() - 29*86400000).toISOString());
  PR.from = start; PR.to = end; PR.tech = null;
  prRender();
}
// ⏱️ «آخر تعديل» للجهاز — ده اللي المدة بتتحسب عليه، **مش** الدخول ولا الخروج.
// جهاز داخل من شهرين واتعدل فيه حاجة النهاردة → بيظهر في «النهاردة».
//   lastModifiedAt = أي تعديل عادي على الجهاز
//   partsReturnAt  = الفني جاوب «القطع رجعت؟» بعد الرفض (migration 42)
// ⚠️ «لسه مجبتش» (partsPendingAt) **مش** محسوب — ده الفني بيقول «مفيش
//    جديد»، ولو حسبناه كل جهاز مستني قطعة هيظهر في «النهاردة» كل يوم.
// ⚠️ ملحوظة: الديسباتشر بيحمّل كل أجهزة المحل + المسلَّمة في آخر ٣٠ يوم
//    بس (DELIVERED_DAYS). جهاز اتسلّم من ٣ شهور ما هيظهرش هنا حتى لو
//    اتعدل النهاردة — بيظهر عند المحاسب في الداشبورد (عنده كل الأجهزة).
function prTouched(d){
  const r = d._raw || {};
  let best = '';
  for(const v of [r.lastModifiedAt, r.partsReturnAt]){
    if(v && (!best || new Date(v) > new Date(best))) best = v;
  }
  return best || d.intake || '';
}
function prInRange(d){
  const k = prDayKey(prTouched(d));
  if(!k) return false;
  return (!PR.from || k >= PR.from) && (!PR.to || k <= PR.to);
}

function openPartsReview(){
  if(!CAN_PARTS_REVIEW){ toast('الميزة دي مقفولة عندك'); return; }
  // الشاشة من ورا: الدرع الشفاف بتاع قايمة ⋮ لازم يتشال — وإلا بيفضل

  document.body.classList.add('inv-open');

}

// ------------------------------------------------------------
// 🔍 البحث — نفس منطق الداشبورد بالظبط
// ------------------------------------------------------------
// كلمة واحدة كفاية. ولو أكتر من كلمة، كل كلمة لازم تتلاقي في أي خانة.
// IFixSearch = نفس بحث الصفحة الرئيسية (بيفهم «بلال» و«belal»).
// ⚠️ مش بنستخدم الفهرس المشترك بتاعه — ده متبني على حقول البحث الرئيسي.
// ⚠️ لو غيّرت المنطق هنا غيّره في dashboard.html كمان — نفس الشاشة.

// ------------------------------------------------------------
// 🔩 القطع المربوطة من المخزن
// ------------------------------------------------------------
// فرق مهم: `partsComment` هو اللي **الفني كتبه بإيده**، والقطع دي
// هي اللي **اتربطت فعلاً من المخزن** (جدول spare_parts) وليها تكلفة.
// الاتنين بيظهروا مع بعض عشان المحاسب يقارن: الفني قال «شاشة»
// وهل اتربطت شاشة فعلاً ولا لأ.
//
// ⚠️ بنجيبها للأجهزة الظاهرة في الفترة بس — مش كل المخزن.
//    وعلى دفعات صغيرة لأن الرابط بيتبعت في العنوان وليه حد أقصى.
var PR_LINK = {};          // رقم الجهاز → [قطع]
var PR_LINK_DONE = {};     // اللي اتجاب قبل كده (حتى لو فاضي)

async function prLoadLinked(ids){
  const need = (ids || []).filter(id => id && !PR_LINK_DONE[id]);
  if(!need.length) return false;
  const CH = 60;
  try{
    for(let i = 0; i < need.length; i += CH){
      const chunk = need.slice(i, i + CH);
      const { data, error } = await sb.from('spare_parts')
        .select('device_id,name,total_cost').in('device_id', chunk);
      if(error) throw error;
      (data || []).forEach(p => {
        (PR_LINK[p.device_id] = PR_LINK[p.device_id] || []).push(p);
      });
      chunk.forEach(id => { PR_LINK_DONE[id] = 1; });
    }
    return true;
  }catch(e){
    // بنعلّم الدفعة كأنها اتجابت عشان مندخلش في لفة تحميل لا تنتهي
    need.forEach(id => { PR_LINK_DONE[id] = 1; });
    console.error('prLoadLinked failed:', e);
    return false;
  }
}

// سطر القطع المربوطة جوه كارت الجهاز
function prLinkHtml(id){
  if(!PR_LINK_DONE[id]) return `<div class="pr-link wait">⏳ بنجيب القطع المربوطة…</div>`;
  const list = PR_LINK[id] || [];
  if(!list.length) return `<div class="pr-link none">🧰 مفيش قطع مربوطة من المخزن</div>`;
  const tot = list.reduce((a, p) => a + Number(p.total_cost || 0), 0);
  return `<div class="pr-link">🧰 <b>مربوط من المخزن (${list.length}):</b> ` +
    list.map(p => esc(p.name)).join('، ') +
    ` <span class="pr-link-t">${tot.toLocaleString()} ج.م</span></div>`;
}

function prCm(d){ return ((d._raw && d._raw.partsComment) || '').trim(); }
function prFields(d){
  return [d.model, d.type, d.customer, d.shop, d.issue, prCm(d), d.tech];
}
function prMatch(d, q){
  const words = String(q || '').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return true;
  const f = prFields(d);
  return words.every(w => window.IFixSearch
    ? IFixSearch.match(w, f)
    : f.some(v => v && String(v).toLowerCase().includes(w.toLowerCase())));
}

// كارت الجهاز — كل المعلومات ظاهرة من برا من غير ما تفتحه
function prDevHtml(d, showTech){
  const cm   = prCm(d);
  const shop = (d.shop || '').trim();
  const meta = [];
  if(shop) meta.push(`🏪 <b>${esc(shop)}</b>`);
  if(showTech && d.tech) meta.push(`🔧 <b>${esc(d.tech)}</b>`);
  return `
        <div class="pr-dev" onclick="prOpenDevice('${d.id}')">
          <div class="pr-dev-t"><span>${esc(d.model || d.type || 'جهاز')} · ${esc(d.customer||'')}</span>
            <span class="pr-dev-s">${(ST[d.status]&&ST[d.status].label)||''}</span></div>
          ${meta.length ? `<div class="pr-dev-m">${meta.join('<span>·</span>')}</div>` : ''}
          <div class="pr-dev-i">⚠️ ${esc(d.issue||'—')}</div>
          ${cm ? `<div class="pr-cm">🔩 ${esc(cm)}</div>`
               : `<div class="pr-cm none">— الفني ما كتبش قطع غيار</div>`}
          ${prLinkHtml(d.id)}
        </div>`;
}

function prByTouchedDesc(a, b){ return new Date(prTouched(b) || 0) - new Date(prTouched(a) || 0); }

// الرسم على جزئين (نفس الداشبورد):
//   prRender     = الشريط (المدة + مربع البحث) + القايمة
//   prRenderList = القايمة بس
// ⚠️ لو كل حرف بيعيد رسم مربع البحث، الكيبورد بيقفل بعد كل حرف.
function prRender(){
  const host = $('prBody');
  if(!host) return;
  // حد بيكتب في البحث دلوقتي وجه تحديث من بره؟ نحدّث القايمة بس
  const qEl = $('prQ');
  if(qEl && document.activeElement === qEl){ prRenderList(); return; }

  host.innerHTML = `
    <div class="pr-bar">
      <div class="pr-quick">
        <button class="pr-q${PR.quick==='today'?' on':''}" onclick="prSetQuick('today')">النهاردة</button>
        <button class="pr-q${PR.quick==='week'?' on':''}"  onclick="prSetQuick('week')">أسبوع</button>
        <button class="pr-q${PR.quick==='month'?' on':''}" onclick="prSetQuick('month')">شهر</button>
      </div>
      <div class="pr-dates">
        <label>من <input type="date" value="${PR.from}" onchange="PR.from=this.value;PR.quick='';PR.tech=null;prRender()"></label>
        <label>إلى <input type="date" value="${PR.to}" onchange="PR.to=this.value;PR.quick='';PR.tech=null;prRender()"></label>
      </div>
    </div>
    <input id="prQ" class="pr-search" type="search" autocomplete="off" value="${esc(PR.q)}"
      placeholder="🔍 دوّر في الفترة دي: جهاز، عميل، محل، عطل، قطعة، فني…"
      oninput="PR.q=this.value;prRenderList()">
    <div id="prList"></div>`;
  prRenderList();
}

function prRenderList(){
  const host = $('prList');
  if(!host) return;
  const rows = devices.filter(prInRange).filter(d => (d.tech||'').trim());
  // القطع المربوطة بتتجاب بعد الرسم، وأول ما توصل بنعيد الرسم مرة واحدة
  // prRenderList بتخرج لوحدها لو الشاشة اتقفلت (مفيش prList)
  prLoadLinked(rows.map(d => d.id)).then(got => { if(got) prRenderList(); });

  // (٠) فيه بحث → قايمة واحدة بكل النتايج، من كل الفنيين
  const q = (PR.q || '').trim();
  if(q){
    const hits = rows.filter(d => prMatch(d, q)).sort(prByTouchedDesc);
    host.innerHTML = hits.length
      ? `<div class="pr-res-h">🔍 ${hits.length} ${hits.length === 1 ? 'نتيجة' : 'نتايج'} في الفترة دي</div>`
        + hits.map(d => prDevHtml(d, true)).join('')
      : `<div class="pr-empty">مفيش نتايج لـ «${esc(q)}» في الفترة دي<br><small>جرّب مدة أطول (أسبوع / شهر)</small></div>`;
    return;
  }

  const byTech = {};
  rows.forEach(d => { const k=(d.tech||'').trim(); (byTech[k]=byTech[k]||[]).push(d); });
  const techs = Object.keys(byTech).sort((a,b)=>byTech[b].length-byTech[a].length);

  if(PR.tech){
    const list = (byTech[PR.tech]||[]).slice().sort(prByTouchedDesc);
    host.innerHTML = `
      <button class="pr-back" onclick="PR.tech=null;prRender()">‹ رجوع لكل الفنيين</button>
      <div class="pr-th">🔧 ${esc(PR.tech)} <span class="pr-n">${list.length}</span></div>
      ${list.length ? list.map(d => prDevHtml(d, false)).join('')
                    : `<div class="pr-empty">مفيش أجهزة للفني ده في الفترة دي</div>`}`;
    return;
  }

  host.innerHTML = techs.length ? `
    <div class="pr-grid">
      ${techs.map(tn => {
        const l = byTech[tn];
        const withCm = l.filter(d => prCm(d)).length;
        return `<button class="pr-tech" onclick="PR.tech='${esc(tn).replace(/'/g,"\\'")}';prRender()">
          <div class="pr-tech-n">🔧 ${esc(tn)}</div>
          <div class="pr-tech-s"><b>${l.length}</b> جهاز · <span class="${withCm?'ok':''}">${withCm} فيهم قطع غيار</span></div>
        </button>`;
      }).join('')}
    </div>` : `<div class="pr-empty">مفيش شغل في الفترة دي</div>`;
}

// فتح شاشة ربط قطع الغيار للجهاز — نفس آلية الربط الموجودة
// (بنظبط DP.openId عن طريق openDeviceIdFn، وبنفتح شاشة الاختيار
//  اللي بتعرض القطع غير الموجهة + خانة بحث)
let sheetId = null;
let prPickingId = null;

async function prOpenDevice(id){
  if(!window.INV || typeof INV.openPickForDevice !== 'function'){
    toast('شاشة قطع الغيار لسه بتحمّل — جرّب تاني بعد ثانية'); return;
  }
  sheetId = id;            // ai-invoice بيقرا الجهاز المفتوح من هنا
  prPickingId = id;
  await prShowDeviceParts(id);
}

// كارت الجهاز: القطع المربوطة حالياً + زرار "اربط قطعة"
async function prShowDeviceParts(id){
  const d = devices.find(x => x.id === id);
  const host = $('prBody');
  if(!host || !d) return;
  host.innerHTML = `
    <button class="pr-back" onclick="prPickingId=null;prRender()">‹ ${PR.q ? 'رجوع لنتايج البحث' : (PR.tech ? 'رجوع لأجهزة الفني' : 'رجوع')}</button>
    <div class="pr-th">📱 ${esc(d.model || d.type || 'جهاز')} · ${esc(d.customer||'')}</div>
    ${((d._raw&&d._raw.partsComment)||'').trim()
      ? (dpPartsIsNone(d._raw.partsComment)
          ? `<div class="pr-cm ok0">✅ الفني قال: الجهاز محتاجش قطع غيار</div>`
          : `<div class="pr-cm">🔩 ${esc(d._raw.partsComment)}</div>`) : ''}
    <div id="prLinked" class="pr-empty">بنجيب القطع المربوطة…</div>
    <button class="pr-q on" style="width:100%;margin-top:10px;padding:12px;"
      onclick="prPickParts()">➕ اربط قطعة غيار بالجهاز</button>`;

  try{
    const { data, error } = await sb.from('spare_parts')
      .select('id,name,total_cost').eq('device_id', id);
    if(error) throw error;
    const box = $('prLinked');
    if(!box) return;
    box.className = '';
    box.innerHTML = (data && data.length)
      ? `<div style="font-weight:800;margin:10px 0 6px;">القطع المربوطة (${data.length})</div>` +
        data.map(p => `<div class="pr-dev" style="cursor:default;">
          <div class="pr-dev-t"><span>🔩 ${esc(p.name)}</span>
            <span class="pr-dev-s">${Number(p.total_cost||0).toLocaleString()} ج.م</span></div>
          <button class="pr-back" style="margin:6px 0 0;" onclick="prUnlink('${p.id}')">✕ فك الربط</button>
        </div>`).join('')
      : `<div class="pr-empty">مفيش قطع مربوطة بالجهاز ده لسه</div>`;
  }catch(e){
    const box = $('prLinked');
    if(box){ box.className=''; box.innerHTML = `<div class="pr-empty">تعذّر جلب القطع: ${esc(e.message||e)}</div>`; }
  }
}

function prPickParts(){
  if(window.INV && typeof INV.openPickForDevice === 'function') INV.openPickForDevice();
  else toast('شاشة قطع الغيار لسه بتحمّل');
}

async function prUnlink(partId){
  try{
    const { error } = await sb.from('spare_parts')
      .update({ category:'unallocated', device_id:null, device_label:null }).eq('id', partId);
    if(error) throw error;
    toast('اتفك الربط ✅');
    if(prPickingId) prShowDeviceParts(prPickingId);
  }catch(e){ toast('فشل فك الربط: ' + (e.message||e)); }
}

// ai-invoice بينده دي بعد أي ربط عشان الشاشة تتحدّث
window.prOnPartsChanged = function(){
  if(prPickingId) prShowDeviceParts(prPickingId);
};

// ============================================================
// صفحة الجرد (ديسباتشر) — قراءة فقط
// ------------------------------------------------------------
// منقولة من dashboard.html بنفس الفكرة (فلتر فترة + كروت أعداد +
// أداء الفنيين + الواقف كتير)، وبنفس أسماء الحقول اللي devices
// هنا بتستخدمها (adapt() في أول الملف: type · shop · issue · intake).
//
// ⚠️ فرقين عن نسخة المحاسب، عن قصد:
//   ١) مفيش عمود سعر ولا كارت "مدفوع/غير مدفوع" — devices_dispatch
//      بتشيل الأسعار قبل ما توصل للمتصفح، فمفيش بيانات فلوس أصلاً
//      نبني عليها الكارت ده.
//   ٢) فلتر الفترة هنا "اليوم/الأسبوع/الشهر" بس، من غير "الكل" أو
//      مدى مخصص — لأن loadDevices() بتحمّل الأجهزة المسلَّمة لآخر
//      ٣٠ يوم بس (مش الأرشيف كله زي الداشبورد)، فأي فلتر أوسع من
//      شهر هيدّي عدد ناقص من غير ما يبان إنه ناقص.
// ============================================================
const INV_STUCK_DAYS = 3;
let invPeriod = { mode: 'today' };
let invView = null;      // {kind:'card'|'tech', key} أو null للقائمة
let invLists = {};
let invTechLists = {};

function setInvPeriod(mode){ invPeriod.mode = mode; renderInventory(); }

function invRange(){
  const now = new Date();
  const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
  if(invPeriod.mode === 'today') return [startOfDay(now), null];
  if(invPeriod.mode === 'week'){ const s = startOfDay(now); s.setDate(s.getDate() - 6); return [s, null]; }
  if(invPeriod.mode === 'month'){ const s = startOfDay(now); s.setDate(s.getDate() - 29); return [s, null]; }
  return [null, null];
}
function invInRange(iso){
  if(!iso) return false;
  const [f, t] = invRange();
  const d = new Date(iso);
  if(f && d < f) return false;
  if(t && d > t) return false;
  return true;
}

const INV_ACTIVE_STATUSES = ['waiting','diagnosing','repairing','done'];
const INV_OPEN_STATUSES   = ['waiting','diagnosing','repairing','returned'];
const INV_TECH_STATUSES   = ['waiting','diagnosing','repairing','returned'];

// آخر حركة على الجهاز — من statusHistory المحفوظ في _raw
function invLastChange(d){
  const h = (d._raw && d._raw.statusHistory) || [];
  return h.length ? h[h.length - 1].date : d.intake;
}
function invDaysSince(iso){
  if(!iso) return 0;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
// أول تسليم بعد آخر رجوع (زي دالة الداشبورد، بس على statusHistory الخام)
function invDeliveredDate(d){
  const h = (d._raw && d._raw.statusHistory) || [];
  return h.length ? (h.filter(x => x.status === 'delivered').slice(-1)[0] || {}).date || null : null;
}

function invStuckDevices(){
  return devices
    .filter(d => INV_ACTIVE_STATUSES.includes(d.status))
    .map(d => ({ d, days: invDaysSince(invLastChange(d)) }))
    .filter(x => x.days >= INV_STUCK_DAYS)
    .sort((a,b) => b.days - a.days);
}

function invMatchesSearch(d, q){
  const hay = [d.customer, d.shop, d.tech, d.type, d.model, d.phone, d.issue].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function openInventory(){
  const _shield = document.getElementById('kebabShield'); if(_shield) _shield.classList.add('hidden');
  invView = null;
  const _s = document.getElementById('invSearch'); if(_s) _s.value = '';
  document.getElementById('inventoryOverlay').classList.remove('hidden');
  document.body.classList.add('inv-open');
  renderInventory();
}
function closeInventory(){
  document.getElementById('inventoryOverlay').classList.add('hidden');
  document.body.classList.remove('inv-open');
}

function openInvView(kind, key){
  invView = { kind, key };
  renderInventory();
  const sc = document.getElementById('inventoryOverlay');
  if(sc) sc.scrollTop = 0;
}
function closeInvView(){ invView = null; renderInventory(); }

function invStatusTag(status){
  const s = ST[status] || { label: status, c: '--muted' };
  return `<span class="status-tag" style="background:var(${s.c}-bg);color:var(${s.c})">${esc(s.label)}</span>`;
}

function invViewData(){
  if(!invView) return null;
  if(invView.kind === 'tech') return { title: '🔧 ' + invView.key, list: invTechLists[invView.key] || [] };
  const labels = { received:'📥 استلمت الفترة دي', progress:'⏳ قيد التنفيذ', delivered:'✅ اتسلّمت', stuck:`⚠️ واقفة ${INV_STUCK_DAYS} أيام فأكتر` };
  return { title: labels[invView.key] || invView.key, list: invLists[invView.key] || [] };
}

function invViewHtml(){
  const data = invViewData();
  if(!data) return '';
  const rows = data.list.length === 0
    ? `<tr><td colspan="5" style="text-align:center;padding:34px;color:var(--muted-2);">مفيش أجهزة هنا</td></tr>`
    : data.list.map(d => `<tr onclick="showInfo('${d.id}')">
        <td class="iv-ref">${esc(ticketNo(d.id))}</td>
        <td><div class="iv-dev">${esc([d.type, d.model].filter(Boolean).join(' ') || '—')}</div></td>
        <td><div style="font-weight:700;">${esc(d.customer) || '—'}</div>${d.shop ? `<div class="iv-sub">${esc(d.shop)}</div>` : ''}</td>
        <td class="iv-issue">${esc(d.issue) || '—'}</td>
        <td>${invStatusTag(d.status)}</td>
      </tr>`).join('');
  return `
    <div class="iv-head">
      <button class="iv-back" onclick="closeInvView()">⬅️ رجوع للقائمة</button>
      <h3 class="iv-title">${esc(data.title)}</h3>
      <span class="iv-count">${data.list.length}</span>
    </div>
    <div class="iv-scroll">
      <table class="iv-table">
        <thead><tr><th>الرقم</th><th>الجهاز</th><th>العميل</th><th>العطل</th><th>الحالة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderInventory(){
  const chip = (mode, label) => `<button class="inv-chip ${invPeriod.mode===mode?'active':''}" onclick="setInvPeriod('${mode}')">${label}</button>`;
  const filterBar = `<div class="inv-filter">${chip('today','اليوم')}${chip('week','الأسبوع')}${chip('month','الشهر')}</div>`;

  const received  = devices.filter(d => invInRange(d.intake));
  const delivered = devices.filter(d => { const dd = invDeliveredDate(d); return dd && invInRange(dd); });
  const inProgress = devices.filter(d => INV_OPEN_STATUSES.includes(d.status));
  const stuck = invStuckDevices();
  invLists = { received, delivered, progress: inProgress, stuck: stuck.map(x => x.d) };

  const card = (key, num, color, label) => `
    <div class="inv-card" onclick="openInvView('card','${key}')">
      <div class="inv-card-num" style="color:${color};">${num}</div>
      <div class="inv-card-label">${label}</div>
      <div class="inv-card-more">عرض الأجهزة ←</div>
    </div>`;
  const cards = `<div class="inv-cards">
      ${card('received', received.length, 'var(--info)', '📥 استلمت الفترة دي')}
      ${card('progress', inProgress.length, 'var(--warn)', '⏳ قيد التنفيذ')}
      ${card('delivered', delivered.length, 'var(--success)', '✅ اتسلّمت الفترة دي')}
      ${card('stuck', stuck.length, 'var(--danger)', `⚠️ واقفة ${INV_STUCK_DAYS} أيام+`)}
    </div>`;

  // ===== بحث =====
  const q = (document.getElementById('invSearch')?.value || '').trim();
  let searchHtml = '';
  if(q){
    const found = devices.filter(d => invMatchesSearch(d, q));
    searchHtml = `
      <div class="inv-section-title">🔍 نتائج البحث "${esc(q)}" — ${found.length}</div>
      <div class="iv-scroll" style="margin-bottom:20px;">
        <table class="iv-table">
          <thead><tr><th>الرقم</th><th>الجهاز</th><th>العميل</th><th>العطل</th><th>الحالة</th></tr></thead>
          <tbody>${found.length === 0
            ? `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted-2);">مفيش نتايج</td></tr>`
            : found.map(d => `<tr onclick="showInfo('${d.id}')">
                <td class="iv-ref">${esc(ticketNo(d.id))}</td>
                <td><div class="iv-dev">${esc([d.type, d.model].filter(Boolean).join(' ') || '—')}</div></td>
                <td><div style="font-weight:700;">${esc(d.customer) || '—'}</div>${d.shop ? `<div class="iv-sub">${esc(d.shop)}</div>` : ''}</td>
                <td class="iv-issue">${esc(d.issue) || '—'}</td>
                <td>${invStatusTag(d.status)}</td>
              </tr>`).join('')}</tbody>
        </table>
      </div>`;
  }

  // ===== أداء الفنيين: الأجهزة اللي معاهم ولسه ما اتسلمتش =====
  const withTech = {};
  devices.forEach(d => {
    if(!d.tech || !INV_TECH_STATUSES.includes(d.status)) return;
    (withTech[d.tech] = withTech[d.tech] || []).push(d);
  });
  invTechLists = withTech;
  const techNames = Object.keys(withTech).sort((a,b) => withTech[b].length - withTech[a].length);
  const techCards = techNames.length === 0
    ? `<div class="empty-col">مفيش أجهزة موزّعة على فنيين دلوقتي</div>`
    : `<div class="inv-cards">${techNames.map(tn => {
        const late = withTech[tn].filter(d => invDaysSince(invLastChange(d)) >= INV_STUCK_DAYS).length;
        const safe = esc(tn).replace(/'/g, "\\'");
        return `<div class="inv-card" onclick="openInvView('tech','${safe}')">
          <div class="inv-card-num" style="color:var(--repairing);">${withTech[tn].length}</div>
          <div class="inv-card-label">🔧 ${esc(tn)}</div>
          ${late ? `<div style="font-size:11px;color:var(--danger);font-weight:800;margin-top:4px;">${late} متأخرة</div>` : ''}
          <div class="inv-card-more">عرض الأجهزة ←</div>
        </div>`;
      }).join('')}</div>`;

  document.getElementById('inventoryBody').innerHTML = invView
    ? `${filterBar}${invViewHtml()}`
    : `${filterBar}${searchHtml}${cards}
       <div class="inv-section-title">🔧 حسب الفني</div>
       ${techCards}`;
}

document.addEventListener('DOMContentLoaded', function(){
  try{ I18N.applyI18n(document); }catch(e){}
  try{ mountScanBtn(); }catch(e){}
});


boot().catch(e => veilFail('خطأ: ' + esc(e && e.message ? e.message : e) +
  '<br><br><a href="index.html">تسجيل الدخول تاني</a>'));
</script>
</body>
</html>
