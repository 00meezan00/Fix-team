   اختياره القديم متخزّن على جهازه هو. لو مكتبناهاش بالقوة،

<script>
/* المظهر قبل أي رسم. صفحة الدخول عامة — لو مفيش تفضيل محفوظ
   بنتبع إعداد جهاز المستخدم بدل ما نفرض حاجة. */
(function(){
  try{
    var m = localStorage.getItem('ifix-theme'), d;
    if(m === 'dark') d = true;
    else if(m === 'light') d = false;
    else if(m === 'auto'){ var h = new Date().getHours(); d = (h >= 19 || h < 7); }
    else d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    var mt = document.querySelector('meta[name="theme-color"]');
    if(mt) mt.setAttribute('content', d ? '#131E29' : '#F2F2F1');
  }catch(e){}
})();
</script>

    --renew-bg:#FFF8EC; --renew-bd:#EACB84; --renew-ink:#9A6A0C;

  /* ===== الوضع الداكن ===== */
  html[data-theme="dark"]{

  /* ============================================================
     🎨 (٢٠٢٦-١٠-١٩) لوجو FIX TEAM
     ------------------------------------------------------------
     🧸 اللوجو الجديد فيه كلام تحت (FIX TEAM + ALL MOBILE SERVICES).
        القديم كان الكارت راكب على طرفه بـ٨٤ بكسل — لو سبناها كده

     🌗 نسختين: logo-light (الأبيض اتقلب أسود عشان يبان على الفاتح)

  @media (prefers-reduced-motion:no-preference){

  /* ============================================================
     📱 قاعدة الآيفون — متشيلهاش
     ------------------------------------------------------------
     🧠 المشكلة: لو خانة الكتابة خطها **أقل من ١٦ بكسل**، iOS
        بيكبّر الصفحة كلها أول ما تلمسها عشان يقرّب لك الخانة.
        في متصفح عادي بيرجع يصغّرها لما تسيبها — لكن في تطبيق
        مثبّت على الشاشة الرئيسية (PWA) **مبيرجعش**. فالصفحة
        بتفضل مكبّرة ومقصوصة من الجنب لحد ما تقفل التطبيق.

     ✅ الحل: كل خانات الكتابة على الموبايل ١٦ بكسل بالظبط.
        الفرق عن ١٥ مش باين للعين، بس بيمنع التكبير تماماً.

     ⚠️ !important مقصودة هنا. دي مش ذوق تصميم — ده شرط من
        نظام التشغيل. أي قاعدة تانية تتحط بعدين لازم تحترمه.
     ============================================================ */
  @media (max-width:820px){
    input, textarea, select, .tech-select{ font-size:16px !important; }
  }

<script>

// نطاقات الإنتاج (زوّد الدومين المخصص لما تجيبه، زي ifixteam.com):
const PROD_HOSTS = ["fix-team.pages.dev"];

// لوحة الأدمن بقت خانة في قايمة التلت نقط على الفون بس.
const ADMIN_EMAILS_BY_ENV = {
  production: ['belal0@fix.com'],
  staging:    ['belal0@fix.com']
};
const ADMIN_EMAILS = (ADMIN_EMAILS_BY_ENV[APP_ENV] || []).map(e => e.toLowerCase());
const landingFor = (email) => 'dashboard.html';
// سبب رفض الدخول (لما landingByRole ترجّع null)
let denyMsg = '';
// بتروح للصفحة — أو بتطلّع الحساب وتكتب السبب لو مالوش دخول
async function goByRole(email){
  const dest = await landingByRole(email);
  if(dest){ window.location.href = dest; return; }
  try{ await sb.auth.signOut(); }catch(e){}
  const el = document.getElementById('loginError');

// جاي من شاشة تانية طردته لأنه مش متسجّل؟

// 📱 فون ولا كمبيوتر؟ — نفس منطق commonIsPhone في common.js بالحرف.
// ⚠️ متكرّرة هنا عن قصد: صفحة الدخول مش بتحمّل common.js (بتعرّف
//    sb بنفسها)، ولو حمّلناه هيقول «Identifier already declared».
function isPhoneDevice(){
  try{
    const ua = navigator.userAgent || '';
    return /iPhone|iPad|iPod|Android|Mobile/i.test(ua) && (navigator.maxTouchPoints || 0) > 0;
  }catch(e){ return false; }
}

// ============================================================
// تحويل حسب الدور — من هنا مباشرة، من غير ما نعدّي على الداشبورد
// ------------------------------------------------------------
// قبل كده كل الموظفين كانوا بيروحوا dashboard.html، وهو اللي بيحوّل
// الفني والديسباتشر لصفحاتهم. النتيجة إن المستخدم كان يشوف لمحة من
// أيقونة وواجهة النظام قبل ما يوصل صفحته.
//
// دلوقتي بنقرا الدور هنا (نفس منطق roleOf في الداشبورد) وبنروح على
// طول. وبنحفظ الدور محلياً كمان — فحتى لو دخل الداشبورد بعدين،
// التحويل السريع بتاعه هيشتغل من أول لحظة.
//
// أي فشل → بنرجع لسلوك زمان (dashboard.html). الدخول ممنوع يتعطّل
// عشان استعلام إضافي.
// ============================================================
async function landingByRole(email){
  const e = (email || '').toLowerCase();

  // ============================================================
  // 👑 الأدمن (السوبر أدمن)
  // ------------------------------------------------------------
  // 🧠 بالبلدي: الأدمن بقى بيفتح على **شاشة المحاسب** زي أي محاسب.
  //    لوحة الأدمن بقت خانة في قايمة التلت نقط (على الفون بس).
  //
  // ⚠️ لو الاشتراك **خلصان** وهو على **الفون**، بيروح لوحة الأدمن —
  //    عشان يوصل لزرار «تفعيل الاشتراك» (شاشة المحاسب بتقفل نفسها
  //    وتطلّع «تم إيقاف الخدمة»). ونفس الكلام لو مقدرناش نعرف حالة
  //    الاشتراك (النت فصل).
  //
  // 💻 على الكمبيوتر: شاشة المحاسب **دايماً**، حتى لو الاشتراك خلصان
  //    (قرار المالك — سبتمبر ٢٠٢٦). لوحة الأدمن مقفولة على الكمبيوتر
  //    في كل الحالات، يعني التفعيل بيتعمل من الفون بس.
  // ============================================================
  if(ADMIN_EMAILS.includes(e)){
    const active = isPhoneDevice() ? await shopActive() : true;
    if(active === true){
      try{
        localStorage.setItem('ifix-last-role', 'super_admin');
        localStorage.setItem('ifix-last-email', e);
        sessionStorage.removeItem('ifix-bounced');
      }catch(err){}
      return 'dashboard.html';
    }
    return 'admin.html';
  }
  if(!ADMIN_EMAILS.length)     return 'dashboard.html';   // الإعداد لسه ماتعملش

  // ============================================================
  // 🔒 (٢٠٢٦-١٠-١١) مفيش دور افتراضي خلاص
  // ------------------------------------------------------------
  // 🧸 قبل كده أي إيميل مش متسجّل كان بيدخل كمحاسب. دلوقتي:
  //    • متسجّل في لوحة الأدمن → يدخل صفحته
  //    • مش متسجّل            → مايدخلش، ورسالة «كلّم الإدارة»
  //    • مقدرناش نقرا القايمة (نت) → مايدخلش، ورسالة «جرّب تاني»
  // landingByRole بترجّع null في الحالتين دول، والسبب في denyMsg.
  // ============================================================
  let role = null;
  try{
    const q = sb.from('app_data').select('value').eq('key', 'user-roles').maybeSingle();
    const res = await Promise.race([q, new Promise(r => setTimeout(() => r(null), 4000))]);
    if(!res || res.error){ denyMsg = 'تعذّر التحقق من حسابك — اتأكد من النت وجرّب تاني'; return null; }
    if(res && res.data && res.data.value){
      const map = JSON.parse(res.data.value) || {};
      const v = map[e];
      const found = (typeof v === 'string') ? v : (v && v.role);
      // ⚠️ القايمة دي حارس: أي دور مش فيها بيتجاهل ويرجع 'accountant'.
      //    نسيت أزوّد 'hr' فيها، فحساب شؤون العاملين كان بيتحوّل
      //    لمحاسب ويفتح الداشبورد — الدور اتقرا صح، بس الحارس رماه.
      //    **أي دور جديد لازم يتضاف هنا كمان**، مش في ROLES بس.
      // 🛎️🏭📞 reception و production و callcenter بيروحوا dashboard.html (الافتراضي تحت)
      // 🛵 parts = مسؤول قطع الغيار (ملف 95) → parts.html
      if(['super_admin','accountant','dispatcher','technician','hr','staff','owner','reception','production','callcenter','parts'].includes(found)) role = found;
    }
  }catch(err){ denyMsg = 'تعذّر التحقق من حسابك — جرّب تاني'; return null; }

  if(!role){
    denyMsg = '🔒 الحساب ده مش متسجّل في النظام — كلّم الإدارة تضيفك';
    try{ localStorage.removeItem('ifix-last-role'); }catch(err){}
    return null;
  }

  try{
    localStorage.setItem('ifix-last-role', role);
    localStorage.setItem('ifix-last-email', e);
    sessionStorage.removeItem('ifix-bounced');
  }catch(err){}

  if(role === 'technician') return 'my-devices.html';
  if(role === 'dispatcher') return 'dispatch.html';
  // ⚠️ شؤون العاملين ليها صفحتها لوحدها. من غير السطر ده كانت
  //    هتروح للداشبورد وتشوف الأجهزة والفلوس والتقارير كلها —
  //    وهي المفروض تشوف سجل المواعيد وبس.
  if(role === 'hr')         return 'hr.html';
  // ⚠️ الموظف العادي: صفحته مواعيد وبس. من غير السطر ده كان
  //    هيروح للداشبورد ويشوف الأجهزة والفلوس والتقارير كلها.
  if(role === 'staff')      return 'staff.html';
  // 👑 المالك: صاحب الشركة — ديسباتشر + فني في صفحة واحدة
  if(role === 'owner')      return 'owner.html';
  // 🛵 مسؤول قطع الغيار: صفحته لوحده — طلبات القطع والتجار والفواتير
  if(role === 'parts')      return 'parts.html';
  return 'dashboard.html';
}
if(APP_ENV === "staging"){
  addEventListener("DOMContentLoaded", function(){
    var b = document.createElement("div");
    b.textContent = (window.I18N && I18N.has("app.stagingBar")) ? I18N.t("app.stagingBar") : "🧪 بيئة تجريبية — STAGING";
    b.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#B45309;color:#fff;text-align:center;font:700 12px/1.7 system-ui,sans-serif;padding:5px;";
    document.body.appendChild(b);
  });
}

    const $ = (id) => document.getElementById(id);

    // فحص اشتراك المحل (صف واحد في جدول shop — بيسري على كل الموظفين)
    // ⚠️ لازم نفحص نفس الشروط التلاتة اللي الداشبورد بيفحصها:
    //    اشتراك مدفوع · وضع بيتا · فترة مجانية فيها أيام.
    //    قبل كده كانت بتفحص paid_until بس — فحتى والتجربة شغّالة
    //    كانت بتمنع الموظفين من الدخول أصلاً.
    async function shopActive() {
        // (١) اشتراك مدفوع ساري؟
        let paidActive = false;
        try {
            const { data } = await sb.from('shop').select('paid_until').eq('id', 1).maybeSingle();
            paidActive = !!(data && data.paid_until && new Date(data.paid_until) > new Date());
        } catch (e) { return null; }
        if (paidActive) return true;

        // (٢) وضع بيتا أو فترة مجانية لسه فيها أيام؟
        try {
            const { data: cfgRow } = await sb.from('app_data')
                .select('value').eq('key', 'system-config').maybeSingle();
            const cfg = (cfgRow && cfgRow.value) ? JSON.parse(cfgRow.value) : {};
            if (cfg.mode === 'beta') return true;
            if (cfg.mode === 'trial' && cfg.trialStart) {
                const days = cfg.trialDays || 7;
                const end  = new Date(cfg.trialStart).getTime() + days * 86400000;
                if (end > Date.now()) return true;
            }
        } catch (e) { /* لو تعذّر القراءة، بنعتمد على المدفوع بس */ }

        return false;
    }

    // ملحوظة: الأسعار وطرق الدفع اتشالت من هنا عن قصد — بتتبعت
    // على إيميل المسؤول عن الدفع، مش بتتعرض في صفحة الدخول.

    function showRenewBox() {
        $('renewBox').style.display = 'block';
    }

    async function login() {
        const email = $('email').value.trim();
        const password = $('password').value;
        const btn = $('loginBtn');

        $('loginError').textContent = '';
        $('renewBox').style.display = 'none';

        if (!email || !password) {
            $('loginError').textContent = 'من فضلك أدخل البريد وكلمة المرور';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'جارٍ الدخول...';

        try {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                if (error.message.includes('Email not confirmed')) {
                    $('loginError').textContent = 'الحساب غير مؤكد — فعّله من لوحة تحكم Supabase';
                } else if (error.message.includes('Invalid login credentials')) {
                    $('loginError').textContent = t('login.badCreds');
                } else {
                    $('loginError').textContent = 'خطأ: ' + error.message;
                }
                return;
            }

            const isAdmin = ADMIN_EMAILS.includes((email || '').toLowerCase());

            // 🔑 الأدمن بيعدّي دايماً — حتى لو الاشتراك منتهي.
            //    من غير كده بتتحبس بره ومش هتقدر تفعّل الاشتراك بعد الدفع.
            if (isAdmin) { await goByRole(email); return; }

            const active = await shopActive();

            if (active === null) {
                $('loginError').textContent = 'تعذر التحقق من الاشتراك، حاول مرة أخرى';
                await sb.auth.signOut();
                return;
            }

            if (active) {
                await goByRole(email);
            } else {
                await sb.auth.signOut();
                showRenewBox();
            }
        } finally {
            btn.disabled = false;
            btn.textContent = 'دخول';
        }
    }

    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('password').focus(); });

    // لو عنده جلسة سارية بالفعل → تخطي صفحة الدخول
    sb.auth.getSession().then(async ({ data: { session } }) => {
        if (!session) return;
        const em = (session.user.email || '').toLowerCase();
        // الأدمن بيعدّي دايماً — حتى لو الاشتراك منتهي
        if (ADMIN_EMAILS.includes(em)) { await goByRole(em); return; }
        const active = await shopActive();
        if (active) await goByRole(em);
        else showRenewBox();          // يشوف سبب التوقف بدل صفحة صامتة
    });
</script>
